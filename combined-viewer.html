<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, viewport-fit=cover">
  <title>Ocean Intelligence — Combined</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.4.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.4.0/dist/ol.js"></script>
  <style>
    :root{--bg:#050b10;--fg:#e0e6ee;--panel:rgba(5,11,16,0.90);--border:#1b2836;}
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;}
    #map{position:fixed;inset:0;touch-action:none;}

    /* ── Controls bar ── */
    #controls{
      position:fixed;top:0;left:44px;right:0;z-index:30;
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:8px 16px;
      background:var(--panel);border-bottom:1px solid var(--border);
      backdrop-filter:blur(6px);
    }
    #load-status{font-size:12px;font-weight:700;color:#9fb0c3;}
    .toggle{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:5px 12px;border:1px solid #2a3a50;border-radius:6px;background:rgba(12,23,35,0.8);transition:background 0.15s;}
    .toggle:hover{background:rgba(29,79,145,0.4);}
    .toggle input{display:none;}
    .toggle .box{width:16px;height:16px;border-radius:3px;border:2px solid #4d7dff;display:flex;align-items:center;justify-content:center;background:#0c1723;transition:background 0.15s;flex-shrink:0;}
    .toggle input:checked~.box{background:#1d4f91;}
    .toggle input:checked~.box::after{content:"✓";color:#fff;font-size:12px;font-weight:700;}
    .toggle label{font-size:13px;font-weight:700;white-space:nowrap;color:var(--fg);}
    .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .dot-chl{background:#1d8aff;}
    .dot-uv{background:#00c8ff;}
    .dot-bathy{background:#8bb8d4;}
    .dot-front{background:#ff4040;}

    /* ── Legends ── */
    .legend{position:fixed;right:12px;bottom:12px;z-index:15;padding:10px 14px;background:rgba(5,11,16,0.88);border:1px solid rgba(255,255,255,0.18);border-radius:8px;color:#fff;font-size:12px;font-weight:800;}
    .legend-title{margin-bottom:6px;letter-spacing:0.5px;}
    .legend-bar{width:180px;height:10px;border-radius:5px;}
    .legend-labels{display:flex;justify-content:space-between;margin-top:3px;font-size:11px;color:#9fb0c3;}

    /* ── Status bar ── */
    #status{position:fixed;bottom:12px;left:12px;z-index:15;font-size:11px;color:#9fb0c3;background:rgba(5,11,16,0.8);padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);}

    /* ── Hamburger ── */
    #menu-toggle{position:fixed;top:0;left:0;z-index:40;width:44px;height:44px;background:var(--panel);border:none;border-right:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;}
    #menu-toggle span{display:block;width:18px;height:2px;background:var(--fg);border-radius:2px;transition:opacity 0.2s;}
    #menu-toggle:hover span{background:#4d7dff;}

    /* ── Sidebar ── */
    #sidebar-overlay{position:fixed;inset:0;z-index:34;background:rgba(0,0,0,0.4);display:none;}
    #sidebar-overlay.visible{display:block;}
    #sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;z-index:35;background:var(--panel);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform 0.25s ease;display:flex;flex-direction:column;padding:16px 14px;gap:12px;overflow-y:auto;}
    #sidebar.open{transform:translateX(0);}
    .sidebar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#7a8fa8;margin-bottom:6px;}
    #region-select{width:100%;padding:7px 10px;background:rgba(12,23,35,0.9);border:1px solid #2a3a50;border-radius:6px;color:var(--fg);font-size:13px;cursor:pointer;}
    #region-select option{background:#050b10;}

    /* ── Place labels ── */
    #status{position:fixed;bottom:12px;left:12px;z-index:15;font-size:11px;color:#9fb0c3;background:rgba(5,11,16,0.8);padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);pointer-events:none;}
    @media(max-width:600px){#sidebar{width:180px;}}
  </style>
</head>

    <label class="toggle">

<script>
// ─── Config ─────────────────────────────────────────────────────────────────
const REGION_ID = new URLSearchParams(window.location.search).get("region") || "usec_south";
const REGION_CONFIGS = {
  usec_south: { bbox: [-81, 31, -73, 40], dataDir: "data/usec_south", indexUrl: "index-usec_south.json" },
  usec_md:    { bbox: [-76, 37, -69, 41], dataDir: "data/usec_md",    indexUrl: "index-usec_md.json" },
  usec_north: { bbox: [-72, 40, -64, 44], dataDir: "data/usec_north", indexUrl: "index-usec_north.json" },
};
const REGION = REGION_CONFIGS[REGION_ID] || REGION_CONFIGS["usec_south"];
const BBOX   = REGION.bbox;
const DATA_DIR = REGION.dataDir;
const INDEX_URL = REGION.indexUrl;
const BATHY_JSON_URL = `${DATA_DIR}/gebco_bath_latest/gebco_bathy.json`;
const UV_GRID_URL    = `${DATA_DIR}/grids/uv_12500_grid.json`;
const DEPLOY_TS = Date.now();

// CHL palette: log scale 0.02→10 mg/m³
const CHL_PALETTE = [
  [0.00,[5,11,23]],[0.10,[12,32,68]],[0.25,[16,60,102]],
  [0.40,[16,97,110]],[0.55,[20,130,80]],[0.70,[80,170,50]],
  [0.85,[200,160,20]],[1.00,[220,100,10]],
];
const CHL_MIN=0.02, CHL_MAX=10;

// ADT palette: blue→white→red
const ADT_PALETTE = [
  [0.00,[30,80,200]],[0.25,[60,140,230]],[0.50,[240,240,240]],
  [0.75,[230,80,40]],[1.00,[180,20,20]],
];
const ADT_MIN=0.005, ADT_MAX=1.6;

const BATHY_STROKE = "#8bb8d4";
const BATHY_WIDTH  = 0.8;

// ─── Math helpers ─────────────────────────────────────────────────────────────
function is2D(a){ return Array.isArray(a) && Array.isArray(a[0]); }
function logNorm(v,lo,hi){
  const l=Math.log;
  return Math.max(0,Math.min(1,(l(v)-l(lo))/(l(hi)-l(lo))));
}
function linearNorm(v,lo,hi){
  return Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
}
function interpolateColorPalette(v,palette){
  v=Math.max(0,Math.min(1,v));
  for(let i=1;i<palette.length;i++){
    if(v<=palette[i][0]){
      const t=(v-palette[i-1][0])/(palette[i][0]-palette[i-1][0]);
      const a=palette[i-1][1],b=palette[i][1];
      return[Math.round(a[0]+t*(b[0]-a[0])),Math.round(a[1]+t*(b[1]-a[1])),Math.round(a[2]+t*(b[2]-a[2]))];
    }
  }
  return palette[palette.length-1][1];
}
function rgb(c,a){ return`rgba(${c[0]},${c[1]},${c[2]},${(+a).toFixed(3)})`; }

async function fetchWithTimeout(url,ms=15000){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctrl.signal}); clearTimeout(t); return r; }
  catch(e){ clearTimeout(t); throw e; }
}

// ─── Place labels ─────────────────────────────────────────────────────────────
const PLACE_LABELS=[
  {type:"city",name:"Atlantic City",lon:-74.4229,lat:39.3643},
  {type:"city",name:"Baltimore",lon:-76.6122,lat:39.2904},
  {type:"city",name:"Norfolk",lon:-76.2859,lat:36.8508},
  {type:"city",name:"Virginia Beach",lon:-75.9780,lat:36.8529},
  {type:"city",name:"Wilmington",lon:-77.9447,lat:34.2257},
  {type:"city",name:"Myrtle Beach",lon:-78.8867,lat:33.6891},
  {type:"city",name:"Charleston",lon:-79.9311,lat:32.7765},
  {type:"city",name:"Savannah",lon:-81.0998,lat:32.0809},
  {type:"port",name:"Montauk",lon:-71.9448,lat:41.0359},
  {type:"port",name:"Brielle/Manasquan",lon:-74.0565,lat:40.1079},
  {type:"port",name:"Barnegat Light",lon:-74.1065,lat:39.7576},
  {type:"port",name:"Cape May",lon:-74.9060,lat:38.9351},
  {type:"port",name:"Ocean City MD",lon:-75.0849,lat:38.3365},
  {type:"port",name:"Wachapreague",lon:-75.6896,lat:37.6057},
  {type:"port",name:"Oregon Inlet",lon:-75.5488,lat:35.7957},
  {type:"port",name:"Hatteras",lon:-75.6902,lat:35.2196},
  {type:"port",name:"Morehead City",lon:-76.7260,lat:34.7229},
  {type:"port",name:"Wrightsville Beach",lon:-77.7950,lat:34.2085},
  {type:"spot",name:"Wilmington Canyon",lon:-73.60,lat:38.10},
  {type:"spot",name:"Norfolk Canyon",lon:-74.80,lat:36.90},
  {type:"spot",name:"Cape May Rim",lon:-74.40,lat:38.90},
  {type:"spot",name:"Polar Fork",lon:-72.80,lat:38.70},
  {type:"spot",name:"Saxon State",lon:-73.40,lat:38.00},
  {type:"spot",name:"Northern Rim",lon:-73.00,lat:38.60},
];

function inRegion(p){
  const[b0,b1,b2,b3]=BBOX;
  return p.lon>b0&&p.lon<b2&&p.lat>b1&&p.lat<b3;
}

// ─── Map init (matching index.html pattern) ──────────────────────────────────
function installOlGestureZoomFallback(map,target){
  let lastT=0;
  target.addEventListener("touchmove",e=>{
    if(e.touches.length!==2)return;
    const t=e.timeStamp;
    if(t-lastT<200)return;
    lastT=t;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    const ov=map.getView();
    if(!window._lastPinchDist){window._lastPinchDist=dist;return;}
    const delta=dist-window._lastPinchDist;
    if(Math.abs(delta)<5)return;
    const c=ov.getCenter();
    const z=ov.getZoom();
    ov.setZoom(z+delta*0.04);
    window._lastPinchDist=dist;
  },{passive:true});
  target.addEventListener("touchend",()=>{window._lastPinchDist=null;},{passive:true});
}

const view = new ol.View({
  projection:"EPSG:4326",
  extent:BBOX,
  constrainOnlyCenter:false,
  constrainResolution:false,
  smooth:true,
  rotation:0,
  center:[(BBOX[0]+BBOX[2])/2,(BBOX[1]+BBOX[3])/2],
  zoom:7,
  minZoom:5,
  maxZoom:14,
});

const defaultInteractions = (ol.interaction && typeof ol.interaction.defaults==="function")
  ? ol.interaction.defaults({
      altShiftDragRotate:false,
      doubleClickZoom:true,
      dragPan:true,
      mouseWheelZoom:true,
      pinchRotate:false,
      pinchZoom:true
    })
  : undefined;

const map = new ol.Map({
  target:"map",
  layers:[],
  view,
  controls:[],
  interactions: defaultInteractions,
});

map.on("moveend",()=>syncViewState(map));
function syncViewState(m){const v=m.getView();document.getElementById("status").textContent=`zoom:${v.getZoom().toFixed(1)} center:${v.getCenter().map(x=>x.toFixed(2)).join(",")}`;}

installOlGestureZoomFallback(map,document.getElementById("map"));

// Layer refs
let chlLayer=null, uvLayer=null, bathyLayer=null, frontsLayer=null, landLayer=null, placeLayer=null;

// ─── Layer 1: Chlorophyll ─────────────────────────────────────────────────────
async function loadChlLayer(){
  const s=document.getElementById("load-status");
  if(s)s.textContent="Loading CHL…";
  try{
    const idxRes=await fetchWithTimeout(`${INDEX_URL}?t=${Date.now()}`);
    const idx=await idxRes.json();
    const chlFrames=(idx.frames||{}).chl||[];
    if(!chlFrames.length){if(s)s.textContent="No CHL frames";return null;}
    const latest=chlFrames[chlFrames.length-1];
    const latestFile=latest.json_path.split("/").pop();
    if(s)s.textContent="CHL: "+latestFile+"…";
    const res=await fetchWithTimeout(`${DATA_DIR}/chl/${latestFile}?t=${Date.now()}`);
    const d=await res.json();
    const{bbox:extent,nx,ny,z}=d;

    const canvas=document.createElement("canvas");
    canvas.width=nx;canvas.height=ny;
    const ctx=canvas.getContext("2d");
    const imgData=ctx.createImageData(nx,ny);
    // yAxis goes south→north; canvas row 0 = top/north; flip here
    for(let row=0;row<ny;row++){
      for(let col=0;col<nx;col++){
        const val=z[row][col];
        const t=logNorm(val,CHL_MIN,CHL_MAX);
        const col3=interpolateColorPalette(t,CHL_PALETTE);
        const k=((ny-1-row)*nx+col)*4;  // flip y: row 0→south, canvas[ny-1-row]→north
        imgData.data[k]=col3[0];imgData.data[k+1]=col3[1];imgData.data[k+2]=col3[2];
        imgData.data[k+3]=isFinite(val)?255:0;
      }
    }
    ctx.putImageData(imgData,0,0);

    const src=new ol.source.ImageStatic({url:canvas.toDataURL("image/png"),imageExtent:extent,projection:"EPSG:4326",interpolate:false});
    const layer=new ol.layer.Image({source:src,zIndex:10});
    map.addLayer(layer);

    // Legend
    const bar=document.getElementById("chl-bar");
    if(bar) bar.style.background=`linear-gradient(to right,${CHL_PALETTE.map(([t,c])=>`rgb(${c[0]},${c[1]},${c[2]})`).join(",")})`;
    const leg=document.getElementById("chl-legend");
    if(leg) leg.style.display="block";

    if(s)s.textContent="";
    return layer;
  }catch(e){
    console.error("CHL error:",e);
    if(s)s.textContent="CHL failed: "+String(e).slice(0,60);
    return null;
  }
}

// ─── Layer 2: UV arrows (pattern from index.html buildMobileUvArrowLayer) ────
async function loadUvLayer(){
  const s=document.getElementById("load-status");
  if(s)s.textContent="Loading UV…";
  try{
    // Load grid first (provides xAxis/yAxis for proper geo coords)
    let gridInfo=null;
    try{
      const gr=await fetchWithTimeout(UV_GRID_URL);
      const g=await gr.json();
      const lon=g.lon||g.longitude;
      const lat=g.lat||g.latitude;
      let xAxis,yAxis,nx,ny;
      if(Array.isArray(lon[0])&&Array.isArray(lat[0])){
        ny=lon.length;nx=lon[0].length;
        const midY=Math.floor(ny/2),midX=Math.floor(nx/2);
        xAxis=lon[midY].slice();yAxis=lat.map(r=>r[midX]);
      } else {
        xAxis=lon.slice();yAxis=lat.slice();nx=xAxis.length;ny=yAxis.length;
      }
      gridInfo={xAxis,yAxis,nx,ny};
    } catch(e){ console.warn("UV grid load failed:",e); }

    const idxRes=await fetchWithTimeout(`${INDEX_URL}?t=${Date.now()}`);
    const idx=await idxRes.json();
    const uvFrames=(idx.frames||{}).uv||[];
    if(!uvFrames.length){if(s)s.textContent="No UV frames";return null;}
    const latest=uvFrames[uvFrames.length-1];
    const latestFile=latest.json_path.split("/").pop();
    if(s)s.textContent="UV: "+latestFile+"…";
    const res=await fetchWithTimeout(`${DATA_DIR}/uv/${latestFile}?t=${Date.now()}`);
    const d=await res.json();
    const{u,v,adt}=d;

    // Build arrow features using geographic coords from grid axes (or fallback bbox)
    let xAxis=gridInfo?.xAxis, yAxis=gridInfo?.yAxis, nx=gridInfo?.nx||d.nx, ny=gridInfo?.ny||d.ny;
    if(!xAxis||!yAxis){
      // Fallback: bbox-based grid
      const[west,south,east,north]=d.bbox||BBOX;
      xAxis=Array.from({length:nx},(_,i)=>west+(east-west)*i/(nx-1));
      yAxis=Array.from({length:ny},(_,j)=>south+(north-south)*j/(ny-1));
    }

    const step=Math.max(3,Math.floor(Math.sqrt(nx*ny)/18));
    const maxSpeed=1.2, minSpeed=0.035;
    let dxg=Math.abs(xAxis[1]-xAxis[0])||0.01;
    let dyg=Math.abs(yAxis[1]-yAxis[0])||0.01;
    const cell=Math.min(dxg,dyg);
    const minLen=0.95*cell, maxLen=2.80*cell;
    const headAngle=Math.PI/6;
    const features=[];

    for(let j=0;j<ny;j+=step){
      const lat0=yAxis[j];
      for(let i=0;i<nx;i+=step){
        const lon0=xAxis[i];
        const uu=u[j]?.[i], vv=v[j]?.[i];
        if(!isFinite(uu)||!isFinite(vv)) continue;
        const sp=Math.hypot(uu,vv);
        if(sp<minSpeed) continue;

        const scaled=Math.min(sp,maxSpeed)/maxSpeed;
        const len=minLen+(maxLen-minLen)*scaled;
        const lon1=lon0+(uu/sp)*len;
        const lat1=lat0+(vv/sp)*len;

        const theta=Math.atan2(lat1-lat0,lon1-lon0);
        const headLen=Math.min(0.46*len,0.74*cell);
        const left=[lon1+headLen*Math.cos(theta+Math.PI-headAngle),lat1+headLen*Math.sin(theta+Math.PI-headAngle)];
        const right=[lon1+headLen*Math.cos(theta+Math.PI+headAngle),lat1+headLen*Math.sin(theta+Math.PI+headAngle)];

        features.push(new ol.Feature({
          geometry:new ol.geom.MultiLineString([[[lon0,lat0],[lon1,lat1]],[[lon1,lat1],left],[[lon1,lat1],right]])
        }));
      }
    }

    const src=new ol.source.Vector({features,wrapX:false});
    const layer=new ol.layer.Vector({
      source:src,
      style:new ol.style.Style({
        stroke:new ol.style.Stroke({color:"rgba(255,255,255,0.86)",width:1.45,lineCap:"round",lineJoin:"round"})
      }),
      zIndex:25,
      updateWhileAnimating:true,
      updateWhileInteracting:true,
    });
    map.addLayer(layer);

    // ADT legend
    const bar=document.getElementById("adt-bar");
    if(bar) bar.style.background=`linear-gradient(to right,${ADT_PALETTE.map(([t,c])=>`rgb(${c[0]},${c[1]},${c[2]})`).join(",")})`;
    const leg=document.getElementById("adt-legend");
    if(leg) leg.style.display="block";

    if(s)s.textContent="";
    return layer;
  }catch(e){
    console.error("UV error:",e);
    if(s)s.textContent="UV failed: "+String(e).slice(0,60);
    return null;
  }
}

// ─── Land mask (pattern from index.html makeMobileLandCanvas) ──────────────
async function loadLandLayer(){
  try{
    const res=await fetchWithTimeout(BATHY_JSON_URL);
    const bathy=await res.json();
    const{xAxis,yAxis,depth}=bathy;
    const xAsc=(xAxis.length<2)||(xAxis[0]<=xAxis[xAxis.length-1]);
    const yAsc=(yAxis.length<2)||(yAxis[0]<=yAxis[yAxis.length-1]);
    const nx=xAxis.length, ny=yAxis.length;
    const canvas=document.createElement("canvas");
    canvas.width=nx;canvas.height=ny;
    const ctx=canvas.getContext("2d",{willReadFrequently:false});
    const img=ctx.createImageData(nx,ny);
    for(let row=0;row<ny;row++){
      const srcJ=yAsc?(ny-1-row):row;
      for(let col=0;col<nx;col++){
        const srcI=xAsc?col:(nx-1-col);
        const v=depth[srcJ]?.[srcI];
        const k=(row*nx+col)*4;
        if(v!==null&&isFinite(v)&&v<=0){
          img.data[k]=185;img.data[k+1]=185;img.data[k+2]=178;img.data[k+3]=245;
        } else {
          img.data[k+3]=0;
        }
      }
    }
    ctx.putImageData(img,0,0);

    const extent=[xAxis[0],yAxis[0],xAxis[nx-1],yAxis[ny-1]];
    const src=new ol.source.ImageStatic({url:canvas.toDataURL("image/png"),imageExtent:extent,projection:"EPSG:4326",interpolate:false});
    const layer=new ol.layer.Image({source:src,zIndex:20});
    map.addLayer(layer);
    return layer;
  }catch(e){console.error("Land layer error:",e);return null;}
}

// ─── Layer 3: Bathymetry contours ───────────────────────────────────────────
async function loadBathymetryLayer(){
  const s=document.getElementById("load-status");
  if(s)s.textContent="Loading bathy…";
  try{
    const res=await fetchWithTimeout(BATHY_JSON_URL);
    const d=await res.json();
    window._bathyData={xAxis:d.xAxis,yAxis:d.yAxis,depth:d.depth,nx:d.xAxis.length,ny:d.yAxis.length};

    const layer=new ol.layer.Vector({
      source:new ol.source.Vector({wrapX:false}),
      style:new ol.style.Style({stroke:new ol.style.Stroke({color:BATHY_STROKE,width:BATHY_WIDTH})}),
      zIndex:15,
    });
    map.addLayer(layer);
    window._bathyLayer=layer;
    updateBathyContours(map);
    if(s)s.textContent="";
    return layer;
  }catch(e){console.error("Bathy error:",e);if(s)s.textContent="Bathy failed";return null;}
}

function updateBathyContours(map){
  const bd=window._bathyData;
  const layer=window._bathyLayer;
  if(!bd||!layer) return;
  const source=layer.getSource();
  source.clear();

  const extent=map.getView().calculateExtent(map.getSize());
  const[vx0,vy0,vx1,vy1]=extent;

  const maxW=400,maxH=600;
  const sx=Math.max(1,Math.floor(bd.nx/maxW));
  const sy=Math.max(1,Math.floor(bd.ny/maxH));

  const maxDepth=depthMaxInExtent(bd,extent,sx,sy);
  const levels=generateContourLevels(maxDepth);

  for(const level of levels){
    const segs=extractContourSegments(bd,level,sx,sy,extent);
    for(const seg of segs){
      const feat=new ol.Feature(new ol.geom.LineString(seg));
      source.addFeature(feat);
    }
  }
}

function depthMaxInExtent(bd,extent,sx,sy){
  const[vx0,vy0,vx1,vy1]=extent;
  let maxD=0;
  for(let row=0;row<bd.ny;row+=sy){
    const lat=bd.yAxis[row];
    if(lat<vy0||lat>vy1)continue;
    for(let col=0;col<bd.nx;col+=sx){
      const lon=bd.xAxis[col];
      if(lon<vx0||lon>vx1)continue;
      const d=bd.depth[row][col];
      if(d>maxD)maxD=d;
    }
  }
  return maxD;
}

function generateContourLevels(maxDepth){
  const std=[50,100,200,500,1000,1500,2000,2500,3000,3500,4000,4500,5000];
  if(maxDepth<200) return[50,100,200].filter(l=>l<=maxDepth+200);
  return std.filter(l=>l<=maxDepth+200);
}

function extractContourSegments(bd,level,sx,sy,extent){
  const[vx0,vy0,vx1,vy1]=extent;
  const segments=[];
  for(let row=1;row<bd.ny-1;row+=sy){
    const lat=bd.yAxis[row];
    if(lat<vy0||lat>vy1)continue;
    const nextLat=bd.yAxis[Math.min(row+sy,bd.ny-1)];
    for(let col=1;col<bd.nx-1;col+=sx){
      const lon=bd.xAxis[col];
      if(lon<vx0||lon>vx1)continue;
      const nextLon=bd.xAxis[Math.min(col+sx,bd.nx-1)];
      const tl=bd.depth[row][col];
      const tr=bd.depth[row][Math.min(col+sx,bd.nx-1)];
      const br=bd.depth[Math.min(row+sy,bd.ny-1)][Math.min(col+sx,bd.nx-1)];
      const bl=bd.depth[Math.min(row+sy,bd.ny-1)][col];
      const crossings=[];
      if((tl<level)!==(tr<level)){
        const t=(level-tl)/(tr-tl);
        crossings.push([[lon+t*(nextLon-lon),lat],"top"]);
      }
      if((bl<level)!==(br<level)){
        const t=(level-bl)/(br-bl);
        crossings.push([[lon+t*(nextLon-lon),nextLat],"bottom"]);
      }
      if((tl<level)!==(bl<level)){
        const t=(level-tl)/(bl-tl);
        crossings.push([[lon,lat+t*(nextLat-lat)],"left"]);
      }
      if((tr<level)!==(br<level)){
        const t=(level-tr)/(br-tr);
        crossings.push([[nextLon,lat+t*(nextLat-lat)],"right"]);
      }
      if(crossings.length>=2){
        const coords=crossings.slice(0,2).map(c=>c[0]);
        if(coords[0]&&coords[1]&&Math.hypot(coords[0][0]-coords[1][0],coords[0][1]-coords[1][1])>0.01){
          segments.push(coords);
        }
      }
    }
  }
  return segments;
}

// ─── Layer 4: Thermal front density (latest day, point cloud) ───────────────
async function loadFrontsLayer(){
  const s=document.getElementById("load-status");
  if(s)s.textContent="Loading fronts…";
  try{
    const idxRes=await fetchWithTimeout(`${INDEX_URL}?t=${Date.now()}`);
    const idx=await idxRes.json();
    const frames=(idx.frames||{}).sst_front||[];
    if(!frames.length){if(s)s.textContent="No front frames";return null;}

    // Group by date
    const dateMap=new Map();
    for(const f of frames){
      const m=f.id.match(/(\d{8})_\d\d_[a-z0-9]+$/);
      if(!m)continue;
      if(!dateMap.has(m[1]))dateMap.set(m[1],[]);
      dateMap.get(m[1]).push(f);
    }
    const dates=Array.from(dateMap.keys()).sort();
    const latestDate=dates[dates.length-1];
    const latestEntries=dateMap.get(latestDate)||[];
    if(!latestEntries.length){if(s)s.textContent="No front frames for "+latestDate;return null;}
    if(s)s.textContent="Fronts: "+latestEntries.length+" frames…";

    const allFeatures=[];
    for(const entry of latestEntries){
      try{
        const res=await fetchWithTimeout(`${DATA_DIR}/sst_front/${entry.json_path.split("/").pop()}?t=${Date.now()}`);
        const f=await res.json();
        allFeatures.push(...(f.features||[]));
      } catch(e){}
    }

    // Point cloud: draw front points with gradient magnitude as color
    const cellDeg=0.005;
    const nx=Math.max(2,Math.ceil((BBOX[2]-BBOX[0])/cellDeg)+1);
    const ny=Math.max(2,Math.ceil((BBOX[3]-BBOX[1])/cellDeg)+1);
    const canvas=document.createElement("canvas");
    canvas.width=nx;canvas.height=ny;
    const ctx=canvas.getContext("2d");
    const img=ctx.createImageData(nx,ny);

    for(const feat of allFeatures){
      const coords=feat.geometry?.coordinates||[];
      for(const pt of coords){
        const[lon,lat]=pt;
        const cx=Math.round((lon-BBOX[0])/cellDeg);
        const cy=Math.round((lat-BBOX[1])/cellDeg);
        if(cx<0||cx>=nx||cy<0||cy>=ny)continue;
        const grad=feat.properties?.gradient_per_km;
        const k=(cy*nx+cx)*4;
        if(grad!=null){
          const t=Math.min(1,grad/0.5);
          const c=interpolateColorPalette(t,[[0,[180,100,255]],[0.5,[255,60,60]],[1,[255,220,40]]]);
          img.data[k]=c[0];img.data[k+1]=c[1];img.data[k+2]=c[2];img.data[k+3]=255;
        }
      }
    }
    ctx.putImageData(img,0,0);

    const extent=[BBOX[0],BBOX[1],BBOX[0]+nx*cellDeg,BBOX[1]+ny*cellDeg];
    const src=new ol.source.ImageStatic({url:canvas.toDataURL("image/png"),imageExtent:extent,projection:"EPSG:4326",interpolate:false});
    const layer=new ol.layer.Image({source:src,zIndex:30,opacity:0.85});
    map.addLayer(layer);

    if(s)s.textContent="";
    return layer;
  }catch(e){console.error("Fronts error:",e);if(s)s.textContent="Fronts failed";return null;}
}

// ─── Place labels layer ──────────────────────────────────────────────────────
async function loadPlaceLayer(){
  const features=PLACE_LABELS.filter(inRegion).map(p=>new ol.Feature({
    geometry:new ol.geom.Point([p.lon,p.lat]),
    name:p.name,type:p.type
  }));
  if(!features.length) return null;
  const src=new ol.source.Vector({features,wrapX:false});
  const layer=new ol.layer.Vector({
    source:src,
    style:f=>{
      const isCity=f.get("type")==="city";
      return new ol.style.Style([
        new ol.style.Circle({radius:isCity?4:3,fill:new ol.style.Fill({color:"rgba(255,255,255,0.7)"}),stroke:new ol.style.Stroke({color:"rgba(0,0,0,0.5)",width:1})}),
        new ol.style.Text({text:f.get("name"),offsetY:-10,font:"bold 11px system-ui",fill:new ol.style.Fill({color:"rgba(255,255,255,0.85)"),stroke:new ol.style.Stroke({color:"rgba(0,0,0,0.7)",width:2})})
      ]);
    },
    zIndex:35,
    declutter:true,
  });
  map.addLayer(layer);
  return layer;
}

// ─── Toggle handlers ─────────────────────────────────────────────────────────
document.getElementById("chk-chlorophyll").addEventListener("change",e=>{if(chlLayer)chlLayer.setVisible(e.target.checked);});
document.getElementById("chk-currents").addEventListener("change",e=>{if(uvLayer)uvLayer.setVisible(e.target.checked);});
document.getElementById("chk-bathymetry").addEventListener("change",e=>{
  if(bathyLayer){bathyLayer.setVisible(e.target.checked);}
  if(landLayer) landLayer.setVisible(e.target.checked);
});
document.getElementById("chk-fronts").addEventListener("change",e=>{if(frontsLayer)frontsLayer.setVisible(e.target.checked);});

// Bathymetry contours update on pan/zoom
map.on("moveend",()=>{if(bathyLayer&&bathyLayer.getVisible())updateBathyContours(map);});

// ─── Menu / sidebar ──────────────────────────────────────────────────────────
const menuToggle=document.getElementById("menu-toggle");
const sidebar=document.getElementById("sidebar");
const sidebarOverlay=document.getElementById("sidebar-overlay");
menuToggle.addEventListener("click",()=>{
  const open=sidebar.classList.contains("open");
  sidebar.classList.toggle("open",!open);
  sidebarOverlay.classList.toggle("visible",!open);
});
sidebarOverlay.addEventListener("click",()=>{sidebar.classList.remove("open");sidebarOverlay.classList.remove("visible");});

// Region selector
const regionSelect=document.getElementById("region-select");
regionSelect.value=REGION_ID;
regionSelect.addEventListener("change",()=>{
  window.location.href=`${window.location.pathname}?region=${regionSelect.value}&t=${Date.now()}`;
});

// ─── Boot ────────────────────────────────────────────────────────────────────
(async()=>{
  const status=document.getElementById("status");
  status.textContent="Loading layers…";
  try{
    const[ch,uv,bath,fr,land,places]=await Promise.all([
      loadChlLayer(),
      loadUvLayer(),
      loadBathymetryLayer(),
      loadFrontsLayer(),
      loadLandLayer(),
      loadPlaceLayer(),
    ]);
    chlLayer=ch;uvLayer=uv;bathyLayer=bath;frontsLayer=fr;landLayer=land;placeLayer=places;
    status.textContent="Ready";
    setTimeout(()=>{status.textContent="";},3000);
  }catch(e){
    console.error(e);
    status.textContent="Error loading layers";
  }
})();
</script>
