<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captain's Dashboard — Redirecting...</title>
  <style>
    body { background: #050b10; color: #e0e6ee; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .msg h2 { font-size: 18px; margin-bottom: 8px; }
    .msg p { color: #9fb0c3; font-size: 14px; }
    .msg a { color: #4d7dff; }
  </style>
</head>
<body>
  <div class="msg">
    <h2>Captain's Dashboard</h2>
    <p>Redirecting to the main viewer...</p>
    <p>If not redirected, <a href="index.html?var=combined">click here</a>.</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const region = params.get("region") || "usec_south";
    const varParam = params.get("var") || "combined";
    window.location.href = "index.html?var=" + varParam + "&region=" + region;
  </script>
</body>
</html>
