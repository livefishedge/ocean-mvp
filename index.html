<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiveMaps</title>
  <link rel="icon" href="data:,">

  <script src="https://cdn.plot.ly/plotly-2.34.0.min.js"></script>
  

  <style>
    :root{
      --bg:#050b10; --fg:#e0e6ee; --panel:rgba(5,11,16,0.92); --border:#1b2836;
      --pad:10px;
    }
    html, body {
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      overflow:auto;
    }

    /* ======= Controls (sticky) ======= */
    #controls{
      position:sticky;
      top:0;
      z-index:80;
      background:var(--panel);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(6px);
      padding:8px 10px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    #row-region,
    #row-var,
    #row-play{ flex: 0 0 auto; }
    #row-slider{ flex: 1 1 520px; min-width:320px; }

    .control-group{
      display:flex;
      align-items:center;
      gap:7px;
      min-height:44px;
    }
    .control-select,
    #region-select,
    #var-select{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:9px 12px;
      font-size:16px;
      font-weight:800;
      min-height:42px;
      max-width:280px;
    }
    #var-select{ min-width:168px; }
    #region-select{ min-width:250px; }

    button{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:10px 12px;
      font-size:16px;
      min-height:44px;
      cursor:pointer;
    }
    button:disabled{ opacity:.45; cursor:default; }

    #frame-slider{ flex:1; min-width:220px; height:24px; }
    #frame-label{
      min-width:240px;
      text-align:right;
      font-size:20px;
      font-weight:800;
      font-variant-numeric: tabular-nums;
      white-space:nowrap;
    }


    #speed-wrap{
      display:flex;
      align-items:center;
      gap:4px;
      margin-left:8px;
      white-space:nowrap;
    }
    #speed-select{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:8px 10px;
      font-size:14px;
      min-height:36px;
    }

    /* Modebar host: NEW CSS for floating inside the plot at upper-left */
    #modebar-host{
      position: fixed; /* Must be 'fixed' to float on scroll */
      top: 75px; /* Using 92px is generally better to clear the sticky controls */
      left: 50px; /* Using 10px moves it to the very left edge */
      z-index: 1000;
      pointer-events: auto;
    }

    /* ======= Floating Feedback ======= */
    #feedback-float{
      position:fixed;
      bottom:24px;
      right:24px;
      z-index:500;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
    }
    #feedback-toggle{
      background:#2d7d46;
      color:#fff;
      border:none;
      border-radius:50%;
      width:48px;
      height:48px;
      font-size:22px;
      cursor:pointer;
      box-shadow:0 2px 12px rgba(0,0,0,.5);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #feedback-toggle:hover{ background:#3a9d5c; }
    #feedback-panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      display:flex;
      gap:8px;
      box-shadow:0 4px 20px rgba(0,0,0,.4);
    }
    #feedbackInput{
      background:#fff;
      color:#000;
      border:none;
      border-radius:6px;
      padding:8px 10px;
      width:240px;
      font-size:14px;
      outline:none;
    }
    #feedbackSubmit{
      background:#2d7d46;
      color:#fff;
      border:none;
      border-radius:6px;
      padding:8px 14px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }
    #feedbackSubmit:hover{ background:#3a9d5c; }
    .modebar{
      background: rgba(5,11,16,0.55) !important;
      border-radius:12px !important;
      padding:6px 6px !important;
      position: static !important; /* Override Plotly's internal positioning */
      gap: 14px !important;              /* space between groups */
      /* VITAL FIXES for single row display */
      display: flex !important;
      flex-wrap: nowrap !important; /* Forces all buttons into a single row */
      justify-content: flex-start !important;
    }

    /* Modebar tip */
    #modebar-tip{
      position:absolute;
      z-index:1100;
      pointer-events:none;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.5) !important;
      color: #e0e6ee;
      border: 1px solid rgba(224,230,238,0.15);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 320px;
      white-space: nowrap;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    /* ======= Plot ======= */
    /*#plot-wrap{ position:relative; width:100%; }*/
    #plot{
      width:100%;
      height: calc(200dvh);
      min-height:520px;

      /* Key: allow 1-finger vertical page scrolling */
      touch-action: pan-y;
    }

    /* Floating readout: Updated Top position */
    #readout{
      position:absolute;
      top:75px; /* Adjusted to be consistent with modebar host */
      right:10px;
      z-index:120;
      padding:5px 5px;
      background: rgba(255,255,255,0.50);
      color:#000;
      border:1px solid rgba(0,0,0,0.12);
      border-radius:10px;
      font-variant-numeric: tabular-nums;
      pointer-events:none;
      white-space:nowrap;
      font-size:14px;
      min-width:120px;
      text-align:middle;
    }

    /* ======= Bottom ranges (sticky): Reduced Padding ======= */
    #ranges{
      position:sticky;
      bottom:-50;
      z-index:70;
      background:var(--panel);
      border-top:1px solid var(--border);
      backdrop-filter: blur(6px);
      padding:4px 10px 0;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      font-size:14px;
    }

    /* Ranges row layout with footer colorbar on the right */
    #ranges{ justify-content: space-between; }
    #ranges-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    #ranges-right{
      display:flex;
      align-items:center;
      margin-left:auto;
    }
    #cbar{
      width:320px;
      height:72px;
    }
    .range-block{	
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      padding:4px 8px; /* REDUCED PADDING */
      border:1px solid var(--border);
      border-radius:12px;
      background: rgba(12,23,35,0.65);
    }
    .range-name{
      font-weight:900;
      font-size:14px;
      margin-right:4px;
      white-space:nowrap;
    }
    .mini-label{ opacity:0.85; font-size:13px; white-space:nowrap; }
    input[type="number"]{
      width:96px;
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:2px 8px; /* REDUCED PADDING */
      font-size:14px;
      min-height:20px; /* REDUCED MIN HEIGHT */
    }
    .range-actions{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .range-actions button{
      padding:4px 8px; /* REDUCED PADDING */
      font-size:13px;
      min-height:36px; /* REDUCED MIN HEIGHT */
    }


    /* ======= Captain Briefing Demo Panel ======= */
    #briefing-toggle{
      background:#1a5cff;
      border-color:#4d7dff;
      font-weight:800;
    }
    #briefing-panel{
      position:fixed;
      top:82px;
      right:14px;
      z-index:900;
      width:min(430px, calc(100vw - 28px));
      max-height:calc(100dvh - 150px);
      overflow:auto;
      background:rgba(5,11,16,0.96);
      color:var(--fg);
      border:1px solid #2c4664;
      border-radius:16px;
      box-shadow:0 18px 50px rgba(0,0,0,0.45);
      padding:14px;
      display:none;
    }
    #briefing-panel.open{ display:block; }
    #briefing-panel h2{ margin:0 0 4px; font-size:18px; }
    #briefing-panel .muted{ color:#9fb0c3; font-size:12px; }
    .briefing-port-group{
      margin-top:8px;
      padding:10px;
      background:rgba(255,255,255,0.03);
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.1);
    }
    .briefing-port-plans{
      margin-top:6px;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .briefing-plan{
      border:1px solid #22384f;
      border-radius:8px;
      padding:8px;
      margin-top:0;
      background:rgba(12,23,35,0.6);
      border-left:3px solid #2d7d46;
    }
    .briefing-plan:nth-child(2){ border-left-color:#d4a017; }
    .briefing-plan:nth-child(3){ border-left-color:#8b4513; }
    .briefing-plan strong{ font-size:14px; }
    .briefing-health{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      margin-top:10px;
    }
    .briefing-health div{
      border:1px solid #22384f;
      border-radius:10px;
      padding:8px;
      background:rgba(12,23,35,0.55);
      font-size:12px;
    }
    #briefing-full{
      margin-top:10px;
      white-space:pre-wrap;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:11px;
      line-height:1.35;
      color:#cbd6e2;
      border-top:1px solid #22384f;
      padding-top:10px;
      display:none;
    }
    #briefing-full.open{ display:block; }

    /* ======= Portrait mobile layout (width < height) ======= */
    @media (orientation: portrait) {
      #controls{ align-items:stretch; gap:8px; }
      #row-region,
      #row-var{ flex: 0 0 100%; justify-content:space-between; }
      /* row-play/row-slider display handled in JS for bathy */
      #row-play{ flex: 0 0 100%; justify-content:flex-start; }
      #row-slider{ flex: 0 0 100%; }

      #region-select,
      #var-select{ width:100%; max-width:none; font-size:18px; }
      #frame-label{
        width:100%;
        min-width:0;
        text-align:left;
        font-size:18px;
      }
      #frame-slider{ width:100%; min-width:0; }

      /* modebar full row (only needed if inside controls) - keeping this for mobile safety */
      #modebar-host .modebar{
        width:auto !important; /* Auto width for modebar */
        display:flex !important;
        flex-wrap:nowrap !important;
        justify-content:flex-start !important;
      }
      /* Bigger spacing between modebar symbols */
      #modebar-host .modebar-btn{
        margin-left:10px !important;
        margin-right:10px !important;
      }
      #modebar-host{
        top: 168px; /* Adjusted for larger portrait controls */
        left: 20px;
      }
      #modebar-host .modebar-group{
        display:flex !important;
        flex-wrap:nowrap !important;
        gap: 14px !important;            /* space between buttons */
      }



      /* smaller readout */
      #readout{
        right:10px;
        top: 168px; /* Adjusted to be next to modebar in portrait */
        font-size:12px;
        min-width:96px;
        padding:5px 7px;
      }

      /* plot height */
      #plot{ height: calc(100dvh - 220px - 96px); min-height:420px; }

      /* ===== Fix: keep "Temperature min max" on ONE row ===== */
      .range-block{
        width:100%;
        gap:6px;
        padding:4px 6px; /* FURTHER REDUCED PADDING */
      }
      .range-name{ font-size:12px; margin-right:2px; }
      .mini-label{ font-size:12px; }
      input[type="number"]{
        width:72px;
        font-size:12px;
        padding:4px 6px; /* FURTHER REDUCED PADDING */
        min-height:32px; /* FURTHER REDUCED MIN HEIGHT */
      }

      /* actions go to next row */
      .range-actions{ flex: 0 0 100%; }
      .range-actions button{ font-size:12px; min-height:20 px; padding:2px 8px; }
      /* footer colorbar wraps nicely on portrait */
      #ranges-right{ flex: 0 0 100%; }
      #cbar{ width:100%; }

    }
    
    /* Gate Styles */
	#login-gate {
	  position: fixed;
	  top: 0; left: 0; width: 100%; height: 100%;
	  background: #050b10; /* Solid background blocks the map */
	  z-index: 99999;      /* Ensures it sits on top of everything */
	  display: none;       /* Hidden - login disabled */
	  align-items: center;
	  justify-content: center;
	}

	.gate-box {
	  background: #0c1723;
	  border: 1px solid #273649;
	  padding: 40px;
	  border-radius: 12px;
	  text-align: center;
	  width: 90%;
	  max-width: 400px;
	  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
	}

	.gate-box h2 { margin-top: 0; color: #fff; }
	.gate-box p { color: #ccc; margin-bottom: 20px; }

	/* Inputs */
	.gate-box input {
	  display: block;
	  width: 100%;
	  box-sizing: border-box; /* Fixes padding issues */
	  padding: 12px;
	  margin: 10px 0;
	  border-radius: 6px;
	  border: 1px solid #273649;
	  background: #050b10;
	  color: #e0e6ee;
	  font-size: 16px;
	}

	/* Button */
	.gate-box button {
	  width: 100%;
	  padding: 12px;
	  margin-top: 10px;
	  border: none;
	  border-radius: 6px;
	  background: #1d4f91;
	  color: white;
	  font-weight: bold;
	  font-size: 16px;
	  cursor: pointer;
	}
	.gate-box button:hover { background: #2663b5; }
	
	/* Force cursor overrides for marker modes */
	.crosshair-mode .nsewdrag {
	  cursor: crosshair !important; /* The "thin cross" */
	}
	.remove-mode .nsewdrag {
	  cursor: no-drop !important; /* Or 'not-allowed' */
	}
	
	.measure-mode .nsewdrag {
	  cursor: cell !important; /* Looks like a precision cross/plus */
	}
  </style>
</head>

<body>
<script>/* FORCE HIDE LOGIN GATE - workaround for GitHub Pages cache */
(function(){var g=document.getElementById('login-gate');if(g){g.style.cssText='display:none!important;';g.style.display='none';}})();
</script>
  <div id="login-gate" style="display:none">
  <div class="gate-box">
    <h2 id="gate-title"></h2>
  </div>
  </div>

    

  <div id="controls">
    <div class="row control-group" id="row-region">
      <select id="region-select" class="control-select" title="Region">
        <option value="usec_md">US East Coast — Mid-Atlantic</option>
        <option value="usec_south">US East Coast — South-Atlantic</option>
      </select>
    </div>

    <div class="row control-group" id="row-var">
      <select id="var-select" class="control-select" title="Product">
        <option value="chl">Chlorophyll</option>
        <option value="sst">Temperature</option>
        <option value="uv">Currents</option>
        <option value="bathy">Bathymetry</option>
      </select>
    </div>

    <div class="row" id="row-slider">
      <span id="frame-label" style="min-width:200px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;"></span>
      <div class="row" id="row-play">
        <button id="prev-btn" title="Previous frame">&#9664;</button>
        <button id="play-btn">Play</button>
        <button id="next-btn" title="Next frame">&#9654;</button>
      </div>
      <input id="frame-slider" type="range" min="0" max="0" step="1" value="0" style="flex:1;min-width:160px;" />
      <label id="speed-wrap">
        <select id="speed-select" title="Animation speed">
          <option value="0.25">¼×</option>
          <option value="0.5">½×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <button id="fs-btn" title="Fullscreen">⛶</button>
      <button id="briefing-toggle" title="Captain briefing">Briefing</button>
    </div>
  </div>

  <div id="readout"></div>
  <div id="feedback-float">
    <button id="feedback-toggle" title="Send feedback">&#9993;</button>
    <div id="feedback-panel" style="display:none;">
      <input type="text" id="feedbackInput" placeholder="Questions / comments…" />
      <button id="feedbackSubmit">Send</button>
    </div>
  </div>
  <div id="modebar-host">
    <div id="modebar-tip" style="display:none;"></div>
  </div>
  <div id="plot"></div>

  <div id="briefing-panel" aria-live="polite">
    <h2>Captain Briefing</h2>
    <div id="briefing-status" class="muted">Loading briefing…</div>
    <div id="briefing-plans"></div>
    <div id="briefing-health" class="briefing-health"></div>
    <button id="briefing-full-toggle" style="margin-top:10px;">Show full briefing</button>
    <div id="briefing-full"></div>
  </div>

  <div id="ranges">
    <div id="ranges-left">
    <div class="range-block">
      <span class="range-name" id="range-title">Chlorophyll</span>
      <span class="mini-label">min</span><input id="vmin-input" type="number" step="any" inputmode="decimal" />
      <span class="mini-label">max</span><input id="vmax-input" type="number" step="any" inputmode="decimal" />
      <div class="range-actions">
        <button id="apply-range">Apply</button>
        <button id="reset-range">Reset</button>
      </div>
    </div>
    
    <div id="arrow-legend" class="range-block" style="display:none;">
      <span class="range-name">Currents</span>
      <svg id="arrow-svg" width="100" height="36" viewBox="0 0 100 36">
        <line x1="10" y1="18" x2="80" y2="18" stroke="#e0e6ee" stroke-width="1"/>
        <polyline points="75,14 85,18 75,22" fill="none" stroke="#e0e6ee" stroke-width="1"/>
      </svg>
      <span class="mini-label">1 m/s</span>
    </div>
    </div>
    
    <div id="ranges-right">
      <div id="cbar"></div>
    </div>
  </div>

<script>
/* ========================= CONFIG ========================= */
const CTO_TEST_LABEL = "hello pages rebuild";
const REGIONS = {
  usec_md: { label: "US East Coast — Mid-Atlantic", index: "index-usec_md.json" },
  usec_south: { label: "US East Coast — South-Atlantic", index: "index-usec_south.json" }
};
let REGION_ID = new URLSearchParams(location.search).get("region") || "usec_md";
if (!REGIONS[REGION_ID]) REGION_ID = "usec_md";

// Bounding Box (LonMin, LatMin, LonMax, LatMax)
  // usec_south BBOX: lon [-81, -71], lat [31, 40] — South Atlantic shelf and tournament grounds
  // Do NOT extend into Mid-Atlantic; usec_md covers the northerly area
  let BBOX = [-81, 31, -71, 40];

// UPDATED: UV label is now Sea Surface Height, and Currents arrow unit is separate
const VAR_LABELS = { 
  chl:"Chlorophyll", sst:"Temperature", 
  uv:"Sea Surface Height", /* CHANGED for Range Input Title */
  bathy:"Bathymetry" 
};

const VAR_TO_GRID = {
  chl: "viirs_chl_750_grid.json",
  sst: "goes_sst_1000_grid.json",
  uv:  "uv_12500_grid.json"
};

let BATHY_JSON_URL = `data/${REGION_ID}/gebco_bath_latest/gebco_bathy.json`;

const DEFAULT_RANGES = {
  chl:   { vmin: 0.01, vmax: 5.0, unit: "mg/m³" },
  sst:   { vmin: 23.0, vmax: 28.0, unit: "°C" },
  uv:    { vmin: 0.6, vmax: 0.9,  unit: "m" }, /* CHANGED: Now represents ADT/SSH range */
  bathy: { vmin: 0.0,  vmax: 3000.0, unit: "m" }
};

let userRanges = {
  chl:   { ...DEFAULT_RANGES.chl },
  sst:   { ...DEFAULT_RANGES.sst },
  uv:    { ...DEFAULT_RANGES.uv },
  bathy: { ...DEFAULT_RANGES.bathy }
};

/* CHL colorscale (algae-ish) */
const CHL_ALGAE = [
  [0.00, "#ff00ff"], // Magenta (Lowest)
  [0.25, "#0000ff"], // Blue (shifted up to 25%)
  [0.50, "#00ffff"], // Cyan (Midpoint is now strictly cool)
  [0.70, "#00ff00"], // Green (Delayed until 70%)
  [0.85, "#ffff00"], // Yellow (Compressed into top 15%)
  [1.00, "#ff0000"]  // Red (Highest)
];

/* const CHL_ALGAE = [
  [0.0, "#021029"], // Pitch Dark Blue (Lowest)
  [0.2, "#002a70"], // Deep Royal Blue
  [0.4, "#0055ff"], // Bright Electric Blue
  [0.5, "#00d4aa"], // Vivid Teal (Transition)
  [0.6, "#00c42e"], // Bright Lime/Emerald
  [0.8, "#007a1c"], // Rich Green
  [1.0, "#003300"]  // Deepest Forest Green (Highest)
];*/

// Professional Bathymetry Scale: Shallow (Light Teal) to Deep (Navy)
const BATHY_SCALE = [
  [0.0, "#e0ffff"], // 0 depth: Very light cyan (Coastline)
  [0.1, "#afeeee"], // Pale Turquoise (Inner Shelf)
  [0.3, "#40e0d0"], // Turquoise (Outer Shelf)
  [0.5, "#0080ff"], // Azure Blue (Slope)
  [0.7, "#0000cc"], // Medium Blue (Deep Ocean)
  [0.9, "#000066"], // Dark Blue (Abyssal)
  [1.0, "#000033"]  // Midnight Blue (Deepest Trenches)
];

/* show 0.01, 0.1, 1, 10 on CHL colorbar */
const CHL_TICKS_LINEAR = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10];
const CHL_TICKVALS = CHL_TICKS_LINEAR.map(v => Math.log10(v));
const CHL_TICKTEXT = CHL_TICKS_LINEAR.map(v => (v===0.01||v===0.1||v===1||v===10) ? String(v) : "");

/* ========================= STATE ========================= */
let lastUpdateTimestamp = null;
let framesByVar = { chl: [], sst: [], uv: [], bathy: [] };
let frameTimesByVar = { chl: [], sst: [], uv: [], bathy: [] };
let currentVar = "chl";

function placeInRegion(p) {
  const [w, s, e, n] = BBOX.map(Number);
  return p.lon >= w && p.lon <= e && p.lat >= s && p.lat <= n;
}

function placeTrace(type) {
  const pts = PLACE_LABELS.filter(p => p.type === type && placeInRegion(p));
  const isPort = type === "port";
  const isSpot = type === "spot";
  const isCity = type === "city";
  return {
    type:"scatter",
    mode:"markers+text",
    x: pts.map(p => p.lon),
    y: pts.map(p => p.lat),
    text: pts.map(p => p.name),
    textposition: isSpot ? "top center" : isPort ? "bottom center" : "top center",
    textfont:{ size: isSpot ? 11 : isPort ? 10 : 11, color: isSpot ? "#ff9f1c" : isPort ? "#ffd166" : "#ffffff", font:{ weight: isSpot ? "bold" : "normal" } },
    marker:{ size: isSpot ? 9 : isPort ? 7 : 6, color: isSpot ? "#ff6b35" : isPort ? "#ff9f1c" : "#7bdff2", symbol: isSpot ? "star" : isPort ? "diamond" : "circle", line:{color:"#061018", width: isSpot ? 2 : 1} },
    hovertemplate: `<b>${isSpot ? "Tournament Spot" : isPort ? "Fishing Port" : "City"}</b>: %{text}<extra></extra>`,
    showlegend:false,
    name: isSpot ? "Tournament Spots" : isPort ? "Fishing Ports" : "Major Cities"
  };
}

function removeNearestMarker(lon, lat, tolDeg = 0.05) {
  let bestI = -1, bestD = Infinity;
  for (let i = 0; i < markers.length; i++) {
    const dx = (markers[i].lon - lon);
    const dy = (markers[i].lat - lat);
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; bestI = i; }
  }
  if (bestI >= 0 && bestD <= tolDeg) markers.splice(bestI, 1);
}

// UPDATED: Haversine Formula for Nautical Miles (nm)
function getDistanceInNM(lat1, lon1, lat2, lon2) {
  const R = 3440.065; // Radius of earth in Nautical Miles
  const dLat = (lat2 - lat1) * (Math.PI / 180);
  const dLon = (lon2 - lon1) * (Math.PI / 180);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function updateMeasureTrace() {
  // Case 1: Start Mode (Only 1 point)
  if (measurePoints.length < 2) {
    measureTrace.x = measurePoints.map(p => p.lon);
    measureTrace.y = measurePoints.map(p => p.lat);
    measureTrace.text = [""];
    
    // Reset style for single dot
    measureTrace.marker.size = 8;
    measureTrace.marker.opacity = 1; 
    return;
  }

  // Case 2: Measurement Mode
  const p1 = measurePoints[0];
  const p2 = measurePoints[1];

  const midLon = (p1.lon + p2.lon) / 2;
  const midLat = (p1.lat + p2.lat) / 2;

  const dist = getDistanceInNM(p1.lat, p1.lon, p2.lat, p2.lon);

  measureTrace.x = [p1.lon, midLon, p2.lon];
  measureTrace.y = [p1.lat, midLat, p2.lat];
  measureTrace.text = ["", `${dist.toFixed(2)} nm`, ""];
  
  // --- DYNAMIC ORIENTATION ---
  // Check if the line is more "Vertical" (dLat > dLon) or "Horizontal"
  const dLon = Math.abs(p1.lon - p2.lon);
  const dLat = Math.abs(p1.lat - p2.lat);
  const isVertical = dLat > dLon;

  // If Vertical: Push text to the Side (Middle Right)
  // If Horizontal: Push text Up (Top Center)
  measureTrace.textposition = isVertical ? "middle right" : "top center";

  // --- PADDING TRICK ---
  // We make the middle marker LARGE (30px) so the text is pushed away from the center.
  // We make it INVISIBLE (opacity 0) so you don't actually see a giant dot.
  measureTrace.marker.size = [8, 30, 8]; 
  measureTrace.marker.opacity = [1, 0, 1];
}

/* ========================= TIME PARSERS ========================= */
function parseChlUtcFromName(filename) {
  const m = filename.match(/_(\d{4})(\d{3})\.(\d{4})_/);
  if (!m) return null;
  const year = Number(m[1]);
  const jjj  = Number(m[2]);
  const hhmm = m[3];
  const hh = Number(hhmm.slice(0,2));
  const mm = Number(hhmm.slice(2,4));
  const d0 = new Date(Date.UTC(year,0,1,0,0,0));
  return new Date(d0.getTime() + (jjj-1)*86400e3 + hh*3600e3 + mm*60e3);
}
function parseSstUtcFromName(filename) {
  const m = filename.match(/sstcomp_.*?_(\d{4})(\d{3})_(\d{8})_(\d{2})_/);
  if (!m) return null;
  const year = Number(m[1]);
  const jjj  = Number(m[2]);
  const hh   = Number(m[4]);
  const d0 = new Date(Date.UTC(year,0,1,0,0,0));
  return new Date(d0.getTime() + (jjj-1)*86400e3 + hh*3600e3);
}
function parseUvDateFromName(filename) {
  const m = filename.match(/_(\d{8})_/);
  if (!m) return null;
  const y = Number(m[1].slice(0,4));
  const mo = Number(m[1].slice(4,6)) - 1;
  const d = Number(m[1].slice(6,8));
  return new Date(Date.UTC(y,mo,d));
}

function fmtLocalDateTime(dt) {
  return dt.toLocaleString(undefined, {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit",
    hour12:false
  });
}
function fmtLocalDate(dt) {
  return dt.toLocaleDateString(undefined, { year:"numeric", month:"2-digit", day:"2-digit" });
}

function framePathOf(f){ return String(f?.json_path || f?.path || f?.file || f?.url || f?.json || ""); }
function frameFilenameOf(f){ const p = framePathOf(f); return p.split("/").pop() || p; }

function timeOnlyLabel(varKey, frameMeta) {
  if (varKey === "bathy") return ""; /* EMPTY for bathy */
  const path = framePathOf(frameMeta);
  const filename = String(path).split("/").pop() || "";
  if (varKey === "chl") { const dt = parseChlUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "sst") { const dt = parseSstUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "uv")  { const dt = parseUvDateFromName(filename);  return dt ? fmtLocalDate(dt) : ""; }
  return "";
}

function epochMsForFrame(varKey, frameMeta) {
  if (varKey === "bathy") return Date.UTC(2025,11,8);
  const filename = frameFilenameOf(frameMeta);
  let dt = null;
  if (varKey === "chl") dt = parseChlUtcFromName(filename);
  if (varKey === "sst") dt = parseSstUtcFromName(filename);
  if (varKey === "uv")  dt = parseUvDateFromName(filename);
  return dt ? dt.getTime() : null;
}

/* ========================= HELPERS ========================= */
function is2D(a){ return Array.isArray(a) && a.length>0 && Array.isArray(a[0]) && a[0].length>0; }

function filterFramesForVar(varKey, frames) {
  const out = [];
  for (const f of (frames || [])) {
    const fn = frameFilenameOf(f).toLowerCase();
    if (!fn.endsWith(".json")) continue;
    if (fn.includes("grid")) continue;
    if (varKey === "chl" && !fn.includes("_chl_")) continue;
    if (varKey === "sst" && !fn.startsWith("sst")) continue;
    if (varKey === "uv"  && !fn.startsWith("uv_")) continue;
    out.push(f);
  }
  return out;
}

function closestIndex(times, targetMs) {
  if (!times.length || targetMs === null) return 0;
  let best = 0, bestDist = Infinity;
  for (let i=0;i<times.length;i++){
    const t = times[i];
    if (t === null) continue;
    const d = Math.abs(t - targetMs);
    if (d < bestDist){ bestDist = d; best = i; }
  }
  return best;
}

function attachRelayoutListenerOnce() {
  if (_relayoutHooked) return;
  _relayoutHooked = true;

  plotDiv.on("plotly_relayout", (ev) => {
    if (!ev) return;
    const xr0 = ev["xaxis.range[0]"], xr1 = ev["xaxis.range[1]"];
    const yr0 = ev["yaxis.range[0]"], yr1 = ev["yaxis.range[1]"];
    if (xr0 !== undefined && xr1 !== undefined && yr0 !== undefined && yr1 !== undefined) {
      viewState.hasRange = true;
      viewState.xRange = [xr0, xr1];
      viewState.yRange = [yr0, yr1];
      return;
    }
    if (ev["xaxis.autorange"] === true || ev["yaxis.autorange"] === true) {
      viewState.hasRange = false;
      viewState.xRange = null;
      viewState.yRange = null;
    }
  });
}

async function renderFooterColorbar(varKey) {
  if (!cbarDiv) return;
  
  const unit = DEFAULT_RANGES[varKey]?.unit || "";
  let cmin = userRanges[varKey]?.vmin;
  let cmax = userRanges[varKey]?.vmax;
  
  let chosenScale = "Viridis"; 
  let tickmode = undefined;
  let tickvals = undefined;
  let ticktext = undefined;
  let xValues = [0, 1];
  let cValues = [cmin, cmax];

  // --- SPECIAL CONFIG FOR CHL (Log10) ---
  if (varKey === "chl") {
    console.log("[DEBUG] Building CHL Footer");
    
    // 1. Force Custom Colors
    chosenScale = CHL_ALGAE;
    
    // 2. Log-Transform Limits
    cmin = Math.log10(cmin > 0 ? cmin : 0.01); 
    cmax = Math.log10(cmax > 0 ? cmax : 100);
    
    // 3. Setup Log Ticks
    // Convert linear ticks (0.01, 1, 10) to Log10 (-2, 0, 1)
    tickmode = "array"; 
    tickvals = CHL_TICKS_LINEAR.map(v => Math.log10(v));
    ticktext = CHL_TICKS_LINEAR.map(v => String(v));

    // 4. GENERATE DENSE GRADIENT
    // To ensure Plotly renders the custom log gradient correctly, we create 100 points
    // spanning cmin to cmax.
    xValues = [];
    cValues = [];
    for (let i = 0; i <= 100; i++) {
        xValues.push(i / 100); // 0.0 to 1.0
        // Interpolate value between cmin and cmax
        cValues.push(cmin + (cmax - cmin) * (i / 100));
    }
    
  } else if (varKey === "sst") {
    chosenScale = "RdBu";
    cValues = [cmin, cmax];
  } else if (varKey === "bathy") {
    chosenScale = BATHY_SCALE;
    cValues = [cmin, cmax];
  }

  const trace = {
    type: "scatter", 
    mode: "markers", 
    x: xValues, 
    y: new Array(xValues.length).fill(0), // All at y=0
    hoverinfo: "none",
    marker: {
      size: 1, 
      opacity: 0.001, 
      color: cValues, // This forces the full gradient range
      cmin: cmin, 
      cmax: cmax, 
      colorscale: chosenScale, 
      showscale: true,
      colorbar: { 
        title: { text: unit, side: "top" }, 
        orientation: "h", 
        x: 0.5, xanchor: "center", 
        y: 0.5, yanchor: "middle", 
        len: 1.0, thickness: 14, 
        tickmode, tickvals, ticktext, 
        ticks: "outside", ticklen: 4, tickwidth: 1, 
        tickfont: { color: "#e0e6ee", size: 11 }, 
        titlefont: { color: "#e0e6ee", size: 11 } 
      }
    }
  };

  const layout = { 
    margin: { l: 0, r: 0, t: 0, b: 0 }, 
    paper_bgcolor: "rgba(0,0,0,0)", 
    plot_bgcolor: "rgba(0,0,0,0)", 
    xaxis: { visible: false }, 
    yaxis: { visible: false } 
  };
  
  // Use newPlot to ensure complete refresh
  await Plotly.newPlot(cbarDiv, [trace], layout, { displayModeBar: false, responsive: true });
}


function stableLayout() {
  const portrait = isPortrait();
  const layout = {
    uirevision: "sync_fov_mobile_v4",
    margin: portrait ? { l: 52, r: 16, t: 8, b: 84 } : { l: 0, r: 0, t: 0, b: 0 },
    paper_bgcolor: "#050b10",
    plot_bgcolor: "#ffffff",
    font: { color:"#e0e6ee" },
    xaxis: { automargin:true, tickpadding: 0 },
    yaxis: { automargin:true, tickpadding: 0, scaleanchor:"x", scaleratio: 1 },
    hovermode: "closest",
    dragmode: "pan"
  };

  if (viewState.hasRange && viewState.xRange && viewState.yRange) {
    // Keep the user's current field-of-view (pan/zoom) during animation
    layout.xaxis.range = [viewState.xRange[0], viewState.xRange[1]];
    layout.yaxis.range = [viewState.yRange[0], viewState.yRange[1]];
    layout.xaxis.autorange = false;
    layout.yaxis.autorange = false;
  } else {
    layout.xaxis.autorange = true;
    layout.yaxis.autorange = true;
  }
  return layout;
}

/* ================= BUILD CHL (Matches SST Layout + Custom Colors) ================= */
function buildChl(grid, data) {
  // 1. DATA FINDER
  const rawZ = data.z || data.chl || data.data;
  if (!rawZ) return { data: [], layout: {} };

  // 2. GET AXES
  let plotX = grid.xAxis; 
  let plotY = grid.yAxis;

  // 3. UPSIDE DOWN FIX (Flip Y if needed)
  if (plotY.length > 1 && plotY[0] < plotY[plotY.length - 1]) {
    plotY = [...plotY].reverse();
  }

  // 4. LOG-SCALE COLORS
  // We map the data to Log10 so it matches the footer's Log scale.
  const logZ = rawZ.map(row => {
    if (!Array.isArray(row)) return row;
    return row.map(v => (v > 0 ? Math.log10(v) : null));
  });

  // Convert User Sliders (Linear) to Log Limits
  const linearMin = userRanges.chl.vmin;
  const linearMax = userRanges.chl.vmax;
  const cminLog = Math.log10(linearMin > 0 ? linearMin : 0.01);
  const cmaxLog = Math.log10(linearMax > 0 ? linearMax : 100);

  // 5. DEFINE TRACE
  const trace = {
    type: "heatmap",
    x: plotX,           
    y: plotY,          
    z: logZ,            // Log values (Controls Color)
    customdata: rawZ,   // Linear values (Controls Hover Text)

    colorscale: CHL_ALGAE, // <--- EXPLICITLY USE CUSTOM SCALE
    zmin: cminLog,        
    zmax: cmaxLog,        
    showscale: false,   // Internal bar hidden (Footer used instead)

    hovertemplate: `<b>CHL</b>: %{customdata:.2f} mg/m³<extra></extra>`
  };

  // 6. USE STABLE LAYOUT (Critical for consistent margins)
  const layout = stableLayout();

  return { data: [trace], layout };
}

function buildSst(gridInfo, dataObj) {
  const { xAxis, yAxis } = gridInfo;
  const sst = dataObj.sst || dataObj.z || dataObj.data;
  if (!is2D(sst)) throw new Error("SST JSON missing 2-D key: sst/z/data");

  const vmin = userRanges.sst.vmin;
  const vmax = userRanges.sst.vmax;	

  return {
    data: [{
      type:"heatmap",
      x:xAxis, y:yAxis,
      z: sst,
      customdata: sst,
      hoverinfo:"none",
      showscale:false,
      zauto:false, zmin:vmin, zmax:vmax,

      /* CHANGED: Use RdBu with reverseScale:true for standard cold(blue) -> warm(red) */
      colorscale: "RdBu",
      reversescale: false,

      colorbar: colorbarFor("sst"),
      zsmooth:false
    }],
    layout: stableLayout()
  };
}

function buildUv(gridInfo, dataObj) {
  const { xAxis, yAxis, nx, ny } = gridInfo;
  const d = dataObj.data || dataObj;

  if (!d || !is2D(d.u) || !is2D(d.v) || !is2D(d.adt)) {
    throw new Error("UV JSON missing 2-D keys: data.u, data.v, data.adt");
  }

  const adt = d.adt;
  const u = d.u, v = d.v;

  // Use the UV range, which is now configured for ADT (Sea Surface Height)
  const vmin = userRanges.uv.vmin; 
  const vmax = userRanges.uv.vmax; 

  const bg = {
    type:"heatmap",
    x:xAxis, y:yAxis,
    z:adt,
    customdata:adt,
    hoverinfo:"none",
    showscale:false,
    zauto:false, zmin:vmin, zmax:vmax,
    colorscale:"Viridis",
    // Colorbar uses the 'uv' key which now has the unit 'm'
    colorbar: colorbarFor("uv"), 
    zsmooth:false
  };

  // Open arrowheads
  const lineX = [];
  const lineY = [];

  let dxg = 0.01, dyg = 0.01;
  if (nx > 1) dxg = Math.abs(xAxis[1] - xAxis[0]);
  if (ny > 1) dyg = Math.abs(yAxis[1] - yAxis[0]);
  const minHead = 0.2 * Math.max(dxg, dyg);
  const headAngle = (10 * Math.PI) / 180;

  const step = (nx * ny > 2500) ? 2 : 1;
  const scale = 1.0;

  for (let j=0;j<ny;j+=step){
    const lat0 = yAxis[j];
    for (let i=0;i<nx;i+=step){
      const lon0 = xAxis[i];
      const uu = u[j][i], vv = v[j][i];
      const sp = Math.hypot(uu, vv); 
      
      if (!isFinite(uu) || !isFinite(vv) || !isFinite(sp)) continue;

      const lon1 = lon0 + uu * scale;
      const lat1 = lat0 + vv * scale;

      const dx = lon1 - lon0, dy = lat1 - lat0;
      const L = Math.hypot(dx,dy);
      if (!(L > 0)) continue;

      // shaft
      lineX.push(lon0, lon1, null);
      lineY.push(lat0, lat1, null);

      // open V head
      const theta = Math.atan2(dy, dx);
      const hl = Math.max(minHead, 0.45 * L);

      const xL = lon1 + hl * Math.cos(theta + Math.PI - headAngle);
      const yL = lat1 + hl * Math.sin(theta + Math.PI - headAngle);
      const xR = lon1 + hl * Math.cos(theta + Math.PI + headAngle);
      const yR = lat1 + hl * Math.sin(theta + Math.PI + headAngle);

      lineX.push(lon1, xL, null, lon1, xR, null);
      lineY.push(lat1, yL, null, lat1, yR, null);
    }
  }

  const arrows = {
    type:"scatter",
    mode:"lines",
    x:lineX, y:lineY,
    hoverinfo:"none",
    line:{ color:"#000000", width:1.6 }, /* CHANGED color to white for better contrast */
    showlegend:false
  };

  return { data:[bg, arrows], layout: stableLayout() };
}

/* ===== Improved Bathymetry Loader ===== */
async function loadBathymetryJson(url) {
  if (gridCache.__bathy_json) return gridCache.__bathy_json;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to load bathy JSON: ${url}`);
  const data = await res.json();

  // Validate structure
  if (!data.xAxis || !data.yAxis || !data.depth) {
    throw new Error("Bathy JSON missing keys: xAxis, yAxis, or depth");
  }

  // Create customdata for readout (clone depth)
  // We can just reference the same array since we aren't modifying it
  const out = {
    xAxis: data.xAxis,
    yAxis: data.yAxis,
    depth: data.depth,
    customdata: data.depth 
  };
  
  gridCache.__bathy_json = out;
  return out;
}

function buildBathy(bathy) {
  const vmin = userRanges.bathy.vmin;
  const vmax = userRanges.bathy.vmax;

  return {
    data: [{
      type:"heatmap",
      x:bathy.xAxis, y:bathy.yAxis,
      z:bathy.depth,
      customdata:bathy.customdata,
      hoverinfo:"none",
      showscale:false,
      zauto:false, zmin:vmin, zmax:vmax,
      colorscale:BATHY_SCALE,
      reversescale:false,
      colorbar: colorbarFor("bathy"),
      zsmooth:false
    }],
    layout: stableLayout()
  };
}

function buildForVar(varKey, gridInfo, dataObj) {
  if (varKey === "chl") return buildChl(gridInfo, dataObj);
  if (varKey === "sst") return buildSst(gridInfo, dataObj);
  if (varKey === "uv")  return buildUv(gridInfo, dataObj);
  throw new Error(`Unsupported varKey=${varKey}`);
}

/* ========================= READOUT (hover + tap) ========================= */
function setupReadoutHandlersOnce() {
  if (_readoutHooked) return;
  _readoutHooked = true;

  plotDiv.on("plotly_unhover", () => { if (!IS_TOUCH) setReadout(""); });

  plotDiv.on("plotly_hover", (ev) => {
    if (IS_TOUCH) return;
    const p = ev.points && ev.points[0];
    if (!p) return;
    renderReadoutFromPoint(p);
  });

  plotDiv.on("plotly_click", async (ev) => {
    // 1. CLEANUP PREVIOUS MEASUREMENT (If exists)
    // If the user clicks ANYWHERE while a measurement line is visible, clear it first.
    if (measureResultVisible) {
      measurePoints = [];
      measureResultVisible = false;
      await showFrame();
      // We continue processing this click (so they can immediately click to add a marker or see a value)
    }

    // 2. DETERMINE COORDINATES
    let lon, lat;
    const p = ev.points && ev.points[0];

    // Use Exact Mouse Calculation for Add OR Measure modes
    if (markerMode === "add" || measureMode !== "off") {
      const domEvent = ev.event; 
      const xaxis = plotDiv._fullLayout.xaxis;
      const yaxis = plotDiv._fullLayout.yaxis;
      const dragLayer = plotDiv.querySelector('.nsewdrag');
      const rect = dragLayer.getBoundingClientRect();
      const xPx = domEvent.clientX - rect.left;
      const yPx = domEvent.clientY - rect.top;
      lon = xaxis.p2d(xPx);
      lat = yaxis.p2d(yPx);
    } else {
      if (!p) return;
      lon = Number(p.x);
      lat = Number(p.y);
    }

    if (!isFinite(lon) || !isFinite(lat)) return;

    // --- 3. MEASURE LOGIC (Updated) ---
    if (measureMode !== "off") {
      if (measureMode === "start") {
        // Point A
        measurePoints = [{ lon, lat }];
        measureMode = "end";
        setReadout("Measure: Click END point");
      } else {
        // Point B (Finish)
        measurePoints[1] = { lon, lat };
        
        const d = getDistanceInNM(
          measurePoints[0].lat, measurePoints[0].lon,
          measurePoints[1].lat, measurePoints[1].lon
        );
        
        // 1. Show result in top bar
        setReadout(`Distance: ${d.toFixed(2)} nm`);
        
        // 2. Turn OFF mode immediately
        measureMode = "off";
        plotDiv.classList.remove("measure-mode");
        
        // 3. Flag result as visible so NEXT click clears it
        measureResultVisible = true;
      }
      await showFrame();
      return;
    }

    // --- 4. MARKER LOGIC ---
    if (markerMode === "add") {
      markers.push({ lon, lat, label: String(markers.length + 1) });
      await showFrame();
      return;
    }
    if (markerMode === "remove") {
      removeNearestMarker(lon, lat);
      await showFrame();
      return;
    }

    // --- 5. NORMAL READOUT ---
    if (p) renderReadoutFromPoint(p);
  });
}

/* ================= DDM CONVERSION HELPER (Standard Marine) ================= */
function toDDM(val) {
  const absVal = Math.abs(val);
  const d = Math.floor(absVal);
  const m = (absVal - d) * 60;
  
  // Format: Degrees + Minutes with 3 decimal places (Standard GPS precision)
  // padStart(2, '0') ensures "05.123" instead of "5.123"
  const mStr = m.toFixed(2).padStart(5, '0'); 
  
  // West/South Handling
  // You can also add N/S/E/W suffixes if preferred, 
  // but standard negative signs work well for compact readouts.
  const sign = val < 0 ? "-" : "";
  
  return `${sign}${d}°${mStr}'`;
}

/* ================= READOUT ================= */
function renderReadoutFromPoint(p) {
  const lon = Number(p.x);
  const lat = Number(p.y);
  if (!isFinite(lon) || !isFinite(lat)) return;

  // CHANGED: Use DDM format
  const base = `${toDDM(lon)} ${toDDM(lat)}`;
  
  const cd = p.customdata;
  if (cd === null || cd === undefined || !isFinite(cd)) { 
    setReadout(base); 
    return; 
  }

  const val = Number(cd);
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";
  
  if (currentVar === "sst") setReadout(`${base}, ${val.toFixed(2)}${unit}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else setReadout(`${base} ${val.toFixed(3)}${unit}`);
}

async function setCurrentVar(v, keepTime = true) {
  const prevVar = currentVar;
  const prevFrames = framesByVar[prevVar] || [];
  const prevFrame = prevFrames[currentFrameIdx] || null;
  const prevT = (keepTime && prevFrame) ? epochMsForFrame(prevVar, prevFrame) : null;

  currentVar = v;
  varSelect.value = v;

  const frames = framesByVar[currentVar] || [];
  const times = frameTimesByVar[currentVar] || [];

  if (frames.length) currentFrameIdx = (keepTime && prevT !== null) ? closestIndex(times, prevT) : 0;
  else currentFrameIdx = 0;

  updateSliderUI();

  else Plotly.purge(plotDiv);

function stepFrame(delta) {
  const frames = framesByVar[currentVar] || [];
  const n = frames.length;
  if (!n) return;
  currentFrameIdx = (currentFrameIdx + delta + n) % n;
  slider.value = currentFrameIdx;

  if (on === playing) return;
  playing = on;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  } else {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
  }
}


function setPlaySpeed(mult) {
  const m = Number(mult);
  if (!isFinite(m) || m <= 0) return;
  playSpeed = m;
  playIntervalMs = Math.max(60, Math.round(BASE_PLAY_MS / playSpeed));
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  }
}

/* ========================= LOADING ========================= */
async function loadIndex() {
  // 1. Fetch selected region index ONCE with a cache-buster
  const indexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
  const res = await fetch(indexUrl + "?t=" + Date.now());
  if (!res.ok) throw new Error(`Failed to load ${indexUrl}`);
  const data = await res.json();
  
  // 2. Set the global timestamp if it's the first load
  if (!lastUpdateTimestamp) {
    lastUpdateTimestamp = data.last_updated;
  }
  
  // 3. Use the data we already fetched instead of looping through CANDIDATES
  const idx = data; 
  if (idx.region && idx.region !== REGION_ID) {
    REGION_ID = idx.region;
    BATHY_JSON_URL = `data/${REGION_ID}/${idx.region_meta?.bathy_path || "gebco_bath_latest/gebco_bathy.json"}`;
  }
  if (idx.region_meta?.bbox?.length >= 4) {
    BBOX = idx.region_meta.bbox.map(Number);
  }

  const fbv = idx.frames || idx.framesByVar || idx.frames_by_var || framesByVar;

  framesByVar.chl = filterFramesForVar("chl", fbv.chl || []);
  framesByVar.sst = filterFramesForVar("sst", fbv.sst || []);
  framesByVar.uv  = filterFramesForVar("uv",  fbv.uv  || []);
  framesByVar.bathy = [{ json_path: BATHY_JSON_URL }];

  for (const v of ["chl","sst","uv","bathy"]) {
    framesByVar[v].sort((a,b) => (epochMsForFrame(v,a) ?? 0) - (epochMsForFrame(v,b) ?? 0));
    frameTimesByVar[v] = framesByVar[v].map(f => epochMsForFrame(v,f));
  }

  for (const opt of varSelect.options) {
    const count = (framesByVar[opt.value] || []).length;
    opt.disabled = count === 0;
    opt.textContent = count === 0 ? `${VAR_LABELS[opt.value]} — no data` : VAR_LABELS[opt.value];
  }
  
  return data;
}


function inferGridFromFrame(v, dataObj) {
  const bbox = dataObj && dataObj.bbox;
  const z = v === "uv" ? dataObj?.adt : (dataObj?.sst || dataObj?.z || dataObj?.chl || dataObj?.data);
  const ny = dataObj?.ny || (Array.isArray(z) ? z.length : 0);
  const nx = dataObj?.nx || (Array.isArray(z) && Array.isArray(z[0]) ? z[0].length : 0);
  if (!bbox || bbox.length < 4 || !nx || !ny) throw new Error(`Cannot infer grid for ${v}`);

  const [lonMin, latMin, lonMax, latMax] = bbox;
  const linspace = (a, b, n) => Array.from({length:n}, (_, i) => n === 1 ? a : a + (b - a) * i / (n - 1));
  const xAxis = linspace(lonMin, lonMax, nx);
  // The SST composite rows are north-to-south; CHL and UV are south-to-north.
  const yAxis = v === "sst" ? linspace(latMax, latMin, ny) : linspace(latMin, latMax, ny);
  return { xAxis, yAxis, nx, ny };
}

async function loadGridForVar(v, dataObj = null) {
  if (gridCache[v]) return gridCache[v];
  const gridName = VAR_TO_GRID[v];
  
  try {
    const res = await fetch(`data/${REGION_ID}/grids/${gridName}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const grid = await res.json();

    const lon = grid.lon || grid.longitude;
    const lat = grid.lat || grid.latitude;
    if (!lon || !lat) throw new Error("grid missing lon/lat axes");

    let xAxis, yAxis, nx, ny;
    if (Array.isArray(lon[0]) && Array.isArray(lat[0])) {
      ny = lon.length;
      nx = lon[0].length;
      const midY = Math.floor(ny / 2);
      const midX = Math.floor(nx / 2);
      xAxis = lon[midY].slice();
      yAxis = lat.map(r => r[midX]);
    } else {
      xAxis = lon.slice();
      yAxis = lat.slice();
      nx = xAxis.length;
      ny = yAxis.length;
    }

    const info = { xAxis, yAxis, nx, ny };
    gridCache[v] = info;
    return info;
  } catch (e) {
    console.warn(`Grid file unavailable for ${v}; inferring axes from frame metadata.`, e);
    const info = inferGridFromFrame(v, dataObj || {});
    gridCache[v] = info;
    return info;
  }
}

async function prepareLandMask() {

    const data = await loadBathymetryJson(BATHY_JSON_URL);
    
    // Create a Z-grid for the mask: 1 for Land, null for Water
    // Assuming convention: Positive = Water Depth, Negative/Zero = Land Elevation
    const zMask = data.depth.map(row => 
      row.map(val => (val !== null && val <= 0) ? 1 : null)

    landTrace = {

      x: data.xAxis,

      z: zMask,
      showscale: false, // No colorbar for land

      hoverinfo: "skip", // Don't show hover tooltips for land
      zmin: 0,

    };

  }
}

async function showFrame() {
  updateReadoutPosition();

  const frames = framesByVar[currentVar] || [];
  if (!frames.length) return;

  const frameMeta = frames[currentFrameIdx];

  let fig = null;

  if (currentVar === "bathy") {
    const bathy = await loadBathymetryJson(BATHY_JSON_URL);
    fig = buildBathy(bathy);
  } else {
    const dataObj = await fetchFrameData(currentVar, frameMeta);
    const gridInfo = await loadGridForVar(currentVar, dataObj);
    fig = buildForVar(currentVar, gridInfo, dataObj);
  }

  injectMarkers(fig);
  
  if (landTrace) {
    fig.data.push(landTrace);
  }
  injectPlaceLabels(fig);

  await Plotly.react(plotDiv, fig.data, fig.layout, plotConfig());
  await renderFooterColorbar(currentVar);
  
  const modebar = plotDiv.querySelector('.modebar');
  if (modebar && !modebarHost.querySelector('.modebar')) {
      modebarHost.appendChild(modebar);
  }
  
  installModebarHoverHelpOnce();

  installTouchPolicyOnce();
  
  setupReadoutHandlersOnce();
  attachRelayoutListenerOnce();
  updateSliderUI();
}

  const panel = document.getElementById("briefing-panel");
  const status = document.getElementById("briefing-status");
  const plansDiv = document.getElementById("briefing-plans");
  const healthDiv = document.getElementById("briefing-health");
  const fullDiv = document.getElementById("briefing-full");
  if (!panel || !status || !plansDiv || !healthDiv || !fullDiv) return;

  try {
    const res = await fetch(`data/${REGION_ID}/briefing/latest.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`No briefing artifact for ${REGION_ID}`);
    const briefing = await res.json();
    const when = briefing.generated_at ? new Date(briefing.generated_at).toLocaleString() : "unknown";
    status.textContent = `${briefing.target_window || briefing.title || "Captain Briefing"} • ${when}`;

    // New structure: plans grouped by departure_port
    // Each plan has: { departure_port, destinations: [{zone, verdict, score, confidence, rank_within_port}] }
    const portGroups = {};
    (briefing.plans || []).forEach(p => {
      const port = p.departure_port || p.zone || "Unknown Port";
      if (!portGroups[port]) portGroups[port] = [];
      portGroups[port].push(p);
    });
    plansDiv.innerHTML = Object.entries(portGroups).slice(0, 4).map(([port, plans]) => `
      <div class="briefing-port-group">
        <div class="muted" style="font-size:11px;margin-bottom:4px;">DEPARTURE PORT</div>
        <strong style="font-size:14px;">${port}</strong>
        <div class="briefing-port-plans">
          ${(plans || []).slice(0, 3).map((p, i) => `
            <div class="briefing-plan" style="margin-left:0;padding-left:8px;border-left:2px solid ${i===0?'#2d7d46':i===1?'#d4a017':'#8b4513'}">
              <div class="muted">PLAN ${"ABC"[i]}</div>
              <strong>${p.zone || "Unknown"}</strong><br>
              <span>${p.verdict || ""}</span> • Score ${p.score ?? "?"}/120 • ${p.confidence || "?"}
            </div>
          `).join("")}
        </div>
      </div>
    `).join("");

    const products = (briefing.health && briefing.health.products) || {};
    healthDiv.innerHTML = ["sst", "chl", "uv"].map(k => {
      const h = products[k] || {};
      return `<div><strong>${k.toUpperCase()}</strong><br>ok=${h.ok === true}<br>age=${h.age_min ?? "?"}m</div>`;
    }).join("");

    fullDiv.textContent = briefing.briefing_text || briefing.ranking_summary || "No briefing text available.";
  } catch (e) {
    status.textContent = `Briefing unavailable: ${e.message}`;
    plansDiv.innerHTML = "";
    healthDiv.innerHTML = "";
    fullDiv.textContent = "";
  }
}

(function setupBriefingPanel(){
  const toggle = document.getElementById("briefing-toggle");
  const panel = document.getElementById("briefing-panel");
  const fullToggle = document.getElementById("briefing-full-toggle");
  const fullDiv = document.getElementById("briefing-full");
  if (toggle && panel) {
    toggle.addEventListener("click", async () => {
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) await loadCaptainBriefing();
    });
  }
  if (fullToggle && fullDiv) {
    fullToggle.addEventListener("click", () => {
      fullDiv.classList.toggle("open");
      fullToggle.textContent = fullDiv.classList.contains("open") ? "Hide full briefing" : "Show full briefing";
    });
  }
})();

async function pollForUpdates() {
  try {
    // Ping index.json with a random string to force GitHub to give us the newest version
    const regionIndexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
    const res = await fetch(regionIndexUrl + "?nocache=" + Date.now());
    if (!res.ok) throw new Error(`Failed to poll ${regionIndexUrl}`);
    const data = await res.json();

    // Check if the SERVER has a timestamp, and if it differs from ours.
    // This allows the page to refresh even if our local timestamp was null (first run).
    if (data.last_updated && data.last_updated !== lastUpdateTimestamp) {
      // New data detected — silently update the frame list without resetting user state.
      // Only jump to latest if user is on the last frame and new data is newer than what they saw;
      // otherwise just let the new data be available on next step.
      console.log("New data available in index — refreshing frame list silently.");
      lastUpdateTimestamp = data.last_updated;
      // Reload the index in the background and rebuild framesByVar; preserve current view state.
      // Reload THIS region's index (not the hardcoded ma index)
      const regionIndexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
      loadIndex().then(idx => {
        // loadIndex() already updates framesByVar, frameTimesByVar, and BBOX in place.
        // If user was on the last available frame, advance to new latest automatically;
        // otherwise just make new data available without disrupting navigation.
        const maxIdx = frameTimesByVar[currentVar].length - 1;
        if (currentFrameIdx >= maxIdx && maxIdx >= 0) {
          currentFrameIdx = maxIdx;
          showFrame(currentFrameIdx);
        }
      }).catch(e => {
        console.error("Silent index refresh failed:", e);
      });
    }
  } catch (e) {
    console.error("Update check failed", e);
  }
}

// Check for updates every 60 seconds (1 minute)
setInterval(pollForUpdates, 60000);
