async function renderCombinedMode() {
  // Prevent concurrent calls — if a render is already in progress, bail out
  if (window._combinedRenderLocked) {
    console.log("[combined] renderCombinedMode SKIPPED — render already in progress");
    return;
  }
  window._combinedRenderLocked = true;
  console.log("[combined] renderCombinedMode called, currentVar:", currentVar, "REGION_ID:", REGION_ID);
  document.body.classList.remove("desktop-map-ready", "mobile-map-ready");
  document.body.classList.add("combined-mode");

  // ── Build a standalone OL map in #map ─────────────────────────
  const mapDiv = document.getElementById("map");
  if (!mapDiv) {
    window._combinedRenderLocked = false;
    return;
  }

  // Destroy previous instance if any
  if (window._combinedMap) {
    console.log("[combined] CLEANUP: disposing prev combined map");
    try { window._combinedMap.dispose(); } catch (_) {}
    window._combinedMap.setTarget(undefined);
    window._combinedMap = null; // null BEFORE building new — so subsequent calls see a clean slate
    window._combinedChlLayer = null;
    window._combinedSstLayer = null;
    window._combinedBathyLayer = null;
    window._combinedUvLayer = null;
    window._combinedFrontDensityLayer = null;
    window._combinedFrontLineLayer = null;
    console.log("[combined] CLEANUP: all combined state cleared");
  }
  detachInactiveMapTargets(null);
  // NOTE: do NOT unlock _combinedRenderLocked here — it must stay set while the
  // function is building the new map. Unlock only after the new map is complete.

  // Combined view uses EPSG:3857 (Web Mercator) so OpenFreeMap vector tiles can
  // render. All data layers (CHL/SST/UV/bathy) keep `projection: "EPSG:4326"` on
  // their ImageStatic sources — OL reprojects them automatically on render.
  // At the boundary (applyViewStateToOlMap / mapViewportRanges) we transform
  // extents in/out of 4326 so the rest of the viewer (viewState, backend APIs)
  // stays in lat/lon.
  const view = new ol.View({ projection: "EPSG:3857" });
  console.log("[combined] creating OL map (EPSG:3857), mapDiv:", mapDiv, "size:", mapDiv?.clientWidth, mapDiv?.clientHeight);
  // Force layout so mapDiv has real pixel dimensions before new ol.Map
  // (position:absolute divs report 0x0 until the browser computes layout)
  mapDiv.getBoundingClientRect();
  const map = new ol.Map({
    target: mapDiv,
    view,
    layers: [],
    overlays: [],
    controls: ol.control.defaults.defaults({ zoom: true, attribution: false })
  });
  window._combinedMap = map;
  window._combinedMapRef = map;
  attachMapToUnifiedTarget(map);
  installCaptainToolHandler(map);
  map.on("moveend", () => syncViewStateFromOlMap(map));
  console.log("[combined] OL map created, target:", !!map.getTargetElement(), "size:", map.getSize());
  const cv0 = map.getTargetElement()?.querySelector("canvas");
  console.log("[combined]   canvas initial:", cv0 ? `${cv0.width}x${cv0.height}` : "NO CANVAS");
  console.log("[combined]   layers initial:", map.getLayers().getLength());
  // Also attach a ResizeObserver on the target div — when DevTools opens the
  // viewport shrinks and the map re-centers, triggering a resize that OL handles.
  // This catches the same signal programmatically.
  const ro = new ResizeObserver(() => {
    console.log("[combined] ResizeObserver fired");
    const m = window._combinedMap;
    if (!m) return;
    const sz = m.getSize();
    console.log("[combined] map size:", sz);
    if (!sz || !Array.isArray(sz) || sz.every(s => s === 0)) {
      m.updateSize();
      console.log("[combined] updateSize from RO, new size:", m.getSize());
    }
  });
  ro.observe(mapDiv);

  // Force OL to remeasure after layout is ready — #map is position:absolute
  // with explicit top/left/right/bottom but may have 0x0 size at construction time
  // (browser hasn't laid it out yet). DevTools opening causes a reflow that fixes this.
  // Trigger the same remeasure via updateSize() after the first animation frame.
  if (map.getSize().every(s => s === 0)) {
    console.log("[combined] map size is 0x0 - scheduling updateSize()");
    requestAnimationFrame(() => {
      const m = window._combinedMap;
      if (!m) return;
      m.updateSize();
      const sz = m.getSize();
      if (Array.isArray(sz) && sz[0] > 0 && sz[1] > 0) {
        applyViewStateToOlMap(m, null); // restore saved viewport (null=preserve center/zoom only)
        console.log("[combined] view fit retried, zoom:", m.getView().getZoom());
      }
    });
    setTimeout(() => {
      const m = window._combinedMap;
      if (!m) return;
      m.updateSize();
      const sz = m.getSize();
      if (Array.isArray(sz) && sz[0] > 0 && sz[1] > 0) {
        applyViewStateToOlMap(m, null); // restore saved viewport (null=preserve center/zoom only)
        console.log("[combined] view fit from timer, zoom:", m.getView().getZoom());
      }
    }, 500);
  } else {
    applyViewStateToOlMap(map, null); // restore saved viewport from previous product page (null=preserve center/zoom)
  }
  console.log("[combined] view.fit done, map size:", map.getSize(), "view zoom:", view.getZoom());

  // Layer order: OFM water(0, dimmed ocean tint) -> CHL(10) -> bathy(15) -> UV(20) -> fronts(30/32) -> OFM land(40, all land fills+lines+labels)
  await applyOfmTwoLayerBasemap(map);

  const chlFrames = framesByVar.chl || [];
  const chlScanTimeDiv = document.getElementById("combined-chl-scan-time");
  if (chlFrames.length) {
    const frame = chlFrames[chlFrames.length - 1];  // framesByVar.chl is sorted oldest-first
    const data = await fetchFrameData("chl", frame);
    const grid = await loadGridForVar("chl", data);
    window._combinedChlData = data;
    window._combinedChlGrid = grid;
    const canvas = makeMobileRasterCanvas("chl", grid, data);
    const extent = frameExtentFromGrid(grid);
    let src;
    try {
      // canvasToOlSource uses ol.source.ImageCanvas which avoids the
      // iOS Safari "The string did not match the expected pattern" error
      // that toBlob/createObjectURL/ImageStatic would throw here.
      src = canvasToOlSource(canvas, extent);
    } catch (e) {
      console.error("[OL chl] canvasToOlSource failed", frame?.id || frame?.json_path, e);
      return;
    }
    const layer = new ol.layer.Image({ source: src, zIndex: 10 });
    map.addLayer(layer);
    window._combinedChlLayer = layer;
    const chlT = epochMsForFrame("chl", frame);
    window._combinedChlScanTime = chlT;
    if (chlScanTimeDiv) chlScanTimeDiv.textContent = chlT
      ? new Date(chlT).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : "";
  } else {
    if (chlScanTimeDiv) chlScanTimeDiv.textContent = "";
  }

  // ── Layer: SST Temperature (unchecked by default — conflicts visually with CHL) ──
  const sstFrames = framesByVar.sst || [];
  console.log("[combined] SST frames count:", sstFrames.length);
  const sstScanTimeDiv = document.getElementById("combined-sst-scan-time");
  if (sstFrames.length) {
    const sorted = [...sstFrames].sort((a, b) => {
      const ta = epochMsForFrame("sst", a) || 0, tb = epochMsForFrame("sst", b) || 0;
      return tb - ta;
    });
    // Default: Last 24h composite, same logic as dropdown
    const latestT = epochMsForFrame("sst", sorted[0]) || Date.now();
    const cutoff = latestT - 24 * 3600000;
    const selected = sorted.filter(f => { const t = epochMsForFrame("sst", f); return t && t >= cutoff; });
    const compositeFrames = selected.length ? selected : sorted.slice(0, 1);
    const loaded = (await Promise.all(compositeFrames.map(async frame => {
      try {
        const data = await fetchFrameData("sst", frame);
        const grid = await loadGridForVar("sst", data);
        const z = mobileZForVar("sst", data);
        return is2D(z) ? { frame, data, grid, z } : null;
      } catch (_) { return null; }
    }))).filter(Boolean);
    if (loaded.length) {
      const base = loaded[0];
      const ny = base.z.length, nx = base.z[0]?.length || 0;
      if (ny && nx) {
        const compatible = loaded.map(item => {
          if (item.z.length === ny && item.z[0]?.length === nx) return item;
          const nyS = item.z.length, nxS = item.z[0]?.length || 0;
          const result = Array.from({ length: ny }, () => Array(nx).fill(null));
          for (let rT = 0; rT < ny; rT++) {
            const rS = rT * (nyS - 1) / (ny - 1), rS0 = Math.floor(rS), rS1 = Math.min(rS0 + 1, nyS - 1), dr = rS - rS0;
            for (let cT = 0; cT < nx; cT++) {
              const cS = cT * (nxS - 1) / (nx - 1), cS0 = Math.floor(cS), cS1 = Math.min(cS0 + 1, nxS - 1), dc = cS - cS0;
              const v00 = item.z[rS0]?.[cS0], v01 = item.z[rS0]?.[cS1], v10 = item.z[rS1]?.[cS0], v11 = item.z[rS1]?.[cS1];
              const f00 = Number.isFinite(v00) && v00 > 0 && v00 < 1e20;
              const f01 = Number.isFinite(v01) && v01 > 0 && v01 < 1e20;
              const f10 = Number.isFinite(v10) && v10 > 0 && v10 < 1e20;
              const f11 = Number.isFinite(v11) && v11 > 0 && v11 < 1e20;
              if (f00 && f01 && f10 && f11) result[rT][cT] = v00*(1-dr)*(1-dc) + v01*(1-dr)*dc + v10*dr*(1-dc) + v11*dr*dc;
              else if (f00) result[rT][cT] = v00;
              else if (f01) result[rT][cT] = v01;
              else if (f10) result[rT][cT] = v10;
              else if (f11) result[rT][cT] = v11;
            }
          }
          return { ...item, z: result };
        });
        const composite = Array.from({ length: ny }, () => Array(nx).fill(null));
        for (let row = 0; row < ny; row++) {
          for (let col = 0; col < nx; col++) {
            for (const item of compatible) {
              const v = Number(item.z[row]?.[col]);
              if (Number.isFinite(v) && v > 0 && Math.abs(v) < 1e20) { composite[row][col] = v; break; }
            }
          }
        }
        const renderData = { ...base.data, z: composite, sst: composite, data: composite, nx, ny, bbox: base.data?.bbox };
        const canvas = makeMobileRasterCanvas("sst", base.grid, renderData);
        const extent = frameExtentFromGrid(base.grid);
        const src = canvasToOlSource(canvas, extent);
        const layer = new ol.layer.Image({ source: src, zIndex: 9 });
        layer.setVisible(false);
        map.addLayer(layer);
        window._combinedSstLayer = layer;
        window._combinedSstData = renderData;
        window._combinedSstGrid = base.grid;
        const epochTimes = compositeFrames.map(item => epochMsForFrame("sst", item.frame)).filter(t => t);
        const meanTime = epochTimes.length ? epochTimes.reduce((a, b) => a + b, 0) / epochTimes.length : null;
        if (sstScanTimeDiv) sstScanTimeDiv.textContent = meanTime
          ? new Date(meanTime).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
          : "";
      }
    }
  } else {
    if (sstScanTimeDiv) sstScanTimeDiv.textContent = "";
  }

  // ── Layer: Bathymetry contours ───────────────────────────────────────
  const bathyData = await loadBathymetryJson(BATHY_JSON_URL);
  const bathyGridInfo = { xAxis: bathyData.xAxis, yAxis: bathyData.yAxis, nx: bathyData.xAxis.length, ny: bathyData.yAxis.length };
  const bathyLayer = buildBathyContourLayer(bathyData, bathyGridInfo, map);
  if (bathyLayer) { map.addLayer(bathyLayer); window._combinedBathyLayer = bathyLayer; }

  // ── Layer: UV arrows ─────────────────────────────────────────────────
  // v4.2: use the dedicated rebuild helper so the layer picks the
  // NEWEST UV frame (not the oldest) and refreshes on demand.
  const uvHoursSel = document.getElementById("combined-uv-hours");
  await rebuildCombinedUvLayer(map, { hoursMode: uvHoursSel?.value || "latest" });

  // ── Layer: Thermal fronts — fixed-pixel point symbols
  await thermalLoadData();
  const thermalItems = thermalFrontState.frameData.length
    ? [thermalFrontState.frameData[thermalFrontState.frameData.length - 1]]
    : [];
  window._combinedFrontData = thermalItems[0]?.data || null;
  window._combinedFrontGrid = window._combinedFrontData
    ? await loadGridForVar("thermal_fronts", window._combinedFrontData).catch(() => null)
    : null;
  const thermalScanTimeDiv = document.getElementById("combined-thermal-scan-time");
  const initialThermalHours = parseInt(document.getElementById("combined-thermal-hours")?.value || "24", 10);
  const initialThermal = buildThermalHoursComposite(map, initialThermalHours);
  if (initialThermal.pointLayer) { map.addLayer(initialThermal.pointLayer); window._combinedFrontLineLayer = initialThermal.pointLayer; }
  if (initialThermal.densityLayer) { map.addLayer(initialThermal.densityLayer); window._combinedFrontDensityLayer = initialThermal.densityLayer; }
  if (thermalScanTimeDiv) thermalScanTimeDiv.textContent = initialThermal.scanTime || "";

  // ── Cursor circle (matches mobile/thermal-fronts behavior) ───────────
  const cursorFeature = new ol.Feature({
    geometry: new ol.geom.Point(toMapProjection([(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2]))
  });
  cursorFeature.setStyle(new ol.style.Style({
    image: new ol.style.Circle({
      radius: 3,
      fill: new ol.style.Fill({ color: "rgba(255,255,255,0.45)" }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.55)", width: 1 })
    })
  }));
  const cursorLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: [cursorFeature], projection: "EPSG:4326" }),
    zIndex: 60
  });
  map.addLayer(cursorLayer);
  window._combinedCursorFeature = cursorFeature;

  // ── Cursor readout ───────────────────────────────────────────────────
  // The combined view is EPSG:3857 (Web Mercator) so vector tiles render
  // correctly. ev.coordinate is therefore in *meters*, not degrees — the
  // readout text and raster samplers need 4326 (lon/lat). Transform once
  // here and reuse; keep the 3857 coordinate for the cursor feature.
  const readoutEl = document.getElementById("combined-readout");
  const hoverTip = document.getElementById("combined-hover-tip");
  map.on("pointermove", (ev) => {
    if (!ev.coordinate) {
      if (readoutEl) readoutEl.textContent = "—, —";
      return;
    }
    const xy3857 = ev.coordinate;
    const xy4326 = ol.proj.transform(xy3857, "EPSG:3857", "EPSG:4326");
    const lon4326 = xy4326[0];
    const lat4326 = xy4326[1];
    cursorFeature.getGeometry().setCoordinates(xy3857);
    const parts = [`${lat4326.toFixed(4)}, ${lon4326.toFixed(4)}`];
    const chlSample = sampleRasterValueAt("chl", window._combinedChlGrid, window._combinedChlData, lon4326, lat4326);
    if (chlSample?.value !== undefined) parts.push(formatChlValue(chlSample.value));
    const sstSample = sampleRasterValueAt("sst", window._combinedSstGrid, window._combinedSstData, lon4326, lat4326);
    if (sstSample?.value !== undefined) parts.push(formatSstValue(sstSample.value));
    // If the cursor is within 14px of a thermal-front hit point, also show
    // gradient + ΔSST in the persistent readout — same format as the
    // hover-tip, but lives in the visible bottom-right box. Mike wants the
    // gradient + ΔSST info "at cursor position" so the user doesn't have
    // to mouse-track a tiny floating tooltip.
    const frontHover = combinedNearestFrontHover(map, ev.coordinate, ev.pixel);
    if (frontHover) parts.push(frontHover);
    if (readoutEl) readoutEl.textContent = parts.join("  ");
    console.log("[combined:pointermove]", parts.join("  "), "| grid:", !!window._combinedChlGrid, "| data:", !!window._combinedChlData);
    const bathyFeature = map.forEachFeatureAtPixel(ev.pixel, feature => (
      Number.isFinite(feature.get("depth")) ? feature : null
    ), { hitTolerance: 6 });
    if (bathyFeature && hoverTip) {
      hoverTip.textContent = `${bathyFeature.get("depth")}m`;
      hoverTip.style.left = `${ev.originalEvent.clientX}px`;
      hoverTip.style.top = `${ev.originalEvent.clientY}px`;
      hoverTip.style.display = "block";
    } else if (hoverTip) {
      const frontHover = combinedNearestFrontHover(map, ev.coordinate, ev.pixel);
      if (frontHover) {
        hoverTip.textContent = frontHover;
        hoverTip.style.left = `${ev.originalEvent.clientX}px`;
        hoverTip.style.top = `${ev.originalEvent.clientY}px`;
        hoverTip.style.display = "block";
      } else {
        hoverTip.style.display = "none";
      }
    }
    if (readoutEl) readoutEl.textContent = parts.join("  ");
  });
  map.on("click", (ev) => {
    if (!ev.coordinate) return;
    const xy3857 = ev.coordinate;
    const xy4326 = ol.proj.transform(xy3857, "EPSG:3857", "EPSG:4326");
    const lon4326 = xy4326[0];
    const lat4326 = xy4326[1];
    cursorFeature.getGeometry().setCoordinates(xy3857);
    const chlSample = sampleRasterValueAt("chl", window._combinedChlGrid, window._combinedChlData, lon4326, lat4326);
    const sstSample = sampleRasterValueAt("sst", window._combinedSstGrid, window._combinedSstData, lon4326, lat4326);
    const parts = [`${lat4326.toFixed(4)}, ${lon4326.toFixed(4)}`];
    if (chlSample?.value !== undefined) parts.push(formatChlValue(chlSample.value));
    if (sstSample?.value !== undefined) parts.push(formatSstValue(sstSample.value));
    // Mirror pointermove: include front info on click so the persistent
    // readout doesn't fall back to lat/lon+CHL+SST only and hide the
    // gradient/ΔSST the user came for.
    const frontHover = combinedNearestFrontHover(map, ev.coordinate, ev.pixel);
    if (frontHover) parts.push(frontHover);
    if (readoutEl) readoutEl.textContent = parts.join("  ");
  });
  map.getTargetElement()?.addEventListener("pointerleave", () => {
    if (hoverTip) hoverTip.style.display = "none";
  });

  window._combinedRenderLocked = false;
  // If CHL is already checked on first render (e.g. page refreshed in
  // combined mode), the change handler hasn't fired — init the panel now.
  if (chkChl?.checked) {
    combinedChlInitPanel();
    combinedChlRenderSelected();
  }
  console.log("[combined] renderCombinedMode finished successfully");
  console.log("[combined] FINAL state — total layers:", map.getLayers().getLength());
  const allLayers = [];
  map.getLayers().forEach((l, i) => allLayers.push({i, zIndex: l.getZIndex(), type: l.getClassName()}));
  console.log("[combined] FINAL layers:", JSON.stringify(allLayers));
  const vp = map.getTargetElement()?.querySelector(".ol-viewport");
  const cv = map.getTargetElement()?.querySelector("canvas");
  console.log("[combined] FINAL viewport:", vp ? `${vp.offsetWidth}x${vp.offsetHeight}` : "NO VIEWPORT");
  console.log("[combined] FINAL canvas:", cv ? `${cv.width}x${cv.height}` : "NO CANVAS");
  // Log all window._combined* layer refs
  console.log("[combined] window._combinedChlLayer:", !!window._combinedChlLayer);
  console.log("[combined] window._combinedBathyLayer:", !!window._combinedBathyLayer);
  console.log("[combined] window._combinedUvLayer:", !!window._combinedUvLayer);
  console.log("[combined] window._combinedFrontDensityLayer:", !!window._combinedFrontDensityLayer);
  console.log("[combined] window._combinedFrontLineLayer:", !!window._combinedFrontLineLayer);
  // Log combined UI elements
  console.log("[combined] #map:", !!mapDiv, "display:", mapDiv ? getComputedStyle(mapDiv).display : "N/A", "size:", mapDiv ? `${mapDiv.clientWidth}x${mapDiv.clientHeight}` : "N/A");
  console.log("[combined] #combined-readout:", !!readoutEl, "display:", readoutEl ? getComputedStyle(readoutEl).display : "N/A");
  console.log("[combined] #combined-controls:", !!combinedControls, "display:", combinedControls ? getComputedStyle(combinedControls).display : "N/A");
  console.log("[combined] #combined-menu-btn:", !!combinedMenuBtn, "display:", combinedMenuBtn ? getComputedStyle(combinedMenuBtn).display : "N/A");
  return true;
}

// ── Helpers for combined mode ──────────────────────────────────────────────

function buildBathyContourLayer(bathyData, gridInfo, map) {
  const source = new ol.source.Vector({ wrapX: false, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source,
    style: feature => new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "#b25cff", width: feature.get("depth") >= 1000 ? 1.1 : 0.9 })
    }),
    zIndex: 15
  });
  window._bathyData = {
    xAxis: bathyData.xAxis, yAxis: bathyData.yAxis,
    depth: bathyData.depth,
    nx: bathyData.xAxis.length, ny: bathyData.yAxis.length
  };
  window._bathyContourSource = source;
  updateBathyContoursForMap(map);
  window._combinedMap?.on("moveend", () => updateBathyContoursForMap(window._combinedMap));
  return layer;
}

function updateBathyContoursForMap(map) {
  const bd = window._bathyData;
  const source = window._bathyContourSource;
  if (!bd || !source || !map) return;
  source.clear();
  // Combined view is EPSG:3857. depthMaxInExtent and extractContourSegments
  // compare against bd.xAxis/bd.yAxis in 4326, so transform first.
  const viewExtent = map.getView().calculateExtent(map.getSize());
  const viewProjCode = map.getView().getProjection().getCode();
  const extent = viewProjCode === "EPSG:4326"
    ? viewExtent
    : ol.proj.transformExtent(viewExtent, viewProjCode, "EPSG:4326");
  const [vx0, vy0, vx1, vy1] = extent;
  const maxW = 400, maxH = 600;
  const sx = Math.max(1, Math.floor(bd.nx / maxW));
  const sy = Math.max(1, Math.floor(bd.ny / maxH));
  const maxDepth = depthMaxInExtent(bd, extent, sx, sy);
  const levels = generateContourLevels(maxDepth);
  window._combinedBathyLevels = levels;
  updateCombinedBathyLegend(levels);
  for (const level of levels) {
    const segs = extractContourSegments(bd, level, sx, sy, extent);
    for (const seg of segs) {
      const feat = new ol.Feature({ geometry: new ol.geom.LineString(seg), depth: level });
      feat.getGeometry().transform("EPSG:4326", "EPSG:3857");
      source.addFeature(feat);
    }
  }
}

function updateCombinedBathyLegend(levels) {
  const el = document.getElementById("combined-bathy-legend");
  if (!el) return;
  if (!levels?.length) {
    el.textContent = "";
    return;
  }
  el.innerHTML = `
    <div class="combined-legend-row">
      <span class="combined-bathy-swatch"></span>
      <span>Levels (m): ${levels.map(v => `${v}`).join(", ")}</span>
    </div>
  `;
}

function depthMaxInExtent(bd, extent, sx, sy) {
  const [vx0, vy0, vx1, vy1] = extent;
  let maxD = 0;
  for (let row = 0; row < bd.ny; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    for (let col = 0; col < bd.nx; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const d = bd.depth[row][col];
      if (d > maxD) maxD = d;
    }
  }
  return maxD;
}

function generateContourLevels(maxDepth) {
  const std = [50, 100, 200, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
  if (maxDepth < 200) return [50, 100, 200].filter(l => l <= maxDepth + 200);
  return std.filter(l => l <= maxDepth + 200);
}

function extractContourSegments(bd, level, sx, sy, extent) {
  const [vx0, vy0, vx1, vy1] = extent;
  const segments = [];
  for (let row = 1; row < bd.ny - 1; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    const nextLat = bd.yAxis[Math.min(row + sy, bd.ny - 1)];
    for (let col = 1; col < bd.nx - 1; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const nextLon = bd.xAxis[Math.min(col + sx, bd.nx - 1)];
      const tl = bd.depth[row][col];
      const tr = bd.depth[row][Math.min(col + sx, bd.nx - 1)];
      const br = bd.depth[Math.min(row + sy, bd.ny - 1)][Math.min(col + sx, bd.nx - 1)];
      const bl = bd.depth[Math.min(row + sy, bd.ny - 1)][col];
      const crossings = [];
      if ((tl < level) !== (tr < level)) {
        const t = (level - tl) / (tr - tl);
        crossings.push([[lon + t * (nextLon - lon), lat], "top"]);
      }
      if ((bl < level) !== (br < level)) {
        const t = (level - bl) / (br - bl);
        crossings.push([[lon + t * (nextLon - lon), nextLat], "bottom"]);
      }
      if ((tl < level) !== (bl < level)) {
        const t = (level - tl) / (bl - tl);
        crossings.push([[lon, lat + t * (nextLat - lat)], "left"]);
      }
      if ((tr < level) !== (br < level)) {
        const t = (level - tr) / (br - tr);
        crossings.push([[nextLon, lat + t * (nextLat - lat)], "right"]);
      }
      if (crossings.length >= 2) {
        const coords = crossings.slice(0, 2).map(c => c[0]);
        if (coords[0] && coords[1]) {
          const d0 = Math.hypot(coords[0][0] - vx0, coords[0][1] - vy0);
          const d1 = Math.hypot(coords[1][0] - vx0, coords[1][1] - vy0);
          if (d0 > 0.01 && d1 > 0.01) {
            segments.push(coords);
          }
        }
        if (coords[0] && coords[1] && Math.hypot(coords[0][0] - coords[1][0], coords[0][1] - coords[1][1]) > 0.01) {
          segments.push(coords);
        }
      }
    }
  }
  return segments;
}

function buildDesktopUvArrowLayer(data, grid) {
  const uvData = (data.data && !Array.isArray(data.data)) ? data.data : data;
  const { xAxis, yAxis, nx, ny } = grid;
  if (!xAxis?.length || !yAxis?.length) return null;
  const features = [];
  const step = Math.max(2, Math.floor(Math.sqrt(nx * ny) / 72));
  const dxg = Math.abs((xAxis[1] ?? xAxis[0]) - xAxis[0]) || 0.01;
  const dyg = Math.abs((yAxis[1] ?? yAxis[0]) - yAxis[0]) || 0.01;
  const cell = Math.min(dxg, dyg);
  const minSpeed = 0.035;
  const maxSpeed = 1.2;
  const minLen = 0.95 * cell;
  const maxLen = 2.8 * cell;
  for (let row = 0; row < ny; row += step) {
    for (let col = 0; col < nx; col += step) {
      const u = uvData.u?.[row]?.[col];
      const v = uvData.v?.[row]?.[col];
      if (!Number.isFinite(u) || !Number.isFinite(v)) continue;
      const spd = Math.sqrt(u * u + v * v);
      if (spd < minSpeed || spd > 3) continue;
      const lon = xAxis[col];
      const lat = yAxis[row];
      const scaled = Math.min(spd, maxSpeed) / maxSpeed;
      const arrowLen = minLen + (maxLen - minLen) * scaled;
      const geom = buildArrowGeometry(lon, lat, u, v, arrowLen, cell);
      if (geom) features.push(new ol.Feature({ geometry: geom, speed: spd }));
    }
  }
  if (!features.length) return null;
  const source = new ol.source.Vector({ features, wrapX: false, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source,
    style: (feature) => new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.85)", width: 1.45, lineCap: "round", lineJoin: "round" })
    }),
    zIndex: 20
  });
  return layer;
}

function buildArrowGeometry(lon, lat, u, v, len, cell) {
  try {
    const spd = Math.hypot(u, v);
    if (!Number.isFinite(spd) || spd <= 0) return null;
    const lon1 = lon + (u / spd) * len;
    const lat1 = lat + (v / spd) * len;
    const theta = Math.atan2(lat1 - lat, lon1 - lon);
    const headLen = Math.min(0.46 * len, 0.74 * cell);
    const headAng = Math.PI / 6;
    const left = [lon1 + headLen * Math.cos(theta + Math.PI - headAng), lat1 + headLen * Math.sin(theta + Math.PI - headAng)];
    const right = [lon1 + headLen * Math.cos(theta + Math.PI + headAng), lat1 + headLen * Math.sin(theta + Math.PI + headAng)];
    return new ol.geom.MultiLineString([
      [toMapProjection([lon, lat]), toMapProjection([lon1, lat1])],
      [toMapProjection([lon1, lat1]), toMapProjection(left)],
      [toMapProjection([lon1, lat1]), toMapProjection(right)]
    ]);
  } catch { return null; }
}

function speedColor(speed, min, max) {
  const t = Math.min(1, Math.max(0, (speed - min) / (max - min)));
  const r = Math.round(255 * t);
  const b = Math.round(255 * (1 - t));
  return `rgb(${r},50,${b})`;
}

// buildChlCompositeLayer(map, hours) is the legacy hours-window path.
// buildChlCompositeLayer(map, { selectedFrames, labelMode }) is the
// chip-driven path. The function resolves the frame list internally
// from whichever input is provided. labelMode = "auto" picks a
// contract that describes the actual data shown:
//   - 0 frames   -> "Pick at least one chip"
//   - 1 frame    -> <that frame's time>
//   - N>1 frames -> "Median of N frames: <earliest> - <latest>"
//   - hoursWindow (legacy) -> mean of frames in window (kept for the
//     pre-chip dropdown path so old behavior is unchanged)
async function buildChlCompositeLayer(map, hoursOrOpts) {
  const opts = (typeof hoursOrOpts === "object" && hoursOrOpts !== null)
    ? hoursOrOpts
    : { hours: hoursOrOpts, labelMode: "hoursWindow" };
  const explicitFrames = Array.isArray(opts.selectedFrames) ? opts.selectedFrames : null;
  const chlFrames = framesByVar.chl || [];
  if (!chlFrames.length) return {};
  const sorted = [...chlFrames].sort((a, b) => {
    const ta = epochMsForFrame("chl", a) || 0;
    const tb = epochMsForFrame("chl", b) || 0;
    return tb - ta;
  });
  let selected;
  if (explicitFrames) {
    // Chip-driven path: caller already picked exactly which frames.
    // Preserve the caller's order; deduplicate by stable frame id.
    const seen = new Set();
    selected = [];
    for (const f of explicitFrames) {
      const id = f?.id || f?.json_path || JSON.stringify(f);
      if (seen.has(id)) continue;
      seen.add(id);
      selected.push(f);
    }
  } else {
    // Legacy hours-window path: filter relative to the newest frame.
    const hours = Number(opts.hours) || 1;
    const latestT = epochMsForFrame("chl", sorted[0]) || Date.now();
    const cutoff = latestT - hours * 3600000;
    selected = sorted.filter(f => {
      const t = epochMsForFrame("chl", f);
      return t && t >= cutoff;
    });
    if (!selected.length) selected = [sorted[0]];
  }
  if (!selected.length) return {};
  const loaded = (await Promise.all(selected.map(async frame => {
    try {
      const data = await fetchFrameData("chl", frame);
      const grid = await loadGridForVar("chl", data);
      const z = mobileZForVar("chl", data);
      return is2D(z) ? { frame, data, grid, z } : null;
    } catch (err) {
      console.warn("CHL composite frame failed", frame?.id || frame?.json_path, err);
      return null;
    }
  }))).filter(Boolean);
  if (!loaded.length) return {};

  const base = loaded[0];
  const ny = base.z.length;
  const nx = base.z[0]?.length || 0;
  if (!ny || !nx) return {};

  // Resample all frames to the base grid so even 1-pixel mismatches are bridged
  const compatible = loaded.map(item => {
    if (item.z.length === ny && item.z[0]?.length === nx) return item;
    // Different grid size — resample to base dimensions via bilinear
    const nyS = item.z.length, nxS = item.z[0]?.length || 0;
    const result = Array.from({ length: ny }, () => Array(nx).fill(null));
    for (let rT = 0; rT < ny; rT++) {
      const rS = rT * (nyS - 1) / (ny - 1);
      const rS0 = Math.floor(rS), rS1 = Math.min(rS0 + 1, nyS - 1);
      const dr = rS - rS0;
      for (let cT = 0; cT < nx; cT++) {
        const cS = cT * (nxS - 1) / (nx - 1);
        const cS0 = Math.floor(cS), cS1 = Math.min(cS0 + 1, nxS - 1);
        const dc = cS - cS0;
        const v00 = item.z[rS0]?.[cS0], v01 = item.z[rS0]?.[cS1];
        const v10 = item.z[rS1]?.[cS0], v11 = item.z[rS1]?.[cS1];
        const f00 = Number.isFinite(v00) && v00 > 0 && v00 < 1e20;
        const f01 = Number.isFinite(v01) && v01 > 0 && v01 < 1e20;
        const f10 = Number.isFinite(v10) && v10 > 0 && v10 < 1e20;
        const f11 = Number.isFinite(v11) && v11 > 0 && v11 < 1e20;
        if (f00 && f01 && f10 && f11) {
          result[rT][cT] = v00*(1-dr)*(1-dc) + v01*(1-dr)*dc + v10*dr*(1-dc) + v11*dr*dc;
        } else if (f00) { result[rT][cT] = v00; }
        else if (f01) { result[rT][cT] = v01; }
        else if (f10) { result[rT][cT] = v10; }
        else if (f11) { result[rT][cT] = v11; }
      }
    }
    return { ...item, z: result };
  });

  // Median helper
  function pixelMedian(values) {
    const finite = values.filter(v => Number.isFinite(v) && v > 0 && Math.abs(v) < 1e20);
    if (!finite.length) return null;
    const sorted = finite.slice().sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }

  let renderData = { ...base.data };
  if (compatible.length > 1) {
    const composite = Array.from({ length: ny }, () => Array(nx).fill(null));
    for (let row = 0; row < ny; row++) {
      for (let col = 0; col < nx; col++) {
        const values = compatible.map(item => Number(item.z[row]?.[col]));
        composite[row][col] = pixelMedian(values);
      }
    }
    renderData = { ...base.data, z: composite, chl: composite, data: composite, nx, ny, bbox: base.data?.bbox };
  }

  const canvas = makeMobileRasterCanvas("chl", base.grid, renderData);
  let layer;
  try {
    // canvasToOlSource uses ol.source.ImageCanvas — Safari-safe, no URL parsing.
    layer = new ol.layer.Image({
      source: canvasToOlSource(canvas, frameExtentFromGrid(base.grid)),
      zIndex: 10
    });
  } catch (e) {
    console.error("[OL composite] canvasToOlSource failed", e);
    return {};
  }
  const epochTimes = selected.map(item => epochMsForFrame("chl", item.frame)).filter(t => t);
  let scanTime = "";
  if (epochTimes.length === 0) {
    window._combinedChlScanTime = null;
  } else if (epochTimes.length === 1) {
    // Single-frame: that frame's time, no averaging.
    const t = epochTimes[0];
    window._combinedChlScanTime = t;
    scanTime = new Date(t).toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
  } else {
    const earliest = Math.min.apply(null, epochTimes);
    const latest = Math.max.apply(null, epochTimes);
    const labelMode = opts.labelMode || "auto";
    if (labelMode === "hoursWindow") {
      // Legacy hours-window fallback: mean of frames in window. Kept
      // so the pre-chip dropdown path is byte-for-byte unchanged.
      const meanTime = epochTimes.reduce((a, b) => a + b, 0) / epochTimes.length;
      window._combinedChlScanTime = meanTime;
      scanTime = new Date(meanTime).toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
    } else {
      // "auto" / chip-driven: describe the actual data shown.
      // Median of K frames: <earliest> - <latest>. The label claims
      // a range, not a single time, because the displayed pixel
      // values are a per-pixel median across those frames.
      window._combinedChlScanTime = latest;
      const fmt = ms => new Date(ms).toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
      scanTime = `Median of ${epochTimes.length} frames: ${fmt(earliest)} – ${fmt(latest)}`;
    }
  }
  return { layer, scanTime, data: renderData, grid: base.grid, frameCount: selected.length };
}

/* ============================================================
   Combined-mode CHL chip multi-select (v4.2)
   Pattern is reused from the v4.1 thermal-fronts day-chip panel
   (commit 2776e0577d). The chip = one CHL frame; coverage gate
   filters to > 10% valid pixels; multi-select = per-pixel median
   composite via the refactored buildChlCompositeLayer above.
   Session-only state; not persisted to localStorage.
   ============================================================ */

function combinedChlFrameId(frame) {
  return frame?.id || frame?.json_path || JSON.stringify(frame);
}

function combinedChlFrameTimeMs(frame) {
  return epochMsForFrame("chl", frame) || null;
}

function combinedChlFormatTime(t) {
  // Legacy absolute format (kept for any other callers; chips use the relative formatter).
  if (!t) return "?";
  const d = new Date(t);
  const month = d.toLocaleString(undefined, { month: "short" });
  const day = d.getDate();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${month} ${day} ${hh}:${mm}`;
}

// Relative-time formatter for the CHL frame chip labels.
// v4.3: chip shows the offset from the newest eligible frame in the
// panel, e.g. "0h", "5h", "23h", "1d 3h", "2d". A single "Hours ago"
// header sits above the chip row; the chip itself carries only the
// number. Reference = the newest frame's timeMs in the current window.
// Returns "?" if t or referenceT is missing so a single cache miss
// in one chip cannot blank out the entire panel.
function combinedChlFormatRelativeShort(t, referenceT) {
  if (!Number.isFinite(t) || !Number.isFinite(referenceT)) return "?";
  const deltaMs = referenceT - t;
  if (deltaMs < 0) return "0h";
  const totalMinutes = Math.round(deltaMs / 60000);
  const totalHours = Math.floor(totalMinutes / 60);
  if (totalHours < 24) {
    return totalHours === 0 ? "<1h" : `${totalHours}h`;
  }
  const days = Math.floor(totalHours / 24);
  const remH = totalHours - days * 24;
  if (remH === 0) return `${days}d`;
  return `${days}d ${remH}h`;
}

function combinedChlFormatCoveragePct(pct) {
  if (!Number.isFinite(pct)) return "?";
  return `${Math.round(pct)}%`;
}

function combinedChlIsValidPixel(v) {
  return Number.isFinite(v) && v > 0 && Math.abs(v) < 1e20;
}

function combinedChlComputeCoveragePct(data) {
  const z = data?.z || data?.chl || data?.data;
  if (!is2D(z)) return null;
  let total = 0, valid = 0;
  for (let r = 0; r < z.length; r++) {
    const row = z[r] || [];
    for (let c = 0; c < row.length; c++) {
      total++;
      if (combinedChlIsValidPixel(row[c])) valid++;
    }
  }
  if (!total) return null;
  return (valid / total) * 100;
}

function combinedChlEnsureState() {
  if (!window._combinedChl) {
    window._combinedChl = {
      selectedFrameIds: new Set(),
      eligibleFrameIds: new Set(),
      cache: new Map(),            // frameId -> { timeMs, coverage, manifestKey }
      manifestKey: "",
      initialized: false,
      lastN: 10,
      gatePct: 10,
      loadingPromise: null,
      panelRevealed: false,
      opSeq: 0                      // increments on each toggle to abort stale renders
    };
  }
  return window._combinedChl;
}

function combinedChlManifestKey() {
  const ids = (framesByVar.chl || []).map(combinedChlFrameId);
  return `${(typeof REGION_ID !== "undefined" ? REGION_ID : "?")}|${ids.length}|${ids.slice(-3).join(",")}|${ids[0] || ""}`;
}

function combinedChlManifestChanged() {
  const s = combinedChlEnsureState();
  const k = combinedChlManifestKey();
  return k !== s.manifestKey;
}

// Fetch the last N CHL frame JSONs in bounded parallel batches to
// compute coverage. Caches by frame id; only refetches when the
// manifest key changes (new frames or region change).
async function combinedChlEnsureCoverage() {
  const s = combinedChlEnsureState();
  const k = combinedChlManifestKey();
  if (s.loadingPromise && s.manifestKey === k) return s.loadingPromise;
  const allFrames = framesByVar.chl || [];
  if (!allFrames.length) return [];
  // Last N frames, newest-last (chronological). We'll display newest-first.
  const lastN = allFrames.slice(-s.lastN);
  s.manifestKey = k;
  s.loadingPromise = (async () => {
    const BATCH = 3;
    for (let i = 0; i < lastN.length; i += BATCH) {
      const batch = lastN.slice(i, i + BATCH);
      await Promise.all(batch.map(async frame => {
        const id = combinedChlFrameId(frame);
        if (s.cache.has(id) && s.cache.get(id).manifestKey === k) return;
        try {
          const data = await fetchFrameData("chl", frame);
          const coverage = combinedChlComputeCoveragePct(data);
          s.cache.set(id, {
            timeMs: combinedChlFrameTimeMs(frame) || null,
            coverage,
            manifestKey: k,
            frame
          });
        } catch (err) {
          console.warn("[CHL chip] coverage fetch failed", id, err);
          s.cache.set(id, { timeMs: combinedChlFrameTimeMs(frame) || null, coverage: null, manifestKey: k, frame });
        }
      }));
    }
    s.loadingPromise = null;
    return lastN;
  })();
  return s.loadingPromise;
}

function combinedChlEligibleFrames() {
  const s = combinedChlEnsureState();
  const allFrames = (framesByVar.chl || []).slice(-s.lastN);
  // Sort newest-first for display.
  const newestFirst = [...allFrames].sort((a, b) => (combinedChlFrameTimeMs(b) || 0) - (combinedChlFrameTimeMs(a) || 0));
  return newestFirst.filter(f => {
    const id = combinedChlFrameId(f);
    const e = s.cache.get(id);
    return e && Number.isFinite(e.coverage) && e.coverage > s.gatePct;
  });
}

function combinedChlUpdateCountBadge() {
  const s = combinedChlEnsureState();
  const eligible = s.eligibleFrameIds.size;
  const selected = s.selectedFrameIds.size;
  const el = document.getElementById("combined-chl-chips-count");
  if (el) el.textContent = `${selected}/${eligible}`;
}

function combinedChlRebuildChips() {
  const wrap = document.getElementById("combined-chl-chips");
  if (!wrap) return;
  const s = combinedChlEnsureState();
  wrap.innerHTML = "";
  const allFrames = (framesByVar.chl || []).slice(-s.lastN);
  const newestFirst = [...allFrames].sort((a, b) => (combinedChlFrameTimeMs(b) || 0) - (combinedChlFrameTimeMs(a) || 0));
  s.eligibleFrameIds = new Set();
  if (!newestFirst.length) {
    const empty = document.createElement("div");
    empty.style.fontSize = "11px";
    empty.style.color = "#9aa7b5";
    empty.style.padding = "4px 0";
    empty.textContent = "No frames in window";
    wrap.appendChild(empty);
    combinedChlUpdateCountBadge();
    return;
  }
  // v4.3: derive timeMs from the frame itself, not the coverage cache.
  // The cache is for coverage (an async fetch) and may not be filled
  // on first render; the time is always available from the filename
  // and must never be blank. Reference time for relative labels is
  // the newest frame in the current window.
  // Use current time as reference so "hours ago" is accurate relative to now.
  const referenceT = Date.now();
  for (const frame of newestFirst) {
    const id = combinedChlFrameId(frame);
    const entry = s.cache.get(id) || {};
    const coverage = entry.coverage;
    const eligible = Number.isFinite(coverage) && coverage > s.gatePct;
    if (eligible) s.eligibleFrameIds.add(id);
    const chip = document.createElement("button");
    chip.type = "button";
    // Show as .selected if in selectedFrameIds (user's explicit choice,
    // independent of coverage gate). Otherwise dim if eligible, or
    // disabled-style if below gate and not selected.
    const inSelected = s.selectedFrameIds.has(id);
    chip.className = "day-chip" + (inSelected ? " selected" : (eligible ? " unselected" : ""));
    chip.dataset.frameId = id;
    chip.disabled = !eligible;
    // Chip label = relative time ("5h", "1d 3h"). Tooltip keeps
    // the absolute timestamp + coverage for hover/audit.
    const frameT = combinedChlFrameTimeMs(frame);
    const labelText = combinedChlFormatRelativeShort(frameT, referenceT);
    const covText = combinedChlFormatCoveragePct(coverage);
    const absText = combinedChlFormatTime(frameT);
    chip.title = eligible
      ? `${absText} • ${covText} coverage`
      : `${absText} • ${covText} coverage (below ${s.gatePct}% gate)`;
    // No swatch (we don't have a CHL color domain here). The coverage badge is the differentiator.
    const label = document.createElement("span");
    label.textContent = labelText;
    const badge = document.createElement("span");
    badge.style.cssText = "font-size:10px;opacity:0.78;margin-left:2px;";
    badge.textContent = covText;
    chip.appendChild(label);
    chip.appendChild(badge);
    if (eligible) {
      chip.addEventListener("click", () => combinedChlToggleFrame(id));
    }
    wrap.appendChild(chip);
  }
  combinedChlUpdateCountBadge();
}

function combinedChlToggleFrame(frameId) {
  const s = combinedChlEnsureState();
  if (!s.eligibleFrameIds.has(frameId)) return;
  if (s.selectedFrameIds.has(frameId)) s.selectedFrameIds.delete(frameId);
  else s.selectedFrameIds.add(frameId);
  s.initialized = true;
  // Increment opSeq so any in-flight fetch from a prior interaction
  // cannot overwrite the result of this deselect.
  s.opSeq = (s.opSeq || 0) + 1;
  const mySeq = s.opSeq;
  // Update chip styling in place
  const wrap = document.getElementById("combined-chl-chips");
  if (wrap) {
    const chip = wrap.querySelector(`[data-frame-id="${CSS.escape(frameId)}"]`);
    if (chip) {
      chip.classList.toggle("selected", s.selectedFrameIds.has(frameId));
      chip.classList.toggle("unselected", !s.selectedFrameIds.has(frameId));
    }
  }
  combinedChlUpdateCountBadge();
  combinedChlRenderSelected();
}

function combinedChlApplyPreset(name) {
  const s = combinedChlEnsureState();
  const eligibleList = (framesByVar.chl || []).slice(-s.lastN)
    .sort((a, b) => (combinedChlFrameTimeMs(b) || 0) - (combinedChlFrameTimeMs(a) || 0))
    .filter(f => s.eligibleFrameIds.has(combinedChlFrameId(f)));
  s.selectedFrameIds = new Set();
  if (name === "all") {
    for (const f of eligibleList) s.selectedFrameIds.add(combinedChlFrameId(f));
  } else if (name === "none") {
    // explicitly empty
  } else if (name === "latest1") {
    if (eligibleList[0]) s.selectedFrameIds.add(combinedChlFrameId(eligibleList[0]));
  } else if (name === "latest3") {
    for (const f of eligibleList.slice(0, 3)) s.selectedFrameIds.add(combinedChlFrameId(f));
  } else if (name === "latest5") {
    for (const f of eligibleList.slice(0, 5)) s.selectedFrameIds.add(combinedChlFrameId(f));
  }
  s.initialized = true;
  combinedChlRebuildChips();
  combinedChlRenderSelected();
}

function combinedChlApplyHoursPreset(hoursRaw) {
  // Map the legacy hours dropdown into a chip selection. "1" = Latest
  // 1, anything else = all eligible chips in the window. If no chip
  // falls in the window, fall back to the latest eligible chip.
  const s = combinedChlEnsureState();
  const hours = Number(hoursRaw) || 1;
  const allFrames = (framesByVar.chl || []).slice().sort((a, b) => (combinedChlFrameTimeMs(b) || 0) - (combinedChlFrameTimeMs(a) || 0));
  if (!allFrames.length) return;
  const latestT = combinedChlFrameTimeMs(allFrames[0]) || Date.now();
  const cutoff = hours === 1 ? Infinity : (latestT - hours * 3600000);
  const eligibleInWindow = allFrames.filter(f => {
    const t = combinedChlFrameTimeMs(f);
    const id = combinedChlFrameId(f);
    if (!s.eligibleFrameIds.has(id)) return false;
    if (hours === 1) return true;          // Latest 1 = newest eligible
    return t && t >= cutoff;
  });
  s.selectedFrameIds = new Set();
  if (eligibleInWindow.length) {
    for (const f of eligibleInWindow) s.selectedFrameIds.add(combinedChlFrameId(f));
  } else if (s.eligibleFrameIds.size) {
    // Fall back to the newest eligible chip so the user always sees
    // something rather than an empty panel.
    for (const f of allFrames) {
      if (s.eligibleFrameIds.has(combinedChlFrameId(f))) {
        s.selectedFrameIds.add(combinedChlFrameId(f));
        break;
      }
    }
  }
  s.initialized = true;
  combinedChlRebuildChips();
  combinedChlRenderSelected();
}

async function combinedChlRenderSelected() {
  const s = combinedChlEnsureState();
  const mySeq = s.opSeq || 0;   // snapshot of the toggle that started this render
  const chlScanTimeDiv = document.getElementById("combined-chl-scan-time");
  // 0 chips: clear layer, show "Pick at least one chip"
  if (s.selectedFrameIds.size === 0) {
    if (window._combinedChlLayer && window._combinedMap) {
      try { window._combinedMap.removeLayer(window._combinedChlLayer); } catch (_) {}
      window._combinedChlLayer = null;
    }
    window._combinedChlData = null;
    window._combinedChlGrid = null;
    window._combinedChlScanTime = null;
    if (chlScanTimeDiv) chlScanTimeDiv.textContent = "Pick at least one chip";
    return;
  }
  // Resolve selected frame metas from framesByVar
  const allFrames = framesByVar.chl || [];
  const idToFrame = new Map(allFrames.map(f => [combinedChlFrameId(f), f]));
  const selectedFrames = [];
  for (const id of s.selectedFrameIds) {
    const f = idToFrame.get(id);
    if (f) selectedFrames.push(f);
  }
  if (!selectedFrames.length) {
    if (chlScanTimeDiv) chlScanTimeDiv.textContent = "No matching frames";
    return;
  }
  // Single frame: render directly without composite math
  if (selectedFrames.length === 1) {
    const frame = selectedFrames[0];
    try {
      const data = await fetchFrameData("chl", frame);
      if (s.opSeq !== mySeq) return;   // stale — user deselected while we were fetching
      const grid = await loadGridForVar("chl", data);
      if (s.opSeq !== mySeq) return;
      const z = mobileZForVar("chl", data);
      if (!is2D(z)) { if (chlScanTimeDiv) chlScanTimeDiv.textContent = "Frame has no 2D data"; return; }
      const renderData = { ...data, z, chl: z, data: z, nx: z[0]?.length || 0, ny: z.length, bbox: data?.bbox };
      const canvas = makeMobileRasterCanvas("chl", grid, renderData);
      if (s.opSeq !== mySeq) return;
      if (window._combinedChlLayer && window._combinedMap) {
        try { window._combinedMap.removeLayer(window._combinedChlLayer); } catch (_) {}
      }
      const layer = new ol.layer.Image({
        source: canvasToOlSource(canvas, frameExtentFromGrid(grid)),
        zIndex: 10
      });
      const chk = document.getElementById("chk-combined-chl");
      layer.setVisible(chk ? chk.checked : true);
      if (window._combinedMap) window._combinedMap.addLayer(layer);
      window._combinedChlLayer = layer;
      window._combinedChlData = renderData;
      window._combinedChlGrid = grid;
      const t = combinedChlFrameTimeMs(frame);
      window._combinedChlScanTime = t || null;
      if (chlScanTimeDiv && t) {
        chlScanTimeDiv.textContent = new Date(t).toLocaleString(undefined, {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
      }
    } catch (err) {
      console.error("[CHL chip] single-frame render failed", err);
      if (chlScanTimeDiv) chlScanTimeDiv.textContent = "Render failed";
    }
    return;
  }
  // Multi-frame: delegate to the refactored composite renderer
  if (window._combinedChlLayer && window._combinedMap) {
    try { window._combinedMap.removeLayer(window._combinedChlLayer); } catch (_) {}
    window._combinedChlLayer = null;
  }
  const result = await buildChlCompositeLayer(window._combinedMap, { selectedFrames, labelMode: "auto" });
  if (s.opSeq !== mySeq) return;   // stale — user deselected while compositing
  if (result?.layer) {
    if (window._combinedMap) window._combinedMap.addLayer(result.layer);
    window._combinedChlLayer = result.layer;
  }
  if (result?.data && result?.grid) {
    window._combinedChlData = result.data;
    window._combinedChlGrid = result.grid;
  }
  if (chlScanTimeDiv) chlScanTimeDiv.textContent = result?.scanTime || "";
}

async function combinedChlInitPanel() {
  const s = combinedChlEnsureState();
  if (s.initialized && !combinedChlManifestChanged()) {
    combinedChlRebuildChips();
    return;
  }
  if (!s.initialized) {
    // Default: Latest 1 frame by timestamp (NOT cache-dependent).
    // Cache may be empty on first load; don't let that make selectedFrameIds empty.
    const allFrames = framesByVar.chl || [];
    const sorted = [...allFrames].sort((a, b) => (combinedChlFrameTimeMs(b) || 0) - (combinedChlFrameTimeMs(a) || 0));
    s.selectedFrameIds = new Set();
    if (sorted[0]) s.selectedFrameIds.add(combinedChlFrameId(sorted[0]));
    s.initialized = true;
  } else {
    // Manifest changed: prune selection to still-existing eligible ids
    const stillEligible = new Set(combinedChlEligibleFrames().map(combinedChlFrameId));
    s.selectedFrameIds = new Set([...s.selectedFrameIds].filter(id => stillEligible.has(id)));
  }
  // Build chips SYNCHRONOUSLY first. Chips must exist in the DOM before
  // renderSelected() runs — otherwise renderSelected() removes the layer
  // (0-chip branch) before the chip DOM exists to show the selection.
  combinedChlRebuildChips();
  // Now render with chips in the DOM. This is synchronous with respect
  // to the map — it does not wait for coverage.
  combinedChlRenderSelected();
  // Fetch coverage in background; rebuild + re-render once it resolves.
  const p = combinedChlEnsureCoverage();
  if (p) p.then(() => {
    combinedChlRebuildChips();
    combinedChlRenderSelected();
  });
}

// Wire chip preset buttons. Called once after DOMContentLoaded.
function combinedChlWirePresets() {
  const panel = document.getElementById("combined-chl-chips-panel");
  if (!panel) return;
  panel.querySelectorAll(".day-chip-preset").forEach(btn => {
    btn.addEventListener("click", () => {
      const preset = btn.dataset.preset;
      if (preset) combinedChlApplyPreset(preset);
    });
  });
  // Reveal/hide the panel with the CHL checkbox. Idempotent:
  // if the user toggles CHL on, init the panel (which fetches
  // coverage and rebuilds chips). If off, just hide it.
  const chk = document.getElementById("chk-combined-chl");
  if (chk && !chk._combinedChlWired) {
    chk._combinedChlWired = true;
    chk.addEventListener("change", () => {
      panel.classList.toggle("hidden", !chk.checked);
      if (chk.checked) combinedChlInitPanel();
    });
  }
}

// Wire the legacy hours dropdown to drive chip selection. Called
// once at boot. We do NOT remove the pre-existing handler on
// #combined-chl-composite (it still rebuilds via the legacy path
// when chips are not initialized); instead we override its effect
// by calling combinedChlApplyHoursPreset and then combinedChlRender
// Selected which replaces the layer.
function combinedChlWireHoursDropdown() {
  const sel = document.getElementById("combined-chl-composite");
  if (!sel || sel._combinedChlHoursWired) return;
  sel._combinedChlHoursWired = true;
  sel.addEventListener("change", () => {
    const s = combinedChlEnsureState();
    if (!s.initialized) return; // legacy path owns the layer until chip panel is opened
    combinedChlApplyHoursPreset(sel.value);
  });
}

// --- UV (currents) layer rebuild helper (v4.2 captain's-dashboard fix) ---
// Before v4.2 the UV layer was built once during renderCombinedMode
// using uvFrames[0] (the OLDEST frame, because framesByVar is sorted
// oldest-first per the line-4576 comment). Mike, 2026-06-13 14:01 ET:
// "the currents layer shows stable data or time stamp." Root cause:
// the layer was never rebuilt and was sourced from the wrong end of
// the manifest. This helper:
//   - uses the newest frame for hoursMode === "latest"
//   - for hour windows, picks the newest frame within [latestT - h, latestT]
//   - replaces the existing arrow layer cleanly
//   - updates #combined-uv-scan-time with a label that describes the
//     data actually shown
async function rebuildCombinedUvLayer(map, { hoursMode = "latest" } = {}) {
  const uvFrames = framesByVar.uv || [];
  const uvScanTimeDiv = document.getElementById("combined-uv-scan-time");
  // Remove existing
  if (window._combinedUvLayer && map) {
    try { map.removeLayer(window._combinedUvLayer); } catch (_) {}
    window._combinedUvLayer = null;
  }
  window._combinedUvData = null;
  window._combinedUvGrid = null;
  if (!uvFrames.length) {
    if (uvScanTimeDiv) uvScanTimeDiv.textContent = "";
    return null;
  }
  // Sort newest-first; pick by hoursMode.
  const newestFirst = [...uvFrames].sort((a, b) => (epochMsForFrame("uv", b) || 0) - (epochMsForFrame("uv", a) || 0));
  let frame;
  if (hoursMode === "latest") {
    frame = newestFirst[0];
  } else {
    const h = Number(hoursMode) || 24;
    const latestT = epochMsForFrame("uv", newestFirst[0]) || Date.now();
    const cutoff = latestT - h * 3600000;
    // The plan said: do not invent vector averaging if no helper
    // exists. So for hour windows we still pick the newest frame in
    // the window and label it "Latest in last N hours".
    frame = newestFirst.find(f => {
      const t = epochMsForFrame("uv", f);
      return t && t >= cutoff;
    }) || newestFirst[0];
  }
  if (!frame) { if (uvScanTimeDiv) uvScanTimeDiv.textContent = ""; return null; }
  try {
    const data = await fetchFrameData("uv", frame);
    const grid = await loadGridForVar("uv", data);
    window._combinedUvGrid = grid;
    window._combinedUvData = data;
    const arrowLayer = buildDesktopUvArrowLayer(data, grid);
    if (arrowLayer && map) {
      const chk = document.getElementById("chk-combined-uv");
      arrowLayer.setVisible(chk ? chk.checked : true);
      map.addLayer(arrowLayer);
      window._combinedUvLayer = arrowLayer;
    }
    const uvT = epochMsForFrame("uv", frame);
    if (uvScanTimeDiv) {
      if (uvT) {
        const fmt = new Date(uvT).toLocaleString(undefined, {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
        uvScanTimeDiv.textContent = hoursMode === "latest"
          ? fmt
          : `Latest in last ${hoursMode} hours: ${fmt}`;
      } else {
        uvScanTimeDiv.textContent = "";
      }
    }
    return arrowLayer;
  } catch (err) {
    console.error("[UV] rebuild failed", err);
    if (uvScanTimeDiv) uvScanTimeDiv.textContent = "Render failed";
    return null;
  }
}

/* ============================================================
   Combined-mode helpers: build ThermalHours composite layers
   ============================================================ */


function buildThermalHoursComposite(map, hours) {
  const allItems = (thermalFrontState.frameData || [])
    .filter(item => Number.isFinite(item?.t))
    .sort((a, b) => a.t - b.t);
  const latest = allItems.at(-1)?.t ?? Date.now();
  const cutoff = latest - hours * 3600000;

  // Collect thermal front items relative to the latest available scan, not wall-clock
  // time, so stale-but-current published data still renders a multi-hour overlay.
  let frontItems = allItems.filter(item => item.t >= cutoff && item.t <= latest);
  if (!frontItems.length && allItems.length) frontItems = [allItems.at(-1)];
  // Scan time: mid-point timestamp in local format
  const tSorted = frontItems.map(i => i.t).filter(Boolean).sort((a, b) => a - b);
  const scanTime = tSorted.length > 0
    ? new Date(tSorted[Math.floor(tSorted.length / 2)]).toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      })
    : "";

  // ImageStatic overlay. This avoids thousands of separate vector symbols and
  // preserves the original visual density/opacity behavior.
  const cellDeg = 0.01;
  const [west, south, east, north] = BBOX.map(Number);
  const nx = Math.max(2, Math.ceil((east - west) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((north - south) / cellDeg) + 1);
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d");
  const counts = new Uint8Array(nx * ny);
  const cellHalf = cellDeg / 2;
  const hoverPoints = [];

  for (const item of frontItems) {
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sf of sourceFeatures) {
      const coords = sf?.geometry?.coordinates || [];
      const props = sf?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i];
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const lon = Number(pt[0]);
        const lat = Number(pt[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        // Pointwise ΔSST — must read it INSIDE the inner loop so `i` is the
        // vertex index, not undefined. Previously this was computed once per
        // feature with `i` undefined, which fell through to the feature-wide
        // strength_median fallback — every vertex on the same front showed
        // the same ΔSST value.
        const deltaSst = thermalDeltaSstForFeature(props, i);
        hoverPoints.push({ lon, lat, grad: thermalGradientForFeaturePoint(props, i), deltaSst });
        const cx = Math.round((lon - west) / cellDeg);
        const cy = Math.round((north - lat) / cellDeg);
        if (cx < 0 || cx >= nx || cy < 0 || cy >= ny) continue;
        const idx = cy * nx + cx;
        if (counts[idx] < 255) counts[idx]++;
      }
    }
  }

  let nonzero = 0;
  for (let row = 0; row < ny; row++) {
    for (let x = 0; x < nx; x++) {
      const c = counts[row * nx + x];
      if (!c) continue;
      nonzero++;
      // Captain's dashboard: single point in a cell = α ≈ 0.2; no cap so
      // dense cells scale up to fully opaque (capped at 1.0 by CSS).
      const alpha = c * 51;
      const aStr = Number.isFinite(alpha) ? (alpha / 255).toFixed(3) : "0.200";
      ctx.fillStyle = `rgba(255,30,30,${aStr})`;
      ctx.beginPath();
      ctx.arc(x + 0.5, row + 0.5, 1.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const extent = [west, north - ny * cellDeg, west + nx * cellDeg, north];
  const source = canvasToOlSource(canvas, extent);
  const densityLayer = new ol.layer.Image({ source, zIndex: 30, opacity: 0.90 });

  console.log("[thermal] frontDensityCells=" + nonzero + " hours=" + hours + " frames=" + frontItems.length);
  window._combinedFrontHoverPoints = hoverPoints;
  return { pointLayer: null, densityLayer, scanTime };
}

function combinedNearestFrontHover(map, coord, pixel) {
  const points = window._combinedFrontHoverPoints || [];
  if (!map || !coord || !pixel || !points.length) return null;
  // Zoom-independent hit radius — Haversine in km rather than the old
  // 14-px screen-pixel radius that became effectively zero-area at high zoom.
  // Clicking near (not exactly on) a front line still counts.
  const nearby = [];
  for (const point of points) {
    const d = thermalHaversineKm(coord, [point.lon, point.lat]);
    if (d <= MAX_THERMAL_HIT_DISTANCE_KM) nearby.push(point);
  }
  if (!nearby.length) return null;
  // Average valid gradient and SST values across nearby points
  const gradVals = [], sstVals = [];
  for (const pt of nearby) {
    if (pt.grad !== null && pt.grad !== undefined && Number.isFinite(pt.grad)) gradVals.push(pt.grad);
    if (pt.deltaSst && Number.isFinite(pt.deltaSst.value)) sstVals.push(pt.deltaSst.value);
  }
  const parts = [];
  if (gradVals.length) {
    const avg = gradVals.reduce((a, b) => a + b, 0) / gradVals.length;
    const avgC = avg * (tempUnit === "F" ? 9 / 5 : 1);
    const displayGrad = thermalDistUnit === "nm" ? kmToNm(avgC) : avgC;
    const unit = tempUnit + (thermalDistUnit === "nm" ? "/nm" : "/km");
    parts.push(`${displayGrad.toFixed(3)} °${unit}`);
  }
  if (sstVals.length) {
    const avg = sstVals.reduce((a, b) => a + b, 0) / sstVals.length;
    const deltaVal = tempUnit === "F" ? avg * 9 / 5 : avg;
    parts.push(`ΔSST ${deltaVal.toFixed(2)} ${tempUnitLabel()}`);
  }
  return parts.length ? parts.join("  ") : null;
}

async function buildUvCompositeLayer(map, count) {
  const uvFrames = framesByVar.uv || [];
  if (!uvFrames.length) return {};
  const sorted = [...uvFrames].sort((a, b) => {
    const ta = epochMsForFrame("uv", a) || 0;
    const tb = epochMsForFrame("uv", b) || 0;
    return tb - ta;
  });
  const selected = sorted.slice(0, Math.min(count, sorted.length));
  if (!selected.length) return {};

  // Load all selected frames
  const loaded = await Promise.all(selected.map(f => fetchFrameData("uv", f).catch(() => null)));
  const valid = loaded.filter(d => d && d.u && d.v);

  // Scan time: mid-point of selected frames
  const frameTimes = selected.map((f, i) => {
    const d = valid[i];
    if (!d) return null;
    return epochMsForFrame("uv", f) || null;
  }).filter(Boolean).sort((a, b) => a - b);
  const midTime = frameTimes.length > 0 ? frameTimes[Math.floor(frameTimes.length / 2)] : null;
  const scanTime = midTime
    ? new Date(midTime).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : "";

  if (!valid.length) return { scanTime };

  // Build nanmedian composite for u and v
  const ny = valid[0].u.length;
  const nx = valid[0].u[0]?.length || 0;
  if (!ny || !nx) return { scanTime };

  const uMedian = [], vMedian = [];
  for (let row = 0; row < ny; row++) {
    uMedian[row] = []; vMedian[row] = [];
    for (let col = 0; col < nx; col++) {
      const uVals = [], vVals = [];
      for (const frame of valid) {
        const u = frame.u?.[row]?.[col];
        const v = frame.v?.[row]?.[col];
        if (u !== null && isFinite(u)) uVals.push(u);
        if (v !== null && isFinite(v)) vVals.push(v);
      }
      uMedian[row][col] = uVals.length > 0
        ? (uVals.length === 1 ? uVals[0] : uVals.sort()[Math.floor(uVals.length / 2)])
        : NaN;
      vMedian[row][col] = vVals.length > 0
        ? (vVals.length === 1 ? vVals[0] : vVals.sort()[Math.floor(vVals.length / 2)])
        : NaN;
    }
  }

  // Load grid from first valid frame
  const grid = await loadGridForVar("uv", valid[0]).catch(() => null);
  if (!grid) return { scanTime };
  const { xAxis, yAxis } = grid;
  const dxg = Math.abs((xAxis[1] ?? xAxis[0]) - xAxis[0]) || 0.01;
  const dyg = Math.abs((yAxis[1] ?? yAxis[0]) - yAxis[0]) || 0.01;
  const cell = Math.min(dxg, dyg);
  const step = Math.max(3, Math.floor(Math.sqrt(nx * ny) / 36));
  const minSpeed = 0.035, maxSpeed = 1.2;
  const minLen = 0.95 * cell, maxLen = 2.8 * cell;
  const features = [];
  for (let row = 0; row < ny; row += step) {
    for (let col = 0; col < nx; col += step) {
      const u = uMedian[row]?.[col];
      const v = vMedian[row]?.[col];
      if (!Number.isFinite(u) || !Number.isFinite(v)) continue;
      const spd = Math.sqrt(u * u + v * v);
      if (spd < minSpeed || spd > 3) continue;
      const lon = xAxis[col], lat = yAxis[row];
      const scaled = Math.min(spd, maxSpeed) / maxSpeed;
      const arrowLen = minLen + (maxLen - minLen) * scaled;
      const geom = buildArrowGeometry(lon, lat, u, v, arrowLen, cell);
      if (geom) features.push(new ol.Feature({ geometry: geom, speed: spd }));
    }
  }
  if (!features.length) return { scanTime };
  const source = new ol.source.Vector({ features, wrapX: false, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source,
    style: (feature) => new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.85)", width: 1.45, lineCap: "round", lineJoin: "round" })
    }),
    zIndex: 20
  });
  return { layer, scanTime };
}

function buildThermalFrontLineLayer(frontData) {
  const features = frontData.features || [];
  if (!features.length) return null;
  const source = new ol.source.Vector({ wrapX: false, projection: "EPSG:4326" });
  for (const feat of features) {
    const coords = feat.geometry?.coordinates || [];
    if (feat.geometry?.type === "LineString" && coords.length >= 2) {
      const f = new ol.Feature({ geometry: new ol.geom.LineString(coords) });
      f.getGeometry().transform("EPSG:4326", "EPSG:3857");
      source.addFeature(f);
    } else if (feat.geometry?.type === "MultiLineString") {
      for (const seg of coords) {
        if (Array.isArray(seg) && seg.length >= 2) {
          const f = new ol.Feature({ geometry: new ol.geom.LineString(seg) });
          f.getGeometry().transform("EPSG:4326", "EPSG:3857");
          source.addFeature(f);
        }
      }
    }
  }
  return new ol.layer.Vector({
    source,
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "#ff4040", width: 1.4 })
    }),
    zIndex: 32
  });
}

function buildThermalFrontDensityCanvas(frontData, grid) {
  const features = frontData.features || [];
  if (!features.length) return null;
  const { xAxis, yAxis } = grid;
  const cellDeg = 0.014;
  const nx = Math.max(2, Math.ceil((BBOX[2] - BBOX[0]) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((BBOX[3] - BBOX[1]) / cellDeg) + 1);
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d");
  const counts = new Float32Array(nx * ny);
  const radiusPx = 0.9;
  for (const feat of features) {
    const coords = feat.geometry?.coordinates || [];
    for (const pt of coords) {
      if (!pt || pt.length < 2) continue;
      const [lon, lat] = pt;
      const cx = Math.round((lon - BBOX[0]) / cellDeg);
      const cy = Math.round((BBOX[3] - lat) / cellDeg);
      if (cx < 0 || cx >= nx || cy < 0 || cy >= ny) continue;
      counts[cy * nx + cx]++;
    }
  }
  const maxC = Math.max(...counts) || 1;
  for (let row = 0; row < ny; row++) {
    for (let x = 0; x < nx; x++) {
      const c = counts[row * nx + x];
      if (c > 0) {
        const alpha = Math.min(95, (c / maxC) * 110);
        const aStr = Number.isFinite(alpha) ? (alpha / 255).toFixed(3) : "0.373";
        ctx.beginPath();
        ctx.arc(x + 0.5, row + 0.5, radiusPx, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,30,30,${aStr})`;
        ctx.fill();
      }
    }
  }
  return canvas;
}

async function renderMobileFrame(frameMeta) {
  if (currentVar === "chl_front" || currentVar === "sst_front" || currentVar === "thermal_fronts" || currentVar === "combined") {
    document.body.classList.remove("mobile-map-ready");
    detachInactiveMapTargets(null);
    return false;
  }
  const map = initMobileMapIfNeeded();
  if (!map) return false;

  // Combined: not yet supported on mobile — fall through to single-product path
  if (currentVar === "combined") {
    // Show a toast instead of an error
    const toast = document.createElement("div");
    toast.textContent = "Combined view is desktop-only";
    toast.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;color:#fff;background:rgba(0,80,0,0.85);padding:14px 20px;border-radius:8px;font-size:14px;text-align:center;";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
    return false;
  }

  let dataObj, gridInfo;
  if (currentVar === "bathy") {
    dataObj = await loadBathymetryJson(BATHY_JSON_URL);
    gridInfo = { xAxis: dataObj.xAxis, yAxis: dataObj.yAxis, nx: dataObj.xAxis.length, ny: dataObj.yAxis.length };
  } else {
    dataObj = await fetchFrameData(currentVar, frameMeta);
    gridInfo = await loadGridForVar(currentVar, dataObj);
  }
  mobileMapState.currentGridInfo = gridInfo;
  mobileMapState.currentDataObj = dataObj;

  // Defensive: currentVar can flip to a multi-layer value (e.g. 'combined')
  // during the async fetch above, AFTER the early-return at the top of
  // this function ran. The mobile raster canvas only handles single-variable
  // 2-D rasters, so bail out cleanly for any non-raster view.
  if (currentVar !== "chl" && currentVar !== "sst" && currentVar !== "uv" && currentVar !== "bathy") {
    console.info("[OL mobile] renderMobileFrame: skipping — currentVar=" + currentVar + " has no 2-D mobile raster");
    document.body.classList.remove("mobile-map-ready");
    return false;
  }

  const canvas = makeMobileRasterCanvas(currentVar, gridInfo, dataObj);
  const extent = frameExtentFromGrid(gridInfo);
  let source;
  try {
    // Skip toBlob/toDataURL/ImageStatic entirely — they can throw on iOS Safari.
    // canvasToOlSource uses ol.source.ImageCanvas which never round-trips
    // through the URL parser.
    source = canvasToOlSource(canvas, extent);
  } catch (e) {
    console.error("[OL mobile] canvasToOlSource failed, extent:", extent, e);
    throw e;
  }
  source.on("imageloaderror", () => {
    console.error("Mobile map image layer failed to load; falling back to Plotly.");
    mobileMapState.disabled = true;
    document.body.classList.remove("mobile-map-ready");
    showFrame();
  });
  // Mike, 2026-08-10 07:44 ET: drop the now-orphan URL.revokeObjectURL guard
  // (no blob: URL exists to revoke since b13739edcc2 switched to
  // ol.source.ImageCanvas via canvasToOlSource) and replace the dead 'url'
  // assignment with an explicit null clear that documents the new contract.
  // Originally fixed in commit ce8a4539344 on
  // feature/fix-mobile-ol-url-undefined, but that branch was never merged
  // to main — re-applied here so this branch's preview doesn't break iOS
  // Safari with "Mobile OL error: Can't find variable: url" on first paint.
  mobileMapState.imageUrl = null;
  if (mobileMapState.imageLayer) {
    mobileMapState.imageLayer.setSource(source);
  } else {
    mobileMapState.imageLayer = new ol.layer.Image({ source, zIndex: 10 });
    map.addLayer(mobileMapState.imageLayer);
  }
  clearMobileUvArrowLayer(map);
  if (currentVar === "uv") {
    mobileMapState.arrowLayer = buildMobileUvArrowLayer(dataObj, gridInfo);
    if (mobileMapState.arrowLayer) map.addLayer(mobileMapState.arrowLayer);
  }
  await ensureMobileLandLayer(map);
  ensureMobilePlaceLayer(map);
  if (currentVar === "bathy") {
    await ensureMobileBathyContourLayer(map, dataObj, gridInfo);
  }
  installMobileReadoutOnce(map);
  map.updateSize();

  const regionKey = `${REGION_ID}:${currentVar}`;
  if (mobileMapState.fittedRegion !== regionKey) {
    if (viewState.hasRange) applyViewStateToOlMap(map, extent);
    else fitMobileMapWidth(map, extent);
    mobileMapState.fittedRegion = regionKey;
  }

  await renderFooterColorbarToDiv(document.getElementById("hamburger-cbar"), currentVar);
  updateSliderUI();
  return true;
}

/* ========================= READOUT (hover + tap) ========================= */
function setupReadoutHandlersOnce() {
  if (_readoutHooked) return;
  _readoutHooked = true;

  plotDiv.on("plotly_unhover", () => { if (!IS_TOUCH) setReadout(""); });

  plotDiv.on("plotly_hover", (ev) => {
    console.log("[hover] plotly_hover fired, points:", ev.points?.length, "IS_TOUCH:", IS_TOUCH);
    if (IS_TOUCH) return;
    const p = ev.points && ev.points[0];
    if (!p) { console.log("[hover] no point"); return; }
    console.log("[hover] point x=", p.x, "y=", p.y, "customdata=", p.customdata);
    renderReadoutFromPoint(p);
  });

  plotDiv.on("plotly_click", async (ev) => {
    // 1. CLEANUP PREVIOUS MEASUREMENT (If exists)
    // If the user clicks ANYWHERE while a measurement line is visible, clear it first.
    if (measureResultVisible) {
      measurePoints = [];
      measureResultVisible = false;
      await showFrame();
      // We continue processing this click (so they can immediately click to add a marker or see a value)
    }

    // 2. DETERMINE COORDINATES
    let lon, lat;
    const p = ev.points && ev.points[0];

    // Use Exact Mouse Calculation for Add OR Measure modes
    if (markerMode === "add" || measureMode !== "off") {
      const domEvent = ev.event;
      const xaxis = plotDiv._fullLayout.xaxis;
      const yaxis = plotDiv._fullLayout.yaxis;
      const dragLayer = plotDiv.querySelector('.nsewdrag');
      const rect = dragLayer.getBoundingClientRect();
      const xPx = domEvent.clientX - rect.left;
      const yPx = domEvent.clientY - rect.top;
      lon = xaxis.p2d(xPx);
      lat = yaxis.p2d(yPx);
    } else {
      if (!p) return;
      lon = Number(p.x);
      lat = Number(p.y);
    }

    if (!isFinite(lon) || !isFinite(lat)) return;

    // --- 3. MEASURE LOGIC (Updated) ---
    if (measureMode !== "off") {
      if (measureMode === "start") {
        // Point A
        measurePoints = [{ lon, lat }];
        measureMode = "end";
        setReadout("Measure: Click END point");
      } else {
        // Point B (Finish)
        measurePoints[1] = { lon, lat };

        const d = getDistanceInNM(
          measurePoints[0].lat, measurePoints[0].lon,
          measurePoints[1].lat, measurePoints[1].lon
        );

        // 1. Show result in top bar
        setReadout(`Distance: ${d.toFixed(2)} nm`);

        // 2. Turn OFF mode immediately
        measureMode = "off";
        plotDiv.classList.remove("measure-mode");

        // 3. Flag result as visible so NEXT click clears it
        measureResultVisible = true;
      }
      await showFrame();
      return;
    }

    // --- 4. MARKER LOGIC ---
    if (markerMode === "add") {
      markers.push({ lon, lat, label: String(markers.length + 1) });
      await showFrame();
      return;
    }
    if (markerMode === "remove") {
      removeNearestMarker(lon, lat);
      await showFrame();
      return;
    }

    // --- 5. NORMAL READOUT ---
    if (p) renderReadoutFromPoint(p);
  });
}

/* ================= DDM CONVERSION HELPER (Standard Marine) ================= */
function toDDM(val) {
  const absVal = Math.abs(val);
  const d = Math.floor(absVal);
  const m = (absVal - d) * 60;

  // Format: Degrees + Minutes with 3 decimal places (Standard GPS precision)
  // padStart(2, '0') ensures "05.123" instead of "5.123"
  const mStr = m.toFixed(2).padStart(5, '0');

  // West/South Handling
  // You can also add N/S/E/W suffixes if preferred,
  // but standard negative signs work well for compact readouts.
  const sign = val < 0 ? "-" : "";

  return `${sign}${d}°${mStr}'`;
}

/* ================= READOUT ================= */
function renderReadoutFromPoint(p) {
  const lon = Number(p.x);
  const lat = Number(p.y);
  if (!isFinite(lon) || !isFinite(lat)) return;

  const base = formatReadoutCoords(lon, lat);

  const cd = p.customdata;
  if (cd === null || cd === undefined) {
    setReadout(base);
    return;
  }

  // Handle front data (customdata with _is_front flag)
  if (cd._is_front) {
    const parts = [];
    if (cd.strength !== null && cd.strength !== undefined) {
      parts.push(`${Number(cd.strength).toFixed(2)} ${cd.strength_unit || ""}`);
    }
    if (cd.length_km !== null && cd.length_km !== undefined) {
      parts.push(formatDist(cd.length_km));
    }
    setReadout(parts.length ? `${base} ${parts.join(" / ")}` : base);
    return;
  }

  const val = Number(cd);
  if (!isFinite(val) || isNaN(val)) {
    setReadout(base);
    return;
  }
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";

  if (currentVar === "sst") setReadout(`${base}, ${formatSstValue(val)}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else if (currentVar === "uv") setReadout(`${base}, SSH ${formatSshValue(val)}`);
  else setReadout(`${base} ${formatChlValue(val)}`);
}
