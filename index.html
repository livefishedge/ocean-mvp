<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>LiveMaps</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.4.0/ol.css">

  <script src="https://cdn.plot.ly/plotly-2.34.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.4.0/dist/ol.js"></script>
  <script src="drawMobileUvArrowsLite.js?v=20260517-arrows2"></script>


  <style>
    :root{
      --bg:#050b10; --fg:#e0e6ee; --panel:rgba(5,11,16,0.92); --border:#1b2836;
      --pad:10px;
      --controls-h: 60px;
      --ranges-h: 72px;
    }
    html, body {
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      overflow:auto;
    }

    /* ======= Controls (sticky) ======= */
    #controls{
      position:sticky;
      top:0;
      z-index:80;
      background:var(--panel);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(6px);
      padding:8px 10px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    #row-region,
    #row-var,
    #row-play{ flex: 0 0 auto; }
    #row-slider{ flex: 1 1 520px; min-width:320px; }

    .control-group{
      display:flex;
      align-items:center;
      gap:7px;
      min-height:44px;
    }
    .control-select,
    #region-select,
    #var-select{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:9px 12px;
      font-size:16px;
      font-weight:800;
      min-height:42px;
      max-width:280px;
    }
    #var-select{ min-width:168px; }
    #region-select{ min-width:250px; }
    #row-fronts-overlay{
      display:none;
      align-items:center;
      gap:12px;
      font-size:13px;
      font-weight:700;
      color:#c8d3df;
      min-height:32px;
    }
    #row-fronts-overlay label{
      display:none;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    #row-fronts-overlay input{
      width:16px;
      height:16px;
      accent-color:#e0e6ee;
    }

    button{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:10px 12px;
      font-size:16px;
      min-height:44px;
      cursor:pointer;
    }
    button:disabled{ opacity:.45; cursor:default; }
    #row-play{
      gap:8px;
    }
    #prev-btn,
    #next-btn{
      min-width:58px;
      min-height:52px;
      padding:8px 14px;
      font-size:30px;
      line-height:1;
      font-weight:900;
    }
    #play-btn{
      min-height:52px;
      padding:8px 16px;
      font-weight:800;
    }

    #frame-slider{ flex:1; min-width:220px; height:24px; }
    #frame-label{
      min-width:240px;
      text-align:right;
      font-size:20px;
      font-weight:800;
      font-variant-numeric: tabular-nums;
      white-space:nowrap;
    }


    #speed-wrap{
      display:flex;
      align-items:center;
      gap:4px;
      margin-left:8px;
      white-space:nowrap;
    }
    #speed-select{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:8px 10px;
      font-size:14px;
      min-height:36px;
    }

    /* Modebar host: NEW CSS for floating inside the plot at upper-left */
    #modebar-host{
      position: fixed; /* Must be 'fixed' to float on scroll */
      top: 75px; /* Using 92px is generally better to clear the sticky controls */
      left: 50px; /* Using 10px moves it to the very left edge */
      z-index: 1000;
      pointer-events: auto;
    }

    /* ======= Floating Feedback ======= */
    #feedback-float{
      position:fixed;
      bottom:24px;
      right:24px;
      z-index:500;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
    }
    #feedback-toggle{
      background:#2d7d46;
      color:#fff;
      border:none;
      border-radius:50%;
      width:48px;
      height:48px;
      aspect-ratio:1 / 1;
      padding:0;
      font-size:0;
      line-height:1;
      cursor:pointer;
      box-shadow:0 2px 12px rgba(0,0,0,.5);
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      box-sizing:border-box;
      overflow:hidden;
      position:relative;
    }
    #feedback-toggle::before{
      content:"";
      width:18px;
      height:14px;
      border:2px solid currentColor;
      border-radius:4px;
      box-sizing:border-box;
      display:block;
    }
    #feedback-toggle::after{
      content:"";
      position:absolute;
      width:7px;
      height:7px;
      border-right:2px solid currentColor;
      border-bottom:2px solid currentColor;
      transform:rotate(45deg);
      margin-top:13px;
      margin-left:-8px;
      background:#2d7d46;
    }
    #feedback-toggle:hover{ background:#3a9d5c; }
    #feedback-toggle:hover::after{ background:#3a9d5c; }
    #temp-unit-toggle{
      display:none;
      min-width:44px;
      min-height:32px;
      padding:4px 10px;
      border:1px solid var(--border);
      border-radius:8px;
      background:#111a24;
      color:var(--fg);
      font-weight:800;
      font-size:13px;
      cursor:pointer;
    }
    body.show-temp-unit #temp-unit-toggle{ display:inline-flex; align-items:center; justify-content:center; }
    #feedback-panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      display:flex;
      gap:8px;
      box-shadow:0 4px 20px rgba(0,0,0,.4);
    }
    #feedbackInput{
      background:#fff;
      color:#000;
      border:none;
      border-radius:6px;
      padding:8px 10px;
      width:240px;
      font-size:14px;
      outline:none;
    }
    #feedbackSubmit{
      background:#2d7d46;
      color:#fff;
      border:none;
      border-radius:6px;
      padding:8px 14px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }
    #feedbackSubmit:hover{ background:#3a9d5c; }
    .modebar{
      background: rgba(5,11,16,0.55) !important;
      border-radius:12px !important;
      padding:6px 6px !important;
      position: static !important; /* Override Plotly's internal positioning */
      gap: 14px !important;              /* space between groups */
      /* VITAL FIXES for single row display */
      display: flex !important;
      flex-wrap: nowrap !important; /* Forces all buttons into a single row */
      justify-content: flex-start !important;
    }

    /* Modebar tip */
    #modebar-tip{
      position:absolute;
      z-index:1100;
      pointer-events:auto;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.5) !important;
      color: #e0e6ee;
      border: 1px solid rgba(224,230,238,0.15);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 320px;
      white-space: nowrap;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    /* ======= Plot ======= */
    /*#plot-wrap{ position:relative; width:100%; }*/
    #plot{
      width:100%;
      height: 100dvh;
      /* Key: allow 1-finger vertical page scrolling */
      touch-action: pan-y;
    }
    #mobile-map{
      display:none;
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      background:#050b10;
      touch-action:none;
      z-index:20;
    }
    #mobile-map .ol-viewport{
      background:#050b10;
    }
    #mobile-map .ol-viewport,
    #mobile-map .ol-unselectable,
    #mobile-map canvas{
      touch-action:none;
    }
    #mobile-map .ol-control{
      display:none;
    }
    #mobile-time-badge{
      display:none;
      position:fixed;
      top:10px;
      left:10px;
      z-index:140;
      max-width:calc(100vw - 76px);
      padding:4px 6px;
      border:1px solid rgba(255,255,255,0.28);
      border-radius:8px;
      background:rgba(5,11,16,0.68);
      color:#fff;
      font-size:11px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
      line-height:1.1;
      min-height:24px;
      box-sizing:border-box;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      pointer-events:auto;
      touch-action:none;
      user-select:none;
      text-shadow:0 1px 2px rgba(0,0,0,0.75);
    }
    #mobile-time-badge.has-time::before,
    #mobile-time-badge.has-time::after{
      display:inline-block;
      color:rgba(255,255,255,0.72);
      font-size:10px;
      line-height:1;
      vertical-align:1px;
    }
    #mobile-time-badge.has-time::before{
      content:"‹";
      margin-right:4px;
    }
    #mobile-time-badge.has-time::after{
      content:"›";
      margin-left:4px;
    }
    #map-status-toolbar{
      position:fixed;
      top:calc(8px + env(safe-area-inset-top, 0px));
      left:calc(10px + env(safe-area-inset-left, 0px));
      z-index:145;
      display:flex;
      align-items:center;
      gap:7px;
      padding:4px 7px;
      border:1px solid rgba(255,255,255,0.24);
      border-radius:8px;
      background:rgba(5,11,16,0.70);
      color:#fff;
      font-size:11px;
      font-weight:800;
      box-shadow:0 3px 12px rgba(0,0,0,0.35);
      backdrop-filter:blur(5px);
      pointer-events:auto;
      user-select:none;
    }
    #map-time-status{
      max-width:190px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .map-time-step{
      width:22px;
      height:22px;
      border:1px solid rgba(255,255,255,0.28);
      border-radius:6px;
      background:rgba(255,255,255,0.10);
      color:#fff;
      font-size:15px;
      font-weight:900;
      line-height:18px;
      cursor:pointer;
      padding:0;
    }
    .map-time-step:disabled{
      opacity:0.35;
      cursor:default;
    }
    #thermal-front-toolbar{
      display:flex;
      align-items:center;
      gap:4px;
      white-space:nowrap;
    }
    #thermal-front-toolbar input{
      width:13px;
      height:13px;
      accent-color:#ffb000;
    }

    /* Floating readout: fixed lower-right so it stays visible during map gestures. */
    #readout{
      position:fixed;
      top:calc(6px + env(safe-area-inset-top, 0px));
      left:auto;
      right:10px;
      bottom:auto;
      z-index:120;
      padding:4px 6px;
      background: rgba(255,255,255,0.50);
      color:#000;
      border:1px solid rgba(0,0,0,0.12);
      border-radius:10px;
      font-variant-numeric: tabular-nums;
      pointer-events:none;
      white-space:nowrap;
      font-size:14px;
      min-width:140px;
      text-align:left;
      user-select:none;
      cursor:default;
      line-height: 1.4;
      display: inline-block;
    }
    body.mobile-device #readout,
    body.portrait-mode #readout{
      display:none !important;
    }

    /* ======= Bottom ranges (sticky): Reduced Padding ======= */
    #ranges{
      position: sticky;
      bottom: 0;
      z-index:70;
      background:var(--panel);
      border-top:1px solid var(--border);
      backdrop-filter: blur(6px);
      padding:4px 10px;
      padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      font-size:14px;
    }

    /* Ranges row layout with footer colorbar on the right */
    #ranges{ justify-content: space-between; }
    #ranges-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    #ranges-right{
      display:flex;
      align-items:center;
      margin-left:auto;
    }
    #cbar{
      width:320px;
      height:72px;
    }
    .range-block{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      padding:4px 8px; /* REDUCED PADDING */
      border:1px solid var(--border);
      border-radius:12px;
      background: rgba(12,23,35,0.65);
    }
    .range-name{
      font-weight:900;
      font-size:14px;
      margin-right:4px;
      white-space:nowrap;
    }
    .mini-label{ opacity:0.85; font-size:13px; white-space:nowrap; }
    input[type="number"]{
      width:96px;
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:2px 8px; /* REDUCED PADDING */
      font-size:14px;
      min-height:20px; /* REDUCED MIN HEIGHT */
    }
    .range-actions{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .range-actions button{
      padding:4px 8px; /* REDUCED PADDING */
      font-size:13px;
      min-height:36px; /* REDUCED MIN HEIGHT */
    }


    /* ======= Captain Briefing Demo Panel ======= */
    #briefing-toggle{
      background:#1a5cff;
      border-color:#4d7dff;
      font-weight:800;
    }
    #briefing-panel{ display:none; }
    #briefing-panel[aria-live]{ display:none; }
    /* OVERRIDE any .open class to keep briefing hidden until explicitly opened */
    #briefing-panel.open{ display:none !important; }
    #briefing-panel{
      position:fixed;
      top:82px;
      right:14px;
      z-index:900;
      width:min(430px, calc(100vw - 28px));
      max-height:calc(100dvh - 150px);
      overflow:auto;
      background:rgba(5,11,16,0.96);
      color:var(--fg);
      border:1px solid #2c4664;
      border-radius:16px;
      box-shadow:0 18px 50px rgba(0,0,0,0.45);
      padding:14px;
      display:none;
    }
    #briefing-panel.open{ display:block; }
    #briefing-panel h2{ margin:0 0 4px; font-size:18px; }
    #briefing-panel .muted{ color:#9fb0c3; font-size:12px; }
    .briefing-port-group{
      margin-top:8px;
      padding:10px;
      background:rgba(255,255,255,0.03);
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.1);
    }
    .briefing-port-plans{
      margin-top:6px;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .briefing-plan{
      border:1px solid #22384f;
      border-radius:8px;
      padding:8px;
      margin-top:0;
      background:rgba(12,23,35,0.6);
      border-left:3px solid #2d7d46;
    }
    .briefing-plan:nth-child(2){ border-left-color:#d4a017; }
    .briefing-plan:nth-child(3){ border-left-color:#8b4513; }
    .briefing-plan strong{ font-size:14px; }
    .briefing-health{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      margin-top:10px;
    }
    .briefing-health div{
      border:1px solid #22384f;
      border-radius:10px;
      padding:8px;
      background:rgba(12,23,35,0.55);
      font-size:12px;
    }
    /* Make map place labels readable over CHL/SST/current rasters. */
    #plot .textpoint text{
      paint-order: stroke;
      stroke: rgba(0,0,0,0.88);
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    #briefing-full{
      margin-top:10px;
      white-space:pre-wrap;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:11px;
      line-height:1.35;
      color:#cbd6e2;
      border-top:1px solid #22384f;
      padding-top:10px;
      display:none;
    }
    #briefing-full.open{ display:block; }

    /* Controls hamburger toggle button: visible in portrait only */
    #controls-hamburger-toggle-btn{
      display: none;
      position: fixed;
      top: 6px;
      right: 6px;
      z-index: 160;
      width: 44px;
      height: 44px;
      background: rgba(5,11,16,0.94);
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 8px;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 0;
      align-items: center;
      justify-content: center;
      box-shadow:0 3px 12px rgba(0,0,0,0.5);
    }
    #ranges-hamburger{ display: none; }
    #mobile-range-controls{ display:none; }

    @media (orientation: portrait) {
      #controls-hamburger-toggle-btn{ display: flex !important; }
      /* In portrait, the existing controls bar becomes the hamburger panel. */
      #controls{
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 150;
        background: rgba(5,11,16,0.92);
        backdrop-filter: blur(8px);
        flex-direction: column;
        align-items: stretch;
        padding: 16px;
        gap: 12px;
        overflow-y: auto;
      }
      #controls.open{ display: flex; }
      #row-region-and-var{ display:flex; flex-wrap:nowrap; gap:8px; width:100%; }
      #row-region, #row-var{ flex:1 1 50%; }
      #row-fronts-overlay{ width:100%; padding:0 2px; }
      #region-select, #var-select{
        width:100%;
        min-width:0;
        font-size:14px;
        padding:8px 10px;
        min-height:40px;
        border-radius:8px;
      }
      #row-slider-and-play{ display:flex; width:100%; }
      #row-slider{ display:flex; flex-wrap:wrap; gap:8px; width:100%; min-width:0; }
      #frame-label{ flex:1 1 100%; min-width:0 !important; font-size:14px !important; white-space:nowrap; }
      #row-play{ display:flex; gap:8px; flex:0 0 auto; }
      #row-play button{ min-width:42px; min-height:42px; font-size:16px; }
      #row-play #prev-btn,
      #row-play #next-btn{ min-width:56px; min-height:48px; font-size:28px; }
      #frame-slider{ width:100%; min-width:0 !important; flex:1 1 100% !important; }
      #speed-wrap{ flex: 0 0 auto; }
      #mobile-range-controls{
        display:flex;
        flex-direction:column;
        gap:10px;
        width:100%;
        padding-top:8px;
        border-top:1px solid rgba(255,255,255,0.12);
      }
      #mobile-range-row{
        display:flex;
        align-items:center;
        gap:8px;
        flex-wrap:wrap;
      }
      #mobile-range-title{
        flex:1 1 100%;
        font-size:13px;
        font-weight:800;
        color:#9fb0c3;
      }
      #mobile-range-row input{
        flex:1 1 72px;
        min-width:0;
        min-height:38px;
        font-size:14px;
      }
      #mobile-range-row button{
        min-height:38px;
        font-size:13px;
        padding:7px 10px;
      }
      #mobile-cbar{ width:100%; height:64px; }

      /* Modebar below map */
      #modebar-host{
        position: absolute !important;
        top: auto !important;
        left: 4px !important;
        right: auto !important;
        bottom: 0 !important;
      }
      #modebar-host .modebar{
        background: rgba(5,11,16,0.75) !important;
        border-radius: 0 8px 8px 0 !important;
        padding: 4px 6px !important;
        display: flex !important;
        flex-wrap: nowrap !important;
        justify-content: flex-start !important;
      }
      #modebar-host .modebar-btn{ margin-left: 6px !important; margin-right: 6px !important; }
      #modebar-host .modebar-group{ gap: 8px !important; }

      /* Readout: always bottom-right, regardless of orientation */
      #readout{
        left: auto !important;
        right: 72px;
        top: auto;
        bottom: 12px;
        font-size: 11px;
        min-width: 160px;
        padding: 4px 8px;
        z-index: 130;
        line-height: 1.5;
        display: inline-block;
        pointer-events:none;
      }
      #temp-unit-toggle{ min-width:38px; min-height:32px; padding:3px 8px; font-size:12px; }

      /* Plot: full viewport; controls/date strip are hidden until the hamburger opens. */
      #plot{ height: 100dvh; min-height: 200px; }
      body.mobile-map-ready #plot{ display:none; }
      body.mobile-map-ready #mobile-map{ display:block; }
      body.mobile-map-ready #mobile-time-badge.has-time{ display:block; }
      body.mobile-map-ready #controls.open ~ #mobile-time-badge{ display:none; }
      #modebar-host{ display:none !important; }

      /* Ranges bar hidden on portrait */
      #ranges{ display: none; }

      /* ====== Ranges bar: hidden on portrait ====== */
      #ranges{ display: none; }

      /* ====== Hamburger: floating toggle + collapsible panel ====== */
      #ranges-hamburger{
        display:none;
        position:fixed;
        bottom:calc(12px + env(safe-area-inset-bottom, 0px));
        left:12px;
        z-index:200;
        flex-direction:column;
        align-items:flex-start;
        gap:0;
      }
      /* ranges-hamburger is always hidden; mobile controls live behind the top-right toggle. */
      #ranges-hamburger{ display: none !important; }
      #ranges-hamburger-toggle{
        width:36px; height:36px;
        background:var(--panel); border:1px solid var(--border);
        border-radius:8px; color:var(--fg); font-size:18px;
        cursor:pointer; display:flex; align-items:center; justify-content:center;
        padding:0;
      }
      #ranges-hamburger-panel{
        display:none; position:absolute; bottom:40px; left:0;
        background:var(--panel); border:1px solid var(--border);
        border-radius:10px; padding:8px 10px;

/* ========================= CONFIG ========================= */

/* ========================= STATE ========================= */
let lastUpdateTimestamp = null;

let frameTimesByVar = { chl: [], sst: [], chl_front: [], sst_front: [], uv: [], bathy: [] };

let _relayoutHooked = false;

/* Touch / portrait detection */
const IS_TOUCH = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
function isPortrait() { return window.innerHeight > window.innerWidth; }
function isMobileDevice() { return IS_TOUCH || Math.min(window.innerWidth, window.innerHeight) <= 760; }
function isMobileMapMode() { return false; }
let lastViewportPortrait = isPortrait();
function syncViewportClasses() {
  if (!document.body) return;
  document.body.classList.toggle("mobile-device", isMobileDevice());
  if (document.body) document.body.classList.toggle("portrait-mode", isPortrait());
}
syncViewportClasses();

function visualViewportBox() {
  const vv = window.visualViewport;
  const width = Math.min(vv ? vv.width : window.innerWidth, window.innerWidth);
  const height = Math.min(vv ? vv.height : window.innerHeight, window.innerHeight);
  return {
    left: vv ? vv.offsetLeft : 0,
    top: vv ? vv.offsetTop : 0,
    width,
    height
  };
}

function clampRectToVisualViewport(el, fallback) {
  if (!el) return;
  const box = visualViewportBox();
  const rect = el.getBoundingClientRect();
  const width = rect.width || fallback?.width || 44;
  const height = rect.height || fallback?.height || 44;
  const margin = fallback?.margin ?? 8;
  const minX = box.left + margin;
  const minY = box.top + margin;
  const maxX = box.left + Math.max(margin, box.width - width - margin);
  const maxY = box.top + Math.max(margin, box.height - height - margin);
  const desiredX = fallback?.x ?? rect.left;
  const desiredY = fallback?.y ?? rect.top;
  el.style.left = Math.max(minX, Math.min(maxX, desiredX)) + "px";
  el.style.top = Math.max(minY, Math.min(maxY, desiredY)) + "px";
  el.style.right = "auto";
  el.style.bottom = "auto";
}

function syncFloatingViewportUi() {
  const box = visualViewportBox();
  const hamburger = document.getElementById("controls-hamburger-toggle-btn");
  if (hamburger && isMobileDevice()) {
    hamburger.style.left = "auto";
    hamburger.style.right = "calc(6px + env(safe-area-inset-right, 0px))";

    hamburger.style.bottom = "auto";

  const badge = document.getElementById("mobile-time-badge");
  if (badge && badge.classList.contains("has-time")) {
    badge.style.fontSize = "11px";
    badge.style.transform = "none";
    clampRectToVisualViewport(badge, {
      x: box.left + 10,
      y: box.top + 10,
      width: Math.min(220, box.width - 76),
      height: 26,
      margin: 8
    });
  }
  const feedback = document.getElementById("feedback-float");
  if (feedback) clampRectToVisualViewport(feedback, { margin: 8 });
}

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", syncFloatingViewportUi);
  window.visualViewport.addEventListener("scroll", syncFloatingViewportUi);
}

function updateControlsHamburgerVisibility() {

  if (!btn) return;

}

const controlsHamburgerToggleBtn = document.getElementById("controls-hamburger-toggle-btn");
if (controlsHamburgerToggleBtn) {
  controlsHamburgerToggleBtn.addEventListener("click", () => {
    if (!controlsPanel) return;
    controlsPanel.classList.toggle("open");
    updateControlsHamburgerVisibility();

}
updateControlsHamburgerVisibility();

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    lastViewportPortrait = isPortrait();
    syncViewportClasses();
    updateControlsHamburgerVisibility();
    if (!isMobileDevice() && controlsPanel) {

const hVmin = document.getElementById("hamburger-vmin");

function placeInRegion(p) {
  const [w, s, e, n] = BBOX.map(Number);
  return p.lon >= w && p.lon <= e && p.lat >= s && p.lat <= n;
}

function placeTrace(type) {
  const pts = PLACE_LABELS.filter(p => p.type === type && placeInRegion(p));
  const isPort = type === "port";
  const isSpot = type === "spot";
  const isCity = type === "city";
  return {
    type:"scatter",
    mode:"markers+text",
    x: pts.map(p => p.lon),
    y: pts.map(p => p.lat),
    text: pts.map(p => p.name),
    textposition: isSpot ? "top center" : isPort ? "bottom center" : "top center",
    textfont:{ size: isSpot ? 13 : isPort ? 13 : 13, color: isSpot ? "#ffb000" : isPort ? "#ffe066" : "#ffffff", font:{ weight: "bold" } },
    marker:{ size: isSpot ? 10 : isPort ? 8 : 7, color: isSpot ? "#ff6b35" : isPort ? "#ffb000" : "#7bdff2", symbol: isSpot ? "star" : isPort ? "diamond" : "circle", line:{color:"#000000", width: 2} },
    hovertemplate: `%{text}<extra></extra>`,
    showlegend:false,
    name: isSpot ? "Tournament Spots" : isPort ? "Fishing Ports" : "Major Cities"
  };
}

function injectPlaceLabels(fig) {
  if (!fig) return;
  fig.data = (fig.data || []).filter(t => t?.name !== "Major cities" && t?.name !== "Fishing ports");
  const cityTrace = placeTrace("city");

}

function removeNearestMarker(lon, lat, tolDeg = 0.05) {
  let bestI = -1, bestD = Infinity;
  for (let i = 0; i < markers.length; i++) {
    const dx = (markers[i].lon - lon);
    const dy = (markers[i].lat - lat);
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; bestI = i; }
  }
  if (bestI >= 0 && bestD <= tolDeg) markers.splice(bestI, 1);
}

// UPDATED: Haversine Formula for Nautical Miles (nm)
function getDistanceInNM(lat1, lon1, lat2, lon2) {
  const R = 3440.065; // Radius of earth in Nautical Miles
  const dLat = (lat2 - lat1) * (Math.PI / 180);
  const dLon = (lon2 - lon1) * (Math.PI / 180);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function updateMeasureTrace() {
  // Case 1: Start Mode (Only 1 point)
  if (measurePoints.length < 2) {
    measureTrace.x = measurePoints.map(p => p.lon);
    measureTrace.y = measurePoints.map(p => p.lat);
    measureTrace.text = [""];

    // Reset style for single dot
    measureTrace.marker.size = 8;
    measureTrace.marker.opacity = 1;
    return;
  }

  // Case 2: Measurement Mode
  const p1 = measurePoints[0];
  const p2 = measurePoints[1];

  const midLon = (p1.lon + p2.lon) / 2;
  const midLat = (p1.lat + p2.lat) / 2;

  const dist = getDistanceInNM(p1.lat, p1.lon, p2.lat, p2.lon);

  measureTrace.x = [p1.lon, midLon, p2.lon];
  measureTrace.y = [p1.lat, midLat, p2.lat];
  measureTrace.text = ["", `${dist.toFixed(2)} nm`, ""];

  // --- DYNAMIC ORIENTATION ---
  // Check if the line is more "Vertical" (dLat > dLon) or "Horizontal"
  const dLon = Math.abs(p1.lon - p2.lon);
  const dLat = Math.abs(p1.lat - p2.lat);
  const isVertical = dLat > dLon;

  // If Vertical: Push text to the Side (Middle Right)
  // If Horizontal: Push text Up (Top Center)
  measureTrace.textposition = isVertical ? "middle right" : "top center";

  // --- PADDING TRICK ---
  // We make the middle marker LARGE (30px) so the text is pushed away from the center.
  // We make it INVISIBLE (opacity 0) so you don't actually see a giant dot.
  measureTrace.marker.size = [8, 30, 8];
  measureTrace.marker.opacity = [1, 0, 1];
}

/* ========================= TOUCH GESTURES: PINCH + PAN ========================= */
// Pinch state
let _pinch = {
  active: false,
  mode: null,         // "pinch" | "pan"
  startDist: null,    // px distance between two touches at gesture start
  startX: null,       // midpoint x at gesture start
  startY: null,       // midpoint y at gesture start
  startXRange: null,   // [l,r] at gesture start
  startYRange: null,
};

function _touchDist(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.hypot(dx, dy);
}
function _touchMid(e) {
  return [(e.touches[0].clientX + e.touches[1].clientX) / 2,
          (e.touches[0].clientY + e.touches[1].clientY) / 2];
}
function getCurrentPlotRanges() {
  const xa = plotDiv?._fullLayout?.xaxis;
  const ya = plotDiv?._fullLayout?.yaxis;
  const xr = xa?.range;
  const yr = ya?.range;
  if (Array.isArray(xr) && Array.isArray(yr) && xr.length >= 2 && yr.length >= 2) {
    return { x: [Number(xr[0]), Number(xr[1])], y: [Number(yr[0]), Number(yr[1])] };
  }
  if (Array.isArray(BBOX) && BBOX.length >= 4) {
    return { x: [BBOX[0], BBOX[2]], y: [BBOX[1], BBOX[3]] };
  }
  return null;
}

function installTouchGestureHandler() {
  if (!IS_TOUCH) return;
  if (plotDiv.__touchGestureInstalled) return;
  plotDiv.__touchGestureInstalled = true;

  // Keep browser page gestures from swallowing map pinch/pan gestures.
  plotDiv.style.touchAction = "none";

  plotDiv.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      _pinch.active = true;
      _pinch.mode = null;
      _pinch.startDist = _touchDist(e);
      const [mx, my] = _touchMid(e);
      _pinch.startX = mx;
      _pinch.startY = my;
      const lr = plotDiv.getBoundingClientRect();
      _pinch.startFrac = [(mx - lr.left) / lr.width, (my - lr.top) / lr.height];
      const ranges = getCurrentPlotRanges();
      _pinch.startXRange = ranges?.x || null;
      _pinch.startYRange = ranges?.y || null;
    }
  }, { passive: false });

  plotDiv.addEventListener("touchmove", (e) => {
    if (!_pinch.active || e.touches.length !== 2) return;
    e.preventDefault();

    const dist = _touchDist(e);
    const [mx, my] = _touchMid(e);
    const dx = mx - _pinch.startX;
    const dy = my - _pinch.startY;
    if (!_pinch.startXRange || !_pinch.startYRange || !_pinch.startDist) return;
    const ratio = Math.max(0.2, Math.min(8, dist / _pinch.startDist));
    const [fx, fy] = _pinch.startFrac;
    const [x0, x1] = _pinch.startXRange;
    const [y0, y1] = _pinch.startYRange;
    const xSpan = x1 - x0;
    const ySpan = y1 - y0;
    const lr = plotDiv.getBoundingClientRect();
    if (xSpan <= 0 || ySpan <= 0 || lr.width <= 0 || lr.height <= 0) return;

    const newXSpan = xSpan / ratio;
    const newYSpan = ySpan / ratio;
    const anchorX = x0 + xSpan * fx;
    const anchorY = y1 - ySpan * fy;
    const panX = (dx / lr.width) * newXSpan;
    const panY = (dy / lr.height) * newYSpan;
    const nx0 = anchorX - newXSpan * fx - panX;
    const nx1 = nx0 + newXSpan;
    const ny0 = anchorY - newYSpan * (1 - fy) + panY;
    const ny1 = ny0 + newYSpan;
    Plotly.relayout(plotDiv, {
      "xaxis.range[0]": nx0,
      "xaxis.range[1]": nx1,
      "yaxis.range[0]": ny0,
      "yaxis.range[1]": ny1,
      "xaxis.autorange": false,
      "yaxis.autorange": false
    });
  }, { passive: false });

  plotDiv.addEventListener("touchend", (e) => {
    _pinch.active = false;
    _pinch.mode = null;
  }, { passive: false });
}

// Keep old name as alias for callers that don't check return value
let _wheelInstalled = false;
let _lastWheelTime = 0;

function smoothWheelZoom(event) {
  event.preventDefault();
  const now = Date.now();
  // Debounce: only respond once per 16ms (60fps)
  if (now - _lastWheelTime < 16) return;
  _lastWheelTime = now;

  const delta = event.deltaY;
  if (!delta || !isFinite(delta)) return;
  const ratio = delta > 0 ? 1.10 : 0.91; // zoom out / zoom in

  const xaxis = plotDiv._fullLayout?.xaxis;
  const yaxis = plotDiv._fullLayout?.yaxis;
  if (!xaxis || !yaxis) return;

  const xRange = xaxis.range;
  const yRange = yaxis.range;
  if (!xRange || !yRange) return;

  const [x0, x1] = xRange;
  const [y0, y1] = yRange;
  if (x1 <= x0 || y1 <= y0) return;

  const xSpan = x1 - x0;
  const ySpan = y1 - y0;

  // Zoom toward mouse position
  const rect = plotDiv.getBoundingClientRect();
  const mouseX = (event.clientX - rect.left) / rect.width;
  const mouseY = (event.clientY - rect.top) / rect.height;
  const anchorX = x0 + xSpan * mouseX;
  const anchorY = y1 - ySpan * (1 - mouseY);

  const newXSpan = xSpan * ratio;
  const newYSpan = ySpan * ratio;
  const nx0 = anchorX - newXSpan * mouseX;
  const nx1 = nx0 + newXSpan;
  const ny1 = anchorY + newYSpan * (1 - mouseY);
  const ny0 = ny1 - newYSpan;

  Plotly.relayout(plotDiv, {
    "xaxis.range[0]": nx0,
    "xaxis.range[1]": nx1,
    "yaxis.range[0]": ny0,
    "yaxis.range[1]": ny1,
    "xaxis.autorange": false,
    "yaxis.autorange": false
  });
}

function installTouchPolicyOnce() {
  installTouchGestureHandler();

  // Smooth wheel zoom on desktop/trackpad
  if (_wheelInstalled) return;
  _wheelInstalled = true;
  plotDiv.addEventListener("wheel", smoothWheelZoom, { passive: false });
}

/* ========================= TIME PARSERS ========================= */
function parseChlUtcFromName(filename) {
  const m = filename.match(/_(\d{4})(\d{3})\.(\d{4})_/);
  if (!m) return null;
  const year = Number(m[1]);
  const jjj  = Number(m[2]);
  const hhmm = m[3];
  const hh = Number(hhmm.slice(0,2));
  const mm = Number(hhmm.slice(2,4));
  const d0 = new Date(Date.UTC(year,0,1,0,0,0));
  return new Date(d0.getTime() + (jjj-1)*86400e3 + hh*3600e3 + mm*60e3);
}
function parseSstUtcFromName(filename) {
  // Composite: sstcomp_region_yyyyjjj_yyyymmdd_hh_g19_cXX_cXXX.json
  let m = filename.match(/sstcomp_.*?_(\d{4})(\d{3})_(\d{8})_(\d{2})_/);
  if (m) {
    const year = Number(m[1]);
    const jjj  = Number(m[2]);
    const hh   = Number(m[4]);
    const d0 = new Date(Date.UTC(year,0,1,0,0,0));
    return new Date(d0.getTime() + (jjj-1)*86400e3 + hh*3600e3);
  }
  // Scan: sst_region_yyyyjjj_yyyymmdd_hh_g19.json
  // Region names can contain underscores, e.g. sst_usec_south_2026127_20260507_23_g19.json
  m = filename.match(/^sst_.*?_(\d{4})(\d{3})_(\d{8})_(\d{2})_/);
  if (m) {
    const year = Number(m[1]);
    const jjj  = Number(m[2]);
    const yyyymmdd = m[3];
    const hh   = m[4];
    // Parse yyyymmdd -> UTC
    const y = Number(yyyymmdd.slice(0,4));
    const mo = Number(yyyymmdd.slice(4,6)) - 1;
    const d = Number(yyyymmdd.slice(6,8));
    return new Date(Date.UTC(y, mo, d, Number(hh), 0, 0));
  }
  return null;
}
function parseFrontUtcFromName(filename) {
  if (filename.startsWith("chlfront_")) return parseChlUtcFromName(filename);
  if (filename.startsWith("sstfront_")) {
    const m = filename.match(/^sstfront_.*?_(\d{4})(\d{3})_(\d{8})_(\d{2})_/);
    if (!m) return null;
    const y = Number(m[3].slice(0,4));
    const mo = Number(m[3].slice(4,6)) - 1;
    const d = Number(m[3].slice(6,8));
    return new Date(Date.UTC(y, mo, d, Number(m[4]), 0, 0));
  }
  return null;
}
function parseUvDateFromName(filename) {
  const m = filename.match(/_(\d{8})_/);
  if (!m) return null;
  const y = Number(m[1].slice(0,4));
  const mo = Number(m[1].slice(4,6)) - 1;
  const d = Number(m[1].slice(6,8));
  return new Date(Date.UTC(y,mo,d));
}

function fmtLocalDateTime(dt) {
  return dt.toLocaleString(undefined, {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit",
    hour12:false
  });
}
function fmtLocalDate(dt) {
  return dt.toLocaleDateString(undefined, { year:"numeric", month:"2-digit", day:"2-digit" });
}

function framePathOf(f){ return String(f?.json_path || f?.path || f?.file || f?.url || f?.json || ""); }
function frameFilenameOf(f){ const p = framePathOf(f); return p.split("/").pop() || p; }

function timeOnlyLabel(varKey, frameMeta) {
  if (varKey === "bathy") return ""; /* EMPTY for bathy */
  if (frameMeta?.time_iso) {
    const dt = new Date(frameMeta.time_iso);
    if (!isNaN(dt.getTime())) return fmtLocalDateTime(dt);
  }
  if (frameMeta?.label) return String(frameMeta.label);
  const path = framePathOf(frameMeta);
  const filename = String(path).split("/").pop() || "";
  if (varKey === "chl") { const dt = parseChlUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "sst") { const dt = parseSstUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "chl_front" || varKey === "sst_front") { const dt = parseFrontUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "uv")  { const dt = parseUvDateFromName(filename);  return dt ? fmtLocalDate(dt) : ""; }
  return "";
}

function installMobileTimeBadgeSwipeOnce() {
  const badge = document.getElementById("mobile-time-badge");
  if (!badge || badge.__swipeInstalled) return;
  badge.__swipeInstalled = true;
  let start = null;

  badge.addEventListener("pointerdown", (e) => {
    if (!isMobileDevice()) return;
    start = { x: e.clientX, y: e.clientY, pointerId: e.pointerId, handled: false };
    badge.setPointerCapture?.(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  });

  badge.addEventListener("pointermove", (e) => {
    if (!start || start.pointerId !== e.pointerId || start.handled) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    if (Math.abs(dx) < 34 || Math.abs(dx) < Math.abs(dy) * 1.25) return;
    start.handled = true;
    setPlaying(false);
    stepFrame(dx < 0 ? +1 : -1);
    e.preventDefault();
    e.stopPropagation();
  });

  function finish(e) {
    if (start && start.pointerId === e.pointerId) {
      e.preventDefault();
      e.stopPropagation();
    }
    start = null;
  }
  badge.addEventListener("pointerup", finish);
  badge.addEventListener("pointercancel", finish);
}
installMobileTimeBadgeSwipeOnce();

function epochMsForFrame(varKey, frameMeta) {
  if (varKey === "bathy") return Date.UTC(2025,11,8);
  const filename = frameFilenameOf(frameMeta);
  let dt = null;
  if (varKey === "chl") dt = parseChlUtcFromName(filename);
  if (varKey === "sst") dt = parseSstUtcFromName(filename);
  if (varKey === "chl_front" || varKey === "sst_front") dt = parseFrontUtcFromName(filename);
  if (varKey === "uv")  dt = parseUvDateFromName(filename);
  return dt ? dt.getTime() : null;
}

/* ========================= HELPERS ========================= */
function is2D(a){ return Array.isArray(a) && a.length>0 && Array.isArray(a[0]) && a[0].length>0; }

function filterFramesForVar(varKey, frames) {
  const out = [];
  for (const f of (frames || [])) {
    const fn = frameFilenameOf(f).toLowerCase();
    if (!fn.endsWith(".json")) continue;
    if (fn.includes("grid")) continue;
    if (varKey === "chl" && !fn.includes("_chl_")) continue;
    if (varKey === "sst" && !fn.startsWith("sst")) continue;
    if (varKey === "chl_front" && !fn.startsWith("chlfront_")) continue;
    if (varKey === "sst_front" && !fn.startsWith("sstfront_")) continue;
    if (varKey === "uv"  && !fn.startsWith("uv_")) continue;
    out.push(f);
  }
  return out;
}

function closestIndex(times, targetMs) {
  if (!times.length || targetMs === null) return 0;
  let best = 0, bestDist = Infinity;
  for (let i=0;i<times.length;i++){
    const t = times[i];
    if (t === null) continue;
    const d = Math.abs(t - targetMs);
    if (d < bestDist){ bestDist = d; best = i; }
  }
  return best;
}

function isDaytimeFrame(varKey, frameMeta) {
  if (varKey === "bathy" || varKey === "uv") return true;
  const t = epochMsForFrame(varKey, frameMeta);
  if (t === null) return true;
  const hr = new Date(t).getUTCHours();
  // USEC daylight window in UTC, inclusive. CHL is daylight by source, but
  // keeping this generic prevents product switches from landing on overnight SST.
  return hr >= 10 && hr <= 22;
}

function closestDaytimeIndex(varKey, times, frames, targetMs) {
  if (!times.length || targetMs === null) return 0;
  let best = -1, bestDist = Infinity;
  for (let i=0;i<times.length;i++){
    const t = times[i];
    if (t === null) continue;
    // Skip daylight filter - all frames are valid candidates when anchoring a timestamp.
    // A 4/24 CHL frame maps to the nearest available SST/UV/CHL frame regardless of hour.
    const d = Math.abs(t - targetMs);
    if (d < bestDist){ bestDist = d; best = i; }
  }
  return best >= 0 ? best : 0;
}

function stableLayout() {
  const portrait = isPortrait();
  const layout = {
    uirevision: "sync_fov_mobile_v4",
    margin: { l: 0, r: 0, t: 0, b: 0 },
    paper_bgcolor: "#050b10",
    plot_bgcolor: "#ffffff",

    xaxis: { automargin:true, tickpadding: 0, showticklabels: !portrait, ticks: portrait ? "" : "outside", tickfont: { size: portrait ? 0 : 11 } },
    yaxis: { automargin:true, tickpadding: 0, scaleanchor:"x", scaleratio: 1, showticklabels: !portrait, ticks: portrait ? "" : "outside", tickfont: { size: portrait ? 0 : 11 } },
    hovermode: "closest",
    dragmode: "pan",
    hoverlabel: { showhoverinfo: false }
  };

  if (viewState.hasRange && viewState.xRange && viewState.yRange) {
    // Keep the user's current field-of-view (pan/zoom) during animation
    layout.xaxis.range = [viewState.xRange[0], viewState.xRange[1]];
    layout.yaxis.range = [viewState.yRange[0], viewState.yRange[1]];
    layout.xaxis.autorange = false;
    layout.yaxis.autorange = false;
  } else {

    layout.yaxis.autorange = true;
  }
  return layout;
}

/* ========================= FIGURES ========================= */
/* ================= BUILD CHL (Matches SST Layout + Custom Colors) ================= */
function buildChl(grid, data) {
  // 1. DATA FINDER
  const rawZ = data.z || data.chl || data.data;
  if (!rawZ) return { data: [], layout: {} };

  // 2. GET AXES
  let plotX = grid.xAxis;
  let plotY = grid.yAxis;

  // 3. Preserve producer row order.
  // CHL JSON is written south-up: row 0 maps to latMin, last row maps to latMax.
  // Reversing only the axis (without flipping z/customdata) mirrors the map north/south.

  // 4. LOG-SCALE COLORS
  // We map the data to Log10 so it matches the footer's Log scale.
  const logZ = rawZ.map(row => {
    if (!Array.isArray(row)) return row;
    return row.map(v => (v > 0 ? Math.log10(v) : null));
  });

  // Convert User Sliders (Linear) to Log Limits
  const linearMin = userRanges.chl.vmin;
  const linearMax = userRanges.chl.vmax;
  const cminLog = Math.log10(linearMin > 0 ? linearMin : 0.01);
  const cmaxLog = Math.log10(linearMax > 0 ? linearMax : 100);

  // 5. DEFINE TRACE
  const trace = {
    type: "heatmap",
    x: plotX,
    y: plotY,
    z: logZ,            // Log values (Controls Color)
    customdata: rawZ,   // Linear values (Controls Hover Text)

    colorscale: CHL_ALGAE, // <--- EXPLICITLY USE CUSTOM SCALE
    zmin: cminLog,
    zmax: cmaxLog,
    showscale: false,   // Internal bar hidden (Footer used instead)

    hoverinfo: "none",
  };

  // 6. USE STABLE LAYOUT (Critical for consistent margins)
  const layout = stableLayout();

  return { data: [trace], layout };
}

function buildSst(gridInfo, dataObj) {
  const { xAxis, yAxis } = gridInfo;
  const sst = dataObj.sst || dataObj.z || dataObj.data;
  if (!is2D(sst)) throw new Error("SST JSON missing 2-D key: sst/z/data");

  const vmin = userRanges.sst.vmin;
  const vmax = userRanges.sst.vmax;

  return {
    data: [{
      type:"heatmap",
      x:xAxis, y:yAxis,
      z: sst,
      customdata: sst,
      hoverinfo:"none",
      showscale:false,
      zauto:false, zmin:vmin, zmax:vmax,

      /* CHANGED: Use RdBu with reverseScale:true for standard cold(blue) -> warm(red) */
      colorscale: "RdBu",
      reversescale: false,

      colorbar: colorbarFor("sst"),
      zsmooth:false
    }],
    layout: stableLayout()
  };
}

function buildUv(gridInfo, dataObj) {
  const { xAxis, yAxis, nx, ny } = gridInfo;
  const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
  const grid = dataObj?.meta?.grid || dataObj?.layout?.meta?.grid || {};

  const u = d?.u || grid.u;
  const v = d?.v || grid.v;
  const adt = d?.adt || grid.adt || d?.z;

  if (!is2D(u) || !is2D(v) || !is2D(adt)) {
    throw new Error("UV JSON missing 2-D keys: u, v, adt/z");
  }

  // Use the UV range, which is now configured for ADT (Sea Surface Height)
  const vmin = userRanges.uv.vmin;
  const vmax = userRanges.uv.vmax;

  const bg = {
    type:"heatmap",
    x:xAxis, y:yAxis,
    z:adt,
    customdata:adt,
    hoverinfo:"none",
    showscale:false,
    zauto:false, zmin:vmin, zmax:vmax,
    colorscale: UV_SCALE,
    // Colorbar uses the 'uv' key which now has the unit 'm'
    colorbar: colorbarFor("uv"),
    zsmooth:false
  };

  // UV values are m/s, while the plot axes are lon/lat degrees. Render the
  // direction in grid-cell units so arrows remain legible without covering ADT.
  const lineX = [];
  const lineY = [];

  let dxg = 0.01, dyg = 0.01;
  if (nx > 1) dxg = Math.abs(xAxis[1] - xAxis[0]);
  if (ny > 1) dyg = Math.abs(yAxis[1] - yAxis[0]);
  const cell = Math.min(dxg, dyg);
  const headAngle = (24 * Math.PI) / 180;

  const step = Math.max(3, Math.floor(Math.sqrt(nx * ny) / 18));
  const maxSpeed = 1.2;
  const minSpeed = 0.035;
  const minLen = 0.75 * cell;
  const maxLen = 2.25 * cell;

  for (let j=0;j<ny;j+=step){
    const lat0 = yAxis[j];
    for (let i=0;i<nx;i+=step){
      const lon0 = xAxis[i];
      const uu = u[j][i], vv = v[j][i];
      const sp = Math.hypot(uu, vv);

      if (!isFinite(uu) || !isFinite(vv) || !isFinite(sp)) continue;
      if (sp < minSpeed) continue;

      const scaled = Math.min(sp, maxSpeed) / maxSpeed;
      const len = minLen + (maxLen - minLen) * scaled;
      const lon1 = lon0 + (uu / sp) * len;
      const lat1 = lat0 + (vv / sp) * len;

      const dx = lon1 - lon0, dy = lat1 - lat0;
      const L = Math.hypot(dx,dy);
      if (!(L > 0)) continue;

      // shaft
      lineX.push(lon0, lon1, null);
      lineY.push(lat0, lat1, null);

      // open V head
      const theta = Math.atan2(dy, dx);
      const hl = Math.min(0.44 * L, 0.58 * cell);

      const xL = lon1 + hl * Math.cos(theta + Math.PI - headAngle);
      const yL = lat1 + hl * Math.sin(theta + Math.PI - headAngle);
      const xR = lon1 + hl * Math.cos(theta + Math.PI + headAngle);
      const yR = lat1 + hl * Math.sin(theta + Math.PI + headAngle);

      lineX.push(lon1, xL, null, lon1, xR, null);
      lineY.push(lat1, yL, null, lat1, yR, null);
    }
  }

  const arrows = {
    type:"scatter",
    mode:"lines",
    x:lineX, y:lineY,
    hoverinfo:"none",
    line:{ color:"rgba(255,255,255,0.88)", width:1.45 },
    showlegend:false
  };

  return { data:[bg, arrows], layout: stableLayout() };
}

function buildFrontLines(gridInfo, dataObj, varKey) {
  const features = Array.isArray(dataObj.features) ? dataObj.features : [];
  const lineX = [];
  const lineY = [];
  const text = [];
  const custom = [];
  for (const feature of features) {
    const coords = feature?.geometry?.coordinates || [];
    const props = feature?.properties || {};
    if (!Array.isArray(coords) || coords.length < 2) continue;
    let prev = null;
    for (const pt of coords) {
      if (!Array.isArray(pt) || pt.length < 2) continue;
      const lon = Number(pt[0]);
      const lat = Number(pt[1]);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
      if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > 0.08) {
        lineX.push(null);
        lineY.push(null);
        text.push(null);
        custom.push(null);
      }
      lineX.push(lon);
      lineY.push(lat);
      text.push(String(props.strength_median ?? "") + " " + (props.strength_unit || "") + "<br>" + String(props.length_km ?? "") + " km");
      custom.push(props);
      prev = [lon, lat];
    }
    lineX.push(null);
    lineY.push(null);
    text.push(null);
    custom.push(null);
  }
  const color = "rgba(0, 0, 0, 0.96)";
  const label = varKey === "chl_front" ? "CHL front" : "SST front";
  const trace = {
    type: "scatter",
    mode: "lines",
    x: lineX,
    y: lineY,
    text,
    customdata: custom,
    hovertemplate: "<b>" + label + "</b><br>%{text}<extra></extra>",
    line: { color, width: 2.2 },
    connectgaps: false,
    showlegend: false
  };
  const layout = stableLayout();
  return { data: [trace], layout };
}

function formatRelativeFrontTime(diffMs) {
  if (!Number.isFinite(diffMs)) return "";
  const absHours = Math.abs(diffMs) / 36e5;
  if (absHours < 0.5) return "same time";
  const suffix = diffMs < 0 ? "ago" : "later";
  if (absHours < 48) return `${Math.round(absHours)}h ${suffix}`;
  return `${Math.round(absHours / 24)}d ${suffix}`;
}

function frontLabelTrace(frontData, label) {
  if (!label) return null;
  const features = (Array.isArray(frontData?.features) ? frontData.features : [])
    .filter(f => Array.isArray(f?.geometry?.coordinates) && f.geometry.coordinates.length >= 2)
    .sort((a, b) => (Number(b?.properties?.length_km) || b.geometry.coordinates.length) - (Number(a?.properties?.length_km) || a.geometry.coordinates.length));
  const feature = features[0];
  if (!feature) return null;
  const coords = feature.geometry.coordinates;
  const pt = coords[Math.floor(coords.length / 2)];
  if (!Array.isArray(pt) || pt.length < 2) return null;
  return {
    type: "scatter",
    mode: "text",
    x: [Number(pt[0])],
    y: [Number(pt[1])],
    text: [label],
    textfont: { color: "#050b10", size: 13, family: "system-ui,-apple-system,Segoe UI,sans-serif" },
    textposition: "middle center",
    hoverinfo: "skip",
    showlegend: false
  };
}

async function loadBathymetryJson(url) {
  if (gridCache.__bathy_json) return gridCache.__bathy_json;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to load bathy JSON: ${url}`);

  // Validate structure
  if (!data.xAxis || !data.yAxis || !data.depth) {
    throw new Error("Bathy JSON missing keys: xAxis, yAxis, or depth");

  // Create customdata for readout (clone depth)

  const out = {
    xAxis: data.xAxis,
    yAxis: data.yAxis,
    depth: data.depth,
    customdata: data.depth
  };

  gridCache.__bathy_json = out;
  return out;
}

function buildForVar(varKey, gridInfo, dataObj) {
  if (varKey === "chl") return buildChl(gridInfo, dataObj);
  if (varKey === "sst") return buildSst(gridInfo, dataObj);
  if (varKey === "chl_front" || varKey === "sst_front") return buildFrontLines(gridInfo, dataObj, varKey);
  if (varKey === "uv")  return buildUv(gridInfo, dataObj);
  throw new Error(`Unsupported varKey=${varKey}`);
}

/* ========================= MOBILE MAP RENDERER ========================= */
function hexToRgb(hex) {
  const h = String(hex || "").replace("#", "").trim();
  if (h.length === 3) {
    return [
      parseInt(h[0] + h[0], 16),
      parseInt(h[1] + h[1], 16),
      parseInt(h[2] + h[2], 16)
    ];
  }
  return [
    parseInt(h.slice(0, 2), 16),
    parseInt(h.slice(2, 4), 16),
    parseInt(h.slice(4, 6), 16)
  ];
}

function rgbToCss(rgb) {
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function interpolateScale(scale, t) {
  const x = Math.max(0, Math.min(1, Number(t)));
  for (let i = 1; i < scale.length; i++) {
    const [p1, c1] = scale[i];
    if (x <= p1) {
      const [p0, c0] = scale[i - 1];
      const local = p1 === p0 ? 0 : (x - p0) / (p1 - p0);
      const a = hexToRgb(c0);
      const b = hexToRgb(c1);
      return [
        Math.round(a[0] + (b[0] - a[0]) * local),
        Math.round(a[1] + (b[1] - a[1]) * local),
        Math.round(a[2] + (b[2] - a[2]) * local)
      ];
    }
  }
  return hexToRgb(scale[scale.length - 1][1]);
}

function mobileValueConfig(varKey) {
  if (varKey === "chl") {
    const lo = Math.log10(Math.max(0.001, userRanges.chl.vmin));
    const hi = Math.log10(Math.max(0.001, userRanges.chl.vmax));
    return { scale: CHL_ALGAE, lo, hi, transform: v => Math.log10(Math.max(0.001, v)) };
  }
  if (varKey === "sst") return { scale: SST_SCALE, lo: userRanges.sst.vmin, hi: userRanges.sst.vmax, transform: v => v };
  if (varKey === "uv") return { scale: UV_SCALE, lo: userRanges.uv.vmin, hi: userRanges.uv.vmax, transform: v => v };
  return { scale: BATHY_SCALE, lo: userRanges.bathy.vmin, hi: userRanges.bathy.vmax, transform: v => v };
}

function mobileZForVar(varKey, dataObj) {
  if (varKey === "chl") return dataObj.z || dataObj.chl || dataObj.data;
  if (varKey === "sst") return dataObj.sst || dataObj.z || dataObj.data;
  if (varKey === "uv") {
    const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
    return d?.adt || dataObj?.meta?.grid?.adt || d?.z;
  }
  if (varKey === "bathy") return dataObj.depth;
  return null;
}

function isMobileMissingValue(varKey, rawValue, numericValue) {
  if (rawValue === null || rawValue === undefined || rawValue === "") return true;
  if (!Number.isFinite(numericValue)) return true;
  if (Math.abs(numericValue) >= 1e20) return true;
  if ((varKey === "chl" || varKey === "sst") && numericValue <= 0) return true;
  return false;
}

function clearMobileUvArrowLayer(map) {
  if (!map || !mobileMapState.arrowLayer) return;
  map.removeLayer(mobileMapState.arrowLayer);
  mobileMapState.arrowLayer = null;
}

function frameExtentFromGrid(gridInfo) {
  const xs = gridInfo.xAxis || [];
  const ys = gridInfo.yAxis || [];
  const x0 = Math.min(xs[0], xs[xs.length - 1]);
  const x1 = Math.max(xs[0], xs[xs.length - 1]);
  const y0 = Math.min(ys[0], ys[ys.length - 1]);
  const y1 = Math.max(ys[0], ys[ys.length - 1]);
  return [x0, y0, x1, y1];
}

function drawMobileUvArrows(ctx, dataObj, z, xAxis, yAxis, xAscending, yAscending, yFlip) {
  const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
  const u = d?.u || dataObj?.meta?.grid?.u;
  const v = d?.v || dataObj?.meta?.grid?.v;
  if (!is2D(u) || !is2D(v)) return;
  const ny = z.length;
  const nx = z[0].length;
  const step = Math.max(3, Math.floor(Math.sqrt(nx * ny) / 18));
  const sx = ctx.canvas.width / Math.max(1, nx - 1);
  const sy = ctx.canvas.height / Math.max(1, ny - 1);

  // Arrow drawing parameters
  const SCALE = 10;
  const ARROW_COLOR = [255, 255, 255, 242]; // white, slightly less opaque than 255 to avoid full overwrite
  const ARROW_LINE_WIDTH = 2.0; // thinner line to reduce edge bleed
  const HEAD_SIZE = 2.5;

  // Get ImageData directly so we can draw pixels without anti-aliasing edge bleed
  // putImageData + stroke has anti-aliasing bleed that overwrites nearby heatmap pixels
  const imgData = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
  const imgW = ctx.canvas.width;

  for (let row = 0; row < ny; row += step) {
    const srcJ = yFlip ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col += step) {
      const srcI = xAscending ? col : (nx - 1 - col);
      const uu = u[srcJ]?.[srcI];
      const vv = v[srcJ]?.[srcI];
      if (!isFinite(uu) || !isFinite(vv)) continue;
      const x = col * sx;
      const y = row * sy;
      const dx = uu * sx * SCALE;
      const dy = -vv * sy * SCALE;
      const len = Math.hypot(dx, dy);
      if (!(len > 0.5)) continue;
      const ex = x + dx;
      const ey = y + dy;

      // Draw anti-aliased line using Bresenham-style pixel drawing
      drawLinePixels(imgData, x, y, ex, ey, ARROW_COLOR, imgW, ARROW_LINE_WIDTH);

      // Draw arrowhead
      const a = Math.atan2(dy, dx);
      const ax1 = ex - HEAD_SIZE * Math.cos(a - Math.PI / 6);
      const ay1 = ey - HEAD_SIZE * Math.sin(a - Math.PI / 6);
      const ax2 = ex - HEAD_SIZE * Math.cos(a + Math.PI / 6);
      const ay2 = ey - HEAD_SIZE * Math.sin(a + Math.PI / 6);
      drawLinePixels(imgData, ex, ey, ax1, ay1, ARROW_COLOR, imgW, ARROW_LINE_WIDTH);
      drawLinePixels(imgData, ex, ey, ax2, ay2, ARROW_COLOR, imgW, ARROW_LINE_WIDTH);
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

function buildMobileUvArrowLayer(dataObj, gridInfo) {
  const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
  const u = d?.u || dataObj?.meta?.grid?.u;
  const v = d?.v || dataObj?.meta?.grid?.v;
  const xAxis = gridInfo?.xAxis || [];
  const yAxis = gridInfo?.yAxis || [];
  if (!is2D(u) || !is2D(v) || xAxis.length < 2 || yAxis.length < 2) return null;

  const ny = Math.min(u.length, v.length, yAxis.length);
  const nx = Math.min(u[0]?.length || 0, v[0]?.length || 0, xAxis.length);
  if (nx < 2 || ny < 2) return null;

  const dxg = Math.abs(xAxis[1] - xAxis[0]);
  const dyg = Math.abs(yAxis[1] - yAxis[0]);
  const cell = Math.min(dxg, dyg);
  const step = Math.max(4, Math.floor(Math.sqrt(nx * ny) / 18));
  const maxSpeed = 1.2;
  const minSpeed = 0.035;
  const minLen = 0.95 * cell;
  const maxLen = 2.80 * cell;
  const headAngle = Math.PI / 6;
  const features = [];

  for (let j = 0; j < ny; j += step) {
    const lat0 = yAxis[j];
    for (let i = 0; i < nx; i += step) {
      const lon0 = xAxis[i];
      const uu = u[j]?.[i];
      const vv = v[j]?.[i];
      const sp = Math.hypot(uu, vv);
      if (!isFinite(uu) || !isFinite(vv) || !isFinite(sp) || sp < minSpeed) continue;

      const scaled = Math.min(sp, maxSpeed) / maxSpeed;
      const len = minLen + (maxLen - minLen) * scaled;
      const lon1 = lon0 + (uu / sp) * len;
      const lat1 = lat0 + (vv / sp) * len;
      const theta = Math.atan2(lat1 - lat0, lon1 - lon0);
      const headLen = Math.min(0.46 * len, 0.74 * cell);
      const left = [
        lon1 + headLen * Math.cos(theta + Math.PI - headAngle),
        lat1 + headLen * Math.sin(theta + Math.PI - headAngle)
      ];
      const right = [
        lon1 + headLen * Math.cos(theta + Math.PI + headAngle),
        lat1 + headLen * Math.sin(theta + Math.PI + headAngle)
      ];
      features.push(new ol.Feature({
        geometry: new ol.geom.MultiLineString([
          [[lon0, lat0], [lon1, lat1]],
          [[lon1, lat1], left],
          [[lon1, lat1], right]
        ])
      }));
    }
  }

  const source = new ol.source.Vector({ features });
  return new ol.layer.Vector({
    source,
    zIndex: 25,
    updateWhileAnimating: true,
    updateWhileInteracting: true,
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({
        color: "rgba(255,255,255,0.86)",
        width: 1.45,
        lineCap: "round",
        lineJoin: "round"
      })
    })
  });
}

// Draw a line using direct pixel manipulation (Bresenham-inspired)
// to avoid canvas stroke anti-aliasing edge bleed that corrupts nearby heatmap pixels
function drawLinePixels(imgData, x0, y0, x1, y1, color, imgWidth, lineWidth) {
  const dx = Math.abs(x1 - x0);
  const dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1;
  const sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  let x = Math.round(x0);
  let y = Math.round(y0);
  const x1r = Math.round(x1);
  const y1r = Math.round(y1);

  // Helper to set pixel with alpha blending to preserve heatmap underneath
  const setPixel = (px, py, alpha) => {
    const pyClamped = Math.max(0, Math.min(imgData.height - 1, py));
    const pxClamped = Math.max(0, Math.min(imgWidth - 1, px));
    const idx = (pyClamped * imgWidth + pxClamped) * 4;
    // Blend arrow color with existing pixel using alpha
    const existingAlpha = imgData.data[idx + 3];
    if (existingAlpha === 0) return; // transparent pixel (land mask), skip
    // Simple over: result = arrow * alpha + background * (1 - alpha)
    // Only overwrite if existing pixel is opaque enough
    if (existingAlpha < 128) {
      // Copy arrow color directly for land/ocean boundary pixels
      imgData.data[idx] = color[0];
      imgData.data[idx + 1] = color[1];
      imgData.data[idx + 2] = color[2];
      imgData.data[idx + 3] = color[3];
    } else {
      // Blend for heatmap pixels
      imgData.data[idx] = Math.round(color[0] * alpha + imgData.data[idx] * (1 - alpha));
      imgData.data[idx + 1] = Math.round(color[1] * alpha + imgData.data[idx + 1] * (1 - alpha));
      imgData.data[idx + 2] = Math.round(color[2] * alpha + imgData.data[idx + 2] * (1 - alpha));
      imgData.data[idx + 3] = Math.min(255, existingAlpha + color[3] * alpha * 0.5);
    }
  };

  while (true) {
    // Draw block around the point for the given line width
    const halfWid = Math.floor(lineWidth / 2);
    for (let dy2 = -halfWid; dy2 <= halfWid; dy2++) {
      for (let dx2 = -halfWid; dx2 <= halfWid; dx2++) {
        // Use distance from center to determine alpha falloff
        const dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        if (dist <= lineWidth / 2 + 0.5) {
          const alpha = dist <= lineWidth / 2 - 0.5 ? 1.0 : Math.max(0, 1 - (dist - (lineWidth / 2 - 0.5)));
          setPixel(x + dx2, y + dy2, alpha);
        }
      }
    }

    if (x === x1r && y === y1r) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}

function makeMobileLandCanvas(bathy) {
  const z = bathy.depth;
  if (!is2D(z)) return null;
  const ny = z.length;
  const nx = z[0].length;
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d", { willReadFrequently: false });
  const img = ctx.createImageData(nx, ny);
  const xAxis = bathy.xAxis || [];
  const yAxis = bathy.yAxis || [];
  const xAscending = xAxis.length < 2 || xAxis[0] <= xAxis[xAxis.length - 1];
  const yAscending = yAxis.length < 2 || yAxis[0] <= yAxis[yAxis.length - 1];
  for (let row = 0; row < ny; row++) {
    const srcJ = yAscending ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col++) {
      const srcI = xAscending ? col : (nx - 1 - col);
      const value = z[srcJ]?.[srcI];
      const k = (row * nx + col) * 4;
      if (value !== null && isFinite(value) && value <= 0) {
        img.data[k] = 185;
        img.data[k + 1] = 185;
        img.data[k + 2] = 178;
        img.data[k + 3] = 245;
      } else {
        img.data[k + 3] = 0;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

async function ensureMobileLandLayer(map) {
  if (mobileMapState.landLayer || currentVar === "bathy") return;
  const bathy = await loadBathymetryJson(BATHY_JSON_URL);
  const canvas = makeMobileLandCanvas(bathy);
  if (!canvas) return;
  const extent = frameExtentFromGrid({ xAxis: bathy.xAxis, yAxis: bathy.yAxis });
  const source = new ol.source.ImageStatic({
    url: canvas.toDataURL("image/png"),
    imageExtent: extent,
    projection: "EPSG:4326",
    interpolate: false
  });
  mobileMapState.landLayer = new ol.layer.Image({ source, zIndex: 20 });
  map.addLayer(mobileMapState.landLayer);
}

function mobilePlaceStyle(feature) {
  const type = feature.get("type");
  const isPort = type === "port";
  const isSpot = type === "spot";
  const fill = isSpot ? "#ffb000" : isPort ? "#ffe066" : "#ffffff";
  const image = new ol.style.RegularShape({
    points: isSpot ? 5 : isPort ? 4 : 20,
    radius: isSpot ? 6 : isPort ? 5 : 4,
    radius2: isSpot ? 3 : undefined,
    angle: isPort ? Math.PI / 4 : 0,
    fill: new ol.style.Fill({ color: isSpot ? "#ff6b35" : isPort ? "#ffb000" : "#7bdff2" }),
    stroke: new ol.style.Stroke({ color: "#000", width: 2 })
  });
  return new ol.style.Style({
    image,
    text: new ol.style.Text({
      text: feature.get("name"),
      offsetY: isPort ? 16 : -14,
      font: "700 12px system-ui, -apple-system, Segoe UI, sans-serif",
      fill: new ol.style.Fill({ color: fill }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.9)", width: 3 })
    })
  });
}

function ensureMobilePlaceLayer(map) {
  const features = PLACE_LABELS
    .filter(placeInRegion)
    .map(p => new ol.Feature({
      geometry: new ol.geom.Point([p.lon, p.lat]),
      name: p.name,
      type: p.type
    }));
  const source = new ol.source.Vector({ features });
  const layer = new ol.layer.Vector({
    source,
    style: mobilePlaceStyle,
    zIndex: 30,
    declutter: true
  });
  if (mobileMapState.placeLayer) map.removeLayer(mobileMapState.placeLayer);
  mobileMapState.placeLayer = layer;
  map.addLayer(layer);
}

function ensureMobileCursorLayer(map) {
  if (mobileMapState.cursorLayer) return;
  mobileMapState.cursorFeature = new ol.Feature({
    geometry: new ol.geom.Point([(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2])
  });
  mobileMapState.cursorFeature.setStyle(new ol.style.Style({
    image: new ol.style.Circle({
      radius: 3,
      fill: new ol.style.Fill({ color: "rgba(180,180,180,0.45)" }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.55)", width: 1 })
    })
  }));
  mobileMapState.cursorLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: [mobileMapState.cursorFeature] }),
    zIndex: 60
  });
  map.addLayer(mobileMapState.cursorLayer);
}

function updateMobileCursor(lon, lat) {
  if (!mobileMapState.cursorFeature || !isFinite(lon) || !isFinite(lat)) return;
  mobileMapState.cursorFeature.getGeometry().setCoordinates([lon, lat]);
}

function sampleMobileValueAt(lon, lat) {
  const gridInfo = mobileMapState.currentGridInfo;
  const dataObj = mobileMapState.currentDataObj;
  if (!gridInfo || !dataObj) return null;
  const z = mobileZForVar(currentVar, dataObj);
  if (!is2D(z)) return null;
  const xAxis = gridInfo.xAxis || [];
  const yAxis = gridInfo.yAxis || [];
  if (xAxis.length < 2 || yAxis.length < 2) return null;
  const nx = xAxis.length;
  const ny = yAxis.length;
  const xAsc = xAxis[0] <= xAxis[nx - 1];
  const yAsc = yAxis[0] <= yAxis[ny - 1];
  const xMin = Math.min(xAxis[0], xAxis[nx - 1]);
  const xMax = Math.max(xAxis[0], xAxis[nx - 1]);
  const yMin = Math.min(yAxis[0], yAxis[ny - 1]);
  const yMax = Math.max(yAxis[0], yAxis[ny - 1]);
  if (lon < xMin || lon > xMax || lat < yMin || lat > yMax) return null;
  const iFrac = xAsc ? (lon - xAxis[0]) / (xAxis[nx - 1] - xAxis[0]) : (xAxis[0] - lon) / (xAxis[0] - xAxis[nx - 1]);
  const jFrac = yAsc ? (lat - yAxis[0]) / (yAxis[ny - 1] - yAxis[0]) : (yAxis[0] - lat) / (yAxis[0] - yAxis[ny - 1]);
  const i = Math.max(0, Math.min(nx - 1, Math.round(iFrac * (nx - 1))));
  const j = Math.max(0, Math.min(ny - 1, Math.round(jFrac * (ny - 1))));
  const value = z[j]?.[i];
  if (value === null || value === undefined || value === "" || Number.isNaN(value)) return null;
  const num = Number(value);
  if (!Number.isFinite(num)) return null;
  return num;
}

function renderMobileReadout(lon, lat) {
  if (!isFinite(lon) || !isFinite(lat)) return;
  updateMobileCursor(lon, lat);
  const base = `${toDDM(lon)} ${toDDM(lat)}`;
  const val = sampleMobileValueAt(lon, lat);
  if (val === null || val === undefined) {
    setReadout(base);
    return;
  }
  if (!isFinite(val) || isNaN(val)) {
    setReadout(base);
    return;
  }
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";
  if (currentVar === "sst") setReadout(`${base}, ${formatSstValue(val)}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else setReadout(`${base} ${val.toFixed(3)}${unit}`);
}

function installMobileReadoutOnce(map) {
  if (map.__mobileReadoutInstalled) return;
  map.__mobileReadoutInstalled = true;
  ensureMobileCursorLayer(map);
  map.on("pointermove", (ev) => {
    renderMobileReadout(ev.coordinate[0], ev.coordinate[1]);
  });
  map.on("click", (ev) => {
    renderMobileReadout(ev.coordinate[0], ev.coordinate[1]);
  });
}

function makeMobileRasterCanvas(varKey, gridInfo, dataObj) {
  const z = mobileZForVar(varKey, dataObj);
  if (!is2D(z)) throw new Error(`Mobile renderer missing 2-D data for ${varKey}`);
  const ny = z.length;
  const nx = z[0].length;
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d", { willReadFrequently: false });
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, nx, ny);
  const img = ctx.createImageData(nx, ny);
  const xAxis = gridInfo.xAxis || [];
  const yAxis = gridInfo.yAxis || [];
  const xAscending = xAxis.length < 2 || xAxis[0] <= xAxis[xAxis.length - 1];
  const yAscending = yAxis.length < 2 || yAxis[0] <= yAxis[yAxis.length - 1];
  const cfg = mobileValueConfig(varKey);
  const denom = cfg.hi === cfg.lo ? 1 : (cfg.hi - cfg.lo);

  // yFlip determines when to reverse row order relative to yAscending:
  //   CHL north-up data: flip when yAscending (data 0=north=top), no flip when yAscending is false (data 0=south)
  //   UV south-up data: flip when yAscending is false (data 0=south), no flip when yAscending (data 0=south)
  const yFlip = (varKey === "uv") ? yAscending : yAscending;

  for (let row = 0; row < ny; row++) {
    const srcJ = yFlip ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col++) {
      const srcI = xAscending ? col : (nx - 1 - col);
      const value = z[srcJ]?.[srcI];
      const k = (row * nx + col) * 4;
      const numericValue = Number(value);
      if (isMobileMissingValue(varKey, value, numericValue)) {
        if (varKey === "uv") {
          img.data[k + 3] = 0;
        } else {
          img.data[k] = 255;
          img.data[k + 1] = 255;
          img.data[k + 2] = 255;
          img.data[k + 3] = 255;
        }
        continue;
      }
      const t = (cfg.transform(numericValue) - cfg.lo) / denom;
      const rgb = interpolateScale(cfg.scale, t);
      img.data[k] = rgb[0];
      img.data[k + 1] = rgb[1];
      img.data[k + 2] = rgb[2];
      img.data[k + 3] = 235;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function initMobileMapIfNeeded() {
  const target = document.getElementById("mobile-map");
  if (!target || !window.ol) return null;
  if (mobileMapState.map) {
    document.body.classList.add("mobile-map-ready");
    mobileMapState.map.updateSize();
    return mobileMapState.map;
  }
  const view = new ol.View({
    projection: "EPSG:4326",
    center: [(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2],
    zoom: 6,
    minZoom: 4,
    maxZoom: 13,
    enableRotation: false
  });
  view.on("change:rotation", () => {
    if (view.getRotation()) view.setRotation(0);
  });
  const mobileInteractions = (ol.interaction && typeof ol.interaction.defaults === "function")
    ? ol.interaction.defaults({ altShiftDragRotate: false, pinchRotate: false })
    : undefined;
  mobileMapState.map = new ol.Map({
    target,
    layers: [],
    view,
    controls: [],
    interactions: mobileInteractions
  });
  document.body.classList.add("mobile-map-ready");
  return mobileMapState.map;
}

function fitMobileMapWidth(map, extent) {
  const size = map.getSize();
  if (!size || size[0] <= 0 || size[1] <= 0) return;
  const widthRes = Math.abs(extent[2] - extent[0]) / size[0];
  map.getView().setCenter([(extent[0] + extent[2]) / 2, (extent[1] + extent[3]) / 2]);
  map.getView().setRotation(0);
  map.getView().setResolution(widthRes);
}

async function renderMobileFrame(frameMeta) {
  if (currentVar === "chl_front" || currentVar === "sst_front") return false;
  const map = initMobileMapIfNeeded();
  if (!map) return false;

  let dataObj, gridInfo;
  if (currentVar === "bathy") {
    dataObj = await loadBathymetryJson(BATHY_JSON_URL);
    gridInfo = { xAxis: dataObj.xAxis, yAxis: dataObj.yAxis, nx: dataObj.xAxis.length, ny: dataObj.yAxis.length };
  } else {
    dataObj = await fetchFrameData(currentVar, frameMeta);
    gridInfo = await loadGridForVar(currentVar, dataObj);
  }
  mobileMapState.currentGridInfo = gridInfo;
  mobileMapState.currentDataObj = dataObj;

  const canvas = makeMobileRasterCanvas(currentVar, gridInfo, dataObj);
  // iOS Safari is more reliable with data URLs than Blob image URLs for
  // dynamically generated static image layers. The frames are small enough here.
  const url = canvas.toDataURL("image/png");
  if (!url || !url.startsWith("data:image/png")) throw new Error("Could not encode mobile raster");
  const extent = frameExtentFromGrid(gridInfo);
  const source = new ol.source.ImageStatic({
    url,
    imageExtent: extent,
    projection: "EPSG:4326",
    interpolate: false
  });
  source.on("imageloaderror", () => {
    console.error("Mobile map image layer failed to load; falling back to Plotly.");
    mobileMapState.disabled = true;
    document.body.classList.remove("mobile-map-ready");
    showFrame();
  });
  const layer = new ol.layer.Image({ source });

  if (mobileMapState.imageLayer) map.removeLayer(mobileMapState.imageLayer);
  if (mobileMapState.imageUrl && mobileMapState.imageUrl.startsWith("blob:")) {
    URL.revokeObjectURL(mobileMapState.imageUrl);
  }
  mobileMapState.imageLayer = layer;
  mobileMapState.imageUrl = url;
  map.addLayer(layer);
  clearMobileUvArrowLayer(map);
  if (currentVar === "uv") {
    mobileMapState.arrowLayer = buildMobileUvArrowLayer(dataObj, gridInfo);
    if (mobileMapState.arrowLayer) map.addLayer(mobileMapState.arrowLayer);
  }
  await ensureMobileLandLayer(map);
  ensureMobilePlaceLayer(map);
  installMobileReadoutOnce(map);
  map.updateSize();

  const regionKey = `${REGION_ID}:${currentVar}`;
  if (mobileMapState.fittedRegion !== regionKey) {
    fitMobileMapWidth(map, extent);
    mobileMapState.fittedRegion = regionKey;
  }

  await renderFooterColorbarToDiv(document.getElementById("hamburger-cbar"), currentVar);
  await renderFooterColorbarToDiv(document.getElementById("mobile-cbar"), currentVar);
  updateSliderUI();
  return true;
}

/* ========================= READOUT (hover + tap) ========================= */
function setupReadoutHandlersOnce() {
  if (_readoutHooked) return;
  _readoutHooked = true;

  plotDiv.on("plotly_unhover", () => { if (!IS_TOUCH) setReadout(""); });

  plotDiv.on("plotly_hover", (ev) => {
    const p = ev.points && ev.points[0];
    if (!p) return;
    renderReadoutFromPoint(p);
  });

  plotDiv.on("plotly_click", async (ev) => {
    // 1. CLEANUP PREVIOUS MEASUREMENT (If exists)
    // If the user clicks ANYWHERE while a measurement line is visible, clear it first.
    if (measureResultVisible) {
      measurePoints = [];
      measureResultVisible = false;
      await showFrame();
      // We continue processing this click (so they can immediately click to add a marker or see a value)
    }

    // 2. DETERMINE COORDINATES
    let lon, lat;
    const p = ev.points && ev.points[0];

    // Use Exact Mouse Calculation for Add OR Measure modes
    if (markerMode === "add" || measureMode !== "off") {
      const domEvent = ev.event;
      const xaxis = plotDiv._fullLayout.xaxis;
      const yaxis = plotDiv._fullLayout.yaxis;
      const dragLayer = plotDiv.querySelector('.nsewdrag');
      const rect = dragLayer.getBoundingClientRect();
      const xPx = domEvent.clientX - rect.left;
      const yPx = domEvent.clientY - rect.top;
      lon = xaxis.p2d(xPx);
      lat = yaxis.p2d(yPx);
    } else {
      if (!p) return;
      lon = Number(p.x);
      lat = Number(p.y);
    }

    if (!isFinite(lon) || !isFinite(lat)) return;

    // --- 3. MEASURE LOGIC (Updated) ---
    if (measureMode !== "off") {
      if (measureMode === "start") {
        // Point A
        measurePoints = [{ lon, lat }];
        measureMode = "end";
        setReadout("Measure: Click END point");
      } else {
        // Point B (Finish)
        measurePoints[1] = { lon, lat };

        const d = getDistanceInNM(
          measurePoints[0].lat, measurePoints[0].lon,
          measurePoints[1].lat, measurePoints[1].lon
        );

        // 1. Show result in top bar
        setReadout(`Distance: ${d.toFixed(2)} nm`);

        // 2. Turn OFF mode immediately
        measureMode = "off";
        plotDiv.classList.remove("measure-mode");

        // 3. Flag result as visible so NEXT click clears it
        measureResultVisible = true;
      }
      await showFrame();
      return;
    }

    // --- 4. MARKER LOGIC ---
    if (markerMode === "add") {
      markers.push({ lon, lat, label: String(markers.length + 1) });
      await showFrame();
      return;
    }
    if (markerMode === "remove") {
      removeNearestMarker(lon, lat);
      await showFrame();
      return;
    }

    // --- 5. NORMAL READOUT ---
    if (p) renderReadoutFromPoint(p);
  });
}

/* ================= DDM CONVERSION HELPER (Standard Marine) ================= */
function toDDM(val) {
  const absVal = Math.abs(val);
  const d = Math.floor(absVal);
  const m = (absVal - d) * 60;

  // Format: Degrees + Minutes with 3 decimal places (Standard GPS precision)
  // padStart(2, '0') ensures "05.123" instead of "5.123"
  const mStr = m.toFixed(2).padStart(5, '0');

  // West/South Handling
  // You can also add N/S/E/W suffixes if preferred,
  // but standard negative signs work well for compact readouts.
  const sign = val < 0 ? "-" : "";

  return `${sign}${d}°${mStr}'`;
}

/* ================= READOUT ================= */
function renderReadoutFromPoint(p) {
  const lon = Number(p.x);
  const lat = Number(p.y);
  if (!isFinite(lon) || !isFinite(lat)) return;

  const base = `${toDDM(lon)} ${toDDM(lat)}`;

  const cd = p.customdata;
  if (cd === null || cd === undefined) {
    setReadout(base);
    return;
  }
  const val = Number(cd);
  if (!isFinite(val) || isNaN(val)) {
    setReadout(base);
    return;
  }
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";

  if (currentVar === "sst") setReadout(`${base}, ${formatSstValue(val)}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else setReadout(`${base} ${val.toFixed(3)}${unit}`);
}

async function addNearestFrontOverlay(fig, baseVar, baseFrameMeta) {
  let frontVar = baseVar === "chl" ? "chl_front" : baseVar === "sst" ? "sst_front" : null;
  if (showGlobalSstFrontOverlay && baseVar !== "sst_front") frontVar = "sst_front";
  if (!frontVar) return;
  if (frontVar === "chl_front" && !showChlFrontOverlay) return;
  if (frontVar === "sst_front" && !(showSstFrontOverlay || showGlobalSstFrontOverlay)) return;

  const frontFrames = framesByVar[frontVar] || [];
  if (!frontFrames.length) return;
  const finiteFrontTimes = (frameTimesByVar[frontVar] || []).filter(Number.isFinite);
  const curMs = epochMsForFrame(baseVar, baseFrameMeta) ?? finiteFrontTimes.at(-1) ?? null;
  const frontTimes = frameTimesByVar[frontVar] || [];
  let bestIdx = 0;
  let bestDiff = Infinity;
  for (let i = 0; i < frontFrames.length; i++) {
    const t = frontTimes[i];
    if (!Number.isFinite(t)) continue;
    const d = Math.abs(t - curMs);
    if (d < bestDiff) {
      bestDiff = d;
      bestIdx = i;
    }
  }

  try {
    const frontData = await fetchFrameData(frontVar, frontFrames[bestIdx]);
    const frontGrid = await loadGridForVar(frontVar, frontData);
    const frontFig = buildFrontLines(frontGrid, frontData, frontVar);
    const label = formatRelativeFrontTime((frontTimes[bestIdx] ?? NaN) - curMs);
    for (const trace of frontFig.data || []) {
      trace.name = label ? `Thermal front (${label})` : "Thermal front";
      trace.hovertemplate = label ? `<b>Thermal front</b><br>${label}<extra></extra>` : trace.hovertemplate;
    }
    fig.data.push(...frontFig.data);
    const labelTrace = frontLabelTrace(frontData, label);
    if (labelTrace) fig.data.push(labelTrace);
  } catch (e) {
    console.error(`${frontVar} overlay failed:`, e);
  }
}

async function setCurrentVar(v, keepTime = true, keepRange = true) {

  const prevT = (keepTime && prevFrame) ? epochMsForFrame(prevVar, prevFrame) : null;

  currentVar = v;
  varSelect.value = v;
