function thermalDateKey(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

function thermalFrameTimeLabel(ms) {
  // Bug fix 2026-08-02: was hardcoding timeZone: "UTC" and appending " UTC",
  // which forced thermal-fronts-mode labels to UTC regardless of user's tz.
  // Now uses browser local time (same convention as fmtLocalDateTime).
  return new Date(ms).toLocaleString(undefined, {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
}

function thermalColorForAge(ms, latestMs, oldestMs) {
  // Legacy helper — kept for any external callers but no longer used by
  // the dashboard render path (see thermalColorForHourInDay / DayInPeriod).
  const span = Math.max(1, latestMs - oldestMs);
  const t = Math.max(0, Math.min(1, (ms - oldestMs) / span));
  const hue = 282 - 282 * t;
  const light = 46 + 4 * t;
  return `hsl(${hue}, 92%, ${light}%)`;
}

// Rainbow colormap: 7-stop full-spectrum gradient.
// violet (270) -> blue (240) -> cyan (190) -> green (120) ->
// yellow (60) -> orange (30) -> red (0).
// Older = cooler (violet/blue), newer = warmer (orange/red).
// Mike asked for a "more distinguishable color map... rainbow perhaps"
// on 2026-06-12. The previous 4-stop (purple/blue/green/red) was hard
// to read when many days overlap in the same area.
const THERMAL_RAINBOW_STOPS = [
  { t: 0.00, h: 270, s: 75, l: 50 }, // violet (oldest, coolest)
  { t: 1/6,  h: 240, s: 80, l: 52 }, // blue
  { t: 2/6,  h: 190, s: 85, l: 48 }, // cyan
  { t: 3/6,  h: 120, s: 80, l: 45 }, // green
  { t: 4/6,  h:  60, s: 90, l: 50 }, // yellow
  { t: 5/6,  h:  30, s: 92, l: 50 }, // orange
  { t: 1.00, h:   0, s: 88, l: 50 }  // red (newest, warmest)
];

function thermalColorForTimeFractionRainbow(t) {
  const tc = Math.max(0, Math.min(1, Number(t) || 0));
  let a = THERMAL_RAINBOW_STOPS[0];
  let b = THERMAL_RAINBOW_STOPS[THERMAL_RAINBOW_STOPS.length - 1];
  for (let i = 0; i < THERMAL_RAINBOW_STOPS.length - 1; i++) {
    if (tc >= THERMAL_RAINBOW_STOPS[i].t && tc <= THERMAL_RAINBOW_STOPS[i + 1].t) {
      a = THERMAL_RAINBOW_STOPS[i];
      b = THERMAL_RAINBOW_STOPS[i + 1];
      break;
    }
  }
  const span = (b.t - a.t) || 1;
  const f = (tc - a.t) / span;
  // Hue shortest-path interpolation (red->violet is -270, not +90)
  let hDiff = b.h - a.h;
  if (hDiff > 180) hDiff -= 360;
  else if (hDiff < -180) hDiff += 360;
  const h = (a.h + hDiff * f + 360) % 360;
  const s = a.s + (b.s - a.s) * f;
  const l = a.l + (b.l - a.l) * f;
  return `hsl(${h.toFixed(1)}, ${s.toFixed(1)}%, ${l.toFixed(1)}%)`;
}

function thermalColorForTimeFractionRainbowRgb(t) {
  const tc = Math.max(0, Math.min(1, Number(t) || 0));
  let a = THERMAL_RAINBOW_STOPS[0];
  let b = THERMAL_RAINBOW_STOPS[THERMAL_RAINBOW_STOPS.length - 1];
  for (let i = 0; i < THERMAL_RAINBOW_STOPS.length - 1; i++) {
    if (tc >= THERMAL_RAINBOW_STOPS[i].t && tc <= THERMAL_RAINBOW_STOPS[i + 1].t) {
      a = THERMAL_RAINBOW_STOPS[i];
      b = THERMAL_RAINBOW_STOPS[i + 1];
      break;
    }
  }
  const span = (b.t - a.t) || 1;
  const f = (tc - a.t) / span;
  let hDiff = b.h - a.h;
  if (hDiff > 180) hDiff -= 360;
  else if (hDiff < -180) hDiff += 360;
  const h = (a.h + hDiff * f + 360) % 360;
  const s = (a.s + (b.s - a.s) * f) / 100;
  const l = (a.l + (b.l - a.l) * f) / 100;
  return thermalHslToRgb(h, s, l);
}

// Domain-based color helpers — every front-line color is keyed to an
// absolute time domain (full UTC day for hourly, full 14-day period
// for daily), not to the visible subset. See commit message for the
// 2026-06-11 dashboard fix (contract: dashboard-v2). The previous
// 4-stop gradient was replaced with a 7-stop rainbow on 2026-06-12.
function thermalColorForHourInDay(frameTimeMs) {
  // Domain: full UTC day. 00:00 UTC -> violet, 12:00 UTC -> green,
  // 23:00 UTC -> red. Independent of which hourly frames are visible.
  if (!Number.isFinite(frameTimeMs)) return thermalColorForTimeFractionRainbow(0);
  const d = new Date(frameTimeMs);
  const frac = (d.getUTCHours() + d.getUTCMinutes() / 60) / 23;
  return thermalColorForTimeFractionRainbow(frac);
}

function thermalColorForDayInPeriod(dayMs, oldestMs, latestMs) {
  // Domain: full 14-day period (or whatever the active window is).
  // Oldest day -> violet, newest day -> red (rainbow colormap).
  // Independent of which daily frames are visible. Rainbow was
  // switched in 2026-06-12 from 4-stop purple/blue/green/red to
  // 7-stop violet/blue/cyan/green/yellow/orange/red so the
  // 14 days are individually distinguishable.
  if (!Number.isFinite(dayMs) || !Number.isFinite(oldestMs) || !Number.isFinite(latestMs)) {
    return thermalColorForTimeFractionRainbow(0);
  }
  const span = Math.max(1, latestMs - oldestMs);
  const t = (dayMs - oldestMs) / span;
  return thermalColorForTimeFractionRainbow(t);
}

function thermalColorForDensityDate(date) {
  // Per-cell color for the v4-refine Point layer (the only daily
  // visualization as of 2026-06-12). Keyed to day-in-period with
  // the rainbow colormap (oldest = violet, newest = red), so the
  // returned RGB matches the HSL color used by the front layer's
  // daily-day color helper.
  const dayItem = thermalFrontState.dailyFrames.find(d => d.date === date);
  if (!dayItem) return [19, 74, 136];
  const oldestMs = thermalFrontState.dailyFrames[0]?.t ?? dayItem.t;
  const latestMs = thermalFrontState.dailyFrames.at(-1)?.t ?? dayItem.t;
  const t = Math.max(0, Math.min(1, (dayItem.t - oldestMs) / Math.max(1, latestMs - oldestMs)));
  return thermalColorForTimeFractionRainbowRgb(t);
}

function thermalFramesForDate(date) {
  return thermalFrontState.frameData.filter(item => thermalDateKey(item.t) === date);
}

function thermalActiveFrameList() {
  if (thermalFrontState.mode === "daily") return thermalFrontState.dailyFrames;
  const dayItems = thermalFramesForDate(thermalFrontState.selectedDate);
  return dayItems.length ? dayItems : thermalFrontState.frameData;
}

function thermalDisplayedFrontItems() {
  if (thermalFrontState.mode === "daily") return [];
  const list = thermalActiveFrameList();
  if (thermalAllDayCb?.checked) return list;
  const item = list[thermalFrontState.frameIdx];
  return item ? [item] : [];
}

function thermalCurrentFrameTime() {
  if (thermalFrontState.mode === "daily") return thermalFrontState.dailyFrames[thermalFrontState.frameIdx]?.t ?? null;
  return thermalActiveFrameList()[thermalFrontState.frameIdx]?.t ?? null;
}

function thermalClosestFrameIndex(items, targetMs) {
  if (!items.length || !Number.isFinite(targetMs)) return Math.max(0, items.length - 1);
  let bestIdx = 0;
  let bestDist = Infinity;
  for (let i = 0; i < items.length; i++) {
    const t = Number(items[i]?.t);
    if (!Number.isFinite(t)) continue;
    const d = Math.abs(t - targetMs);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }
  return bestIdx;
}

function thermalSegmentedLineStrings(coords, maxJumpDeg = 0.08) {
  // Always break on NaN/Infinity — do not connect across missing data.
  // Also break when two valid points are too far apart (> maxJumpDeg).
  const segments = [];
  let seg = null;
  let prev = null;
  for (const pt of coords || []) {
    if (!Array.isArray(pt) || pt.length < 2) { if (seg && seg.length >= 2) segments.push(seg); seg = null; continue; }
    const lon = Number(pt[0]);
    const lat = Number(pt[1]);
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) { if (seg && seg.length >= 2) segments.push(seg); seg = null; prev = null; continue; }
    if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > maxJumpDeg) { if (seg && seg.length >= 2) segments.push(seg); seg = null; }
    if (!seg) seg = [];
    seg.push([lon, lat]);
    prev = [lon, lat];
  }
  if (seg && seg.length >= 2) segments.push(seg);
  return segments;
}

function thermalGradientForFeaturePoint(props, index) {
  const gradMap = Array.isArray(props?.gradient_map) ? props.gradient_map : null;
  if (gradMap && index < gradMap.length) {
    const exact = Number(gradMap[index]);
    return Number.isFinite(exact) && exact > 0 ? exact : null;
  }
  const g = Number(props?.gradient_per_km);
  return Number.isFinite(g) && g > 0 ? g : null;
}

function thermalDeltaSstForFeaturePoint(props, index) {
  const deltaMap = Array.isArray(props?.delta_sst_map) ? props.delta_sst_map : null;
  if (deltaMap && index < deltaMap.length) {
    const exact = Number(deltaMap[index]);
    if (Number.isFinite(exact) && exact > 0) return exact;
  }
  // Older frames only have a feature-wide cross-front contrast. This keeps
  // them usable, but Aug 6 carries the per-vertex map above.
  const fallback = Number(props?.strength_max);
  return Number.isFinite(fallback) && fallback > 0 ? fallback : null;
}

// Offshore-fishing working-front threshold. The producer stores gradients in
// °C/km; 0.3 °C/km × 9/5 × 1.852 = 1.0 °F/nm exactly (within display
// precision). Weak fronts are excluded from rendering and hit-testing.
const STRONG_FRONT_MIN_GRADIENT_C_PER_KM = 0.3;
function thermalIsStrongFrontGradient(gradient) {
  return Number.isFinite(gradient) && gradient >= STRONG_FRONT_MIN_GRADIENT_C_PER_KM;
}

function thermalStrongSegmentedLineStrings(coords, props, maxJumpDeg = 0.08) {
  const segments = [];
  let seg = null;
  let prev = null;
  for (let i = 0; i < (coords || []).length; i++) {
    const pt = coords[i];
    const grad = thermalGradientForFeaturePoint(props, i);
    if (!Array.isArray(pt) || pt.length < 2 || !thermalIsStrongFrontGradient(grad)) {
      if (seg && seg.length >= 2) segments.push(seg);
      seg = null; prev = null; continue;
    }
    const lon = Number(pt[0]), lat = Number(pt[1]);
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
      if (seg && seg.length >= 2) segments.push(seg);
      seg = null; prev = null; continue;
    }
    if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > maxJumpDeg) {
      if (seg && seg.length >= 2) segments.push(seg);
      seg = null;
    }
    if (!seg) seg = [];
    seg.push([lon, lat]);
    prev = [lon, lat];
  }
  if (seg && seg.length >= 2) segments.push(seg);
  return segments;
}

// Visibility is controlled independently from the offshore working-front
// classification. A zero display threshold means show every valid detected
// front vertex; raising it filters weak vertices without changing the stored
// data or the 1.0°F/nm fishing-grade classification.
function thermalVisibleSegmentedLineStrings(coords, props, maxJumpDeg = 0.08) {
  const segments = [];
  let seg = null;
  let segStrong = null;
  let prev = null;
  const flush = () => {
    if (seg && seg.length >= 2) segments.push({ coords: seg, strong: !!segStrong });
    seg = null; segStrong = null;
  };
  for (let i = 0; i < (coords || []).length; i++) {
    const pt = coords[i];
    const grad = thermalGradientForFeaturePoint(props, i);
    const metric = thermalDisplayMetric === "delta_sst"
      ? thermalDeltaSstForFeaturePoint(props, i)
      : grad;
    const lon = Number(pt?.[0]), lat = Number(pt?.[1]);
    const passesDisplayThreshold = thermalDisplayThresholdCPerKm <= 0
      ? Number.isFinite(metric)
      : Number.isFinite(metric) && metric >= thermalDisplayThresholdCPerKm;
    if (!Array.isArray(pt) || pt.length < 2 || !Number.isFinite(lon) || !Number.isFinite(lat) || !passesDisplayThreshold) {
      flush(); prev = null; continue;
    }
    if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > maxJumpDeg) flush();
    const strong = thermalIsStrongFrontGradient(grad);
    if (!seg) { seg = []; segStrong = strong; }
    else segStrong = segStrong || strong;
    seg.push([lon, lat]);
    prev = [lon, lat];
  }
  flush();
  return segments;
}

function thermalDeltaSstForFeature(props, index) {
  const deltaMap = Array.isArray(props?.delta_sst_map) ? props.delta_sst_map : null;
  if (deltaMap && Number.isInteger(index) && index < deltaMap.length) {
    const exact = Number(deltaMap[index]);
    return Number.isFinite(exact) && exact > 0 ? { label: "ΔSST", value: exact } : null;
  }
  const median = Number(props?.strength_median);
  const max = Number(props?.strength_max);
  if (Number.isFinite(median)) return { label: "ΔSST", value: median };
  if (Number.isFinite(max)) return { label: "ΔSST max", value: max };
  return null;
}

function thermalCollectFrontPoints(items) {
  const points = [];
  for (const item of items) {
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sourceFeature of sourceFeatures) {
      const coords = sourceFeature?.geometry?.coordinates || [];
      const props = sourceFeature?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i];
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const lon = Number(pt[0]);
        const lat = Number(pt[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        const grad = thermalGradientForFeaturePoint(props, i);
        if (!thermalIsStrongFrontGradient(grad)) continue;
        points.push({ lon, lat, t: item.t, grad });
      }
    }
  }
  return points;
}

function thermalHslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function thermalColorForDensityDate_legacyRed() {
  // Tombstone: density heatmap was removed 2026-06-12. The v4-refine
  // Point layer is the only daily visualization now (rainbow by
  // day-in-period). Kept here for git history.
  return [255, 30, 30];
}

function thermalBuildDensityField(points, hourlyCount, label) {
  const [west, south, east, north] = BBOX.map(Number);
  // v4: 0.01° cells (Mike's spec). 0.005° was too fine for the per-day
  // hourly-front density we observe (~14k points / day spread over
  // ~750 x 460 cells, median 1 point/cell, max ~20).
  const cellDeg = 0.01;
  const nx = Math.max(2, Math.ceil((east - west) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((north - south) / cellDeg) + 1);
  const counts = new Int32Array(nx * ny);
  for (const point of points) {
    const cx = Math.round((point.lon - west) / cellDeg);
    const cy = Math.round((point.lat - south) / cellDeg);
    if (cx < 0 || cx >= nx || cy < 0 || cy >= ny) continue;
    counts[cy * nx + cx]++;
  }
  const nonzero = Array.from(counts).filter(v => v > 0);
  const max = Math.max(1, ...nonzero);
  // v4: fixed threshold of 3 (Mike's spec for v4-refine). Cells hit
  // by fewer than 3 hourly detections are noise. Was 2 in the
  // pre-refine v4; tightened to 3 because the refinement step is
  // most useful when each surviving cell has at least one strong
  // core hit, and we want the output to be sparser / more confident.
  const cutoff = 3;
  return {
    label,
    color: thermalColorForDensityDate(label),
    points: points.length,
    hourlyCount,
    nx,
    ny,
    cellDeg,
    extent: [west, south, west + (nx - 1) * cellDeg, south + (ny - 1) * cellDeg],
    counts,
    max,
    cutoff
  };
}

// v4-refine: for each surviving cell in a density field, build a
// candidate pool of (self + 8 immediate neighbors at 1-stride: up,
// up-right, right, down-right, down, down-left, left, up-left), keep
// only those that ALSO pass the cutoff, and pick the top-K (=3) by
// count. The cell's reported front location is the COUNT-WEIGHTED
// mean of those top-K cell centers, so a high-count neighbor pulls
// the result toward it more strongly than a low-count one. The new
// count for the output point is the count-weighted mean of the top-K
// counts, which keeps the radius bounded and consistent with the
// location weighting.
//
// Why: the raw v4 scatter produces blocky 0.01 deg cells. Pulling
// each point toward the densest part of its 9-cell window smooths the
// front into the consensus core, drops single-cell noise outliers,
// and gives one representative location per local density mode.
//
// Edge handling:
// - Cell itself below cutoff: drop the point (don't render).
// - Boundary cells: only in-bounds neighbors are considered.
// - < K cells in pool: average whatever is there (1 or 2).
// - Self is always part of the pool if it passes the cutoff; this
//   means a strongly isolated cell stays anchored to itself (the
//   weighted mean with only self in the pool = self).
function thermalRefineDensityField(field, k = 3) {
  const { counts, nx, ny, cellDeg, extent, cutoff } = field;
  const west = extent[0];
  const south = extent[1];
  const refined = new Map(); // idx -> { lon, lat, count }
  for (let row = 0; row < ny; row++) {
    for (let col = 0; col < nx; col++) {
      const idx = row * nx + col;
      const c = counts[idx];
      if (c < cutoff) continue; // drop cells below cutoff
      // Build candidate pool: self + 8 neighbors (in-bounds and >= cutoff).
      const pool = [{
        lon: west + col * cellDeg,
        lat: south + row * cellDeg,
        count: c
      }];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue; // self already in pool
          const nc = col + dc;
          const nr = row + dr;
          if (nc < 0 || nc >= nx || nr < 0 || nr >= ny) continue;
          const ncCount = counts[nr * nx + nc];
          if (ncCount < cutoff) continue;
          pool.push({
            lon: west + nc * cellDeg,
            lat: south + nr * cellDeg,
            count: ncCount
          });
        }
      }
      // Top-K by count. Stable sort means ties resolve by scan order,
      // which is deterministic across runs.
      pool.sort((a, b) => b.count - a.count);
      const top = pool.slice(0, k);
      // Count-weighted mean of (lon, lat). sumW is the sum of the
      // top-K weights; the new count is the mean weight (sumW / K)
      // so the radius stays bounded between cutoff and field.max.
      let sumW = 0, sumLon = 0, sumLat = 0;
      for (const t of top) {
        sumW += t.count;
        sumLon += t.lon * t.count;
        sumLat += t.lat * t.count;
      }
      refined.set(idx, {
        lon: sumLon / sumW,
        lat: sumLat / sumW,
        count: sumW / top.length
      });
    }
  }
  return refined;
}

// v10-zoomfix-v2: scale open-circle symbols with the map's zoom level
// so they stay perceptually visible as the user zooms in. Projection-
// independent: unlike the v9 formula (which compared a degrees/px
// baseline against Web Mercator meters/px resolution), zoom is unitless
// and works regardless of the view's projection (EPSG:4326 or
// EPSG:3857). At default zoom 6, scale = 1.0 and the symbols look
// identical to the v9 build. At higher zoom, scale grows as
// 2^((zoom-6)*0.65), capped at MAX_SCALE so symbols stay visible
// without bloating at the deepest zoom levels.
const THERMAL_POINT_DEFAULT_ZOOM = 6;
const THERMAL_POINT_MAX_SCALE = 6.0;          // cap at deepest zoom (z=10+)
const THERMAL_POINT_MIN_SCALE = 0.9;          // gentle floor when zoomed out
const THERMAL_POINT_ZOOM_EXPONENT = 0.65;     // 2^((zoom-6)*0.65) growth curve
function thermalPointStyleScale(resolution, map) {
  let zoom = NaN;
  const view = (map && typeof map.getView === 'function') ? map.getView() : null;
  if (view && Number.isFinite(resolution) && resolution > 0 &&
      typeof view.getZoomForResolution === 'function') {
    zoom = view.getZoomForResolution(resolution);
  }
  if (!Number.isFinite(zoom) && view && typeof view.getZoom === 'function') {
    zoom = view.getZoom();
  }
  if (!Number.isFinite(zoom)) return 1;
  const scaled = Math.pow(2, (zoom - THERMAL_POINT_DEFAULT_ZOOM) * THERMAL_POINT_ZOOM_EXPONENT);
  return Math.max(THERMAL_POINT_MIN_SCALE,
                  Math.min(THERMAL_POINT_MAX_SCALE, scaled));
}

function thermalFeatureStyle(feature, resolution, map) {
  const geom = feature.getGeometry();
  // v4-refine: daily front layer is a Point per surviving density cell.
  // Open circle (stroke only, no fill) so overlapping symbols from
  // multiple days stay visually separable instead of stacking into a
  // solid blob. Matches the matplotlib v8_refine_all_days.png
  // prototype (facecolors='none', edgecolors=day_color).
  if (geom instanceof ol.geom.Point) {
    const radius = feature.get("pointRadius");
    const color = feature.get("color") || "hsl(282, 92%, 52%)";
    const strokeWidth = feature.get("pointStrokeWidth") ?? 0.5;
    const scale = thermalPointStyleScale(resolution, map);
    return new ol.style.Style({
      image: new ol.style.Circle({
        radius: (Number.isFinite(radius) ? radius : 0.75) * scale,
        // no fill => open ring
        stroke: new ol.style.Stroke({ color, width: strokeWidth * scale })
      })
    });
  }
  return new ol.style.Style({
    stroke: new ol.style.Stroke({
      color: feature.get("color") || "#111",
      width: feature.get("lineWidth") || 2,
      lineCap: "round",
      lineJoin: "round"
    })
  });
}

// Hover tooltip for v4-refine front points (daily mode).
// Mike, 2026-06-12: "When hovered upon, should show the time or
// date of the points." Renders a small floating tip with a colored
// dot (matches the point's rainbow color) + the date/hour label.
// Zoom-independent hit radius for thermal fronts. Daily mode already
// Daily mode uses a separate 5-km-radius mean. Hourly hit-testing is kept
// deliberately tight so a click a few kilometres off a front remains an SST
// readout instead of snapping back onto the front line.
const MAX_THERMAL_HIT_DISTANCE_KM = 2;

// Snap-to-segment proximity for thermal fronts. Unlike
// thermalNearestGradient (which finds the closest vertex), this
// measures distance to the closest point on any front line segment.
// Clicking between two vertices on the same line still snaps to it.
// Uses Haversine so the result is in real-world km regardless of zoom.
// When the click is mid-segment, gradient + ΔSST are interpolated
// linearly between the two endpoint vertices.
function thermalNearestFrontHit(coord) {
  const lon = coord[0];
  const lat = coord[1];
  let bestDist = Infinity;
  let bestPoint = null;
  let bestGrad = null;
  let bestDelta = null;
  // Also track nearest valid (non-null gradient) separately for fallback.
  let validDist = Infinity;
  let validPoint = null;
  let validGrad = null;
  let validDelta = null;
  const toRad = Math.PI / 180;
  const R = 6371;
  for (const item of thermalDisplayedFrontItems()) {
    const features = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      const props = feature?.properties || {};
      if (!Array.isArray(coords) || coords.length < 1) continue;
      for (let i = 0; i < coords.length; i++) {
        const a = coords[i];
        if (!Array.isArray(a) || a.length < 2) continue;
        const aLon = Number(a[0]);
        const aLat = Number(a[1]);
        if (!Number.isFinite(aLon) || !Number.isFinite(aLat)) continue;
        // Snap to vertex
        let candDist = thermalHaversineKm([lon, lat], [aLon, aLat]);
        let candLon = aLon, candLat = aLat;
        let candSegT = 0;
        // Snap to segment between this vertex and the next
        if (i + 1 < coords.length) {
          const b = coords[i + 1];
          if (Array.isArray(b) && b.length >= 2) {
            const bLon = Number(b[0]);
            const bLat = Number(b[1]);
            if (Number.isFinite(bLon) && Number.isFinite(bLat)) {
              const meanLat = (aLat + bLat) * 0.5 * toRad;
              const cosLat = Math.cos(meanLat);
              const ax = aLon * toRad * R * cosLat;
              const ay = aLat * toRad * R;
              const bx = bLon * toRad * R * cosLat;
              const by = bLat * toRad * R;
              const px = lon * toRad * R * cosLat;
              const py = lat * toRad * R;
              const dx = bx - ax, dy = by - ay;
              const lenSq = dx * dx + dy * dy;
              let t = lenSq > 0 ? ((px - ax) * dx + (py - ay) * dy) / lenSq : 0;
              t = Math.max(0, Math.min(1, t));
              const projLon = aLon + t * (bLon - aLon);
              const projLat = aLat + t * (bLat - aLat);
              const segDist = thermalHaversineKm([lon, lat], [projLon, projLat]);
              if (segDist < candDist) {
                candDist = segDist;
                candLon = projLon;
                candLat = projLat;
                candSegT = t;
              }
            }
          }
        }
        const grad = thermalGradientForFeaturePoint(props, i);
        if (!thermalIsStrongFrontGradient(grad)) continue;
        const delta = thermalDeltaSstForFeature(props, i);
        let useGrad = grad, useDelta = delta;
        if (candSegT > 0 && candSegT < 1 && i + 1 < coords.length) {
          const nextG = thermalGradientForFeaturePoint(props, i + 1);
          const nextD = thermalDeltaSstForFeature(props, i + 1);
          if (Number.isFinite(grad) && Number.isFinite(nextG)) {
            useGrad = grad + (nextG - grad) * candSegT;
          }
          if (delta && nextD && Number.isFinite(delta.value) && Number.isFinite(nextD.value)) {
            useDelta = { label: delta.label, value: delta.value + (nextD.value - delta.value) * candSegT };
          }
        }
        if (!thermalIsStrongFrontGradient(useGrad)) continue;
        if (candDist < bestDist) {
          bestDist = candDist;
          bestPoint = [candLon, candLat];
          bestGrad = useGrad;
          bestDelta = useDelta;
        }
        if (Number.isFinite(useGrad)) {
          if (candDist < validDist) {
            validDist = candDist;
            validPoint = [candLon, candLat];
            validGrad = useGrad;
            validDelta = useDelta;
          }
        }
      }
    }
  }
  if (validGrad !== null) {
    return { dist: validDist, gradient: validGrad, point: validPoint, deltaSst: validDelta };
  }
  return { dist: bestDist, gradient: bestGrad, point: bestPoint, deltaSst: bestDelta };
}

function thermalFrontHoverTip(coord, pixel) {
  const tipEl = document.getElementById("thermal-hover-tip");
  if (!tipEl || !thermalFrontState.frontLayer) return;
  // Only show tip in daily mode where the v4-refine points exist.
  if (thermalFrontState.mode !== "daily") {
    tipEl.style.display = "none";
    return;
  }
  // Hit-test: find nearest point within ~14px (matches the cursor
  // hit radius used elsewhere in the file). iterateFeaturesInExtent
  // is a fast way to limit the search to a small box.
  if (!coord || !Number.isFinite(coord[0]) || !Number.isFinite(coord[1])) {
    tipEl.style.display = "none";
    return;
  }
  const map = thermalFrontState.map;
  if (!map || !pixel) { tipEl.style.display = "none"; return; }
  const source = thermalFrontState.frontLayer.getSource();
  if (!source) { tipEl.style.display = "none"; return; }
  // Zoom-independent bounding box (~0.1° lon/lat covers ~11 km at mid
  // latitudes), superseding the old 14-px box that became effectively
  // zero-area at high zoom and made hover tips vanish.
  const hitDeg = 0.1;
  const candidates = source.getFeaturesInExtent([
    coord[0] - hitDeg, coord[1] - hitDeg,
    coord[0] + hitDeg, coord[1] + hitDeg
  ]);
  if (!candidates.length) { tipEl.style.display = "none"; return; }
  // Pick nearest by Haversine (zoom-independent, supersedes the old
  // 14-px screen-pixel nearest-by-distance step).
  let best = null;
  let bestDist = Infinity;
  for (const f of candidates) {
    const geom = f.getGeometry();
    if (!(geom instanceof ol.geom.Point)) continue;
    const p = geom.getCoordinates();
    if (!Number.isFinite(p?.[0])) continue;
    const d = thermalHaversineKm(coord, p);
    if (d < bestDist) { bestDist = d; best = f; }
  }
  if (!best || bestDist > MAX_THERMAL_HIT_DISTANCE_KM) { tipEl.style.display = "none"; return; }
  const color = best.get("color") || "hsl(282, 92%, 52%)";
  const label = best.get("hoverLabel") || best.get("dayDate") || "";
  tipEl.innerHTML = `<span class="tip-dot" style="background:${color};border-color:${color}"></span>${label}`;
  // Position tip at cursor + (14, -50%) so it sits to the right
  // of the cursor without overlapping the dot. Use clientX/Y so
  // the position stays correct even when the map is scrolled.
  const evt = window.event;
  const cx = evt?.clientX ?? pixel[0];
  const cy = evt?.clientY ?? pixel[1];
  tipEl.style.left = `${cx}px`;
  tipEl.style.top = `${cy}px`;
  tipEl.style.display = "block";
}

// Mike, 2026-08-10 07:09 ET: helpers for SST underlay below hourly front
// map + click-readout SST sampling on no-fronts-nearby. Index files
// (data/index-<region>.json) are empty placeholders, so probe a
// deterministic filename pattern instead.
function thermalDateKeyToYYYYDDD(dateKey) {
  if (!dateKey || dateKey.length < 10) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateKey);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const start = Date.UTC(y, 0, 1);
  const dayOfYear = Math.floor((Date.UTC(y, mo - 1, d) - start) / 86400000) + 1;
  return `${y}${String(dayOfYear).padStart(3, "0")}`;
}

function thermalSstProbePath(region, dateKey, hh) {
  const ddd = thermalDateKeyToYYYYDDD(dateKey);
  if (!ddd) return null;
  const ymd = dateKey.slice(0, 10).replace(/-/g, "");
  const hhStr = String(hh).padStart(2, "0");
  return `data/${region}/sst/sst_${region}_${ddd}_${ymd}_${hhStr}_g19.json`;
}

async function thermalFindSstFrame(region, dateKey) {
  // Noon first (best daily representative), then walk outward.
  const hours = [12, 11, 13, 10, 14, 9, 15, 8, 16, 7, 17, 6, 18, 5, 19, 4, 20, 3, 21, 2, 22, 1, 23, 0];
  for (const hh of hours) {
    const url = thermalSstProbePath(region, dateKey, hh);
    if (!url) continue;
    try {
      const r = await fetch(url, { method: "HEAD" });
      if (r.ok) return { url, hour: hh };
    } catch (_) { /* fall through */ }
  }
  return null;
}

async function thermalEnsureSstUnderlay(map, dateKey) {
  if (!map || !dateKey) return;
  const sourceFrame = thermalSourceSstFilenameForCurrentView(dateKey);
  const sourceKey = sourceFrame || `fallback:${dateKey}`;
  if (thermalFrontState.sstUnderlayLoading) return;
  if (thermalFrontState.sstUnderlaySourceFrame === sourceKey && thermalFrontState.sstUnderlayLayer) {
    // Mike, 2026-08-10 13:58 ET: page-switch fix — renderDesktopFrame
    // hides sstUnderlayLayer on leaving thermal_fronts, but navigating
    // back here used to fall into this cache-hit branch and never call
    // setVisible(true), so the layer stayed hidden until reload.
    thermalFrontState.sstUnderlayLayer.setVisible(true);
    return;
  }
  thermalFrontState.sstUnderlayLoading = true;
  try {
    const region = (typeof REGION_ID !== "undefined" && REGION_ID) || "usec_south";
    // Mike, 2026-08-10 13:58 ET: prefer the EXACT source_frame from the
    // front JSON — the SST that was actually used to compute these
    // fronts — over the generic date+hour probe. Probe is only a
    // fallback if the source_frame file is missing.
    let url = null;
    let hour = null;
    if (sourceFrame) {
      const candidate = sourceFrame.startsWith("data/")
        ? sourceFrame
        : `data/${region}/sst/${sourceFrame}`;
      try {
        const head = await fetch(candidate, { method: "HEAD" });
        if (head.ok) {
          url = candidate;
          const m = sourceFrame.match(/_(\d{2})_g19\.json$/);
          hour = m ? Number(m[1]) : null;
        }
      } catch (_) { /* fall through to probe */ }
    }
    if (!url) {
      const found = await thermalFindSstFrame(region, dateKey);
      if (!found) {
        console.warn("[thermal] no SST frame found for", dateKey, region);
        return;
      }
      url = found.url;
      hour = found.hour;
    }
    const res = await fetch(url + "?t=" + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    const grid = await loadGridForVar("sst", data);
    const canvas = makeMobileRasterCanvas("sst", grid, data);
    const extent = frameExtentFromGrid(grid);
    const source = canvasToOlSource(canvas, extent);
    if (thermalFrontState.sstUnderlayLayer) {
      thermalFrontState.sstUnderlayLayer.setSource(source);
      thermalFrontState.sstUnderlayLayer.setVisible(true);
    } else {
      const layer = new ol.layer.Image({ source, zIndex: 25, opacity: 0.85 });
      map.addLayer(layer);
      thermalFrontState.sstUnderlayLayer = layer;
    }
    thermalFrontState.sstUnderlayData = data;
    thermalFrontState.sstUnderlayDate = dateKey;
    thermalFrontState.sstUnderlaySourceFrame = sourceFrame || url;
    thermalFrontState.sstUnderlayHour = hour;
    console.log("[thermal] SST underlay loaded for", dateKey, sourceFrame ? `source=${sourceFrame}` : "fallback-probe", "hour UTC", hour);
  } catch (e) {
    console.warn("[thermal] SST underlay failed:", e);
  } finally {
    thermalFrontState.sstUnderlayLoading = false;
  }
}

// Mike, 2026-08-10 13:58 ET: read the source_frame field from the front
// JSON — the SST file the fronts were actually computed from. Daily mode
// Daily mode uses the first hourly frame for the selected day. Hourly mode
// uses the currently displayed frame. Returns null only when front data has
// no source_frame, allowing the legacy probe fallback.
function thermalSourceSstFilenameForCurrentView(dateKey) {
  if (!dateKey) return null;
  // In hourly mode, the underlay must match the exact front frame currently
  // selected by the slider. In "all hours" mode we still use the selected
  // frame as the anchor raster; the vector overlay may contain other hours.
  if (typeof thermalFramesForDate === "function") {
    const dayFrames = thermalFramesForDate(dateKey);
    const current = thermalFrontState.mode === "daily"
      ? dayFrames[0]
      : (dayFrames[thermalFrontState.frameIdx] || dayFrames.at(-1));
    const sf = current?.data?.source_frame;
    if (sf) return sf;
    const first = dayFrames.find(item => item?.data?.source_frame);
    if (first?.data?.source_frame) return first.data.source_frame;
  }
  return null;
}

// Bilinear sample SST (°C) at a lon/lat point from the loaded underlay data.
function thermalSampleSstAt(lon, lat) {
  const data = thermalFrontState.sstUnderlayData;
  if (!data) return null;
  const bbox = data.bbox;
  if (!Array.isArray(bbox) || bbox.length < 4) return null;
  const west = Number(bbox[0]), south = Number(bbox[1]);
  const east = Number(bbox[2]), north = Number(bbox[3]);
  if (![west, south, east, north].every(Number.isFinite)) return null;
  if (lon < west || lon > east || lat < south || lat > north) return null;
  const nx = Number(data.nx), ny = Number(data.ny);
  if (!Number.isFinite(nx) || !Number.isFinite(ny)) return null;
  const z = data.z;
  if (!Array.isArray(z) || !z.length) return null;
  // SST frames are north_up + west_to_east per makeMobileRasterCanvas
  // (varKey === "sst" branch: rowOrder="north_up", colOrder="west_to_east").
  const fx = (lon - west) / (east - west) * (nx - 1);
  const fy = (north - lat) / (north - south) * (ny - 1);
  const i0 = Math.max(0, Math.min(nx - 1, Math.floor(fx)));
  const j0 = Math.max(0, Math.min(ny - 1, Math.floor(fy)));
  const i1 = Math.min(nx - 1, i0 + 1);
  const j1 = Math.min(ny - 1, j0 + 1);
  const tx = fx - i0, ty = fy - j0;
  const v00 = z[j0]?.[i0], v01 = z[j0]?.[i1];
  const v10 = z[j1]?.[i0], v11 = z[j1]?.[i1];
  if (![v00, v01, v10, v11].every(Number.isFinite)) {
    const single = z[Math.round(fy)]?.[Math.round(fx)];
    return Number.isFinite(single) ? single : null;
  }
  const top = v00 * (1 - tx) + v01 * tx;
  const bot = v10 * (1 - tx) + v11 * tx;
  return top * (1 - ty) + bot * ty;
}

function thermalEnsureCursorLayer(map) {
  if (!map || thermalFrontState.cursorLayer) return;
  thermalFrontState.cursorFeature = new ol.Feature({
    geometry: new ol.geom.Point(toMapProjection([(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2]))
  });
  // Mike, 2026-08-10 07:09 ET: cursor marker is now a high-contrast
  // bullseye (outer white ring + inner yellow dot). The previous
  // single 7 px white dot was reported as "not visible" — too easy
  // to lose against the colorful SST raster underneath.
  thermalFrontState.cursorFeature.setStyle(new ol.style.Style({
    image: new ol.style.Circle({
      radius: 4,
      fill: new ol.style.Fill({ color: "rgba(210,210,210,0.68)" }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.5)", width: 1 })
    })
  }));
  thermalFrontState.cursorLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: [thermalFrontState.cursorFeature], projection: "EPSG:4326" }),
    zIndex: 60,
    updateWhileAnimating: true,
    updateWhileInteracting: true,
    renderBuffer: 200,
    declutter: false
  });
  map.addLayer(thermalFrontState.cursorLayer);
  // iOS Safari has repeatedly failed to paint this one-feature OL vector
  // layer even though the feature and style exist. Keep the OL feature for
  // hit/render state, but use a DOM overlay for the captain-visible marker.
  const el = document.createElement("div");
  el.setAttribute("aria-hidden", "true");
  el.style.cssText = [
    "position:absolute", "left:0", "top:0", "width:8px", "height:8px",
    "border:1px solid rgba(0,0,0,0.5)", "border-radius:50%",
    "background:rgba(210,210,210,0.68)", "box-sizing:border-box",
    "transform:translate(-50%,-50%)", "z-index:10000",
    "pointer-events:none", "display:block"
  ].join(";");
  const target = map.getTargetElement?.() || document.getElementById("map");
  target?.appendChild(el);
  thermalFrontState.cursorEl = el;
  thermalPositionCursor(map, [(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2]);
  console.log("[thermal] cursor DOM marker created: 8px translucent gray");
}

function thermalPositionCursor(map, coord4326) {
  const el = thermalFrontState.cursorEl;
  if (!map || !el || !Array.isArray(coord4326)) return;
  const xy = toMapProjection(coord4326);
  const pixel = map.getPixelFromCoordinate?.(xy);
  if (!pixel || !Number.isFinite(pixel[0]) || !Number.isFinite(pixel[1])) return;
  el.style.left = `${pixel[0]}px`;
  el.style.top = `${pixel[1]}px`;
  el.style.display = "block";
}

// Haversine distance between two [lon, lat] points in km
function thermalHaversineKm([lon1, lat1], [lon2, lat2]) {
  const R = 6371;
  const phi1 = lat1 * Math.PI / 180;
  const phi2 = lat2 * Math.PI / 180;
  const dPhi = (lat2 - lat1) * Math.PI / 180;
  const dLam = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLam / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function thermalNearestGradient(coord) {
  const lon = coord[0];
  const lat = coord[1];
  let bestDist = Infinity;
  let bestGrad = null;
  let bestPoint = null;
  let bestDelta = null;
  // Track the nearest point that actually has valid gradient + ΔSST data.
  // Sparse fronts (some vertices have null gradient because the producer's
  // per-point SST scan didn't have a valid ΔSST there) would otherwise pick a
  // nearest point whose grad/delta are null and show no readout at all.
  let validDist = Infinity;
  let validGrad = null;
  let validPoint = null;
  let validDelta = null;
  for (const item of thermalDisplayedFrontItems()) {
    const features = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      const props = feature?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i];
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const ptLon = Number(pt[0]);
        const ptLat = Number(pt[1]);
        if (!Number.isFinite(ptLon) || !Number.isFinite(ptLat)) continue;
        const d = thermalHaversineKm([lon, lat], [ptLon, ptLat]);
        const grad = thermalGradientForFeaturePoint(props, i);
        const delta = thermalDeltaSstForFeature(props, i);
        if (d < bestDist) {
          bestDist = d;
          bestPoint = [ptLon, ptLat];
          bestGrad = grad;
          bestDelta = delta;
        }
        if (Number.isFinite(grad)) {
          if (d < validDist) {
            validDist = d;
            validPoint = [ptLon, ptLat];
            validGrad = grad;
            validDelta = delta;
          }
        }
      }
    }
  }
  if (validGrad !== null) {
    return { dist: validDist, gradient: validGrad, point: validPoint, deltaSst: validDelta };
  }
  return { dist: bestDist, gradient: bestGrad, point: bestPoint, deltaSst: bestDelta };
}

// Daily mode: compute 5km-radius mean gradient and SST delta around cursor
function thermalRadiusMean(coord) {
  const RADIUS_KM = 5;
  const gradVals = [], sstVals = [];
  for (const item of thermalDisplayedFrontItems()) {
    const features = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      const props = feature?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i];
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const ptLon = Number(pt[0]);
        const ptLat = Number(pt[1]);
        if (!Number.isFinite(ptLon) || !Number.isFinite(ptLat)) continue;
        const d = thermalHaversineKm([coord[0], coord[1]], [ptLon, ptLat]);
        if (d > RADIUS_KM) continue;
        const g = thermalGradientForFeaturePoint(props, i);
        if (g !== null && Number.isFinite(g)) gradVals.push(g);
        const ds = thermalDeltaSstForFeature(props, i);
        if (ds && Number.isFinite(ds.value)) sstVals.push(ds.value);
      }
    }
  }
  if (!gradVals.length && !sstVals.length) return null;
  return {
    gradient: gradVals.length ? gradVals.reduce((a, b) => a + b, 0) / gradVals.length : null,
    deltaSst: sstVals.length ? { label: "ΔSST", value: sstVals.reduce((a, b) => a + b, 0) / sstVals.length } : null
  };
}

function thermalRenderReadout(coord, pixel) {
  if (currentVar !== "thermal_fronts") return;
  if (coord && Number.isFinite(coord[0]) && Number.isFinite(coord[1])) {
    lastThermalCoord = coord;
    lastThermalPixel = pixel;
  }
  if (!coord || !Number.isFinite(coord[0]) || !Number.isFinite(coord[1])) return;
  let cursorCoord = coord;
  let readoutCoord = coord;
  let gradient = null;
  let deltaSst = null;
  if (thermalFrontState.mode === "daily") {
    // Daily mode: compute 5km-radius mean of gradient and SST delta across all front points within 5km
    const mean = thermalRadiusMean(coord);
    if (mean) { gradient = mean.gradient; deltaSst = mean.deltaSst; }
  } else {
    // Animation mode: snap to the nearest point on any front line segment
    // (not just the nearest vertex) with a tight, zoom-independent 2 km hit radius.
    // Clicking between two vertices on the same line still snaps to it.
    const hit = thermalNearestFrontHit(coord);
    if (pixel && hit.point && Number.isFinite(hit.gradient) && hit.dist <= MAX_THERMAL_HIT_DISTANCE_KM) {
      cursorCoord = hit.point;
      readoutCoord = hit.point;
      gradient = hit.gradient;
      deltaSst = hit.deltaSst;
    }
  }
  if (thermalFrontState.cursorFeature) thermalFrontState.cursorFeature.getGeometry().setCoordinates(cursorCoord);
  thermalPositionCursor(thermalFrontState.map, cursorCoord);
  const base = formatReadoutCoords(readoutCoord[0], readoutCoord[1]);
  if (Number.isFinite(gradient)) {
    const gradC = gradient * (tempUnit === "F" ? 9 / 5 : 1);
    const gradDisplay = thermalDistUnit === "nm"
      ? `${kmToNm(gradC).toFixed(3)} °${tempUnit}/nm`
      : `${gradC.toFixed(3)} °${tempUnit}/km`;
    const parts = [gradDisplay];
    if (deltaSst && Number.isFinite(deltaSst.value)) {
      const deltaVal = tempUnit === "F" ? deltaSst.value * 9 / 5 : deltaSst.value;
      parts.push(`${deltaSst.label} ${deltaVal.toFixed(2)} ${tempUnitLabel()}`);
    }
    setReadout(`${base}, ${parts.join(", ")}`);
  } else {
    // Mike, 2026-08-10 07:09 ET: when no front is within the hit
    // radius, sample SST at the click location so the readout still
    // gives the captain something useful instead of just coords.
    const sst = thermalSampleSstAt(readoutCoord[0], readoutCoord[1]);
    if (sst !== null && Number.isFinite(sst)) {
      setReadout(`${base}, SST ${formatSstValue(sst)}`);
    } else {
      setReadout(base);
    }
  }
}

async function thermalInitMap() {
  document.body.classList.remove("mobile-map-ready");
  const map = await initDesktopMapIfNeeded();
  thermalFrontState.map = map;
  if (desktopMapState.imageLayer) desktopMapState.imageLayer.setVisible(false);
  if (desktopMapState.arrowLayer) desktopMapState.arrowLayer.setVisible(false);
  if (desktopMapState.landLayer) desktopMapState.landLayer.setVisible(true);
  if (desktopMapState.placeLayer) desktopMapState.placeLayer.setVisible(true);
  await ensureDesktopLandLayer(map);
  await ensureDesktopPlaceLayer(map);
  thermalEnsureCursorLayer(map);
  if (thermalFrontState.cursorLayer) thermalFrontState.cursorLayer.setVisible(true);
  if (thermalFrontState.cursorEl) thermalFrontState.cursorEl.style.display = "block";
  // The SST source_frame is unavailable until thermalLoadData() has loaded
  // the front JSON. renderThermalFrontsNative() installs the underlay after
  // that load; here only restore visibility when returning to this page.
  if (thermalFrontState.sstUnderlayLayer) {
    thermalFrontState.sstUnderlayLayer.setVisible(true);
  }
  if (!map.__thermalReadoutInstalled) {
    map.__thermalReadoutInstalled = true;
    // The thermal-fronts map is in EPSG:3857 (Web Mercator). ev.coordinate
    // is in meters; thermalRenderReadout + thermalNearestGradient expect
    // 4326 (lon/lat). Transform once before passing through. pixel is
    // screen-relative and stays as-is.
    const to4326 = (ev) => {
      if (!ev || !ev.coordinate) return null;
      const xy4326 = ol.proj.transform(ev.coordinate, "EPSG:3857", "EPSG:4326");
      return { coord: xy4326, pixel: ev.pixel };
    };
    map.on("pointermove", ev => {
      if (currentVar === "thermal_fronts") {
        const x = to4326(ev);
        if (!x) return;
        thermalRenderReadout(x.coord, x.pixel);
        thermalFrontHoverTip(x.coord, x.pixel);
      }
    });
    map.on("pointerdrag", ev => {
      if (currentVar !== "thermal_fronts") return;
      const x = to4326(ev);
      if (x) thermalRenderReadout(x.coord, x.pixel);
    });
    map.on("click", ev => {
      if (currentVar === "thermal_fronts") {
        const x = to4326(ev);
        if (!x) return;
        thermalRenderReadout(x.coord, x.pixel);
        thermalFrontHoverTip(x.coord, x.pixel);
      }
    });
  }
  return map;
}

function thermalDailyStats() {
  const dayItem = thermalFrontState.dailyFrames[thermalFrontState.frameIdx];
  if (!dayItem) return null;
  const dayFrames = thermalFramesForDate(dayItem.date);
  const gradVals = [], sstVals = [];
  for (const item of dayFrames) {
    const features = Array.isArray(item?.data?.features) ? item.data.features : [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      const props = feature?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const g = thermalGradientForFeaturePoint(props, i);
        if (thermalIsStrongFrontGradient(g)) gradVals.push(g);
        const ds = thermalDeltaSstForFeature(props, i);
        if (thermalIsStrongFrontGradient(g) && ds && Number.isFinite(ds.value)) sstVals.push(ds.value);
      }
    }
  }
  if (!gradVals.length && !sstVals.length) return null;
  const meanGrad = gradVals.length ? gradVals.reduce((a, b) => a + b, 0) / gradVals.length : null;
  const meanSst = sstVals.length ? sstVals.reduce((a, b) => a + b, 0) / sstVals.length : null;
  return { meanGrad, meanSst };
}

function thermalRenderFrontLayer() {
  const map = thermalFrontState.map;
  if (!map) return;
  // Daily mode: v4 - render density-thresholded cell centers as points
  // (NO lines). One Point per 0.01° cell that was hit by >=2 hourly
  // detections for that day. Color = day-in-period, radius = subtle.
  // In "all days this period" mode, the density heatmap is the primary
  // visualization across the full period — the point layer would be a
  // noisy pile of small symbols stacked on top of it, so suppress it.
  if (thermalFrontState.mode === "daily") {
    // Daily mode (both single-day and "all days this period") renders
    // the v4-refine Point layer. The density heatmap underneath is
    // hidden in both modes; the points are the primary visualization
    // and the heatmap's "stippled mesh" effect was reported as
    // unreadable (Mike, 2026-06-12). All-days daily mode previously
    // suppressed this layer; now it renders one Point per
    // (day, surviving cell), colored by day-in-period, so the visual
    // matches the offline v8_refine_all_days.png prototype.
    //
    // v4.1 (Mike, 2026-06-13 11:50): apply the chip multi-select
    // filter on top of the all-days branch. Single-day branch is
    // unchanged. Colors are still period-relative (oldestMs /
    // latestMs come from the FULL period, not the selected subset,
    // so a day that's red stays red even when only the oldest 3 are
    // picked).
    const allDaysSelected = thermalAllDayCb?.checked;
    const dayItems = allDaysSelected
      ? thermalFrontState.dailyFrames.filter(d => thermalFrontState.selectedDaySet.has(d.date))
      : [thermalFrontState.dailyFrames[thermalFrontState.frameIdx]].filter(Boolean);
    if (!dayItems.length) {
      if (thermalFrontState.frontLayer) thermalFrontState.frontLayer.setSource(null);
      return;
    }
    const oldestMs = thermalFrontState.dailyFrames[0]?.t ?? Date.now();
    const latestMs = thermalFrontState.dailyFrames.at(-1)?.t ?? oldestMs;
    const features = [];
    // v4-refine point style (Mike, 2026-06-12, refined 2026-06-13):
    //   - Open circle, no fill (overlapping day symbols stay separable)
    //   - Base radius 1.5 px, base stroke 0.5 px (matches the
    //     matplotlib v8_refine_all_days.png prototype at default zoom)
    //   - Resolution-aware scale (see thermalPointStyleScale): the
    //     style function multiplies radius and stroke by a scale that
    //     grows linearly with the inverse of map resolution, capped
    //     at 2.8x. Mike's report (2026-06-13, ~00:36 ET):
    //     "When zooming in, the points get smaller and smaller,
    //     circles lines get thinner and thinner" — the base CSS-pixel
    //     size was staying flat while the basemap got more detailed,
    //     so the symbols became proportionally invisible. The scale
    //     keeps them perceptually constant-or-larger at every zoom.
    //   - Color = rainbow by day-in-period (oldest=violet, newest=red)
    //   - Tooltip on hover shows the date + UTC hour of the frame
    const POINT_RADIUS = 0.75;
    const POINT_STROKE = 0.5;
    for (const dayItem of dayItems) {
      const color = thermalColorForDayInPeriod(dayItem.t, oldestMs, latestMs);
      const dayFrames = thermalFramesForDate(dayItem.date);
      const points = thermalCollectFrontPoints(dayFrames);
      if (!points.length) continue;
      const field = thermalBuildDensityField(points, dayFrames.length, dayItem.date);
      // v4-refine: pull each surviving cell's location toward the
      // top-3 surviving cells in its 8-neighborhood (1-stride). Each
      // output point is the unweighted mean of those top-3 cell
      // centers; its count is the mean of their counts (so the
      // radius still encodes local density at the smoothed location).
      const refined = thermalRefineDensityField(field, 3);
      for (const { lon, lat, count } of refined.values()) {
        const feature = new ol.Feature({ geometry: new ol.geom.Point(toMapProjection([lon, lat])) });
        const d = new Date(dayItem.t);
        const hh = d.getUTCHours().toString().padStart(2, "0");
        const mm = d.getUTCMinutes().toString().padStart(2, "0");
        feature.setProperties({
          color,
          pointRadius: POINT_RADIUS,
          pointStrokeWidth: POINT_STROKE,
          densityCount: count,
          dayDate: dayItem.date,
          frameTime: dayItem.t,
          // Hover tooltip payload (rendered by thermalFrontHoverTip):
          //   "2026-06-06 14:00 UTC · 7 det"
          hoverLabel: `${dayItem.date} ${hh}:${mm} UTC · ${count} det`
        });
        features.push(feature);
      }
    }
    if (window.__VIEW_BUILD_THERMAL) {
      window.__VIEW_BUILD_THERMAL.dailyFrontGeometry = features.length ? "Point" : "none";
      window.__VIEW_BUILD_THERMAL.dailyFrontPointCount = features.length;
    }
    const source = new ol.source.Vector({ features, projection: "EPSG:4326" });
    if (thermalFrontState.frontLayer) thermalFrontState.frontLayer.setSource(source);
    else {
      thermalFrontState.frontLayer = new ol.layer.Vector({
        source,
        style: (feature, resolution) => thermalFeatureStyle(feature, resolution, map),
        zIndex: 45,
        updateWhileAnimating: true,
        updateWhileInteracting: true
      });
      map.addLayer(thermalFrontState.frontLayer);
    }
    thermalFrontState.frontLayer.setVisible(true);
    return;
  }
  // Hourly mode: every frame is colored by its UTC hour, not by
  // visible-subset oldest/latest. Domain = full UTC day.
  const items = thermalDisplayedFrontItems();
  const features = [];
  for (const item of items) {
    const color = thermalColorForHourInDay(item.t);
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sourceFeature of sourceFeatures) {
      const coords = sourceFeature?.geometry?.coordinates || [];
      const props = sourceFeature?.properties || {};
      for (const segment of thermalVisibleSegmentedLineStrings(coords, props)) {
        const segment3857 = toMapProjection(segment.coords);
        const feature = new ol.Feature({ geometry: new ol.geom.LineString(segment3857) });
        feature.setProperties({
          sourceProps: props,
          sourceCoords: coords,
          frameTime: item.t,
          color,
          lineWidth: items.length === 1 ? 2.8 : 1.7,
          lineOpacity: 1.0,
          strongFront: segment.strong
        });
        features.push(feature);
      }
    }
  }
  const source = new ol.source.Vector({ features, projection: "EPSG:4326" });
  if (thermalFrontState.frontLayer) thermalFrontState.frontLayer.setSource(source);
  else {
    thermalFrontState.frontLayer = new ol.layer.Vector({
      source,
      style: (feature, resolution) => thermalFeatureStyle(feature, resolution, map),
      zIndex: 45,
      updateWhileAnimating: true,
      updateWhileInteracting: true
    });
    map.addLayer(thermalFrontState.frontLayer);
  }
  thermalFrontState.frontLayer.setVisible(true);
}

function thermalBuildDailyFrames() {
  thermalFrontState.dailyFrames = [];
  const seen = new Set();
  for (const item of [...thermalFrontState.frameData].sort((a, b) => a.t - b.t)) {
    const date = thermalDateKey(item.t);
    if (seen.has(date)) continue;
    seen.add(date);
    thermalFrontState.dailyFrames.push({ date, t: item.t, item });
  }
  thermalFrontState.hourlyDays = thermalFrontState.dailyFrames.map(item => item.date);
}

function thermalSyncDaySelect() {
  if (!thermalDaySelect) return;
  thermalDaySelect.innerHTML = "";
  for (const date of thermalFrontState.hourlyDays) {
    const opt = document.createElement("option");
    opt.value = date;
    opt.textContent = date;
    thermalDaySelect.appendChild(opt);
  }
  if (!thermalFrontState.selectedDate || !thermalFrontState.hourlyDays.includes(thermalFrontState.selectedDate)) {
    thermalFrontState.selectedDate = thermalFrontState.hourlyDays.at(-1) || "";
  }
  thermalDaySelect.value = thermalFrontState.selectedDate;
}

// v4.1: day-chip multi-select for daily-mode subset.
// Mike, 2026-06-13 11:50 ET: "during daily mode, add options to
// select to load any N days within this period so user can view a
// set of selected days."
//
// Behavior:
//  - Chips rebuilt from thermalFrontState.dailyFrames (oldest→newest)
//  - Each chip's swatch = thermalColorForDayInPeriod(t, oldest, latest)
//    so the chip visually matches its on-map color (period-relative
//    domain; rescaling is intentionally NOT done per-selection)
//  - Tap a chip to toggle in/out of thermalFrontState.selectedDaySet
//  - Master presets: All / None / Last 3 / Last 7
//  - First build of the day list initializes selectedDaySet to all
//    dates (zero behavior change vs. pre-chip). Subsequent builds
//    preserve user selection (prune dates that no longer exist).
//  - Session-only state; not persisted to localStorage.

function thermalRebuildDayChips() {
  const wrap = document.getElementById("thermal-day-chips");
  if (!wrap) return;
  wrap.innerHTML = "";
  const dayItems = thermalFrontState.dailyFrames;
  const allDates = dayItems.map(d => d.date);
  const set = thermalFrontState.selectedDaySet;
  if (!thermalFrontState.dayChipInitialized && allDates.length) {
    // First run after page load: default to "all selected" so there
    // is no behavior change for users who never open the chip panel.
    for (const d of allDates) set.add(d);
    thermalFrontState.dayChipInitialized = true;
  } else {
    // Prune any dates that have rolled out of the period, but do NOT
    // re-fill an empty set (that would stomp an explicit "None").
    for (const d of Array.from(set)) {
      if (!allDates.includes(d)) set.delete(d);
    }
  }
  if (!dayItems.length) {
    thermalUpdateDayChipsCount();
    thermalRefreshDayChipsVisibility();
    return;
  }
  const oldestMs = dayItems[0]?.t ?? Date.now();
  const latestMs = dayItems.at(-1)?.t ?? oldestMs;
  for (const dayItem of dayItems) {
    const color = thermalColorForDayInPeriod(dayItem.t, oldestMs, latestMs);
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "day-chip";
    chip.dataset.date = dayItem.date;
    chip.setAttribute("aria-pressed", set.has(dayItem.date) ? "true" : "false");
    const sw = document.createElement("span");
    sw.className = "day-chip-swatch";
    sw.style.background = color;
    const lbl = document.createElement("span");
    // Compact date label: "Jun 7" (locale-aware, UTC anchored so the
    // label matches the data date string YYYY-MM-DD exactly).
    const dd = new Date(dayItem.date + "T00:00:00Z");
    const month = dd.toLocaleString("en-US", { month: "short", timeZone: "UTC" });
    const dom = dd.getUTCDate();
    lbl.textContent = `${month} ${dom}`;
    chip.appendChild(sw);
    chip.appendChild(lbl);
    chip.addEventListener("click", () => thermalToggleDay(dayItem.date));
    wrap.appendChild(chip);
  }
  thermalRefreshDayChipStyles();
  thermalUpdateDayChipsCount();
  thermalRefreshDayChipsVisibility();
}

function thermalRefreshDayChipStyles() {
  const wrap = document.getElementById("thermal-day-chips");
  if (!wrap) return;
  const set = thermalFrontState.selectedDaySet;
  for (const chip of wrap.querySelectorAll(".day-chip")) {
    const sel = set.has(chip.dataset.date);
    chip.classList.toggle("selected", sel);
    chip.classList.toggle("unselected", !sel);
    chip.setAttribute("aria-pressed", sel ? "true" : "false");
  }
}

function thermalUpdateDayChipsCount() {
  const el = document.getElementById("thermal-day-chips-count");
  if (!el) return;
  const total = thermalFrontState.dailyFrames.length;
  const sel = thermalFrontState.selectedDaySet.size;
  el.textContent = `${sel}/${total}`;
}

function thermalRefreshDayChipsVisibility() {
  const panel = document.getElementById("thermal-day-chips-panel");
  if (!panel) return;
  // Show only when daily mode + "All days" checkbox is on. In hourly
  // mode or single-day daily mode, the chips are meaningless and the
  // panel collapses.
  const show = thermalFrontState.mode === "daily" && !!thermalAllDayCb?.checked;
  panel.classList.toggle("hidden", !show);
}

function thermalToggleDay(date) {
  const s = thermalFrontState.selectedDaySet;
  if (s.has(date)) s.delete(date);
  else s.add(date);
  thermalRefreshDayChipStyles();
  thermalUpdateDayChipsCount();
  // Re-render the front layer only if the chip selection is
  // actually being applied (all-days mode in daily view).
  if (thermalFrontState.mode === "daily" && thermalAllDayCb?.checked) {
    thermalRenderFrontLayer();
    thermalUpdateLegendAndStatus();
  }
}

function thermalApplyDayPreset(preset) {
  const allDates = thermalFrontState.dailyFrames.map(d => d.date);
  const s = thermalFrontState.selectedDaySet;
  s.clear();
  if (preset === "all") {
    for (const d of allDates) s.add(d);
  } else if (preset === "last3") {
    for (const d of allDates.slice(-3)) s.add(d);
  } else if (preset === "last7") {
    for (const d of allDates.slice(-7)) s.add(d);
  }
  // "none" leaves the set empty
  thermalRefreshDayChipStyles();
  thermalUpdateDayChipsCount();
  if (thermalFrontState.mode === "daily" && thermalAllDayCb?.checked) {
    thermalRenderFrontLayer();
    thermalUpdateLegendAndStatus();
  }
}

function updateThermalFrontsNav() {
  const list = thermalActiveFrameList();
  thermalFrontState.frameIdx = Math.max(0, Math.min(thermalFrontState.frameIdx, Math.max(0, list.length - 1)));
  if (slider) {
    slider.min = 0;
    slider.max = Math.max(0, list.length - 1);
    slider.value = thermalFrontState.frameIdx;
    slider.disabled = list.length <= 1;
  }
  if (prevBtn) prevBtn.disabled = list.length <= 1;
  if (nextBtn) nextBtn.disabled = list.length <= 1;
  if (playBtn) playBtn.disabled = list.length <= 1;
  if (frameLbl) {
    const label = thermalFrontState.mode === "daily"
      ? (thermalFrontState.dailyFrames[thermalFrontState.frameIdx]?.date || "")
      : (list[thermalFrontState.frameIdx] ? thermalFrameTimeLabel(list[thermalFrontState.frameIdx].t) : "");
    frameLbl.textContent = label;
    frameLbl.style.display = label ? "inline-flex" : "none";
  }
  if (thermalAllDayLabel) {
    thermalAllDayLabel.textContent = thermalFrontState.mode === "daily" ? "All days this period" : "All hours this day";
  }
}

function thermalUpdateLegendAndStatus() {
  if (currentVar !== "thermal_fronts") return;
  const legendEl = document.getElementById("legend");
  const list = thermalActiveFrameList();
  if (thermalFrontState.mode === "daily") {
    const dayItem = thermalFrontState.dailyFrames[thermalFrontState.frameIdx];
    const count = dayItem ? thermalFramesForDate(dayItem.date).length : 0;
    // v4.1: shownDays now respects the chip multi-select. In single
    // day mode (all-days off) it's still 1. In all-days mode, count
    // the selected subset so the status line matches what the user
    // actually sees on the map.
    let shownDays = 1;
    if (thermalAllDayCb?.checked) {
      shownDays = 0;
      for (const d of thermalFrontState.dailyFrames) {
        if (thermalFrontState.selectedDaySet.has(d.date)) shownDays++;
      }
    }
    // Total hourly frames across all visible days (replaces the
    // removed density field's hourlyCount).
    let totalHourly = count;
    if (shownDays > 1) {
      totalHourly = 0;
      for (const d of thermalFrontState.dailyFrames) {
        if (thermalFrontState.selectedDaySet.has(d.date)) {
          totalHourly += thermalFramesForDate(d.date).length;
        }
      }
    }
    let sourceText;
    if (shownDays === 0) {
      sourceText = "no days selected — pick at least one chip";
    } else if (shownDays === 1) {
      sourceText = `${count} hourly frames`;
    } else {
      sourceText = `${totalHourly} hourly frames across ${shownDays} days`;
    }
    const stats = thermalDailyStats();
    const unitLabel = `°${tempUnit}/${thermalDistUnit}`;
    const sstLabel = tempUnit === "F" ? "°F" : "°C";
    let statsText = ` - ${sourceText}`;
    if (stats && shownDays > 0) {
      if (stats.meanGrad !== null) {
        const displayGrad = stats.meanGrad * (tempUnit === "F" ? 9 / 5 : 1) * (thermalDistUnit === "nm" ? 1.852 : 1);
        statsText += ` | mean gradient: ${displayGrad.toFixed(3)} ${unitLabel}`;
      }
      if (stats.meanSst !== null) {
        const displaySst = tempUnit === "F" ? stats.meanSst * 9 / 5 : stats.meanSst;
        statsText += ` | mean ΔSST: ${displaySst.toFixed(2)}${sstLabel}`;
      }
    }
    if (toolbarStatus) toolbarStatus.textContent = `${thermalFrontState.frameIdx + 1}/${thermalFrontState.dailyFrames.length} daily frames - ${dayItem?.date || ""}${statsText}`;
    if (legendEl) {
      legendEl.style.display = "";
      const allDays = !!thermalAllDayCb?.checked;
      const subsetActive = allDays && shownDays !== thermalFrontState.dailyFrames.length;
      legendEl.textContent = subsetActive
        ? `Color = day in period (rainbow). Showing ${shownDays} of ${thermalFrontState.dailyFrames.length} selected days. Open circles = v4-refine cell centers.`
        : (allDays
          ? "Color = day (rainbow: oldest=violet → newest=red). Open circles = v4-refine cell centers."
          : "Open circles = v4-refine cell centers. Hover for date/time.");
    }
  } else {
    const total = thermalAllDayCb?.checked ? list.length : 1;
    if (toolbarStatus) toolbarStatus.textContent = `${thermalFrontState.frameIdx + 1}/${list.length} hourly frames - ${thermalFrontState.selectedDate || ""} - showing ${total} - ${thermalDisplayThresholdLabel()}`;
    const displayedCount = thermalDisplayedFrontItems().length;
    if (legendEl) {
      legendEl.style.display = displayedCount > 1 ? "" : "none";
      legendEl.textContent = displayedCount > 1
        ? `Color = time: purple oldest -> red newest | ${thermalDisplayThresholdLabel()}`
        : thermalDisplayThresholdLabel();
    }
  }
}

function thermalSetMode(mode) {
  const priorTime = thermalCurrentFrameTime();
  thermalFrontState.mode = mode;
  thermalModeHourlyBtn?.classList.toggle("active", mode === "animation");
  thermalModeDailyBtn?.classList.toggle("active", mode === "daily");
  thermalDayRow?.classList.toggle("hidden", mode !== "animation");
  thermalAllDayToggle?.classList.remove("hidden");
  if (thermalAllDayCb) thermalAllDayCb.checked = false;
  // Same checkbox, mode-conditional semantics:
  //  - hourly mode = "all hours this day"   (plays every hour of the selected day)
  //  - daily  mode = "all days this period" (aggregates density across all days)
  if (thermalAllDayLabel) {
    thermalAllDayLabel.textContent = mode === "daily"
      ? "All days this period"
      : "All hours this day";
  }
  if (mode === "daily") {
    const previousDate = thermalFrontState.selectedDate || thermalDateKey(thermalActiveFrameList()[thermalFrontState.frameIdx]?.t || Date.now());
    thermalFrontState.frameIdx = Math.max(0, thermalFrontState.dailyFrames.findIndex(item => item.date === previousDate));
  } else {
    thermalFrontState.frameIdx = thermalClosestFrameIndex(thermalActiveFrameList(), priorTime);
  }
  thermalRefreshDayChipsVisibility();
  renderThermalFrontsNative();
}

function thermalStep(delta) {
  const list = thermalActiveFrameList();
  if (!list.length) return;
  thermalFrontState.frameIdx = (thermalFrontState.frameIdx + delta + list.length) % list.length;
  renderThermalFrontsNative();
}

function thermalSetFrame(idx) {
  thermalFrontState.frameIdx = Number(idx) || 0;
  setPlaying(false);
  renderThermalFrontsNative();
}

async function thermalLoadData() {
  if (thermalFrontState.loading) return;
  if (thermalFrontState.initialized && thermalFrontState.loadedRegion === REGION_ID) return;
  thermalFrontState.loading = true;
  if (toolbarStatus) toolbarStatus.textContent = "Loading thermal fronts...";
  try {
    const idx = await loadIndex();
    const fbv = idx.frames || idx.framesByVar || idx.frames_by_var || {};
    const sourceFrames = (fbv.thermal_fronts && fbv.thermal_fronts.length) ? fbv.thermal_fronts : (fbv.sst_front || []);
    thermalFrontState.frames = sourceFrames
      .map(f => ({ ...f, t: epochMsForFrame("sst_front", f) ?? epochMsForFrame("thermal_fronts", f) }))
      .filter(f => Number.isFinite(f.t))
      .sort((a, b) => a.t - b.t);
    const latest = thermalFrontState.frames.at(-1)?.t;
    if (latest) thermalFrontState.frames = thermalFrontState.frames.filter(f => latest - f.t <= 21 * 864e5);
    thermalFrontState.frameData = await Promise.all(thermalFrontState.frames.map(async f => {
      const res = await fetch(framePathOf(f) + "?t=" + Date.now());
      return { meta: f, t: f.t, data: res.ok ? await res.json() : { features: [] } };
    }));
    thermalFrontState.frameData = thermalFrontState.frameData.filter(item => Array.isArray(item.data?.features) && item.data.features.length > 0);
    thermalBuildDailyFrames();
    const requestedMs = requestedTimeFromParams();
    const requestedIdx = thermalClosestFrameIndex(thermalFrontState.frameData, requestedMs);
    thermalFrontState.selectedDate = Number.isFinite(requestedMs)
      ? thermalDateKey(thermalFrontState.frameData[requestedIdx]?.t || requestedMs)
      : (thermalFrontState.hourlyDays.at(-1) || "");
    thermalSyncDaySelect();
    thermalRebuildDayChips();
    thermalFrontState.frameIdx = thermalClosestFrameIndex(thermalActiveFrameList(), requestedMs);
    thermalFrontState.initialized = true;
    thermalFrontState.loadedRegion = REGION_ID;
    window.__thermalFrontsState = thermalFrontState;
  } finally {
    thermalFrontState.loading = false;
  }
}

async function renderThermalFrontsNative() {
  syncThermalFrontsVisibility();
  document.body.classList.remove("mobile-map-ready");
  plotDiv.style.display = "block";
  const map = await thermalInitMap();
  await thermalLoadData();
  if (!thermalFrontState.frameData.length) {
    if (toolbarStatus) toolbarStatus.textContent = "No thermal-front frames available for this region.";
    return;
  }
  const requestedViewport = viewportFromParams();
  if (!map.__thermalInitialFitDone) {
    map.updateSize();
    // v4.16 switched the thermal-fronts map view to EPSG:3857 (Web Mercator)
    // to match the OFM vector tile schema. The viewport extent and BBOX are
    // still in EPSG:4326 (lat/lon) by viewer convention. OL's view.fit() does
    // NOT auto-detect projection — passing a 4326 extent to a 3857 view
    // causes the map to fit to a tiny region near (0, 0) at the equator,
    // which leaves the entire US East Coast off-screen and produces
    // near-zero readout values when the user moves the cursor. Transform
    // the extent to 3857 before fitting.
    const extent4326 = requestedViewport
      ? [requestedViewport.xRange[0], requestedViewport.yRange[0], requestedViewport.xRange[1], requestedViewport.yRange[1]]
      : BBOX.map(Number);
    const viewProjCode = map.getView().getProjection().getCode();
    const extentForFit = viewProjCode === "EPSG:4326"
      ? extent4326
      : ol.proj.transformExtent(extent4326, "EPSG:4326", viewProjCode);
    map.getView().fit(extentForFit, {
      size: map.getSize(),
      padding: [58, 0, 0, 0],
      nearest: true
    });
    map.__thermalInitialFitDone = true;
  }
  const list = thermalActiveFrameList();
  thermalFrontState.frameIdx = Math.max(0, Math.min(thermalFrontState.frameIdx, Math.max(0, list.length - 1)));
  thermalRenderFrontLayer();
  // Must run after thermalLoadData() and after frameIdx is clamped: this is
  // where the exact front item's source_frame is available. Await it so a
  // rapid page/frame switch cannot leave the old generic raster cached.
  await thermalEnsureSstUnderlay(map, thermalFrontState.selectedDate);
  updateThermalFrontsNav();
  thermalUpdateLegendAndStatus();
  map.updateSize();
}

async function addNearestFrontOverlay(fig, baseVar, baseFrameMeta) {
  let frontVar = baseVar === "chl" ? "chl_front" : baseVar === "sst" ? "sst_front" : null;
  if (showGlobalSstFrontOverlay && baseVar !== "sst_front") frontVar = "sst_front";
  if (!frontVar) return;
  if (frontVar === "chl_front" && !showChlFrontOverlay) return;
  if (frontVar === "sst_front" && !(showSstFrontOverlay || showGlobalSstFrontOverlay)) return;

  const frontFrames = framesByVar[frontVar] || [];
  if (!frontFrames.length) return;
  const finiteFrontTimes = (frameTimesByVar[frontVar] || []).filter(Number.isFinite);
  const curMs = epochMsForFrame(baseVar, baseFrameMeta) ?? finiteFrontTimes.at(-1) ?? null;
  const frontTimes = frameTimesByVar[frontVar] || [];
  let bestIdx = 0;
  let bestDiff = Infinity;
  for (let i = 0; i < frontFrames.length; i++) {
    const t = frontTimes[i];
    if (!Number.isFinite(t)) continue;
    const d = Math.abs(t - curMs);
    if (d < bestDiff) {
      bestDiff = d;
      bestIdx = i;
    }
  }

  try {
    const frontData = await fetchFrameData(frontVar, frontFrames[bestIdx]);
    const frontGrid = await loadGridForVar(frontVar, frontData);
    const frontFig = buildFrontLines(frontGrid, frontData, frontVar);
    const label = formatRelativeFrontTime((frontTimes[bestIdx] ?? NaN) - curMs);
    for (const trace of frontFig.data || []) {
      trace.name = label ? `Thermal front (${label})` : "Thermal front";
      trace.hovertemplate = label ? `<b>Thermal front</b><br>${label}<extra></extra>` : trace.hovertemplate;
    }
    fig.data.push(...frontFig.data);

  } catch (e) {
    console.error(`${frontVar} overlay failed:`, e);
  }
}

async function setCurrentVar(v, keepTime = true, keepRange = true) {
  const prevVar = currentVar;
  const prevFrames = framesByVar[prevVar] || [];
  const prevFrame = prevFrames[currentFrameIdx] || null;
  const prevT = (keepTime && prevFrame) ? epochMsForFrame(prevVar, prevFrame) : null;

  // Save the live OL/Plotly viewport before switching products.
  const liveRange = keepRange ? currentViewportRanges() : null;
  const savedRange = liveRange
    ? { x: liveRange.xRange, y: liveRange.yRange }
    : ((keepRange && viewState.hasRange) ? { x: viewState.xRange, y: viewState.yRange } : null);

  currentVar = v;
  // Reset combined map state when switching away from combined
  if (v !== "combined") {
    if (window._combinedMap) {
      try { window._combinedMap.dispose(); } catch (_) {}
      window._combinedMap.setTarget(undefined);
      window._combinedMap = null;
    }
  }

  // Issue #3 fix: clear thermal-fronts pointer cache + readout DOM on mode change.
  // The thermal map stores the last hover coord/pixel in module-level state so
  // unit-toggle handlers can re-render the readout. When the user navigates
  // away (or back into) thermal_fronts, that cache must not leak — otherwise
  // a stale lat/lon or thermal gradient shows on a non-thermal page, or a
  // new thermal page starts with the previous page's last hover. The hover
  // tip DOM is also cleared because pointermove no longer fires for it once
  // currentVar leaves thermal_fronts.
  const wasThermal = prevVar === "thermal_fronts";
  const isThermal = v === "thermal_fronts";
  if (wasThermal || isThermal) {
    lastThermalCoord = null;
    lastThermalPixel = null;
    if (wasThermal || isThermal) {
      const tipEl = document.getElementById("thermal-hover-tip");
      if (tipEl) tipEl.style.display = "none";
    }
    if (wasThermal && !isThermal && typeof setReadout === "function") {
      setReadout("");
    }
  }

  document.body.classList.toggle("combined-mode", v === "combined");
  document.body.classList.toggle("thermal-fronts-mode", v === "thermal_fronts");

  const frames = framesByVar[currentVar] || [];
  const times = frameTimesByVar[currentVar] || [];

  if (frames.length) currentFrameIdx = (keepTime && prevT !== null) ? closestDaytimeIndex(currentVar, times, frames, prevT) : frames.length - 1;
  else currentFrameIdx = 0;

  // Restore saved geographic viewport after switching
  if (savedRange) {
    viewState.xRange = savedRange.x;
    viewState.yRange = savedRange.y;
    viewState.hasRange = true;
  }

  syncRangeInputsToVar();
  updateSliderUI();
  syncTimeControls();
  syncArrowLegend();
  syncFrontOverlayControls();
  syncThermalFrontsVisibility();

  if (frames.length) await showFrame();
  else return;
}

function stepFrame(delta) {
  if (currentVar === "thermal_fronts") {
    thermalStep(delta);
    return;
  }
  const frames = framesByVar[currentVar] || [];
  const n = frames.length;
  if (!n) return;
  currentFrameIdx = (currentFrameIdx + delta + n) % n;
  slider.value = currentFrameIdx;
  showFrame();
}

function setPlaying(on) {
  if (on === playing) return;
  playing = on;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  } else {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
  }
}


function setPlaySpeed(mult) {
  const m = Number(mult);
  if (!isFinite(m) || m <= 0) return;
  playSpeed = m;
  playIntervalMs = Math.max(60, Math.round(BASE_PLAY_MS / playSpeed));
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  }
}
