function updateBathyContours(map) {
  const bd = window._bathyData;
  const layer = window._bathyLayer;
  if (!bd || !layer) return;
  const source = layer.getSource();
  source.clear();

  const extent = map.getView().calculateExtent(map.getSize());
  const [vx0, vy0, vx1, vy1] = extent;

  const maxW = 400, maxH = 600;
  const sx = Math.max(1, Math.floor(bd.nx / maxW));
  const sy = Math.max(1, Math.floor(bd.ny / maxH));

  const maxDepth = depthMaxInExtent(bd, extent, sx, sy);
  const levels = generateContourLevels(maxDepth);

  for (const level of levels) {
    const segs = extractContourSegments(bd, level, sx, sy, extent);
    for (const seg of segs) {
      source.addFeature(new ol.Feature({ geometry: new ol.geom.LineString(seg) }));
    }
  }
}

function depthMaxInExtent(bd, extent, sx, sy) {
  const [vx0, vy0, vx1, vy1] = extent;
  let maxD = 0;
  for (let row = 0; row < bd.ny; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    for (let col = 0; col < bd.nx; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const d = bd.depth[row][col];
      if (d > maxD) maxD = d;
    }
  }
  return maxD;
}

function generateContourLevels(maxDepth) {
  const std = [50, 100, 200, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
  if (maxDepth < 200) return [50, 100, 200].filter(l => l <= maxDepth + 200);
  return std.filter(l => l <= maxDepth + 200);
}

function extractContourSegments(bd, level, sx, sy, extent) {
  const [vx0, vy0, vx1, vy1] = extent;
  const segments = [];
  for (let row = 1; row < bd.ny - 1; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    const nextLat = bd.yAxis[Math.min(row + sy, bd.ny - 1)];
    for (let col = 1; col < bd.nx - 1; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const nextLon = bd.xAxis[Math.min(col + sx, bd.nx - 1)];
      const tl = bd.depth[row][col];
      const tr = bd.depth[row][Math.min(col + sx, bd.nx - 1)];
      const br = bd.depth[Math.min(row + sy, bd.ny - 1)][Math.min(col + sx, bd.nx - 1)];
      const bl = bd.depth[Math.min(row + sy, bd.ny - 1)][col];
      const crossings = [];
      if ((tl < level) !== (tr < level)) {
        const t = (level - tl) / (tr - tl);
        crossings.push([[lon + t * (nextLon - lon), lat], "top"]);
      }
      if ((bl < level) !== (br < level)) {
        const t = (level - bl) / (br - bl);
        crossings.push([[lon + t * (nextLon - lon), nextLat], "bottom"]);
      }
      if ((tl < level) !== (bl < level)) {
        const t = (level - tl) / (bl - tl);
        crossings.push([[lon, lat + t * (nextLat - lat)], "left"]);
      }
      if ((tr < level) !== (br < level)) {
        const t = (level - tr) / (br - tr);
        crossings.push([[nextLon, lat + t * (nextLat - lat)], "right"]);
      }
      if (crossings.length >= 2) {
        const coords = crossings.slice(0, 2).map(c => c[0]);
        if (coords[0] && coords[1] && Math.hypot(coords[0][0] - coords[1][0], coords[0][1] - coords[1][1]) > 0.01) {
          segments.push(coords);
        }
      }
    }
  }
  return segments;
}

function renderMobileReadout(lon, lat) {
  if (!isFinite(lon) || !isFinite(lat)) return;
  updateMobileCursor(lon, lat);
  const base = formatReadoutCoords(lon, lat);
  const val = sampleMobileValueAt(lon, lat);
  if (val === null || val === undefined) {
    setReadout(base);
    return;
  }
  if (!isFinite(val) || isNaN(val)) {
    setReadout(base);
    return;
  }
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";
  if (currentVar === "sst") setReadout(`${base}, ${formatSstValue(val)}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else if (currentVar === "uv") setReadout(`${base}, SSH ${formatSshValue(val)}`);
  else setReadout(`${base} ${formatChlValue(val)}`);
}

function makeMobileRasterCanvas(varKey, gridInfo, dataObj) {
  const z = mobileZForVar(varKey, dataObj);
  if (!is2D(z)) throw new Error(`Mobile renderer missing 2-D data for ${varKey}`);
  const ny = z.length;
  const nx = z[0].length;
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d", { willReadFrequently: false });
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, nx, ny);
  const img = ctx.createImageData(nx, ny);
  const xAxis = gridInfo.xAxis || [];
  const yAxis = gridInfo.yAxis || [];
  const xAscending = xAxis.length < 2 || xAxis[0] <= xAxis[xAxis.length - 1];
  const yAscending = yAxis.length < 2 || yAxis[0] <= yAxis[yAxis.length - 1];
  const cfg = mobileValueConfig(varKey);
  const denom = cfg.hi === cfg.lo ? 1 : (cfg.hi - cfg.lo);

  // yFlip determines when to reverse row order relative to yAscending:
  //   CHL north-up data: flip when yAscending (data 0=north=top), no flip when yAscending is false (data 0=south)
  //   UV south-up data: flip when yAscending is false (data 0=south), no flip when yAscending (data 0=south)
  const yFlip = (varKey === "uv") ? yAscending : yAscending;

  for (let row = 0; row < ny; row++) {
    const srcJ = yFlip ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col++) {
      const srcI = xAscending ? col : (nx - 1 - col);
      const value = z[srcJ]?.[srcI];
      const k = (row * nx + col) * 4;
      const numericValue = Number(value);
      if (isMobileMissingValue(varKey, value, numericValue)) {
        if (varKey === "uv") {
          img.data[k + 3] = 0;
        } else {
          img.data[k] = 255;
          img.data[k + 1] = 255;
          img.data[k + 2] = 255;
          img.data[k + 3] = 255;
        }
        continue;
      }
      const t = (cfg.transform(numericValue) - cfg.lo) / denom;
      const rgb = interpolateScale(cfg.scale, t);
      img.data[k] = rgb[0];
      img.data[k + 1] = rgb[1];
      img.data[k + 2] = rgb[2];
      img.data[k + 3] = 235;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function fitMobileMapWidth(map, extent) {
  const size = map.getSize();
  if (!size || size[0] <= 0 || size[1] <= 0) return;
  const widthRes = Math.abs(extent[2] - extent[0]) / size[0];
  map.getView().setCenter([(extent[0] + extent[2]) / 2, (extent[1] + extent[3]) / 2]);
  map.getView().setRotation(0);
  map.getView().setResolution(widthRes);
}

async function renderCombinedMode() {
  // Prevent concurrent calls — if a render is already in progress, bail out
  if (window._combinedRenderLocked) {
    console.log("[combined] renderCombinedMode SKIPPED — render already in progress");
    return;
  }
  window._combinedRenderLocked = true;
  console.log("[combined] renderCombinedMode called, currentVar:", currentVar, "REGION_ID:", REGION_ID);
  document.body.classList.add("combined-mode");

  // ── Build a standalone OL map in #combined-map ─────────────────────────
  const combinedMapDiv = document.getElementById("combined-map");
  if (!combinedMapDiv) {
    window._combinedRenderLocked = false;
    return;
  }

  // Destroy previous instance if any
  if (window._combinedMap) {
    console.log("[combined] CLEANUP: disposing prev combined map");
    try { window._combinedMap.dispose(); } catch (_) {}
    window._combinedMap.setTarget(undefined);
    window._combinedMap = null; // null BEFORE building new — so subsequent calls see a clean slate
    window._combinedLandLayer = null;
    window._combinedPlaceLayer = null;
    window._combinedChlLayer = null;
    window._combinedBathyLayer = null;
    window._combinedUvLayer = null;
    window._combinedFrontDensityLayer = null;
    window._combinedFrontLineLayer = null;
    console.log("[combined] CLEANUP: all combined state cleared");
  }
  // NOTE: do NOT unlock _combinedRenderLocked here — it must stay set while the
  // function is building the new map. Unlock only after the new map is complete.

  const view = new ol.View({ projection: "EPSG:4326", extent: BBOX });
  console.log("[combined] creating OL map, combinedMapDiv:", combinedMapDiv, "size:", combinedMapDiv?.clientWidth, combinedMapDiv?.clientHeight);
  // Force layout so combinedMapDiv has real pixel dimensions before new ol.Map
  // (position:absolute divs report 0x0 until the browser computes layout)
  combinedMapDiv.getBoundingClientRect();
  const map = new ol.Map({
    target: combinedMapDiv,
    view,
    layers: [],
    overlays: [],

function buildBathyContourLayer(bathyData, gridInfo) {
  const source = new ol.source.Vector({ wrapX: false });
  const layer = new ol.layer.Vector({
    source,
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "#8bb8d4", width: 0.8 })
    }),
    zIndex: 15
  });
  window._bathyData = {
    xAxis: bathyData.xAxis, yAxis: bathyData.yAxis,
    depth: bathyData.depth,
    nx: bathyData.xAxis.length, ny: bathyData.yAxis.length
  };
  window._bathyContourSource = source;
  updateBathyContoursForMap(window._combinedMap);
  window._combinedMap?.on("moveend", () => updateBathyContoursForMap(window._combinedMap));
  return layer;
}

function updateBathyContoursForMap(map) {
  const bd = window._bathyData;
  const source = window._bathyContourSource;
  if (!bd || !source || !map) return;
  source.clear();
  const extent = map.getView().calculateExtent(map.getSize());
  const [vx0, vy0, vx1, vy1] = extent;
  const maxW = 400, maxH = 600;
  const sx = Math.max(1, Math.floor(bd.nx / maxW));
  const sy = Math.max(1, Math.floor(bd.ny / maxH));
  const maxDepth = depthMaxInExtent(bd, extent, sx, sy);
  const levels = generateContourLevels(maxDepth);
  for (const level of levels) {
    const segs = extractContourSegments(bd, level, sx, sy, extent);
    for (const seg of segs) {
      source.addFeature(new ol.Feature({ geometry: new ol.geom.LineString(seg) }));
    }
  }
}

function depthMaxInExtent(bd, extent, sx, sy) {
  const [vx0, vy0, vx1, vy1] = extent;
  let maxD = 0;
  for (let row = 0; row < bd.ny; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    for (let col = 0; col < bd.nx; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const d = bd.depth[row][col];
      if (d > maxD) maxD = d;
    }
  }
  return maxD;
}

function generateContourLevels(maxDepth) {
  const std = [50, 100, 200, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
  if (maxDepth < 200) return [50, 100, 200].filter(l => l <= maxDepth + 200);
  return std.filter(l => l <= maxDepth + 200);
}

function extractContourSegments(bd, level, sx, sy, extent) {
  const [vx0, vy0, vx1, vy1] = extent;
  const segments = [];
  for (let row = 1; row < bd.ny - 1; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    const nextLat = bd.yAxis[Math.min(row + sy, bd.ny - 1)];
    for (let col = 1; col < bd.nx - 1; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const nextLon = bd.xAxis[Math.min(col + sx, bd.nx - 1)];
      const tl = bd.depth[row][col];
      const tr = bd.depth[row][Math.min(col + sx, bd.nx - 1)];
      const br = bd.depth[Math.min(row + sy, bd.ny - 1)][Math.min(col + sx, bd.nx - 1)];
      const bl = bd.depth[Math.min(row + sy, bd.ny - 1)][col];
      const crossings = [];
      if ((tl < level) !== (tr < level)) {
        const t = (level - tl) / (tr - tl);
        crossings.push([[lon + t * (nextLon - lon), lat], "top"]);
      }
      if ((bl < level) !== (br < level)) {
        const t = (level - bl) / (br - bl);
        crossings.push([[lon + t * (nextLon - lon), nextLat], "bottom"]);
      }
      if ((tl < level) !== (bl < level)) {
        const t = (level - tl) / (bl - tl);
        crossings.push([[lon, lat + t * (nextLat - lat)], "left"]);
      }
      if ((tr < level) !== (br < level)) {
        const t = (level - tr) / (br - tr);
        crossings.push([[nextLon, lat + t * (nextLat - lat)], "right"]);
      }
      if (crossings.length >= 2) {
        const coords = crossings.slice(0, 2).map(c => c[0]);
        if (coords[0] && coords[1] && Math.hypot(coords[0][0] - coords[1][0], coords[0][1] - coords[1][1]) > 0.01) {
          segments.push(coords);
        }
      }
    }
  }
  return segments;
}

function buildDesktopUvArrowLayer(data, grid) {
  const uvData = (data.data && !Array.isArray(data.data)) ? data.data : data;
  const { xAxis, yAxis, nx, ny } = grid;
  if (!xAxis?.length || !yAxis?.length) return null;
  const features = [];
  const step = Math.max(3, Math.floor(Math.sqrt(nx * ny) / 18));
  const dxg = Math.abs((xAxis[1] ?? xAxis[0]) - xAxis[0]) || 0.01;
  const dyg = Math.abs((yAxis[1] ?? yAxis[0]) - yAxis[0]) || 0.01;
  const cell = Math.min(dxg, dyg);
  const minSpeed = 0.035;
  const maxSpeed = 1.2;
  const minLen = 0.95 * cell;
  const maxLen = 2.8 * cell;
  for (let row = 0; row < ny; row += step) {
    for (let col = 0; col < nx; col += step) {
      const u = uvData.u?.[row]?.[col];
      const v = uvData.v?.[row]?.[col];
      if (!Number.isFinite(u) || !Number.isFinite(v)) continue;
      const spd = Math.sqrt(u * u + v * v);
      if (spd < minSpeed || spd > 3) continue;
      const lon = xAxis[col];
      const lat = yAxis[row];
      const scaled = Math.min(spd, maxSpeed) / maxSpeed;
      const arrowLen = minLen + (maxLen - minLen) * scaled;
      const geom = buildArrowGeometry(lon, lat, u, v, arrowLen, cell);
      if (geom) features.push(new ol.Feature({ geometry: geom, speed: spd }));
    }
  }
  if (!features.length) return null;
  const source = new ol.source.Vector({ features, wrapX: false });
  const layer = new ol.layer.Vector({
    source,
    style: (feature) => new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "rgba(255,255,255,0.84)", width: 1.35, lineCap: "round", lineJoin: "round" })
    }),
    zIndex: 20
  });
  return layer;
}

function buildArrowGeometry(lon, lat, u, v, len, cell) {
  try {
    const spd = Math.hypot(u, v);
    if (!Number.isFinite(spd) || spd <= 0) return null;
    const lon1 = lon + (u / spd) * len;
    const lat1 = lat + (v / spd) * len;
    const theta = Math.atan2(lat1 - lat, lon1 - lon);
    const headLen = Math.min(0.46 * len, 0.74 * cell);
    const headAng = Math.PI / 6;
    const left = [lon1 + headLen * Math.cos(theta + Math.PI - headAng), lat1 + headLen * Math.sin(theta + Math.PI - headAng)];
    const right = [lon1 + headLen * Math.cos(theta + Math.PI + headAng), lat1 + headLen * Math.sin(theta + Math.PI + headAng)];
    return new ol.geom.MultiLineString([[[lon, lat], [lon1, lat1]], [[lon1, lat1], left], [[lon1, lat1], right]]);
  } catch { return null; }
}

function speedColor(speed, min, max) {
  const t = Math.min(1, Math.max(0, (speed - min) / (max - min)));
  const r = Math.round(255 * t);
  const b = Math.round(255 * (1 - t));
  return `rgb(${r},50,${b})`;
}

function buildCombinedThermalFrontLineLayer(items) {
  const latestMs = items.at(-1)?.t ?? Date.now();
  const oldestMs = items[0]?.t ?? latestMs;
  const features = [];
  for (const item of items) {
    const color = thermalColorForAge(item.t, latestMs, oldestMs);
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sourceFeature of sourceFeatures) {
      const coords = sourceFeature?.geometry?.coordinates || [];
      const props = sourceFeature?.properties || {};
      for (const segment of thermalSegmentedLineStrings(coords)) {
        const feature = new ol.Feature({ geometry: new ol.geom.LineString(segment) });
        feature.setProperties({
          sourceProps: props,
          frameTime: item.t,
          color,
          lineWidth: items.length === 1 ? 2.8 : 1.7
        });
        features.push(feature);
      }
    }
  }
  if (!features.length) return null;
  return new ol.layer.Vector({
    source: new ol.source.Vector({ features, wrapX: false }),
    style: thermalFeatureStyle,
    zIndex: 32,
    updateWhileAnimating: true,
    updateWhileInteracting: true
  });
}

/* ============================================================
   Combined-mode helpers: build ThermalHours composite layers
   ============================================================ */
function buildThermalHoursComposite(map, hours) {
  const now = Date.now();
  const cutoff = now - hours * 3600000;
  const lineFeatures = [];
  const densityGrid = {};

  // Collect all thermal front features within the hours window
  for (const item of thermalFrontState.frameData) {
    if (item.t < cutoff) continue;
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sf of sourceFeatures) {
      const coords = sf?.geometry?.coordinates || [];
      if (sf.geometry?.type === "LineString" && coords.length >= 2) {
        const ageNorm = (item.t - cutoff) / (now - cutoff); // 0=oldest, 1=latest
        const style = new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: `rgba(255, ${Math.round(40 + 100 * (1 - ageNorm))}, ${Math.round(30 + 50 * (1 - ageNorm))}, 0.85)`,
            width: 1.5,
            lineCap: "round",
            lineJoin: "round"
          })
        });
        lineFeatures.push(new ol.Feature({ geometry: new ol.geom.LineString(coords), style }));
      }
      // Density: accumulate into grid cells
      if (sf.geometry?.type === "MultiPoint" || (sf.geometry?.type === "Point")) {
        const pts = sf.geometry?.type === "MultiPoint" ? (sf.geometry?.coordinates || []) : [sf.geometry?.coordinates || []];
        for (const pt of pts) {
          if (!pt || pt.length < 2) continue;
          const cellX = Math.floor(pt[0] / 0.014);
          const cellY = Math.floor(pt[1] / 0.014);
          const key = cellX + "," + cellY;
          densityGrid[key] = (densityGrid[key] || 0) + 1;
        }
      }
    }
  }

  const lineSource = new ol.source.Vector({ features: lineFeatures, wrapX: false });
  const lineLayer = new ol.layer.Vector({
    source: lineSource,
    zIndex: 32,
    updateWhileAnimating: true,
    updateWhileInteracting: true
  });

  // Build density canvas
  const cellDeg = 0.014;
  const nx = Math.max(2, Math.ceil((BBOX[2] - BBOX[0]) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((BBOX[3] - BBOX[1]) / cellDeg) + 1);
  const canvas = document.createElement("canvas");
  canvas.width = nx; canvas.height = ny;
  const ctx = canvas.getContext("2d");
  const maxCount = Math.max(1, ...Object.values(densityGrid));
  const radiusPx = hours <= 6 ? 2 : (hours <= 24 ? 3 : 4);
  for (const [key, count] of Object.entries(densityGrid)) {
    const [cx, cy] = key.split(",").map(Number);
    const alpha = 40 + Math.round(180 * count / maxCount);
    ctx.beginPath();
    ctx.arc(cx, ny - 1 - cy, radiusPx, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,30,30,${(alpha / 255).toFixed(3)})`;
    ctx.fill();
  }
  const extent = [BBOX[0], BBOX[1], BBOX[0] + nx * cellDeg, BBOX[1] + ny * cellDeg];
  const densitySrc = new ol.source.ImageStatic({ url: canvas.toDataURL("image/png"), imageExtent: extent, projection: "EPSG:4326", interpolate: false });
  const densityLayer = new ol.layer.Image({ source: densitySrc, zIndex: 30, opacity: 0.85 });

  return { lineLayer, densityLayer };
}

/* ============================================================
   Combined-mode helpers: build CHL nanmedian composite layer
   ============================================================ */
async function buildChlCompositeLayer(map, count) {
  const chlFrames = framesByVar.chl || [];
  if (!chlFrames.length) return {};
  const now = Date.now();
  // Sort by time, take last N frames (most recent)
  const sorted = [...chlFrames].sort((a, b) => {
    const ta = epochMsForFrame("chl", a) || 0;
    const tb = epochMsForFrame("chl", b) || 0;
    return tb - ta; // newest first
  });
  const selected = sorted.slice(0, Math.min(count, sorted.length));
  if (!selected.length) return {};

  // Load all selected frames
  const loaded = await Promise.all(selected.map(f => fetchFrameData("chl", f).catch(() => null)));
  const valid = loaded.filter(d => d && Array.isArray(d.z));
  if (!valid.length) return {};

  // Calculate average scan time
  const scanTimes = selected.map((f, i) => {
    const d = valid[i];
    if (!d) return null;
    // Use scan_id from frame or bbox/ny/nx as proxy
    return d.scan_id || d.frame_id || null;
  }).filter(Boolean);
  const scanTime = scanTimes.length > 1
    ? `Avg: ${scanTimes[0]} – ${scanTimes[scanTimes.length - 1]}`
    : (scanTimes[0] || "");

  // Build nanmedian composite
  const ny = valid[0].z.length;
  const nx = valid[0].z[0]?.length || 0;
  if (!ny || !nx) return {};

  const composite = [];
  for (let row = 0; row < ny; row++) {
    composite[row] = [];
    for (let col = 0; col < nx; col++) {
      const vals = [];
      for (const frame of valid) {
        const v = frame.z[row]?.[col];
        if (v !== null && isFinite(v) && v > 0) vals.push(v);
      }
      composite[row][col] = vals.length > 0
        ? (vals.length === 1 ? vals[0] : vals.sort()[Math.floor(vals.length / 2)])
        : null;
    }
  }

  const grid = { xAxis: valid[0].bbox ? [valid[0].bbox[0], valid[0].bbox[2]] : [-81, -73], yAxis: valid[0].bbox ? [valid[0].bbox[1], valid[0].bbox[3]] : [31, 36], nx, ny };
  const canvas = makeMobileRasterCanvas("chl", grid, { z: composite });
  const url = canvas.toDataURL("image/png");
  if (!url || !url.startsWith("data:image/png")) return { scanTime };
  const extent = frameExtentFromGrid(grid);
  const src = new ol.source.ImageStatic({ url, imageExtent: extent, projection: "EPSG:4326", interpolate: false });
  const layer = new ol.layer.Image({ source: src, zIndex: 10 });
  return { layer, scanTime };
}



function buildThermalFrontLineLayer(frontData) {
  const features = frontData.features || [];
  if (!features.length) return null;
  const source = new ol.source.Vector({ wrapX: false });
  for (const feat of features) {
    const coords = feat.geometry?.coordinates || [];
    if (feat.geometry?.type === "LineString" && coords.length >= 2) {
      source.addFeature(new ol.Feature({ geometry: new ol.geom.LineString(coords) }));
    } else if (feat.geometry?.type === "MultiLineString") {
      for (const seg of coords) {
        if (Array.isArray(seg) && seg.length >= 2) {
          source.addFeature(new ol.Feature({ geometry: new ol.geom.LineString(seg) }));
        }
      }
    }
  }
  return new ol.layer.Vector({
    source,
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "#ff4040", width: 1.4 })
    }),
    zIndex: 32
  });
}

function buildThermalFrontDensityCanvas(frontData, grid) {
  const features = frontData.features || [];
  if (!features.length) return null;
  const { xAxis, yAxis } = grid;
  const cellDeg = 0.014;
  const nx = Math.max(2, Math.ceil((BBOX[2] - BBOX[0]) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((BBOX[3] - BBOX[1]) / cellDeg) + 1);
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d");
  const counts = new Float32Array(nx * ny);
  const radiusPx = 2;
  for (const feat of features) {
    const coords = feat.geometry?.coordinates || [];
    for (const pt of coords) {
      if (!pt || pt.length < 2) continue;
      const [lon, lat] = pt;
      const cx = Math.round((lon - BBOX[0]) / cellDeg);
      const cy = Math.round((BBOX[3] - lat) / cellDeg);
      if (cx < 0 || cx >= nx || cy < 0 || cy >= ny) continue;
      counts[cy * nx + cx]++;
    }
  }
  const maxC = Math.max(...counts) || 1;
  for (let row = 0; row < ny; row++) {
    for (let x = 0; x < nx; x++) {
      const c = counts[row * nx + x];
      if (c > 0) {
        const alpha = Math.min(200, (c / maxC) * 220);
        ctx.beginPath();
        ctx.arc(x, row, radiusPx, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,30,30,${(alpha / 255).toFixed(3)})`;
        ctx.fill();
      }
    }
  }
  return canvas;
}

async function buildThermalFrontDensityCanvas(frontData, grid) {
  // Fallback: build a simple density heatmap from front point features
  const features = frontData.features || [];
  if (!features.length) return null;
  const cellDeg = 0.014;
  const nx = Math.max(2, Math.ceil((BBOX[2] - BBOX[0]) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((BBOX[3] - BBOX[1]) / cellDeg) + 1);
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d");
  const counts = new Uint8Array(nx * ny);
  const radiusPx = 2;

  for (const feat of features) {
    const coords = feat.geometry?.coordinates || [];
    for (const pt of coords) {
      if (!pt || pt.length < 2) continue;
      const [lon, lat] = pt;
      const cx = Math.round((lon - BBOX[0]) / cellDeg);
      const cy = Math.round((BBOX[3] - lat) / cellDeg);
      if (cx < 0 || cx >= nx || cy < 0 || cy >= ny) continue;
      if (counts[cy * nx + cx] < 255) counts[cy * nx + cx]++;
    }
  }

  for (let row = 0; row < ny; row++) {
    for (let x = 0; x < nx; x++) {
      const c = counts[row * nx + x];
      if (c > 0) {
        const alpha = Math.min(200, c * 25);
        ctx.beginPath();
        ctx.arc(x, row, radiusPx, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,30,30,${(alpha / 255).toFixed(3)})`;
        ctx.fill();
      }
    }
  }

  return canvas;
}

async function renderMobileFrame(frameMeta) {
  if (currentVar === "chl_front" || currentVar === "sst_front" || currentVar === "thermal_fronts" || currentVar === "combined") return false;
  const map = initMobileMapIfNeeded();
  if (!map) return false;

  // Combined: not yet supported on mobile — fall through to single-product path
  if (currentVar === "combined") {
    // Show a toast instead of an error
    const toast = document.createElement("div");
    toast.textContent = "Combined view is desktop-only";
    toast.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;color:#fff;background:rgba(0,80,0,0.85);padding:14px 20px;border-radius:8px;font-size:14px;text-align:center;";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
    return false;
  }

  let dataObj, gridInfo;
  if (currentVar === "bathy") {
    dataObj = await loadBathymetryJson(BATHY_JSON_URL);
    gridInfo = { xAxis: dataObj.xAxis, yAxis: dataObj.yAxis, nx: dataObj.xAxis.length, ny: dataObj.yAxis.length };
  } else {
    dataObj = await fetchFrameData(currentVar, frameMeta);
    gridInfo = await loadGridForVar(currentVar, dataObj);
  }
  mobileMapState.currentGridInfo = gridInfo;
  mobileMapState.currentDataObj = dataObj;

  const canvas = makeMobileRasterCanvas(currentVar, gridInfo, dataObj);
  // iOS Safari is more reliable with data URLs than Blob image URLs for
  // dynamically generated static image layers. The frames are small enough here.
  const url = canvas.toDataURL("image/png");
  if (!url || !url.startsWith("data:image/png")) throw new Error("Could not encode mobile raster");
  const extent = frameExtentFromGrid(gridInfo);
  const source = new ol.source.ImageStatic({
    url,
    imageExtent: extent,
    projection: "EPSG:4326",
    interpolate: false
  });
  source.on("imageloaderror", () => {
    console.error("Mobile map image layer failed to load; falling back to Plotly.");
    mobileMapState.disabled = true;
    document.body.classList.remove("mobile-map-ready");
    showFrame();
  });
  if (mobileMapState.imageUrl && mobileMapState.imageUrl.startsWith("blob:")) {
    URL.revokeObjectURL(mobileMapState.imageUrl);
  }
  mobileMapState.imageUrl = url;
  if (mobileMapState.imageLayer) {
    mobileMapState.imageLayer.setSource(source);
  } else {
    mobileMapState.imageLayer = new ol.layer.Image({ source, zIndex: 10 });
    map.addLayer(mobileMapState.imageLayer);
  }
  clearMobileUvArrowLayer(map);
  if (currentVar === "uv") {
    mobileMapState.arrowLayer = buildMobileUvArrowLayer(dataObj, gridInfo);
    if (mobileMapState.arrowLayer) map.addLayer(mobileMapState.arrowLayer);
  }
  await ensureMobileLandLayer(map);
  ensureMobilePlaceLayer(map);
  installMobileReadoutOnce(map);
  map.updateSize();

  const regionKey = `${REGION_ID}:${currentVar}`;
  if (mobileMapState.fittedRegion !== regionKey) {
    if (viewState.hasRange) applyViewStateToOlMap(map, extent);
    else fitMobileMapWidth(map, extent);
    mobileMapState.fittedRegion = regionKey;
  }

  await renderFooterColorbarToDiv(document.getElementById("hamburger-cbar"), currentVar);
  updateSliderUI();
  return true;
}

/* ========================= READOUT (hover + tap) ========================= */
function setupReadoutHandlersOnce() {
  if (_readoutHooked) return;
  _readoutHooked = true;

  plotDiv.on("plotly_unhover", () => { if (!IS_TOUCH) setReadout(""); });

  plotDiv.on("plotly_hover", (ev) => {
    console.log("[hover] plotly_hover fired, points:", ev.points?.length, "IS_TOUCH:", IS_TOUCH);
    if (IS_TOUCH) return;
    const p = ev.points && ev.points[0];
    if (!p) { console.log("[hover] no point"); return; }
    console.log("[hover] point x=", p.x, "y=", p.y, "customdata=", p.customdata);
    renderReadoutFromPoint(p);
  });

  plotDiv.on("plotly_click", async (ev) => {
    // 1. CLEANUP PREVIOUS MEASUREMENT (If exists)
    // If the user clicks ANYWHERE while a measurement line is visible, clear it first.
    if (measureResultVisible) {
      measurePoints = [];
      measureResultVisible = false;
      await showFrame();
      // We continue processing this click (so they can immediately click to add a marker or see a value)
    }

    // 2. DETERMINE COORDINATES
    let lon, lat;
    const p = ev.points && ev.points[0];

    // Use Exact Mouse Calculation for Add OR Measure modes
    if (markerMode === "add" || measureMode !== "off") {
      const domEvent = ev.event;
      const xaxis = plotDiv._fullLayout.xaxis;
      const yaxis = plotDiv._fullLayout.yaxis;
      const dragLayer = plotDiv.querySelector('.nsewdrag');
      const rect = dragLayer.getBoundingClientRect();
      const xPx = domEvent.clientX - rect.left;
      const yPx = domEvent.clientY - rect.top;
      lon = xaxis.p2d(xPx);
      lat = yaxis.p2d(yPx);
    } else {
      if (!p) return;
      lon = Number(p.x);
      lat = Number(p.y);
    }

    if (!isFinite(lon) || !isFinite(lat)) return;

    // --- 3. MEASURE LOGIC (Updated) ---
    if (measureMode !== "off") {
      if (measureMode === "start") {
        // Point A
        measurePoints = [{ lon, lat }];
        measureMode = "end";
        setReadout("Measure: Click END point");
      } else {
        // Point B (Finish)
        measurePoints[1] = { lon, lat };

        const d = getDistanceInNM(
          measurePoints[0].lat, measurePoints[0].lon,
          measurePoints[1].lat, measurePoints[1].lon
        );

        // 1. Show result in top bar
        setReadout(`Distance: ${d.toFixed(2)} nm`);

        // 2. Turn OFF mode immediately
        measureMode = "off";
        plotDiv.classList.remove("measure-mode");

        // 3. Flag result as visible so NEXT click clears it
        measureResultVisible = true;
      }
      await showFrame();
      return;
    }

    // --- 4. MARKER LOGIC ---
    if (markerMode === "add") {
      markers.push({ lon, lat, label: String(markers.length + 1) });
      await showFrame();
      return;
    }
    if (markerMode === "remove") {
      removeNearestMarker(lon, lat);
      await showFrame();
      return;
    }

    // --- 5. NORMAL READOUT ---
    if (p) renderReadoutFromPoint(p);
  });
}

/* ================= DDM CONVERSION HELPER (Standard Marine) ================= */
function toDDM(val) {
  const absVal = Math.abs(val);
  const d = Math.floor(absVal);
  const m = (absVal - d) * 60;

  // Format: Degrees + Minutes with 3 decimal places (Standard GPS precision)
  // padStart(2, '0') ensures "05.123" instead of "5.123"
  const mStr = m.toFixed(2).padStart(5, '0');

  // West/South Handling
  // You can also add N/S/E/W suffixes if preferred,
  // but standard negative signs work well for compact readouts.
  const sign = val < 0 ? "-" : "";

  return `${sign}${d}°${mStr}'`;
}

/* ================= READOUT ================= */
function renderReadoutFromPoint(p) {
  const lon = Number(p.x);
  const lat = Number(p.y);
  if (!isFinite(lon) || !isFinite(lat)) return;

  const base = formatReadoutCoords(lon, lat);

  const cd = p.customdata;
  if (cd === null || cd === undefined) {
    setReadout(base);
    return;
  }

  // Handle front data (customdata with _is_front flag)
  if (cd._is_front) {
    const parts = [];
    if (cd.strength !== null && cd.strength !== undefined) {
      parts.push(`${Number(cd.strength).toFixed(2)} ${cd.strength_unit || ""}`);
    }
    if (cd.length_km !== null && cd.length_km !== undefined) {
      parts.push(`${Number(cd.length_km).toFixed(1)} km`);
    }
    setReadout(parts.length ? `${base} ${parts.join(" / ")}` : base);
    return;
  }

  const val = Number(cd);
  if (!isFinite(val) || isNaN(val)) {
    setReadout(base);
    return;
  }
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";

  if (currentVar === "sst") setReadout(`${base}, ${formatSstValue(val)}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else if (currentVar === "uv") setReadout(`${base}, SSH ${formatSshValue(val)}`);
  else setReadout(`${base} ${formatChlValue(val)}`);
}

function thermalDateKey(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

function thermalFrameTimeLabel(ms) {
  return new Date(ms).toLocaleString(undefined, {
    timeZone: "UTC",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }) + " UTC";
}

function thermalFramesForDate(date) {
  return thermalFrontState.frameData.filter(item => thermalDateKey(item.t) === date);
}

function thermalActiveFrameList() {
  if (thermalFrontState.mode === "daily") return thermalFrontState.dailyFrames;
  const dayItems = thermalFramesForDate(thermalFrontState.selectedDate);
  return dayItems.length ? dayItems : thermalFrontState.frameData;
}

function thermalDisplayedFrontItems() {
  if (thermalFrontState.mode === "daily") return [];
  const list = thermalActiveFrameList();
  if (thermalAllDayCb?.checked) return list;
  const item = list[thermalFrontState.frameIdx];
  return item ? [item] : [];
}

function thermalCurrentFrameTime() {
  if (thermalFrontState.mode === "daily") return thermalFrontState.dailyFrames[thermalFrontState.frameIdx]?.t ?? null;
  return thermalActiveFrameList()[thermalFrontState.frameIdx]?.t ?? null;
}

function thermalClosestFrameIndex(items, targetMs) {
  if (!items.length || !Number.isFinite(targetMs)) return Math.max(0, items.length - 1);
  let bestIdx = 0;
  let bestDist = Infinity;
  for (let i = 0; i < items.length; i++) {
    const t = Number(items[i]?.t);
    if (!Number.isFinite(t)) continue;
    const d = Math.abs(t - targetMs);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }
  return bestIdx;
}

function thermalSegmentedLineStrings(coords, maxJumpDeg = 0.08) {
  const segments = [];
  let segment = [];
  let prev = null;
  for (const pt of coords || []) {
    if (!Array.isArray(pt) || pt.length < 2) continue;
    const lon = Number(pt[0]);
    const lat = Number(pt[1]);
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
    if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > maxJumpDeg) {
      if (segment.length >= 2) segments.push(segment);
      segment = [];
    }
    segment.push([lon, lat]);
    prev = [lon, lat];
  }
  if (segment.length >= 2) segments.push(segment);
  return segments;
}

function thermalGradientForFeaturePoint(props, index) {
  const gradMap = Array.isArray(props?.gradient_map) ? props.gradient_map : null;
  if (gradMap && index < gradMap.length) {
    const exact = Number(gradMap[index]);
    if (Number.isFinite(exact)) return exact;
    for (let offset = 1; offset < gradMap.length; offset++) {
      const left = index - offset;
      const right = index + offset;
      const leftValue = left >= 0 ? Number(gradMap[left]) : NaN;
      if (Number.isFinite(leftValue)) return leftValue;
      const rightValue = right < gradMap.length ? Number(gradMap[right]) : NaN;
      if (Number.isFinite(rightValue)) return rightValue;
    }
  }
  const g = Number(props?.gradient_per_km);
  return Number.isFinite(g) ? g : null;
}

function thermalDeltaSstForFeature(props) {
  const median = Number(props?.strength_median);
  const max = Number(props?.strength_max);
  if (Number.isFinite(median)) return { label: "ΔSST", value: median };
  if (Number.isFinite(max)) return { label: "ΔSST max", value: max };
  return null;
}

function thermalCollectFrontPoints(items) {
  const points = [];
  for (const item of items) {
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sourceFeature of sourceFeatures) {
      const coords = sourceFeature?.geometry?.coordinates || [];
      const props = sourceFeature?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i];
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const lon = Number(pt[0]);
        const lat = Number(pt[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        points.push({ lon, lat, t: item.t, grad: thermalGradientForFeaturePoint(props, i) });
      }
    }
  }
  return points;
}

function thermalHslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function thermalColorForDensityDate(date) {
  const idx = Math.max(0, thermalFrontState.hourlyDays.indexOf(date));
  const denom = Math.max(1, thermalFrontState.hourlyDays.length - 1);
  return thermalHslToRgb(270 - (idx / denom) * 270, 0.85, 0.50);
}

function thermalColorForAge(ms, latestMs, oldestMs) {
  const span = Math.max(1, latestMs - oldestMs);
  const t = Math.max(0, Math.min(1, (ms - oldestMs) / span));
  return `hsl(${282 - 282 * t}, 92%, ${46 + 4 * t}%)`;
}

function thermalBuildDensityField(points, hourlyCount, label) {
  const [west, south, east, north] = BBOX.map(Number);
  const cellDeg = 0.005;
  const nx = Math.max(2, Math.ceil((east - west) / cellDeg) + 1);
  const ny = Math.max(2, Math.ceil((north - south) / cellDeg) + 1);
  const counts = new Int32Array(nx * ny);
  for (const point of points) {
    const cx = Math.round((point.lon - west) / cellDeg);
    const cy = Math.round((point.lat - south) / cellDeg);
    if (cx < 0 || cx >= nx || cy < 0 || cy >= ny) continue;
    counts[cy * nx + cx]++;
  }
  const nonzero = Array.from(counts).filter(v => v > 0);
  const max = Math.max(1, ...nonzero);
  const cutoff = Math.max(2, Math.round(max * 0.15));
  return {
    label,
    color: thermalColorForDensityDate(label),
    points: points.length,
    hourlyCount,
    nx,
    ny,
    extent: [west, south, west + (nx - 1) * cellDeg, south + (ny - 1) * cellDeg],
    counts,
    max,
    cutoff
  };
}

function thermalDailyDensityForDate(date) {
  const key = `day:${date}`;
  if (thermalFrontState.densityCache.has(key)) return thermalFrontState.densityCache.get(key);
  const items = thermalFramesForDate(date);
  const density = thermalBuildDensityField(thermalCollectFrontPoints(items), items.length, date);
  thermalFrontState.densityCache.set(key, density);
  return density;
}

function thermalDensityForDates(dates) {
  const key = `dates:${dates.join("|")}`;
  if (thermalFrontState.densityCache.has(key)) return thermalFrontState.densityCache.get(key);
  const fields = dates.map(date => thermalDailyDensityForDate(date));
  const density = {
    label: `${dates[0]}..${dates.at(-1)}`,
    fields,
    hourlyCount: fields.reduce((sum, field) => sum + field.hourlyCount, 0),
    nx: fields[0]?.nx || 0,
    ny: fields[0]?.ny || 0,
    extent: fields[0]?.extent || BBOX
  };
  thermalFrontState.densityCache.set(key, density);
  return density;
}

function thermalActiveDensityField() {
  if (thermalFrontState.mode !== "daily") return null;
  if (thermalAllDayCb?.checked) return thermalDensityForDates(thermalFrontState.dailyFrames.map(item => item.date));
  const dayItem = thermalFrontState.dailyFrames[thermalFrontState.frameIdx];
  return dayItem ? thermalDailyDensityForDate(dayItem.date) : null;
}

function thermalDensityCanvas(field) {
  if (!field) return null;
  if (Array.isArray(field.fields)) return thermalCompositeDensityCanvas(field);
  if (!field.counts?.length) return null;
  const canvas = document.createElement("canvas");
  canvas.width = field.nx;
  canvas.height = field.ny;
  const ctx = canvas.getContext("2d");
  const max = Math.max(field.max || 1, 1);
  const cutoff = Math.max(field.cutoff || 2, Math.round(max * 0.15));
  const span = Math.max(1, max - cutoff);
  const color = field.color || [19, 74, 136];
  for (let row = 0; row < field.ny; row++) {
    const y = field.ny - 1 - row;
    for (let x = 0; x < field.nx; x++) {
      const v = field.counts[row * field.nx + x];
      if (v < cutoff) continue;
      const norm = Math.min(1, (v - cutoff) / span);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${(0.16 + 0.84 * norm).toFixed(3)})`;
      ctx.fill();
    }
  }
  return canvas;
}

function thermalCompositeDensityCanvas(field) {
  const fields = field.fields || [];
  const first = fields[0];
  if (!first) return null;
  const canvas = document.createElement("canvas");
  canvas.width = first.nx;
  canvas.height = first.ny;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(first.nx, first.ny);
  for (let i = 0; i < first.nx * first.ny; i++) {
    let rSum = 0, gSum = 0, bSum = 0, aSum = 0;
    for (const dayField of fields) {
      const v = dayField.counts ? dayField.counts[i] : 0;
      const max = Math.max(dayField.max || 1, 1);
      const cutoff = Math.max(dayField.cutoff || 2, Math.round(max * 0.15));
      if (v < cutoff) continue;
      const alpha = Math.min(1, v / max);
      const color = dayField.color || [19, 74, 136];
      rSum += color[0] * alpha;
      gSum += color[1] * alpha;
      bSum += color[2] * alpha;
      aSum += alpha;
    }
    if (aSum <= 0) continue;
    const row = Math.floor(i / first.nx);
    const col = i - row * first.nx;
    const k = ((first.ny - 1 - row) * first.nx + col) * 4;
    img.data[k] = Math.round(rSum / aSum);
    img.data[k + 1] = Math.round(gSum / aSum);
    img.data[k + 2] = Math.round(bSum / aSum);
    img.data[k + 3] = Math.min(245, Math.round(100 + 145 * Math.min(1, aSum)));
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function thermalFeatureStyle(feature) {
  return new ol.style.Style({
    stroke: new ol.style.Stroke({
      color: feature.get("color") || "#111",
      width: feature.get("lineWidth") || 2,
      lineCap: "round",
      lineJoin: "round"
    })
  });
}

function thermalEnsureCursorLayer(map) {
  if (!map || thermalFrontState.cursorLayer) return;
  thermalFrontState.cursorFeature = new ol.Feature({
    geometry: new ol.geom.Point([(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2])
  });
  thermalFrontState.cursorFeature.setStyle(new ol.style.Style({
    image: new ol.style.Circle({
      radius: 3,
      fill: new ol.style.Fill({ color: "rgba(255,255,255,0.45)" }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.55)", width: 1 })
    })
  }));
  thermalFrontState.cursorLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: [thermalFrontState.cursorFeature] }),
    zIndex: 60
  });
  map.addLayer(thermalFrontState.cursorLayer);
}

function thermalNearestGradient(coord) {
  const lon = coord[0];
  const lat = coord[1];
  let bestDist = Infinity;
  let bestGrad = null;
  let bestPoint = null;
  let bestDelta = null;
  for (const item of thermalDisplayedFrontItems()) {
    const features = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      const props = feature?.properties || {};
      for (let i = 0; i < coords.length; i++) {
        const pt = coords[i];
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const ptLon = Number(pt[0]);
        const ptLat = Number(pt[1]);
        if (!Number.isFinite(ptLon) || !Number.isFinite(ptLat)) continue;
        const d = Math.hypot(ptLon - lon, ptLat - lat);
        if (d < bestDist) {
          bestDist = d;
          bestPoint = [ptLon, ptLat];
          bestGrad = thermalGradientForFeaturePoint(props, i);
          bestDelta = thermalDeltaSstForFeature(props);
        }
      }
    }
  }
  return { dist: bestDist, gradient: bestGrad, point: bestPoint, deltaSst: bestDelta };
}

function thermalRenderReadout(coord, pixel) {
  if (!coord || !Number.isFinite(coord[0]) || !Number.isFinite(coord[1])) return;
  let cursorCoord = coord;
  let readoutCoord = coord;
  let gradient = null;
  let deltaSst = null;
  const hit = thermalNearestGradient(coord);
  if (pixel && hit.point && Number.isFinite(hit.gradient)) {
    const hitPixel = thermalFrontState.map?.getPixelFromCoordinate(hit.point);
    if (hitPixel && Math.hypot(hitPixel[0] - pixel[0], hitPixel[1] - pixel[1]) <= 14) {
      cursorCoord = hit.point;
      readoutCoord = hit.point;
      gradient = hit.gradient;
      deltaSst = hit.deltaSst;
    }
  }
  if (thermalFrontState.cursorFeature) thermalFrontState.cursorFeature.getGeometry().setCoordinates(cursorCoord);
  const base = formatReadoutCoords(readoutCoord[0], readoutCoord[1]);
  if (Number.isFinite(gradient)) {
    const parts = [`${gradient.toFixed(3)} °C/km`];
    if (deltaSst && Number.isFinite(deltaSst.value)) parts.push(`${deltaSst.label} ${deltaSst.value.toFixed(2)}°C`);
    setReadout(`${base}, ${parts.join(", ")}`);
  } else {
    setReadout(base);
  }
}

async function thermalInitMap() {
  document.body.classList.remove("mobile-map-ready");
  const map = await initDesktopMapIfNeeded();
  thermalFrontState.map = map;
  if (desktopMapState.imageLayer) desktopMapState.imageLayer.setVisible(false);
  if (desktopMapState.arrowLayer) desktopMapState.arrowLayer.setVisible(false);
  if (desktopMapState.landLayer) desktopMapState.landLayer.setVisible(true);
  if (desktopMapState.placeLayer) desktopMapState.placeLayer.setVisible(true);
  await ensureDesktopLandLayer(map);
  await ensureDesktopPlaceLayer(map);
  thermalEnsureCursorLayer(map);
  if (thermalFrontState.cursorLayer) thermalFrontState.cursorLayer.setVisible(true);
  if (!map.__thermalReadoutInstalled) {
    map.__thermalReadoutInstalled = true;
    map.on("pointermove", ev => {
      if (currentVar === "thermal_fronts") thermalRenderReadout(ev.coordinate, ev.pixel);
    });
    map.on("click", ev => {
      if (currentVar === "thermal_fronts") thermalRenderReadout(ev.coordinate, ev.pixel);
    });
  }
  return map;
}

function thermalRenderDensityLayer() {
  const map = thermalFrontState.map;
  if (!map) return;
  if (thermalFrontState.mode !== "daily") {
    if (thermalFrontState.densityLayer) thermalFrontState.densityLayer.setSource(null);
    return;
  }
  const field = thermalActiveDensityField();
  const canvas = thermalDensityCanvas(field);
  if (!field || !canvas) {
    if (thermalFrontState.densityLayer) thermalFrontState.densityLayer.setSource(null);
    return;
  }
  const source = new ol.source.ImageStatic({
    url: canvas.toDataURL("image/png"),
    imageExtent: field.extent,
    projection: "EPSG:4326",
    interpolate: true
  });
  if (thermalFrontState.densityLayer) thermalFrontState.densityLayer.setSource(source);
  else {
    thermalFrontState.densityLayer = new ol.layer.Image({ source, zIndex: 42, opacity: 1 });
    map.addLayer(thermalFrontState.densityLayer);
  }
  thermalFrontState.densityLayer.setVisible(true);
}

function thermalRenderFrontLayer() {
  const map = thermalFrontState.map;
  if (!map) return;
  if (thermalFrontState.mode === "daily") {
    const empty = new ol.source.Vector({ features: [] });
    if (thermalFrontState.frontLayer) thermalFrontState.frontLayer.setSource(empty);
    return;
  }
  const items = thermalDisplayedFrontItems();
  const latestMs = items.at(-1)?.t ?? Date.now();
  const oldestMs = items[0]?.t ?? latestMs;
  const features = [];
  for (const item of items) {
    const color = thermalColorForAge(item.t, latestMs, oldestMs);
    const sourceFeatures = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const sourceFeature of sourceFeatures) {
      const coords = sourceFeature?.geometry?.coordinates || [];
      const props = sourceFeature?.properties || {};
      for (const segment of thermalSegmentedLineStrings(coords)) {
        const feature = new ol.Feature({ geometry: new ol.geom.LineString(segment) });
        feature.setProperties({
          sourceProps: props,
          sourceCoords: coords,
          frameTime: item.t,
          color,
          lineWidth: items.length === 1 ? 2.8 : 1.7
        });
        features.push(feature);
      }
    }
  }
  const source = new ol.source.Vector({ features });
  if (thermalFrontState.frontLayer) thermalFrontState.frontLayer.setSource(source);
  else {
    thermalFrontState.frontLayer = new ol.layer.Vector({
      source,
      style: thermalFeatureStyle,
      zIndex: 45,
      updateWhileAnimating: true,
      updateWhileInteracting: true
    });
    map.addLayer(thermalFrontState.frontLayer);
  }
  thermalFrontState.frontLayer.setVisible(true);
}

function thermalBuildDailyFrames() {
  thermalFrontState.dailyFrames = [];
  const seen = new Set();
  for (const item of [...thermalFrontState.frameData].sort((a, b) => a.t - b.t)) {
    const date = thermalDateKey(item.t);
    if (seen.has(date)) continue;
    seen.add(date);
    thermalFrontState.dailyFrames.push({ date, t: item.t, item });
  }
  thermalFrontState.hourlyDays = thermalFrontState.dailyFrames.map(item => item.date);
}

function thermalSyncDaySelect() {
  if (!thermalDaySelect) return;
  thermalDaySelect.innerHTML = "";
  for (const date of thermalFrontState.hourlyDays) {
    const opt = document.createElement("option");
    opt.value = date;
    opt.textContent = date;
    thermalDaySelect.appendChild(opt);
  }
  if (!thermalFrontState.selectedDate || !thermalFrontState.hourlyDays.includes(thermalFrontState.selectedDate)) {
    thermalFrontState.selectedDate = thermalFrontState.hourlyDays.at(-1) || "";
  }
  thermalDaySelect.value = thermalFrontState.selectedDate;
}

function updateThermalFrontsNav() {
  const list = thermalActiveFrameList();
  thermalFrontState.frameIdx = Math.max(0, Math.min(thermalFrontState.frameIdx, Math.max(0, list.length - 1)));
  if (slider) {
    slider.min = 0;
    slider.max = Math.max(0, list.length - 1);
    slider.value = thermalFrontState.frameIdx;
    slider.disabled = list.length <= 1;
  }
  if (prevBtn) prevBtn.disabled = list.length <= 1;
  if (nextBtn) nextBtn.disabled = list.length <= 1;
  if (playBtn) playBtn.disabled = list.length <= 1;
  if (frameLbl) {
    const label = thermalFrontState.mode === "daily"
      ? (thermalFrontState.dailyFrames[thermalFrontState.frameIdx]?.date || "")
      : (list[thermalFrontState.frameIdx] ? thermalFrameTimeLabel(list[thermalFrontState.frameIdx].t) : "");
    frameLbl.textContent = label;
    frameLbl.style.display = label ? "inline-flex" : "none";
  }
  if (thermalAllDayLabel) {
    thermalAllDayLabel.textContent = thermalFrontState.mode === "daily" ? "All days this period" : "All fronts this day";
  }
}

function thermalUpdateLegendAndStatus() {
  const legendEl = document.getElementById("legend");
  const list = thermalActiveFrameList();
  if (thermalFrontState.mode === "daily") {
    const dayItem = thermalFrontState.dailyFrames[thermalFrontState.frameIdx];
    const count = dayItem ? thermalFramesForDate(dayItem.date).length : 0;
    const field = thermalActiveDensityField();
    const shownDays = thermalAllDayCb?.checked ? thermalFrontState.dailyFrames.length : 1;
    const sourceText = shownDays === 1 ? `${count} hourly frames` : `${field?.hourlyCount || 0} hourly frames across ${shownDays} days`;
    if (toolbarStatus) toolbarStatus.textContent = `${thermalFrontState.frameIdx + 1}/${thermalFrontState.dailyFrames.length} daily frames - ${dayItem?.date || ""} - density from ${sourceText}`;
    if (legendEl) {
      legendEl.style.display = "";
      legendEl.textContent = thermalAllDayCb?.checked ? "Color = day; shade = hourly front-point density" : "Shade = hourly front-point density";
    }
  } else {
    const total = thermalAllDayCb?.checked ? list.length : 1;
    if (toolbarStatus) toolbarStatus.textContent = `${thermalFrontState.frameIdx + 1}/${list.length} hourly frames - ${thermalFrontState.selectedDate || ""} - showing ${total}`;
    const displayedCount = thermalDisplayedFrontItems().length;
    if (legendEl) {
      legendEl.style.display = displayedCount > 1 ? "" : "none";
      legendEl.textContent = displayedCount > 1 ? "Color = time: purple oldest -> red newest" : "";
    }
  }
}

function thermalSetMode(mode) {
  const priorTime = thermalCurrentFrameTime();
  thermalFrontState.mode = mode;
  thermalModeHourlyBtn?.classList.toggle("active", mode === "animation");
  thermalModeDailyBtn?.classList.toggle("active", mode === "daily");
  thermalDayRow?.classList.toggle("hidden", mode !== "animation");
  thermalAllDayToggle?.classList.remove("hidden");
  if (thermalAllDayCb) thermalAllDayCb.checked = false;
  if (mode === "daily") {
    const previousDate = thermalFrontState.selectedDate || thermalDateKey(thermalActiveFrameList()[thermalFrontState.frameIdx]?.t || Date.now());
    thermalFrontState.frameIdx = Math.max(0, thermalFrontState.dailyFrames.findIndex(item => item.date === previousDate));
  } else {
    thermalFrontState.frameIdx = thermalClosestFrameIndex(thermalActiveFrameList(), priorTime);
  }
  renderThermalFrontsNative();
}

function thermalStep(delta) {
  const list = thermalActiveFrameList();
  if (!list.length) return;
  thermalFrontState.frameIdx = (thermalFrontState.frameIdx + delta + list.length) % list.length;
  renderThermalFrontsNative();
}

function thermalSetFrame(idx) {
  thermalFrontState.frameIdx = Number(idx) || 0;
  setPlaying(false);
  renderThermalFrontsNative();
}

async function thermalLoadData() {
  if (thermalFrontState.loading) return;
  if (thermalFrontState.initialized && thermalFrontState.loadedRegion === REGION_ID) return;
  thermalFrontState.loading = true;
  if (toolbarStatus) toolbarStatus.textContent = "Loading thermal fronts...";
  try {
    const idx = await loadIndex();
    const fbv = idx.frames || idx.framesByVar || idx.frames_by_var || {};
    const sourceFrames = (fbv.thermal_fronts && fbv.thermal_fronts.length) ? fbv.thermal_fronts : (fbv.sst_front || []);
    thermalFrontState.frames = sourceFrames
      .map(f => ({ ...f, t: epochMsForFrame("sst_front", f) ?? epochMsForFrame("thermal_fronts", f) }))
      .filter(f => Number.isFinite(f.t))
      .sort((a, b) => a.t - b.t);
    const latest = thermalFrontState.frames.at(-1)?.t;
    if (latest) thermalFrontState.frames = thermalFrontState.frames.filter(f => latest - f.t <= 21 * 864e5);
    thermalFrontState.frameData = await Promise.all(thermalFrontState.frames.map(async f => {
      const res = await fetch(framePathOf(f) + "?t=" + Date.now());
      return { meta: f, t: f.t, data: res.ok ? await res.json() : { features: [] } };
    }));
    thermalFrontState.frameData = thermalFrontState.frameData.filter(item => Array.isArray(item.data?.features) && item.data.features.length > 0);
    thermalFrontState.densityCache = new Map();
    thermalBuildDailyFrames();
    const requestedMs = requestedTimeFromParams();
    const requestedIdx = thermalClosestFrameIndex(thermalFrontState.frameData, requestedMs);
    thermalFrontState.selectedDate = Number.isFinite(requestedMs)
      ? thermalDateKey(thermalFrontState.frameData[requestedIdx]?.t || requestedMs)
      : (thermalFrontState.hourlyDays.at(-1) || "");
    thermalSyncDaySelect();
    thermalFrontState.frameIdx = thermalClosestFrameIndex(thermalActiveFrameList(), requestedMs);
    thermalFrontState.initialized = true;
    thermalFrontState.loadedRegion = REGION_ID;
    window.__thermalFrontsState = thermalFrontState;
  } finally {
    thermalFrontState.loading = false;
  }
}

async function renderThermalFrontsNative() {
  syncThermalFrontsVisibility();
  document.body.classList.remove("mobile-map-ready");
  plotDiv.style.display = "block";
  const map = await thermalInitMap();
  await thermalLoadData();
  if (!thermalFrontState.frameData.length) {
    if (toolbarStatus) toolbarStatus.textContent = "No thermal-front frames available for this region.";
    return;
  }
  const requestedViewport = viewportFromParams();
  if (!map.__thermalInitialFitDone) {
    map.updateSize();
    map.getView().fit(requestedViewport ? [requestedViewport.xRange[0], requestedViewport.yRange[0], requestedViewport.xRange[1], requestedViewport.yRange[1]] : BBOX.map(Number), {
      size: map.getSize(),
      padding: [58, 0, 0, 0],
      nearest: true
    });
    map.__thermalInitialFitDone = true;
  }
  const list = thermalActiveFrameList();
  thermalFrontState.frameIdx = Math.max(0, Math.min(thermalFrontState.frameIdx, Math.max(0, list.length - 1)));
  thermalRenderDensityLayer();
  thermalRenderFrontLayer();
  updateThermalFrontsNav();
  thermalUpdateLegendAndStatus();
  map.updateSize();
}

async function addNearestFrontOverlay(fig, baseVar, baseFrameMeta) {
  let frontVar = baseVar === "chl" ? "chl_front" : baseVar === "sst" ? "sst_front" : null;
  if (showGlobalSstFrontOverlay && baseVar !== "sst_front") frontVar = "sst_front";
  if (!frontVar) return;
  if (frontVar === "chl_front" && !showChlFrontOverlay) return;
  if (frontVar === "sst_front" && !(showSstFrontOverlay || showGlobalSstFrontOverlay)) return;

  const frontFrames = framesByVar[frontVar] || [];
  if (!frontFrames.length) return;
  const finiteFrontTimes = (frameTimesByVar[frontVar] || []).filter(Number.isFinite);
  const curMs = epochMsForFrame(baseVar, baseFrameMeta) ?? finiteFrontTimes.at(-1) ?? null;
  const frontTimes = frameTimesByVar[frontVar] || [];
  let bestIdx = 0;
  let bestDiff = Infinity;
  for (let i = 0; i < frontFrames.length; i++) {
    const t = frontTimes[i];
    if (!Number.isFinite(t)) continue;
    const d = Math.abs(t - curMs);
    if (d < bestDiff) {
      bestDiff = d;
      bestIdx = i;
    }
  }

  try {
    const frontData = await fetchFrameData(frontVar, frontFrames[bestIdx]);
    const frontGrid = await loadGridForVar(frontVar, frontData);
    const frontFig = buildFrontLines(frontGrid, frontData, frontVar);
    const label = formatRelativeFrontTime((frontTimes[bestIdx] ?? NaN) - curMs);
    for (const trace of frontFig.data || []) {
      trace.name = label ? `Thermal front (${label})` : "Thermal front";
      trace.hovertemplate = label ? `<b>Thermal front</b><br>${label}<extra></extra>` : trace.hovertemplate;
    }
    fig.data.push(...frontFig.data);

  } catch (e) {
    console.error(`${frontVar} overlay failed:`, e);
  }
}

async function setCurrentVar(v, keepTime = true, keepRange = true) {
  const prevVar = currentVar;
  const prevFrames = framesByVar[prevVar] || [];
  const prevFrame = prevFrames[currentFrameIdx] || null;
  const prevT = (keepTime && prevFrame) ? epochMsForFrame(prevVar, prevFrame) : null;

  // Save the live OL/Plotly viewport before switching products.
  const liveRange = keepRange ? currentViewportRanges() : null;
  const savedRange = liveRange
    ? { x: liveRange.xRange, y: liveRange.yRange }
    : ((keepRange && viewState.hasRange) ? { x: viewState.xRange, y: viewState.yRange } : null);

  currentVar = v;
  // Reset combined map state when switching away from combined
  if (v !== "combined") {
    if (window._combinedMap) {
      try { window._combinedMap.dispose(); } catch (_) {}
      window._combinedMap.setTarget(undefined);
      window._combinedMap = null;
    }
  }

  document.body.classList.toggle("combined-mode", v === "combined");
  document.body.classList.toggle("thermal-fronts-mode", v === "thermal_fronts");

  const frames = framesByVar[currentVar] || [];
  const times = frameTimesByVar[currentVar] || [];

  if (frames.length) currentFrameIdx = (keepTime && prevT !== null) ? closestDaytimeIndex(currentVar, times, frames, prevT) : frames.length - 1;
  else currentFrameIdx = 0;

  // Restore saved geographic viewport after switching
  if (savedRange) {
    viewState.xRange = savedRange.x;
    viewState.yRange = savedRange.y;
    viewState.hasRange = true;
  }

  syncRangeInputsToVar();
  updateSliderUI();
  syncTimeControls();
  syncArrowLegend();
  syncFrontOverlayControls();
  syncThermalFrontsVisibility();

  if (frames.length) await showFrame();
  else return;
}

function stepFrame(delta) {
  if (currentVar === "thermal_fronts") {
    thermalStep(delta);
    return;
  }
  const frames = framesByVar[currentVar] || [];
  const n = frames.length;
  if (!n) return;
  currentFrameIdx = (currentFrameIdx + delta + n) % n;
  slider.value = currentFrameIdx;
  showFrame();
}

function setPlaying(on) {
  if (on === playing) return;
  playing = on;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  } else {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
  }
}


function setPlaySpeed(mult) {
  const m = Number(mult);
  if (!isFinite(m) || m <= 0) return;
  playSpeed = m;
  playIntervalMs = Math.max(60, Math.round(BASE_PLAY_MS / playSpeed));
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  }
}

async function loadIndex() {
  // 1. Fetch selected region index ONCE with a cache-buster
  const indexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
  const res = await fetch(indexUrl + "?t=" + Date.now());
  if (!res.ok) throw new Error(`Failed to load ${indexUrl}`);
  const data = await res.json();

  // 2. Set the global timestamp if it's the first load
  if (!lastUpdateTimestamp) {
    lastUpdateTimestamp = data.last_updated;
  }

  // 3. Use the data we already fetched instead of looping through CANDIDATES
  const idx = data;
  if (idx.region && idx.region !== REGION_ID) {
    REGION_ID = idx.region;
    BATHY_JSON_URL = `data/${REGION_ID}/${idx.region_meta?.bathy_path || "gebco_bath_latest/gebco_bathy.json"}`;
  }
  if (idx.region_meta?.bbox?.length >= 4) {
    BBOX = idx.region_meta.bbox.map(Number);
  }

  const fbv = idx.frames || idx.framesByVar || idx.frames_by_var || framesByVar;

  framesByVar.chl = filterFramesForVar("chl", fbv.chl || []);
  framesByVar.sst = filterFramesForVar("sst", fbv.sst || []);
  framesByVar.chl_front = filterFramesForVar("chl_front", fbv.chl_front || []);
  framesByVar.sst_front = filterFramesForVar("sst_front", fbv.sst_front || []);
  framesByVar.uv  = filterFramesForVar("uv",  fbv.uv  || []);
  const thermalSourceFrames = (fbv.thermal_fronts && fbv.thermal_fronts.length) ? fbv.thermal_fronts : (fbv.sst_front || []);
  framesByVar.thermal_fronts = filterFramesForVar("thermal_fronts", thermalSourceFrames);
  framesByVar.bathy = [{ json_path: BATHY_JSON_URL }];
  framesByVar.combined = [{ json_path: "__combined_native__" }];

  for (const v of ["chl","sst","chl_front","sst_front","uv","bathy","thermal_fronts","combined"]) {
    framesByVar[v].sort((a,b) => (epochMsForFrame(v,a) ?? 0) - (epochMsForFrame(v,b) ?? 0));
    frameTimesByVar[v] = framesByVar[v].map(f => epochMsForFrame(v,f));
  }

  syncFrontOverlayControls();

  return data;
}


function inferGridFromFrame(v, dataObj) {
  const bbox = dataObj && dataObj.bbox;
  const z = v === "uv" ? dataObj?.adt : (dataObj?.sst || dataObj?.z || dataObj?.chl || dataObj?.data);
  const ny = dataObj?.ny || (Array.isArray(z) ? z.length : 0);
  const nx = dataObj?.nx || (Array.isArray(z) && Array.isArray(z[0]) ? z[0].length : 0);
  if (!bbox || bbox.length < 4 || !nx || !ny) throw new Error(`Cannot infer grid for ${v}`);

  const [lonMin, latMin, lonMax, latMax] = bbox;
  const linspace = (a, b, n) => Array.from({length:n}, (_, i) => n === 1 ? a : a + (b - a) * i / (n - 1));
  const xAxis = linspace(lonMin, lonMax, nx);
  // CHL producer writes frames south-up: row 0 = latMin, last row = latMax.
  // Therefore inferred CHL axes must be ascending to keep z[row] aligned with latitude.
  // SST keeps its existing north-up convention; UV remains south-up.
  const yAxis = v === "sst" ? linspace(latMax, latMin, ny) : linspace(latMin, latMax, ny);
  return { xAxis, yAxis, nx, ny };
}

async function loadGridForVar(v, dataObj = null) {
  if ((v === "chl_front" || v === "sst_front" || v === "thermal_fronts") && dataObj && dataObj.bbox?.length >= 4) {
    const [lonMin, latMin, lonMax, latMax] = dataObj.bbox.map(Number);
    return { xAxis: [lonMin, lonMax], yAxis: [latMin, latMax], nx: dataObj.nx || 2, ny: dataObj.ny || 2 };
  }
  // CHL now mixes OLCI composites and VIIRS model frames with different
  // raster dimensions. A single var-level grid file silently misplaces frames.
  // Prefer each CHL frame's own bbox/nx/ny metadata; fall back to grid only for
  // legacy frames missing metadata.
  if (v === "chl" && dataObj && dataObj.bbox && dataObj.nx && dataObj.ny) {
    return inferGridFromFrame(v, dataObj);
  }

  const gridName = VAR_TO_GRID[v];

  try {
    const res = await fetch(`data/${REGION_ID}/grids/${gridName}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const grid = await res.json();

    const lon = grid.lon || grid.longitude;
    const lat = grid.lat || grid.latitude;
    if (!lon || !lat) throw new Error("grid missing lon/lat axes");

    let xAxis, yAxis, nx, ny;
    if (Array.isArray(lon[0]) && Array.isArray(lat[0])) {
      ny = lon.length;
      nx = lon[0].length;
      const midY = Math.floor(ny / 2);
      const midX = Math.floor(nx / 2);
      xAxis = lon[midY].slice();
      yAxis = lat.map(r => r[midX]);
    } else {
      xAxis = lon.slice();
      yAxis = lat.slice();
      nx = xAxis.length;
      ny = yAxis.length;
    }

    const info = { xAxis, yAxis, nx, ny };
    gridCache[v] = info;
    return info;
  } catch (e) {
    // No grid file - compute axes from frame metadata each time (no caching for inferred axes)
    if (dataObj && dataObj.nx && dataObj.ny) {
      return inferGridFromFrame(v, dataObj);
    }
    // Last resort fallback
    const info2 = inferGridFromFrame(v, {});
    return info2;
  }
}

async function prepareLandMask() {
  try {
    // Reuse your existing loader
    const data = await loadBathymetryJson(BATHY_JSON_URL);

    // Create a Z-grid for the mask: 1 for Land, null for Water
    // Assuming convention: Positive = Water Depth, Negative/Zero = Land Elevation
    const zMask = data.depth.map(row =>
      row.map(val => (val !== null && val <= 0) ? 1 : null)
    );

    landTrace = {
      type: "heatmap",
      x: data.xAxis,
      y: data.yAxis,
      z: zMask,
      showscale: false, // No colorbar for land
      colorscale: [ [0, "#cccccc"], [1, "#cccccc"] ], // Solid Dark Grey
      hoverinfo: "skip", // Don't show hover tooltips for land
      zmin: 0,
      zmax: 1,
      name: "LandMask"
    };
    console.log("Land mask generated.");
  } catch (e) {
    console.warn("Could not generate land mask:", e);
  }
}

async function showFrame() {
  const e = new Error();
  const callers = e.stack?.split("\n").slice(1,4).join(" | ") || "";
  console.log("[showFrame] ENTRY currentVar:", currentVar, "IS_TOUCH:", IS_TOUCH, "callers:", callers);
  console.log("[showFrame] ENTRY timestamp:", Date.now());
  updateReadoutPosition();

  // combined mode uses its own full-renderer — no desktop map init needed
  if (currentVar === "combined") {
    await renderCombinedMode();
    return;
  }

  // thermal_fronts uses a dedicated canvas renderer — not Plotly, not standard OL raster
  if (currentVar === "thermal_fronts") {
    await renderThermalFrontsNative();
    return;
  }

  const frames = framesByVar[currentVar] || [];
  if (!frames.length) return;
  currentFrameIdx = Math.max(0, Math.min(currentFrameIdx, frames.length - 1));

  const frameMeta = frames[currentFrameIdx];

  if (isMobileMapMode()) {
    try {
      const renderedMobile = await renderMobileFrame(frameMeta);
      if (renderedMobile) return;
    } catch (e) {
      console.error("Mobile OL render failed:", e);
      const errDiv = document.createElement("div");
      errDiv.textContent = "Mobile OL error: " + ((e && e.message) ? e.message.slice(0,80) : String(e).slice(0,80));
      errDiv.style.cssText = "position:fixed;top:40px;left:10px;z-index:999;color:#fff;background:rgba(200,50,0,0.9);padding:8px 14px;border-radius:4px;font-size:14px;max-width:80vw;";
      document.body.appendChild(errDiv);
    }
  }

  // Desktop: use OpenLayers
  if (isDesktopMapMode()) {
    console.log("[showFrame] entering desktop OL path, currentVar:", currentVar, "frameMeta:", !!frameMeta);
    try {
      const renderedDesktop = await renderDesktopFrame(frameMeta);
      console.log("[showFrame] renderDesktopFrame returned:", renderedDesktop);
      if (renderedDesktop) {
        await renderFooterColorbarToDiv(document.getElementById("hamburger-cbar"), currentVar);
        updateSliderUI();
        return;
      }
    } catch (e) {
      console.error("Desktop OL render failed:", e);
      const errDiv = document.createElement("div");
      errDiv.textContent = "Desktop OL error: " + ((e && e.message) ? e.message.slice(0,80) : String(e).slice(0,80));
      errDiv.style.cssText = "position:fixed;top:40px;left:10px;z-index:999;color:#fff;background:rgba(200,50,0,0.9);padding:8px 14px;border-radius:4px;font-size:14px;max-width:80vw;";
      document.body.appendChild(errDiv);
    }
  }

  // If both OL paths fail, show a clear error — do NOT fall back to Plotly
  const noOlDiv = document.createElement("div");
  noOlDiv.textContent = "Map failed to load. Please refresh.";
  noOlDiv.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:997;color:#fff;background:rgba(80,0,0,0.9);padding:20px 30px;border-radius:8px;font-size:16px;text-align:center;";
  document.body.appendChild(noOlDiv);
  // Render colorbar only inside the hamburger panel.
  const hCbar = document.getElementById("hamburger-cbar");
  if (hCbar) await renderFooterColorbarToDiv(hCbar, currentVar);

  const modebar = plotDiv.querySelector('.modebar');
  if (modebar && !modebarHost.querySelector('.modebar')) {
      modebarHost.appendChild(modebar);
  }

  installModebarHoverHelpOnce();
  installTouchPolicyOnce();
  updateSliderUI();
}

async function loadCaptainBriefing() {
  const panel = document.getElementById("briefing-panel");
  const status = document.getElementById("briefing-status");
  const plansDiv = document.getElementById("briefing-plans");
  const healthDiv = document.getElementById("briefing-health");
  const fullDiv = document.getElementById("briefing-full");
  if (!panel || !status || !plansDiv || !healthDiv || !fullDiv) return;

  try {
    const res = await fetch(`data/${REGION_ID}/briefing/latest.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`No briefing artifact for ${REGION_ID}`);
    const briefing = await res.json();
    const when = briefing.generated_at ? new Date(briefing.generated_at).toLocaleString() : "unknown";
    status.textContent = `${briefing.target_window || briefing.title || "Captain Briefing"} • ${when}`;

    // New structure: plans grouped by departure_port
    // Each plan has: { departure_port, destinations: [{zone, verdict, score, confidence, rank_within_port}] }
    const portGroups = {};
    (briefing.plans || []).forEach(p => {
      const port = p.departure_port || p.zone || "Unknown Port";
      if (!portGroups[port]) portGroups[port] = [];
      portGroups[port].push(p);
    });
    plansDiv.innerHTML = Object.entries(portGroups).map(([port, plans]) => `
      <div class="briefing-port-group">
        <div class="muted" style="font-size:11px;margin-bottom:4px;">DEPARTURE PORT</div>
        <strong style="font-size:14px;">${port}</strong>
        <div class="briefing-port-plans">
          ${(plans || []).slice(0, 3).map((p, i) => {
            const vals = p.values || {};
            const valueLine = `CHL ${vals.chl_mgm3 ?? "?"} mg/m3 • Current ${vals.current_kt ?? "?"} kt • SST ${vals.sst_f ?? "?"}°F`;
            const reason = ((p.drivers || [])[0] || (p.cautions || [])[0] || p.note || "real-data sample");
            return `
              <div class="briefing-plan" style="margin-left:0;padding-left:8px;border-left:2px solid ${i===0?'#2d7d46':i===1?'#d4a017':'#8b4513'}">
                <div class="muted">PLAN ${"ABC"[i] || i+1}</div>
                <strong>${p.zone || "Unknown"}</strong><br>
                <span>${p.verdict || ""}</span> • Score ${p.score ?? "?"}/120 • ${p.confidence || "?"}<br>
                <span class="muted">${valueLine}</span><br>
                <span class="muted">${reason}</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `).join("");

    const products = (briefing.health && briefing.health.products) || {};
    healthDiv.innerHTML = ["sst", "chl", "uv"].map(k => {
      const h = products[k] || {};
      const label = k === "uv" ? "Curr/SSH" : k.toUpperCase();
      return `<div><strong>${label}</strong><br>ok=${h.ok === true}<br>age=${h.age_min ?? "?"}m</div>`;
    }).join("");

    fullDiv.textContent = briefing.briefing_text || briefing.ranking_summary || "No briefing text available.";
  } catch (e) {
    status.textContent = `Briefing unavailable: ${e.message}`;
    plansDiv.innerHTML = "";
    healthDiv.innerHTML = "";
    fullDiv.textContent = "";
  }
}

  requestAnimationFrame(syncFloatingViewportUi);

  if (toggleBtn && floatEl) {
    toggleBtn.addEventListener('pointerdown', (e) => {
      if (!isMobileDevice()) return;
      const rect = floatEl.getBoundingClientRect();
      dragState = {
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        left: rect.left,
        top: rect.top,
        moved: false
      };
      toggleBtn.setPointerCapture?.(e.pointerId);
    });

    toggleBtn.addEventListener('pointermove', (e) => {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      if (Math.hypot(dx, dy) > 4) dragState.moved = true;
      if (!dragState.moved) return;
      e.preventDefault();
      applyFeedbackPosition({ x: dragState.left + dx, y: dragState.top + dy });
    });

    function finishDrag(e) {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      suppressNextClick = dragState.moved;
      if (dragState.moved) saveFeedbackPosition();
      syncFloatingViewportUi();
      dragState = null;
    }
    toggleBtn.addEventListener('pointerup', finishDrag);
    toggleBtn.addEventListener('pointercancel', finishDrag);
  }

  if (toggleBtn && panel) {
    toggleBtn.addEventListener('click', (e) => {
      if (suppressNextClick) {
        suppressNextClick = false;
        e.preventDefault();
        return;
      }
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
  }
})();

/* ================= INLINE FEEDBACK LOGIC ================= */
(function() {
  const submitBtn = document.getElementById('feedbackSubmit');
  const inputField = document.getElementById('feedbackInput');

  if (submitBtn && inputField) {
    submitBtn.addEventListener('click', sendFeedback);

    // Also allow pressing "Enter" inside the box
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendFeedback();
    });

    function sendFeedback() {
      const text = inputField.value.trim();
      if (!text) return;

      const user = localStorage.getItem('ocean_viewer_last_user') || "Anonymous";
      const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwQoQQ_bK0AW8796hC92EYjLeX1eQtHW0_rbuFTdaFdY6fQUYOdWdZGst04RpckcFmz_A/exec";

      const payload = {
        name: user,
        region: REGION_ID || "unknown",
        message: text,
        link: window.location.href
      };

      // no-cors: Google Apps Script ignores CORS preflight; browser sends simple request.
      // POST will succeed even without server acknowledgment.
      fetch(WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Feedback sent!");
        inputField.value = "";
      })
      .catch(() => {
        // no-cors - catch is unlikely to fire; still show success
        alert("Feedback sent!");
        inputField.value = "";
      });
    }
  }
})();

async function pollForUpdates() {
  try {
    // Ping index.json with a random string to force GitHub to give us the newest version
    const regionIndexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
    const res = await fetch(regionIndexUrl + "?nocache=" + Date.now());
    if (!res.ok) throw new Error(`Failed to poll ${regionIndexUrl}`);
    const data = await res.json();

    // Check if the SERVER has a timestamp, and if it differs from ours.
    // This allows the page to refresh even if our local timestamp was null (first run).
    if (data.last_updated && data.last_updated !== lastUpdateTimestamp) {
      // New data detected - silently update the frame list without resetting user state.
      // Only jump to latest if user is on the last frame and new data is newer than what they saw;
      // otherwise just let the new data be available on next step.
      console.log("New data available in index - refreshing frame list silently.");
      lastUpdateTimestamp = data.last_updated;
      // Reload the index in the background and rebuild framesByVar; preserve current view state.
      // Reload THIS region's index (not the hardcoded ma index)
      const regionIndexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
      loadIndex().then(idx => {
        // loadIndex() already updates framesByVar, frameTimesByVar, and BBOX in place.
        // If user was on the last available frame, advance to new latest automatically;
        // otherwise just make new data available without disrupting navigation.
        const maxIdx = frameTimesByVar[currentVar].length - 1;
        if (currentFrameIdx >= maxIdx && maxIdx >= 0) {
          currentFrameIdx = maxIdx;
          showFrame(currentFrameIdx);
        }
      }).catch(e => {
        console.error("Silent index refresh failed:", e);
      });
    }
  } catch (e) {
    console.error("Update check failed", e);
  }
}

// Check for updates every 60 seconds (1 minute)
setInterval(pollForUpdates, 60000);
