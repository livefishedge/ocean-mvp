  if (varKey === "uv")  return buildUv(gridInfo, dataObj);
  throw new Error(`Unsupported varKey=${varKey}`);
}

/* ========================= MOBILE MAP RENDERER ========================= */
function hexToRgb(hex) {
  const h = String(hex || "").replace("#", "").trim();
  if (h.length === 3) {
    return [
      parseInt(h[0] + h[0], 16),
      parseInt(h[1] + h[1], 16),
      parseInt(h[2] + h[2], 16)
    ];
  }
  return [
    parseInt(h.slice(0, 2), 16),
    parseInt(h.slice(2, 4), 16),
    parseInt(h.slice(4, 6), 16)
  ];
}

function rgbToCss(rgb) {
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function interpolateScale(scale, t) {
  const x = Math.max(0, Math.min(1, Number(t)));
  for (let i = 1; i < scale.length; i++) {
    const [p1, c1] = scale[i];
    if (x <= p1) {
      const [p0, c0] = scale[i - 1];
      const local = p1 === p0 ? 0 : (x - p0) / (p1 - p0);
      const a = hexToRgb(c0);
      const b = hexToRgb(c1);
      return [
        Math.round(a[0] + (b[0] - a[0]) * local),
        Math.round(a[1] + (b[1] - a[1]) * local),
        Math.round(a[2] + (b[2] - a[2]) * local)
      ];
    }
  }
  return hexToRgb(scale[scale.length - 1][1]);
}

function mobileValueConfig(varKey) {
  if (varKey === "chl") {
    const lo = Math.log10(Math.max(0.001, userRanges.chl.vmin));
    const hi = Math.log10(Math.max(0.001, userRanges.chl.vmax));
    return { scale: CHL_ALGAE, lo, hi, transform: v => Math.log10(Math.max(0.001, v)) };
  }
  if (varKey === "sst") return { scale: SST_SCALE, lo: userRanges.sst.vmin, hi: userRanges.sst.vmax, transform: v => v };
  if (varKey === "uv") return { scale: UV_SCALE, lo: userRanges.uv.vmin, hi: userRanges.uv.vmax, transform: v => v };
  return { scale: BATHY_SCALE, lo: userRanges.bathy.vmin, hi: userRanges.bathy.vmax, transform: v => v };
}

function mobileZForVar(varKey, dataObj) {
  if (varKey === "chl") return dataObj.z || dataObj.chl || dataObj.data;
  if (varKey === "sst") return dataObj.sst || dataObj.z || dataObj.data;
  if (varKey === "uv") {
    const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
    return d?.adt || dataObj?.meta?.grid?.adt || d?.z;
  }
  if (varKey === "bathy") return dataObj.depth;
  return null;
}

function isMobileMissingValue(varKey, rawValue, numericValue) {
  if (rawValue === null || rawValue === undefined || rawValue === "") return true;
  if (!Number.isFinite(numericValue)) return true;
  if (Math.abs(numericValue) >= 1e20) return true;
  if ((varKey === "chl" || varKey === "sst") && numericValue <= 0) return true;
  return false;
}

function clearMobileUvArrowLayer(map) {
  if (!map || !mobileMapState.arrowLayer) return;
  map.removeLayer(mobileMapState.arrowLayer);
  mobileMapState.arrowLayer = null;
}

function frameExtentFromGrid(gridInfo) {
  const xs = gridInfo.xAxis || [];
  const ys = gridInfo.yAxis || [];
  const x0 = Math.min(xs[0], xs[xs.length - 1]);
  const x1 = Math.max(xs[0], xs[xs.length - 1]);
  const y0 = Math.min(ys[0], ys[ys.length - 1]);
  const y1 = Math.max(ys[0], ys[ys.length - 1]);
  return [x0, y0, x1, y1];
}

function drawMobileUvArrows(ctx, dataObj, z, xAxis, yAxis, xAscending, yAscending, yFlip) {
  const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
  const u = d?.u || dataObj?.meta?.grid?.u;
  const v = d?.v || dataObj?.meta?.grid?.v;
  if (!is2D(u) || !is2D(v)) return;
  const ny = z.length;
  const nx = z[0].length;
  const step = Math.max(3, Math.floor(Math.sqrt(nx * ny) / 36));
  const sx = ctx.canvas.width / Math.max(1, nx - 1);
  const sy = ctx.canvas.height / Math.max(1, ny - 1);

  // Arrow drawing parameters
  const SCALE = 10;
  const ARROW_COLOR = [255, 255, 255, 242]; // white, slightly less opaque than 255 to avoid full overwrite
  const ARROW_LINE_WIDTH = 2.0; // thinner line to reduce edge bleed
  const HEAD_SIZE = 2.5;

  // Get ImageData directly so we can draw pixels without anti-aliasing edge bleed
  // putImageData + stroke has anti-aliasing bleed that overwrites nearby heatmap pixels
  const imgData = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
  const imgW = ctx.canvas.width;

  for (let row = 0; row < ny; row += step) {
    const srcJ = yFlip ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col += step) {
      const srcI = xAscending ? col : (nx - 1 - col);
      const uu = u[srcJ]?.[srcI];
      const vv = v[srcJ]?.[srcI];
      if (!isFinite(uu) || !isFinite(vv)) continue;
      const x = col * sx;
      const y = row * sy;
      const dx = uu * sx * SCALE;
      const dy = -vv * sy * SCALE;
      const len = Math.hypot(dx, dy);
      if (!(len > 0.5)) continue;
      const ex = x + dx;
      const ey = y + dy;

      // Draw anti-aliased line using Bresenham-style pixel drawing
      drawLinePixels(imgData, x, y, ex, ey, ARROW_COLOR, imgW, ARROW_LINE_WIDTH);

      // Draw arrowhead
      const a = Math.atan2(dy, dx);
      const ax1 = ex - HEAD_SIZE * Math.cos(a - Math.PI / 6);
      const ay1 = ey - HEAD_SIZE * Math.sin(a - Math.PI / 6);
      const ax2 = ex - HEAD_SIZE * Math.cos(a + Math.PI / 6);
      const ay2 = ey - HEAD_SIZE * Math.sin(a + Math.PI / 6);
      drawLinePixels(imgData, ex, ey, ax1, ay1, ARROW_COLOR, imgW, ARROW_LINE_WIDTH);
      drawLinePixels(imgData, ex, ey, ax2, ay2, ARROW_COLOR, imgW, ARROW_LINE_WIDTH);
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

function buildMobileUvArrowLayer(dataObj, gridInfo) {
  const d = (dataObj && dataObj.data && !Array.isArray(dataObj.data)) ? dataObj.data : dataObj;
  const u = d?.u || dataObj?.meta?.grid?.u;
  const v = d?.v || dataObj?.meta?.grid?.v;
  const xAxis = gridInfo?.xAxis || [];
  const yAxis = gridInfo?.yAxis || [];
  if (!is2D(u) || !is2D(v) || xAxis.length < 2 || yAxis.length < 2) return null;

  const ny = Math.min(u.length, v.length, yAxis.length);
  const nx = Math.min(u[0]?.length || 0, v[0]?.length || 0, xAxis.length);
  if (nx < 2 || ny < 2) return null;

  const dxg = Math.abs(xAxis[1] - xAxis[0]);
  const dyg = Math.abs(yAxis[1] - yAxis[0]);
  const cell = Math.min(dxg, dyg);
  const step = Math.max(4, Math.floor(Math.sqrt(nx * ny) / 36));
  const maxSpeed = 1.2;
  const minSpeed = 0.035;
  const minLen = 0.95 * cell;
  const maxLen = 2.80 * cell;
  const headAngle = Math.PI / 6;
  const features = [];

  for (let j = 0; j < ny; j += step) {
    const lat0 = yAxis[j];
    for (let i = 0; i < nx; i += step) {
      const lon0 = xAxis[i];
      const uu = u[j]?.[i];
      const vv = v[j]?.[i];
      const sp = Math.hypot(uu, vv);
      if (!isFinite(uu) || !isFinite(vv) || !isFinite(sp) || sp < minSpeed) continue;

      const scaled = Math.min(sp, maxSpeed) / maxSpeed;
      const len = minLen + (maxLen - minLen) * scaled;
      const lon1 = lon0 + (uu / sp) * len;
      const lat1 = lat0 + (vv / sp) * len;
      const theta = Math.atan2(lat1 - lat0, lon1 - lon0);
      const headLen = Math.min(0.46 * len, 0.74 * cell);
      const left = [
        lon1 + headLen * Math.cos(theta + Math.PI - headAngle),
        lat1 + headLen * Math.sin(theta + Math.PI - headAngle)
      ];
      const right = [
        lon1 + headLen * Math.cos(theta + Math.PI + headAngle),
        lat1 + headLen * Math.sin(theta + Math.PI + headAngle)
      ];
      features.push(new ol.Feature({
        geometry: new ol.geom.MultiLineString([
          [toMapProjection([lon0, lat0]), toMapProjection([lon1, lat1])],
          [toMapProjection([lon1, lat1]), toMapProjection(left)],
          [toMapProjection([lon1, lat1]), toMapProjection(right)]
        ])
      }));
    }
  }

  const source = new ol.source.Vector({ features, projection: "EPSG:4326" });
  return new ol.layer.Vector({
    source,
    zIndex: 25,
    updateWhileAnimating: true,
    updateWhileInteracting: true,
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({
        color: "rgba(255,255,255,0.86)",
        width: 1.45,
        lineCap: "round",
        lineJoin: "round"
      })
    })
  });
}

// Draw a line using direct pixel manipulation (Bresenham-inspired)
// to avoid canvas stroke anti-aliasing edge bleed that corrupts nearby heatmap pixels
function drawLinePixels(imgData, x0, y0, x1, y1, color, imgWidth, lineWidth) {
  const dx = Math.abs(x1 - x0);
  const dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1;
  const sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  let x = Math.round(x0);
  let y = Math.round(y0);
  const x1r = Math.round(x1);
  const y1r = Math.round(y1);

  // Helper to set pixel with alpha blending to preserve heatmap underneath
  const setPixel = (px, py, alpha) => {
    const pyClamped = Math.max(0, Math.min(imgData.height - 1, py));
    const pxClamped = Math.max(0, Math.min(imgWidth - 1, px));
    const idx = (pyClamped * imgWidth + pxClamped) * 4;
    // Blend arrow color with existing pixel using alpha
    const existingAlpha = imgData.data[idx + 3];
    if (existingAlpha === 0) return; // transparent pixel (land mask), skip
    // Simple over: result = arrow * alpha + background * (1 - alpha)
    // Only overwrite if existing pixel is opaque enough
    if (existingAlpha < 128) {
      // Copy arrow color directly for land/ocean boundary pixels
      imgData.data[idx] = color[0];
      imgData.data[idx + 1] = color[1];
      imgData.data[idx + 2] = color[2];
      imgData.data[idx + 3] = color[3];
    } else {
      // Blend for heatmap pixels
      imgData.data[idx] = Math.round(color[0] * alpha + imgData.data[idx] * (1 - alpha));
      imgData.data[idx + 1] = Math.round(color[1] * alpha + imgData.data[idx + 1] * (1 - alpha));
      imgData.data[idx + 2] = Math.round(color[2] * alpha + imgData.data[idx + 2] * (1 - alpha));
      imgData.data[idx + 3] = Math.min(255, existingAlpha + color[3] * alpha * 0.5);
    }
  };

  while (true) {
    // Draw block around the point for the given line width
    const halfWid = Math.floor(lineWidth / 2);
    for (let dy2 = -halfWid; dy2 <= halfWid; dy2++) {
      for (let dx2 = -halfWid; dx2 <= halfWid; dx2++) {
        // Use distance from center to determine alpha falloff
        const dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        if (dist <= lineWidth / 2 + 0.5) {
          const alpha = dist <= lineWidth / 2 - 0.5 ? 1.0 : Math.max(0, 1 - (dist - (lineWidth / 2 - 0.5)));
          setPixel(x + dx2, y + dy2, alpha);
        }
      }
    }

    if (x === x1r && y === y1r) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}

// canvasToOlSource(canvas, imageExtent): wrap a canvas in an
// ol.source.ImageCanvas so we never round-trip through canvas.toDataURL,
// canvas.toBlob, URL.createObjectURL, or new ol.source.ImageStatic.
//
// Background: iOS Safari's CSS/JS URL parser throws
// "The string did not match the expected pattern" when fed very large or
// malformed data: or blob: URLs (confirmed via curl/grep on Safari's own
// response). That is the root cause of the "Mobile OL error:
// The string did not match the expected pattern" alert on iPhone.
// ol.source.ImageCanvas receives a callback that returns a canvas for each
// tile draw — it never parses a URL string, so the failure mode goes away.
function canvasToOlSource(canvas, imageExtent) {
  if (!canvas) throw new Error("canvasToOlSource: missing canvas");
  if (!Array.isArray(imageExtent) || imageExtent.length !== 4 ||
      !imageExtent.every(Number.isFinite) ||
      imageExtent[2] <= imageExtent[0] || imageExtent[3] <= imageExtent[1]) {
    throw new Error("canvasToOlSource: invalid extent " + JSON.stringify(imageExtent));
  }
  return new ol.source.ImageCanvas({
    projection: "EPSG:4326",
    ratio: 1,
    interpolate: false,
    canvasFunction: function(requestedExtent, resolution, pixelRatio, size) {
      const out = document.createElement("canvas");
      out.width = Math.max(1, Math.ceil(size[0]));
      out.height = Math.max(1, Math.ceil(size[1]));
      const ctx = out.getContext("2d", { willReadFrequently: false });
      ctx.clearRect(0, 0, out.width, out.height);
      const dx = (imageExtent[0] - requestedExtent[0]) / resolution * pixelRatio;
      const dy = (requestedExtent[3] - imageExtent[3]) / resolution * pixelRatio;
      const dw = (imageExtent[2] - imageExtent[0]) / resolution * pixelRatio;
      const dh = (imageExtent[3] - imageExtent[1]) / resolution * pixelRatio;
      if ([dx, dy, dw, dh].every(Number.isFinite) && dw > 0 && dh > 0) {
        ctx.drawImage(canvas, dx, dy, dw, dh);
      }
      return out;
    }
  });
}

function makeMobileLandCanvas(bathy) {
  const z = bathy.depth;
  if (!is2D(z)) return null;
  const ny = z.length;
  const nx = z[0].length;
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d", { willReadFrequently: false });
  const img = ctx.createImageData(nx, ny);
  const xAxis = bathy.xAxis || [];
  const yAxis = bathy.yAxis || [];
  const xAscending = xAxis.length < 2 || xAxis[0] <= xAxis[xAxis.length - 1];
  const yAscending = yAxis.length < 2 || yAxis[0] <= yAxis[yAxis.length - 1];
  for (let row = 0; row < ny; row++) {
    const srcJ = yAscending ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col++) {
      const srcI = xAscending ? col : (nx - 1 - col);
      const value = z[srcJ]?.[srcI];
      const k = (row * nx + col) * 4;
      if (value !== null && isFinite(value) && value <= 0) {
        img.data[k] = 185;
        img.data[k + 1] = 185;
        img.data[k + 2] = 178;
        img.data[k + 3] = 245;
      } else {
        img.data[k] = 0; img.data[k + 1] = 0; img.data[k + 2] = 0; img.data[k + 3] = 0; // Bug fix 2026-08-02: explicitly zero RGB for missing pixels (OLCI swath corners)
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

async function ensureDesktopBathyContourLayer(map, bathyData, gridInfo) {
  if (!map) return;
  // Re-use existing layer or create new one
  let layer = desktopMapState.bathyContourLayer;
  if (!layer) {
    const source = new ol.source.Vector({ wrapX: false, projection: "EPSG:4326" });
    layer = new ol.layer.Vector({
      source,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: "#8bb8d4", width: 0.8 })
      }),
      zIndex: 15
    });
    desktopMapState.bathyContourLayer = layer;
    map.addLayer(layer);
  }
  layer.setVisible(true);

  const bd = {
    xAxis: bathyData.xAxis,
    yAxis: bathyData.yAxis,
    depth: bathyData.depth,
    nx: bathyData.xAxis.length,
    ny: bathyData.yAxis.length
  };
  window._bathyData = bd;
  window._bathyLayer = layer;

  // Update contours for current viewport
  updateBathyContours(map, bd, layer);

  // Re-draw on every pan/zoom
  map.on("moveend", () => {
    if (desktopMapState.bathyContourLayer?.getVisible()) {
      updateBathyContours(map, bd, desktopMapState.bathyContourLayer);
    }
  });
}

function updateBathyContours(map, bd, layer) {
  // bd/layer are optional: fall back to desktop's globals (set by
  // ensureDesktopBathyContourLayer). Pass them explicitly when the layer
  // belongs to a different state object (e.g. mobileMapState.bathyContourLayer).
  bd = bd || window._bathyData;
  layer = layer || window._bathyLayer;
  if (!bd || !layer) return;
  const source = layer.getSource();
  source.clear();

  // The OL view is in EPSG:3857 (Web Mercator) but bd.xAxis/yAxis are 4326.
  // Previously this function compared lat/lon (degrees) directly against the
  // 3857 extent (meters), which made `lat < vy0` true for every row and
  // culled all of them — so desktop single-product bathy silently rendered
  // zero contours while the combined view (which has this transform) did.
  // (See combined's updateBathyContoursForMap for the reference impl.)
  const viewExtent = map.getView().calculateExtent(map.getSize());
  const viewProjCode = map.getView().getProjection().getCode();
  const extent = viewProjCode === "EPSG:4326"
    ? viewExtent
    : ol.proj.transformExtent(viewExtent, viewProjCode, "EPSG:4326");

  const maxW = 800, maxH = 1200;
  const sx = Math.max(1, Math.floor(bd.nx / maxW));
  const sy = Math.max(1, Math.floor(bd.ny / maxH));

  const maxDepth = depthMaxInExtent(bd, extent, sx, sy);
  const levels = generateContourLevels(maxDepth);

  for (const level of levels) {
    const segs = extractContourSegments(bd, level, sx, sy, extent);
    for (const seg of segs) {
      const feat = new ol.Feature({ geometry: new ol.geom.LineString(seg), depth: level });
      feat.getGeometry().transform("EPSG:4326", "EPSG:3857");
      source.addFeature(feat);
    }
  }
}

function depthMaxInExtent(bd, extent, sx, sy) {
  const [vx0, vy0, vx1, vy1] = extent;
  let maxD = 0;
  for (let row = 0; row < bd.ny; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    for (let col = 0; col < bd.nx; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const d = bd.depth[row][col];
      if (d > maxD) maxD = d;
    }
  }
  return maxD;
}

function generateContourLevels(maxDepth) {
  const std = [50, 100, 200, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000];
  if (maxDepth < 200) return [50, 100, 200].filter(l => l <= maxDepth + 200);
  return std.filter(l => l <= maxDepth + 200);
}

function extractContourSegments(bd, level, sx, sy, extent) {
  const [vx0, vy0, vx1, vy1] = extent;
  const segments = [];
  for (let row = 1; row < bd.ny - 1; row += sy) {
    const lat = bd.yAxis[row];
    if (lat < vy0 || lat > vy1) continue;
    const nextLat = bd.yAxis[Math.min(row + sy, bd.ny - 1)];
    for (let col = 1; col < bd.nx - 1; col += sx) {
      const lon = bd.xAxis[col];
      if (lon < vx0 || lon > vx1) continue;
      const nextLon = bd.xAxis[Math.min(col + sx, bd.nx - 1)];
      const tl = bd.depth[row][col];
      const tr = bd.depth[row][Math.min(col + sx, bd.nx - 1)];
      const br = bd.depth[Math.min(row + sy, bd.ny - 1)][Math.min(col + sx, bd.nx - 1)];
      const bl = bd.depth[Math.min(row + sy, bd.ny - 1)][col];
      const crossings = [];
      if ((tl < level) !== (tr < level)) {
        const t = (level - tl) / (tr - tl);
        crossings.push([[lon + t * (nextLon - lon), lat], "top"]);
      }
      if ((bl < level) !== (br < level)) {
        const t = (level - bl) / (br - bl);
        crossings.push([[lon + t * (nextLon - lon), nextLat], "bottom"]);
      }
      if ((tl < level) !== (bl < level)) {
        const t = (level - tl) / (bl - tl);
        crossings.push([[lon, lat + t * (nextLat - lat)], "left"]);
      }
      if ((tr < level) !== (br < level)) {
        const t = (level - tr) / (br - tr);
        crossings.push([[nextLon, lat + t * (nextLat - lat)], "right"]);
      }
      if (crossings.length >= 2) {
        const coords = crossings.slice(0, 2).map(c => c[0]);
        if (coords[0] && coords[1]) {
          const d0 = Math.hypot(coords[0][0] - vx0, coords[0][1] - vy0);
          const d1 = Math.hypot(coords[1][0] - vx0, coords[1][1] - vy0);
          if (d0 > 0.01 && d1 > 0.01) {
            segments.push(coords);
          }
        }
        if (coords[0] && coords[1] && Math.hypot(coords[0][0] - coords[1][0], coords[0][1] - coords[1][1]) > 0.01) {
          segments.push(coords);
        }
      }
    }
  }
  return segments;
}

async function ensureMobileLandLayer(map) {
  if (!map) return;

  const curBBox = BBOX.join(",");

  const extent = frameExtentFromGrid({ xAxis: bathy.xAxis, yAxis: bathy.yAxis });

// Bathy contour rendering for mobile. Previously the mobile single-product
// bathy view only painted the raster — no contour lines were added to the
// map, so users had nothing to click on to get a depth readout. This ports
// the desktop+combined contour rendering to mobile (purple stroke matches
// the combined dashboard legend at .dot-bathy). Region-switch safety uses
// the same bbox/URL-tracker pattern as ensureMobileLandLayer so the layer
// rebuilds when the user changes regions.
async function ensureMobileBathyContourLayer(map, bathyData /*, gridInfo */) {
  if (!map) return;
  const curBBox = BBOX.join(",");
  if (mobileMapState.bathyContourLayer
      && (mobileMapState.bathyContourLayerBBox !== curBBox
          || mobileMapState.bathyContourLayerURL !== BATHY_JSON_URL)) {
    map.removeLayer(mobileMapState.bathyContourLayer);
    mobileMapState.bathyContourLayer = null;
    mobileMapState.bathyContourLayerBBox = null;
    mobileMapState.bathyContourLayerURL = null;
  }
  if (mobileMapState.bathyContourLayer) return;
  const source = new ol.source.Vector({ wrapX: false, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source,
    style: feature => new ol.style.Style({
      stroke: new ol.style.Stroke({
        color: "#b25cff",
        width: feature.get("depth") >= 1000 ? 1.3 : 1.0
      })
    }),
    zIndex: 15
  });
  mobileMapState.bathyContourLayer = layer;
  mobileMapState.bathyContourLayerBBox = curBBox;
  mobileMapState.bathyContourLayerURL = BATHY_JSON_URL;
  map.addLayer(layer);
  const bd = {
    xAxis: bathyData.xAxis,
    yAxis: bathyData.yAxis,
    depth: bathyData.depth,
    nx: bathyData.xAxis.length,
    ny: bathyData.yAxis.length
  };
  // updateBathyContours now takes explicit (bd, layer) and transforms the
  // 3857 viewport extent to 4326 before comparing against bd.yAxis — this
  // is the same fix the combined view already had.
  updateBathyContours(map, bd, layer);
  map.on("moveend", () => {
    if (mobileMapState.bathyContourLayer?.getVisible()) {
      updateBathyContours(map, bd, mobileMapState.bathyContourLayer);
    }
  });
}

function mobilePlaceStyle(feature) {
  const type = feature.get("type");
  const isPort = type === "port";
  const isSpot = type === "spot";
  const fill = isSpot ? "#ffb000" : isPort ? "#ffe066" : "#ffffff";
  const image = new ol.style.RegularShape({
    points: isSpot ? 5 : isPort ? 4 : 20,
    radius: isSpot ? 6 : isPort ? 5 : 4,
    radius2: isSpot ? 3 : undefined,
    angle: isPort ? Math.PI / 4 : 0,
    fill: new ol.style.Fill({ color: isSpot ? "#ff6b35" : isPort ? "#ffb000" : "#7bdff2" }),
    stroke: new ol.style.Stroke({ color: "#000", width: 2 })
  });
  return new ol.style.Style({
    image,
    text: new ol.style.Text({
      text: feature.get("name"),
      offsetY: isPort ? 16 : -14,
      font: "700 12px system-ui, -apple-system, Segoe UI, sans-serif",
      fill: new ol.style.Fill({ color: fill }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.9)", width: 3 })
    })
  });
}

function ensureMobilePlaceLayer(map) {
  const features = PLACE_LABELS
    .filter(placeInRegion)
    .map(p => new ol.Feature({
      geometry: new ol.geom.Point(toMapProjection([p.lon, p.lat])),
      name: p.name,
      type: p.type
    }));
  const source = new ol.source.Vector({ features, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source,
    style: mobilePlaceStyle,
    zIndex: 30,
    declutter: true
  });
  if (mobileMapState.placeLayer) map.removeLayer(mobileMapState.placeLayer);
  mobileMapState.placeLayer = layer;
  map.addLayer(layer);

function ensureMobileCursorLayer(map) {
  if (mobileMapState.cursorLayer) return;
  // Initial cursor position at BBOX center, in the view's projection.
  // Mobile map's view is EPSG:3857, so transform the 4326 BBOX center.
  const center4326 = [(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2];
  const center = map?.getView()?.getProjection()?.getCode() === "EPSG:3857"
    ? ol.proj.transform(center4326, "EPSG:4326", "EPSG:3857")
    : center4326;
  mobileMapState.cursorFeature = new ol.Feature({
    geometry: new ol.geom.Point(center)
  });
  mobileMapState.cursorFeature.setStyle(new ol.style.Style({
    image: new ol.style.Circle({
      radius: 3,
      fill: new ol.style.Fill({ color: "rgba(255,255,255,0.45)" }),
      stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.55)", width: 1 })
    })
  }));
  mobileMapState.cursorLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: [mobileMapState.cursorFeature] }),
    zIndex: 60
  });
  map.addLayer(mobileMapState.cursorLayer);
}

function updateMobileCursor(x, y) {
  if (!mobileMapState.cursorFeature || !isFinite(x) || !isFinite(y)) return;
  // x, y are now expected in the view's projection (EPSG:3857), not 4326.
  // The cursor feature geometry is in the view projection because the map
  // is in 3857 — we set the raw map coord directly.
  mobileMapState.cursorFeature.getGeometry().setCoordinates([x, y]);
}

function sampleMobileValueAt(lon, lat) {
  return sampleRasterValueAt(currentVar, mobileMapState.currentGridInfo, mobileMapState.currentDataObj, lon, lat)?.value ?? null;
}

function renderMobileReadout(lon, lat) {
  // Backwards-compat shim. New code path is renderMobileReadoutFromLonLat
  // (which receives already-transformed 4326 coordinates) plus an explicit
  // updateMobileCursor(x3857, y3857) call from the event handler.
  if (!isFinite(lon) || !isFinite(lat)) return;
  // Best-effort: assume 4326 if called directly (old callers); the cursor
  // will be placed wrong (in 4326 instead of 3857) but the readout text and
  // sampling will still be correct. New code path bypasses this function.
  if (mobileMapState.map) {
    try {
      const xy3857 = ol.proj.transform([lon, lat], "EPSG:4326", "EPSG:3857");
      updateMobileCursor(xy3857[0], xy3857[1]);
    } catch (_) { /* projection not registered yet — skip cursor */ }
  }
  renderMobileReadoutFromLonLat(lon, lat);
}

function renderMobileReadoutFromLonLat(lon, lat, pixel) {
  if (!isFinite(lon) || !isFinite(lat)) return;
  const base = formatReadoutCoords(lon, lat);
  // Feature priority (mirror of desktop + combined):
  //   - bathy contour (depth) — requires mobile bathy contour layer to exist
  //   - UV arrow (current speed) — the arrows carry a per-arrow speed
  // Fall through to the raster sample otherwise.
  if (pixel && mobileMapState.bathyContourLayer && currentVar === "bathy") {
    const contourDepth = bathyContourDepthAtPixel(mobileMapState.map, pixel);
    if (contourDepth !== null) {
      setReadout(`${base}, ${contourDepth}m (contour)`);
      return;
    }
  }
  if (pixel && mobileMapState.arrowLayer && currentVar === "uv") {
    const arrowSpeed = uvArrowSpeedAtPixel(mobileMapState.map, pixel);
    if (arrowSpeed !== null) {
      setReadout(`${base}, ${arrowSpeed.toFixed(2)} m/s (arrow)`);
      return;
    }
  }
  const val = sampleMobileValueAt(lon, lat);
  if (val === null || val === undefined) {
    setReadout(base);
    return;
  }
  if (!isFinite(val) || isNaN(val)) {
    setReadout(base);
    return;
  }
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";
  if (currentVar === "sst") setReadout(`${base}, ${formatSstValue(val)}`);
  else if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else if (currentVar === "uv") setReadout(`${base}, SSH ${formatSshValue(val)}`);
  else setReadout(`${base} ${formatChlValue(val)}`);
}

// Hit-test a UV arrow feature at `pixel`. UV arrows are built by
// buildMobileUvArrowLayer with `speed: <m/s>` per feature, so we look up
// that property. Slightly larger hitTolerance (8 px) than bathy contours
// because arrows are small glyphs and the arrowhead is the click target.
function uvArrowSpeedAtPixel(map, pixel) {
  if (!map || !pixel) return null;
  let found = null;
  map.forEachFeatureAtPixel(pixel, feature => {
    if (found !== null) return;
    const s = feature.get("speed");
    if (Number.isFinite(s)) found = s;
  }, { hitTolerance: 8 });
  return found;
}

function installMobileReadoutOnce(map) {
  if (map.__mobileReadoutInstalled) return;
  map.__mobileReadoutInstalled = true;
  ensureMobileCursorLayer(map);
  // The mobile map's view is EPSG:3857 — ev.coordinate is in meters. The
  // readout text and raster sampler need 4326; the cursor feature geometry
  // (already in the view's projection) needs the 3857 coord. ev.pixel is
  // passed through so the readout can hit-test against Vector features
  // (bathy contours / UV arrows) and prefer their semantic value over
  // the raster sample at the click point.
  function handle(ev) {
    if (!ev.coordinate) return;
    const xy3857 = ev.coordinate;
    const xy4326 = ol.proj.transform(xy3857, "EPSG:3857", "EPSG:4326");
    updateMobileCursor(xy3857[0], xy3857[1]);
    renderMobileReadoutFromLonLat(xy4326[0], xy4326[1], ev.pixel);
  }
  map.on("pointermove", handle);
  map.on("click", handle);
}

function makeMobileRasterCanvas(varKey, gridInfo, dataObj) {
  const z = mobileZForVar(varKey, dataObj);
  if (!is2D(z)) throw new Error(`Mobile renderer missing 2-D data for ${varKey}`);
  const ny = z.length;
  const nx = z[0].length;
  const canvas = document.createElement("canvas");
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext("2d", { willReadFrequently: false });
  const img = ctx.createImageData(nx, ny);
  const xAxis = gridInfo.xAxis || [];
  const yAxis = gridInfo.yAxis || [];
  const xAscending = xAxis.length < 2 || xAxis[0] <= xAxis[xAxis.length - 1];
  const yAscending = yAxis.length < 2 || yAxis[0] <= yAxis[yAxis.length - 1];
  const cfg = mobileValueConfig(varKey);
  const denom = cfg.hi === cfg.lo ? 1 : (cfg.hi - cfg.lo);

  // PHASE 4 + PHASE 8 RASTER CONTRACT (2026-06-10):
  //   - ImageStatic maps canvas row 0 to the NORTH edge of the extent and
  //     canvas col 0 to the WEST edge.
  //   - For CHL: the row/col flip is driven by rowOrder/colOrder from the
  //     orientation contract (which comes from authoritative producer
  //     metadata by default in Phase 8; legacy is the escape hatch).
  //   - For UV / bathy (south_up + west_to_east by construction): the legacy
  //     axis-direction flip is preserved (uv: yAxis ascending → flip; bathy
  //     treated like uv). xFlip is !xAscending for these (same as legacy).
  //   - We do NOT infer source-array orientation from xAxis/yAxis direction
  //     for CHL. This closes the contract boundary called out in the
  //     recovery plan: orientation comes from row/col order, not axis order.
  const _qs = typeof window !== "undefined" ? new URLSearchParams(window.location.search) : new URLSearchParams("");
  // Phase 8: default is now metadata-on. ?legacyOrientation=1 is the only
  // way to force legacy behavior. ?useMetadata=0 also forces legacy.
  const useMetadata = _qs.get("legacyOrientation") !== "1" && _qs.get("useMetadata") !== "0";
  const useLegacy = _qs.get("legacyOrientation") === "1";
  let rowOrder = "south_up";
  let colOrder = "west_to_east";
  if (useMetadata && !useLegacy && varKey === "chl" && dataObj && dataObj.orientation_status === "authoritative") {
    if (dataObj.row_order === "north_up" || dataObj.row_order === "south_up") rowOrder = dataObj.row_order;
    if (dataObj.col_order === "west_to_east" || dataObj.col_order === "east_to_west") colOrder = dataObj.col_order;
  } else if (varKey === "sst") {
    rowOrder = "north_up";
    colOrder = "west_to_east";
  } else if (varKey === "uv" || varKey === "bathy") {
    rowOrder = "south_up";
    colOrder = "west_to_east";
  }
  let yFlip, xFlip;
  if (varKey === "chl") {
    yFlip = (rowOrder === "south_up");
    xFlip = (colOrder === "east_to_west");
  } else {
    // UV / bathy: legacy axis-direction semantics preserved.
    yFlip = yAscending;
    xFlip = !xAscending;
  }

  for (let row = 0; row < ny; row++) {
    const srcJ = yFlip ? (ny - 1 - row) : row;
    for (let col = 0; col < nx; col++) {
      const srcI = xFlip ? (nx - 1 - col) : col;
      const value = z[srcJ]?.[srcI];
      const k = (row * nx + col) * 4;
      const numericValue = Number(value);
      if (isMobileMissingValue(varKey, value, numericValue)) {
        // All missing data (including land/no-data-on-land) → fully transparent
        img.data[k] = 0; img.data[k + 1] = 0; img.data[k + 2] = 0; img.data[k + 3] = 0; // Bug fix 2026-08-02: explicitly zero RGB for missing pixels (OLCI swath corners)
        continue;
      }
      const t = (cfg.transform(numericValue) - cfg.lo) / denom;
      const rgb = interpolateScale(cfg.scale, t);
      img.data[k] = rgb[0];
      img.data[k + 1] = rgb[1];
      img.data[k + 2] = rgb[2];
      img.data[k + 3] = 235;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function initMobileMapIfNeeded() {
  document.body.classList.remove("desktop-map-ready");
  document.body.classList.add("mobile-map-ready");
  const target = getUnifiedMapTarget();
  if (!target || !window.ol) return null;
  if (mobileMapState.map) {
    attachMapToUnifiedTarget(mobileMapState.map);
    return mobileMapState.map;
  }
  // View projection is EPSG:3857 (Web Mercator) to match the OpenFreeMap
  // vector tile schema. Data layers (CHL/SST/UV/bathy ImageStatic sources,
  // UV arrow Vector features) keep their EPSG:4326 extents — OL reprojects
  // them on render. Coordinate-boundary transforms are handled by
  // mapViewportRanges() and applyViewStateToOlMap(), so the rest of the
  // viewer code (readouts, sampleRasterValueAt, viewState) stays in 4326.
  const bboxCenter4326 = [(BBOX[0] + BBOX[2]) / 2, (BBOX[1] + BBOX[3]) / 2];
  const bboxCenter3857 = ol.proj.transform(bboxCenter4326, "EPSG:4326", "EPSG:3857");
  const view = new ol.View({
    projection: "EPSG:3857",
    center: bboxCenter3857,
    zoom: 6,
    minZoom: 4,
    maxZoom: 13,
    enableRotation: false
  });
  view.on("change:rotation", () => {
    if (view.getRotation()) view.setRotation(0);
  });
  const mobileInteractions = (ol.interaction && typeof ol.interaction.defaults === "function")
    ? ol.interaction.defaults({
        altShiftDragRotate: false,
        doubleClickZoom: true,
        dragPan: true,
        mouseWheelZoom: true,
        pinchRotate: false,
        pinchZoom: true
      })
    : undefined;
  mobileMapState.map = new ol.Map({
    target,
    layers: [],
    view,
    controls: [],
    interactions: mobileInteractions
  });
  mobileMapState.map.on("moveend", () => syncViewStateFromOlMap(mobileMapState.map));
  installOlGestureZoomFallback(mobileMapState.map, target);
  // Add the OFM two-layer vector basemap so the mobile single-product pages
  // match the combined dashboard's look.
  applyOfmTwoLayerBasemap(mobileMapState.map);
  attachMapToUnifiedTarget(mobileMapState.map);
  return mobileMapState.map;
}

function fitMobileMapWidth(map, extent4326) {
  const size = map.getSize();
  if (!size || size[0] <= 0 || size[1] <= 0) return;
  // extent4326 is in 4326. The mobile map's view is EPSG:3857 — transform
  // the extent and the center to 3857 before applying.
  const viewProjCode = map.getView().getProjection().getCode();
  const extent = viewProjCode === "EPSG:4326"
    ? extent4326
    : ol.proj.transformExtent(extent4326, "EPSG:4326", viewProjCode);
  const widthRes = Math.abs(extent[2] - extent[0]) / size[0];
  map.getView().setCenter([(extent[0] + extent[2]) / 2, (extent[1] + extent[3]) / 2]);
  map.getView().setRotation(0);
  map.getView().setResolution(widthRes);
}

/* ====================== OFM BASEMAP HELPER (shared) ====================== */
// Apply the OpenFreeMap Liberty "two-layer split" basemap to an existing map:
//   • "base"   at zIndex 0  : ONLY the dimmed water fill — the ocean tint below data.
//   • "fg"     at zIndex 40 : ALL land content (fills, lines, symbols, 3D buildings).
// Same tiles, same tile cache, two layers with the same OFM style split by L.type.
//
// IMPORTANT: This requires the view to be in EPSG:3857 (Web Mercator). OL does
// not reproject vector tiles 3857 → 4326, so the view must match the tile CRS.
// For the data layers (ImageStatic 4326), OL reprojects automatically on render.
// Coordinate-boundary transforms are handled by mapViewportRanges() and
// applyViewStateToOlMap() at the viewState boundary, so the rest of the
// viewer code stays in 4326.
//
// Both VectorTileLayers are added synchronously; style is applied asynchronously
// in an unawaited IIFE so this does not block chip-button initialization
// (lesson from v4.14: no network-dependent awaits between unrelated UI init).
async function applyOfmTwoLayerBasemap(map) {
  if (!map || !window.olms) return;
  const landBaseLayer = new ol.layer.VectorTile({
    declutter: false,
    zIndex: 0,
    preload: 0,
    background: undefined
  });
  const landForegroundLayer = new ol.layer.VectorTile({
    declutter: true,
    zIndex: 40,
    preload: 0,
    background: undefined
  });
  map.addLayer(landBaseLayer);
  map.addLayer(landForegroundLayer);

  // Fire-and-forget style apply. Do not await here — that would block callers
  // and break the v4.14 chip-button init lesson.
  (async () => {
    try {
      const style = await fetch("https://tiles.openfreemap.org/styles/liberty", { credentials: "omit" }).then(r => r.json());

      // Split the OFM style into two filtered copies by layer type.
      // Below-data group: ONLY the water fill (solid light gray) — the
      // ocean background. Solid (opacity 1.0) so the dark page bg does
      // not bleed through.
      // Above-data group: roads + place labels on top of the tan land.
      // Drops all OFM landuse/landcover/park/building fills, the 3D
      // building fill-extrusions, the water layers, and the natural
      // earth hillshade. The tan land comes from the OL viewport CSS
      // background (#tan-vp rule) since the Mapbox `background` layer
      // type does not render inside a VectorTileLayer in OL. Keeps
      // `line` (roads, road casings, bridges, boundaries) and `symbol`
      // (place labels, road labels, POIs) for geographic context.
      function patchBelow(src) {
        const out = JSON.parse(JSON.stringify(src));
        out.layers = out.layers.filter(L => L.id === "water");
        for (const L of out.layers) {
          if (L.id === "water") {
            // Solid light gray ocean — no longer a dimmed tint.
            L.paint = Object.assign({}, L.paint, {
              "fill-color": "#d0d0d0",
              "fill-opacity": 1.0
            });
          }
        }
        return out;
      }
      function patchAbove(src) {
        const out = JSON.parse(JSON.stringify(src));
        out.layers = out.layers.filter(L => {
          // Drop: background (handled by OL viewport CSS bg, not by
          // VectorTileLayer rendering), natural_earth (raster hillshade),
          // water + waterway_* (already painted by patchBelow).
          if (L.id === "background" || L.id === "natural_earth") return false;
          if (L.id === "water") return false;
          if (/^waterway_/.test(L.id) || /^water_/.test(L.id)) return false;
          // Drop all OFM fills — landuse, landcover, park, building,
          // aeroway, road_area_pattern — we want a uniform tan land,
          // not differentiated landuse colors.
          if (L.type === "fill") return false;
          // Drop 3D building fill-extrusions — we want a flat 2D look.
          if (L.type === "fill-extrusion") return false;
          // Keep lines (roads, road casings, bridges, boundaries) and
          // symbols (place labels, road labels, POIs) for context.
          return L.type === "line" || L.type === "symbol";
        });
        return out;
      }

      const styleBelow = patchBelow(style);
      const styleAbove = patchAbove(style);
      await Promise.all([
        olms.applyStyle(landBaseLayer, styleBelow, { updateSource: true }),
        olms.applyStyle(landForegroundLayer, styleAbove, { updateSource: true })
      ]);
      console.log(`[ofm] OpenFreeMap basemap applied (below+above) ✓`);
    } catch (e) {
      console.warn(`[ofm] OpenFreeMap style apply failed:`, e?.message || e);
    }
  })();
}
