/* ========================= LOADING ========================= */
async function loadIndex() {
  // 1. Fetch selected region index ONCE with a cache-buster
  const indexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
  const res = await fetch(indexUrl + "?t=" + Date.now());
  if (!res.ok) throw new Error(`Failed to load ${indexUrl}`);
  const data = await res.json();

  // 2. Set the global timestamp if it's the first load
  if (!lastUpdateTimestamp) {
    lastUpdateTimestamp = data.last_updated;
  }

  // 3. Use the data we already fetched instead of looping through CANDIDATES
  const idx = data;
  if (idx.region) setActiveRegion(idx.region, idx.region_meta ?? null);

  const fbv = idx.frames || idx.framesByVar || idx.frames_by_var || framesByVar;

  framesByVar.chl = filterFramesForVar("chl", fbv.chl || []);
  framesByVar.sst = filterFramesForVar("sst", fbv.sst || []);
  framesByVar.chl_front = filterFramesForVar("chl_front", fbv.chl_front || []);
  framesByVar.sst_front = filterFramesForVar("sst_front", fbv.sst_front || []);
  framesByVar.uv  = filterFramesForVar("uv",  fbv.uv  || []);
  const thermalSourceFrames = (fbv.thermal_fronts && fbv.thermal_fronts.length) ? fbv.thermal_fronts : (fbv.sst_front || []);
  framesByVar.thermal_fronts = filterFramesForVar("thermal_fronts", thermalSourceFrames);
  framesByVar.bathy = [{ json_path: BATHY_JSON_URL }];
  framesByVar.combined = [{ json_path: "__combined_native__" }];

  for (const v of ["chl","sst","chl_front","sst_front","uv","bathy","thermal_fronts","combined"]) {
    framesByVar[v].sort((a,b) => (epochMsForFrame(v,a) ?? 0) - (epochMsForFrame(v,b) ?? 0));  // oldest-first → left=oldest, right=newest
    frameTimesByVar[v] = framesByVar[v].map(f => epochMsForFrame(v,f));
  }

  syncFrontOverlayControls();

  // v4.2 captain's-dashboard fix: on data reload, if the combined
  // mode is active, invalidate the CHL chip cache when the manifest
  // changed and rebuild the UV layer. The chip panel re-renders
  // from the new frames and the UV layer picks up the newest frame
  // instead of staying frozen on the oldest.
  //
  // v4.3 fix: do NOT touch s.initialized and do NOT wipe the entire
  // cache on manifest change. The user's multi-select (selectedFrameIds)
  // must survive a poll. Evict only entries for frame ids that no
  // longer exist in the new manifest; everything else is still valid
  // (timeMs is in the frame, coverage was just fetched). The init
  // panel's "manifest changed" branch already prunes selectedFrameIds
  // to still-existing eligible ids, so no further action is needed
  // there.
  if (window._combinedMap) {
    try {
      const s = window._combinedChl;
      if (s && combinedChlManifestChanged && combinedChlManifestChanged()) {
        const currentIds = new Set((framesByVar.chl || []).map(combinedChlFrameId));
        for (const cachedId of s.cache.keys()) {
          if (!currentIds.has(cachedId)) s.cache.delete(cachedId);
        }
        if (document.getElementById("chk-combined-chl")?.checked) {
          combinedChlInitPanel();
        }
      }
      const chkUvCb = document.getElementById("chk-combined-uv");
      if (chkUvCb && chkUvCb.checked) {
        const sel = document.getElementById("combined-uv-hours");
        rebuildCombinedUvLayer(window._combinedMap, { hoursMode: sel?.value || "latest" });
      }
    } catch (err) {
      console.warn("[loadIndex] combined-mode post-refresh failed", err);
    }
  }

  return data;
}


function inferGridFromFrame(v, dataObj) {
  const bbox = dataObj && dataObj.bbox;
  const z = v === "uv" ? dataObj?.adt : (dataObj?.sst || dataObj?.z || dataObj?.chl || dataObj?.data);
  const ny = dataObj?.ny || (Array.isArray(z) ? z.length : 0);
  const nx = dataObj?.nx || (Array.isArray(z) && Array.isArray(z[0]) ? z[0].length : 0);
  if (!bbox || bbox.length < 4 || !nx || !ny) throw new Error(`Cannot infer grid for ${v}`);

  const [lonMin, latMin, lonMax, latMax] = bbox;
  const linspace = (a, b, n) => Array.from({length:n}, (_, i) => n === 1 ? a : a + (b - a) * i / (n - 1));
  const xAxis = linspace(lonMin, lonMax, nx);
  // CHL ORIENTATION CONTRACT (Phase 4 + Phase 8, 2026-06-10):
  //   - Both row_order and col_order come from authoritative producer metadata.
  //     row_order from real latitude geolocation; col_order from real longitude
  //     geolocation. See chl_contract.derive_orientation_from_axes/nc.
  //   - Phase 8 default: metadata-on. The viewer honors dataObj.row_order AND
  //     dataObj.col_order when orientation_status === "authoritative". The
  //     earlier "trust row_order by default" change broke frames because
  //     row_order had been inferred from CHL pixel gradients rather than
  //     from real lat/lon geolocation; Phase 7 fixed the producer side.
  //   - ?legacyOrientation=1: explicit escape hatch; force legacy
  //     south_up + west_to_east behavior.
  //   - ?useMetadata=0: also forces legacy behavior (alias).
  //   - Render-side x/y flips MUST come from rowOrder/colOrder directly; the
  //     raster loop no longer infers them from xAxis/yAxis direction. This
  //     closes the contract boundary called out in the recovery plan.
  const _qs = typeof window !== "undefined" ? new URLSearchParams(window.location.search) : new URLSearchParams("");
  // Phase 8: default is now metadata-on. ?legacyOrientation=1 is the only
  // way to force legacy behavior. ?useMetadata=0 also forces legacy.
  const useMetadata = _qs.get("legacyOrientation") !== "1" && _qs.get("useMetadata") !== "0";
  const useLegacy = _qs.get("legacyOrientation") === "1";
  let rowOrder;
  let colOrder;
  if (v === "sst") {
    rowOrder = "north_up";
    colOrder = "west_to_east";
  } else if (v === "uv") {
    rowOrder = "south_up";
    colOrder = "west_to_east";
  } else if (useLegacy || !useMetadata) {
    rowOrder = "south_up";
    colOrder = "west_to_east";
  } else {
    rowOrder = (dataObj && dataObj.orientation_status === "authoritative" && (dataObj.row_order === "north_up" || dataObj.row_order === "south_up"))
      ? dataObj.row_order
      : "south_up";
    colOrder = (dataObj && dataObj.orientation_status === "authoritative" && (dataObj.col_order === "west_to_east" || dataObj.col_order === "east_to_west"))
      ? dataObj.col_order
      : "west_to_east";
  }
  // yAxis is the CANVAS-anchored linspace (south-to-north ascending) used
  // for extent/sample math. The raster loop's yFlip is driven by rowOrder,
  // not by yAxis direction, so we always emit the same yAxis shape and
  // move the orientation contract into the flip logic.
  const yAxis = linspace(latMin, latMax, ny);
  return { xAxis, yAxis, nx, ny, sensor: (v === "chl" ? "CHL" : v.toUpperCase()), row_order: rowOrder, col_order: colOrder };
}

async function loadGridForVar(v, dataObj = null) {
  if ((v === "chl_front" || v === "sst_front" || v === "thermal_fronts") && dataObj && dataObj.bbox?.length >= 4) {
    const [lonMin, latMin, lonMax, latMax] = dataObj.bbox.map(Number);
    return { xAxis: [lonMin, lonMax], yAxis: [latMin, latMax], nx: dataObj.nx || 2, ny: dataObj.ny || 2 };
  }
  // CHL now mixes OLCI composites and VIIRS model frames with different
  // raster dimensions. A single var-level grid file silently misplaces frames.
  // Prefer each CHL frame's own bbox/nx/ny metadata; fall back to grid only for
  // legacy frames missing metadata.
  if (v === "chl" && dataObj && dataObj.bbox && dataObj.nx && dataObj.ny) {
    return inferGridFromFrame(v, dataObj);
  }

  const gridName = VAR_TO_GRID[v];

  try {
    const res = await fetch(`data/${REGION_ID}/grids/${gridName}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const grid = await res.json();

    const lon = grid.lon || grid.longitude;
    const lat = grid.lat || grid.latitude;
    if (!lon || !lat) throw new Error("grid missing lon/lat axes");

    let xAxis, yAxis, nx, ny;
    if (Array.isArray(lon[0]) && Array.isArray(lat[0])) {
      ny = lon.length;
      nx = lon[0].length;
      const midY = Math.floor(ny / 2);
      const midX = Math.floor(nx / 2);
      xAxis = lon[midY].slice();
      yAxis = lat.map(r => r[midX]);
    } else {
      xAxis = lon.slice();
      yAxis = lat.slice();
      nx = xAxis.length;
      ny = yAxis.length;
    }

    const info = { xAxis, yAxis, nx, ny };
    gridCache[v] = info;
    return info;
  } catch (e) {
    // No grid file - compute axes from frame metadata each time (no caching for inferred axes)
    if (dataObj && dataObj.nx && dataObj.ny) {
      return inferGridFromFrame(v, dataObj);
    }
    // Last resort fallback
    const info2 = inferGridFromFrame(v, {});
    return info2;
  }
}


async function fetchFrameData(varKey, frameMeta) {
  const p = framePathOf(frameMeta);
  if (!p) throw new Error("Frame has no json path");
  const res = await fetch(p + (p.includes('?') ? '&' : '?') + 't=' + Date.now());
  if (!res.ok) throw new Error(`Frame load failed: ${p}`);
  return await res.json();
}

async function prepareLandMask() {
  try {
    // Reuse your existing loader
    const data = await loadBathymetryJson(BATHY_JSON_URL);

    // Create a Z-grid for the mask: 1 for Land, null for Water
    // Assuming convention: Positive = Water Depth, Negative/Zero = Land Elevation
    const zMask = data.depth.map(row =>
      row.map(val => (val !== null && val <= 0) ? 1 : null)
    );

    landTrace = {
      type: "heatmap",
      x: data.xAxis,
      y: data.yAxis,
      z: zMask,
      showscale: false, // No colorbar for land
      colorscale: [ [0, "#cccccc"], [1, "#cccccc"] ], // Solid Dark Grey
      hoverinfo: "skip", // Don't show hover tooltips for land
      zmin: 0,
      zmax: 1,
      name: "LandMask"
    };
    console.log("Land mask generated.");
  } catch (e) {
    console.warn("Could not generate land mask:", e);
  }
}

            plotDiv.classList.add("remove-mode");
            plotDiv.classList.remove("crosshair-mode");
            setReadout("Remove mode ON: click near a marker to remove");
          } else {
            plotDiv.classList.remove("remove-mode");
            setReadout("");
          }
        }
      },
      {
        name: "Measure Distance",
        title: "Measure distance between two points",
        icon: Plotly.Icons.drawline, // Built-in diagonal line icon
        click: () => {
          // Toggle Mode
          if (measureMode === "off") {
            measureMode = "start";
            markerMode = "off"; // Turn off other modes
            plotDiv.classList.add("measure-mode");
            plotDiv.classList.remove("crosshair-mode", "remove-mode");
            measurePoints = []; // Reset previous measurement
            setReadout("Measure Mode: Click START point");
          } else {
            measureMode = "off";
            plotDiv.classList.remove("measure-mode");
            measurePoints = [];
            setReadout("");
          }
          // Refresh to clear/show lines
          showFrame();
        }
      },
    ]
  };
}



async function showFrame() {
  const e = new Error();
  const callers = e.stack?.split("\n").slice(1,4).join(" | ") || "";
  console.log("[showFrame] ENTRY currentVar:", currentVar, "IS_TOUCH:", IS_TOUCH, "callers:", callers);
  console.log("[showFrame] ENTRY timestamp:", Date.now());
  updateReadoutPosition();

  // combined mode uses its own full-renderer — no desktop map init needed
  if (currentVar === "combined") {
    await renderCombinedMode();
    return;
  }

  // thermal_fronts uses a dedicated canvas renderer — not Plotly, not standard OL raster
  if (currentVar === "thermal_fronts") {
    await renderThermalFrontsNative();
    return;
  }

  const frames = framesByVar[currentVar] || [];
  if (!frames.length) return;
  currentFrameIdx = Math.max(0, Math.min(currentFrameIdx, frames.length - 1));

  const frameMeta = frames[currentFrameIdx];
  console.log('[showFrame] DEBUG frames.length:', frames.length, 'currentFrameIdx:', currentFrameIdx, 'frameMeta id:', frameMeta?.id);

  if (isMobileMapMode()) {
    try {
      const renderedMobile = await renderMobileFrame(frameMeta);
      if (renderedMobile) return;
    } catch (e) {
      console.error("Mobile OL render failed:", e);
      const errDiv = document.createElement("div");
      errDiv.textContent = "Mobile OL error: " + ((e && e.message) ? e.message.slice(0,80) : String(e).slice(0,80));
      errDiv.style.cssText = "position:fixed;top:40px;left:10px;z-index:999;color:#fff;background:rgba(200,50,0,0.9);padding:8px 14px;border-radius:4px;font-size:14px;max-width:80vw;";
      document.body.appendChild(errDiv);
      // Also surface in the global error overlay.
      const ov = document.getElementById("global-error-overlay");
      if (ov && ov.dataset.closed !== '1') {
        ov.style.display = 'block';
        const safeMsg = ((e && e.message) ? e.message : String(e)).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
        ov.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
          + '<strong style="font-size:14px;">⚠️ Mobile OL error</strong>'
          + '<button onclick="this.parentNode.parentNode.dataset.closed=\'1\';this.parentNode.parentNode.style.display=\'none\';" style="background:transparent;color:#fff;border:1px solid #fff;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px;">dismiss</button>'
          + '</div><div style="white-space:pre-wrap;word-break:break-all;">' + safeMsg + '</div>'
          + (e && e.stack ? '<details style="margin-top:6px;"><summary style="cursor:pointer;">stack</summary><pre style="margin:4px 0 0 0;white-space:pre-wrap;font-size:10px;">' + e.stack.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</pre></details>' : '');
      }
    }
  }

  // Desktop: use OpenLayers
  if (isDesktopMapMode()) {
    console.log("[showFrame] entering desktop OL path, currentVar:", currentVar, "frameMeta:", !!frameMeta);
    try {
      const renderedDesktop = await renderDesktopFrame(frameMeta);
      console.log("[showFrame] renderDesktopFrame returned:", renderedDesktop);
      if (renderedDesktop) {
        await renderFooterColorbarToDiv(document.getElementById("hamburger-cbar"), currentVar);
        updateSliderUI();
        return;
      }
    } catch (e) {
      console.error("Desktop OL render failed:", e);
      const errDiv = document.createElement("div");
      errDiv.textContent = "Desktop OL error: " + ((e && e.message) ? e.message.slice(0,80) : String(e).slice(0,80));
      errDiv.style.cssText = "position:fixed;top:40px;left:10px;z-index:999;color:#fff;background:rgba(200,50,0,0.9);padding:8px 14px;border-radius:4px;font-size:14px;max-width:80vw;";
      document.body.appendChild(errDiv);
      // Also surface in the global error overlay so the user can see the
      // full message and stack instead of just a truncated 80-char toast.
      const ov = document.getElementById("global-error-overlay");
      if (ov && ov.dataset.closed !== '1') {
        ov.style.display = 'block';
        const safeMsg = ((e && e.message) ? e.message : String(e)).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
        ov.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
          + '<strong style="font-size:14px;">⚠️ Desktop OL error</strong>'
          + '<button onclick="this.parentNode.parentNode.dataset.closed=\'1\';this.parentNode.parentNode.style.display=\'none\';" style="background:transparent;color:#fff;border:1px solid #fff;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px;">dismiss</button>'
          + '</div><div style="white-space:pre-wrap;word-break:break-all;">' + safeMsg + '</div>'
          + (e && e.stack ? '<details style="margin-top:6px;"><summary style="cursor:pointer;">stack</summary><pre style="margin:4px 0 0 0;white-space:pre-wrap;font-size:10px;">' + e.stack.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</pre></details>' : '');
      }
    }
  }

  // If both OL paths fail, show a clear error — do NOT fall back to Plotly
  const noOlDiv = document.createElement("div");
  noOlDiv.textContent = "Map failed to load. Please refresh.";
  noOlDiv.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:997;color:#fff;background:rgba(80,0,0,0.9);padding:20px 30px;border-radius:8px;font-size:16px;text-align:center;";
  document.body.appendChild(noOlDiv);
  // Render colorbar only inside the hamburger panel.
  const hCbar = document.getElementById("hamburger-cbar");
  if (hCbar) await renderFooterColorbarToDiv(hCbar, currentVar);

  const modebar = plotDiv.querySelector('.modebar');
  if (modebar && !modebarHost.querySelector('.modebar')) {
      modebarHost.appendChild(modebar);
  }

  installModebarHoverHelpOnce();
  installTouchPolicyOnce();
  updateSliderUI();
}

async function loadCaptainBriefing() {
  const panel = document.getElementById("briefing-panel");
  const status = document.getElementById("briefing-status");
  const plansDiv = document.getElementById("briefing-plans");
  const healthDiv = document.getElementById("briefing-health");
  const fullDiv = document.getElementById("briefing-full");
  if (!panel || !status || !plansDiv || !healthDiv || !fullDiv) return;

  try {
    const res = await fetch(`data/${REGION_ID}/briefing/latest.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`No briefing artifact for ${REGION_ID}`);
    const briefing = await res.json();
    const when = briefing.generated_at ? new Date(briefing.generated_at).toLocaleString() : "unknown";
    status.textContent = `${briefing.target_window || briefing.title || "Captain Briefing"} • ${when}`;

    // New structure: plans grouped by departure_port
    // Each plan has: { departure_port, destinations: [{zone, verdict, score, confidence, rank_within_port}] }
    const portGroups = {};
    (briefing.plans || []).forEach(p => {
      const port = p.departure_port || p.zone || "Unknown Port";
      if (!portGroups[port]) portGroups[port] = [];
      portGroups[port].push(p);
    });
    plansDiv.innerHTML = Object.entries(portGroups).map(([port, plans]) => `
      <div class="briefing-port-group">
        <div class="muted" style="font-size:11px;margin-bottom:4px;">DEPARTURE PORT</div>
        <strong style="font-size:14px;">${port}</strong>
        <div class="briefing-port-plans">
          ${(plans || []).slice(0, 3).map((p, i) => {
            const vals = p.values || {};
            const valueLine = `CHL ${vals.chl_mgm3 ?? "?"} mg/m3 • Current ${vals.current_kt ?? "?"} kt • SST ${vals.sst_f ?? "?"}°F`;
            const reason = ((p.drivers || [])[0] || (p.cautions || [])[0] || p.note || "real-data sample");
            return `
              <div class="briefing-plan" style="margin-left:0;padding-left:8px;border-left:2px solid ${i===0?'#2d7d46':i===1?'#d4a017':'#8b4513'}">
                <div class="muted">PLAN ${"ABC"[i] || i+1}</div>
                <strong>${p.zone || "Unknown"}</strong><br>
                <span>${p.verdict || ""}</span> • Score ${p.score ?? "?"}/120 • ${p.confidence || "?"}<br>
                <span class="muted">${valueLine}</span><br>
                <span class="muted">${reason}</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `).join("");

    const products = (briefing.health && briefing.health.products) || {};
    healthDiv.innerHTML = ["sst", "chl", "uv"].map(k => {
      const h = products[k] || {};
      const label = k === "uv" ? "Curr/SSH" : k.toUpperCase();
      return `<div><strong>${label}</strong><br>ok=${h.ok === true}<br>age=${h.age_min ?? "?"}m</div>`;
    }).join("");

    fullDiv.textContent = briefing.briefing_text || briefing.ranking_summary || "No briefing text available.";
  } catch (e) {
    status.textContent = `Briefing unavailable: ${e.message}`;
    plansDiv.innerHTML = "";
    healthDiv.innerHTML = "";
    fullDiv.textContent = "";
  }
}

(async function init() {

    // before fetching the index. Without this, init() races the profile

    // usec_md (the "stuck loading dashboard" symptom).
    if (window.__profileReady) {
      const safeTimeout = new Promise(r => setTimeout(() => r(null), 4000));
      await Promise.race([window.__profileReady, safeTimeout]);

    await Promise.all([ loadIndex(), prepareLandMask() ]);
    // Start on the latest frame for each variable (not the oldest)
    for (const v of ["chl","sst","uv"]) {
      if (framesByVar[v]?.length) {

})();

        moved: false
      };
      toggleBtn.setPointerCapture?.(e.pointerId);
    });

    toggleBtn.addEventListener('pointermove', (e) => {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      if (Math.hypot(dx, dy) > 4) dragState.moved = true;
      if (!dragState.moved) return;
      e.preventDefault();
      applyFeedbackPosition({ x: dragState.left + dx, y: dragState.top + dy });
    });

    function finishDrag(e) {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      suppressNextClick = dragState.moved;
      if (dragState.moved) saveFeedbackPosition();
      syncFloatingViewportUi();
      dragState = null;
    }
    toggleBtn.addEventListener('pointerup', finishDrag);
    toggleBtn.addEventListener('pointercancel', finishDrag);
  }

  if (toggleBtn && panel) {
    toggleBtn.addEventListener('click', (e) => {
      if (suppressNextClick) {
        suppressNextClick = false;
        e.preventDefault();
        return;
      }
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
  }
})();

/* ================= INLINE FEEDBACK LOGIC ================= */
(function() {
  const submitBtn = document.getElementById('feedbackSubmit');
  const inputField = document.getElementById('feedbackInput');

  if (submitBtn && inputField) {
    submitBtn.addEventListener('click', sendFeedback);

    // Also allow pressing "Enter" inside the box
    inputField.addEventListener('keypress', (e) => {

    });

    function sendFeedback() {
      const text = inputField.value.trim();
      if (!text) return;

      const user = localStorage.getItem('ocean_viewer_last_user') || "Anonymous";
      const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwQoQQ_bK0AW8796hC92EYjLeX1eQtHW0_rbuFTdaFdY6fQUYOdWdZGst04RpckcFmz_A/exec";

      const payload = {
        name: user,
        region: REGION_ID || "unknown",
        message: text,
        link: window.location.href
      };

      // no-cors: Google Apps Script ignores CORS preflight; browser sends simple request.
      // POST will succeed even without server acknowledgment.
      fetch(WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Feedback sent!");
        inputField.value = "";
      })
      .catch(() => {
        // no-cors - catch is unlikely to fire; still show success
        alert("Feedback sent!");
        inputField.value = "";
      });
    }
  }
})();

async function pollForUpdates() {
  try {
    // Ping index.json with a random string to force GitHub to give us the newest version
    const regionIndexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
    const res = await fetch(regionIndexUrl + "?nocache=" + Date.now());
    if (!res.ok) throw new Error(`Failed to poll ${regionIndexUrl}`);
    const data = await res.json();

    // Check if the SERVER has a timestamp, and if it differs from ours.
    // This allows the page to refresh even if our local timestamp was null (first run).
    if (data.last_updated && data.last_updated !== lastUpdateTimestamp) {
      // New data detected - silently update the frame list without resetting user state.
      // Only jump to latest if user is on the last frame and new data is newer than what they saw;
      // otherwise just let the new data be available on next step.
      console.log("New data available in index - refreshing frame list silently.");
      lastUpdateTimestamp = data.last_updated;
      // Reload the index in the background and rebuild framesByVar; preserve current view state.
      // Reload THIS region's index (not the hardcoded ma index)
      const regionIndexUrl = REGIONS[REGION_ID]?.index || `index-${REGION_ID}.json`;
      loadIndex().then(idx => {
        // loadIndex() already updates framesByVar, frameTimesByVar, and BBOX in place.
        // If user was on the last available frame, advance to new latest automatically;
        // otherwise just make new data available without disrupting navigation.
        const maxIdx = frameTimesByVar[currentVar].length - 1;
        if (currentFrameIdx >= maxIdx && maxIdx >= 0) {
          currentFrameIdx = maxIdx;
          showFrame(currentFrameIdx);
        }
      }).catch(e => {
        console.error("Silent index refresh failed:", e);
      });
    }
  } catch (e) {
    console.error("Update check failed", e);
  }
}

// Check for updates every 60 seconds (1 minute)
setInterval(pollForUpdates, 60000);

// ── Format writers ──────────────────────────────────────────────────────────

function waypointsToGPX(pts) {
  const wpts = pts.map((p, i) => {
    const ts = p.ts ? new Date(p.ts).toISOString() : new Date().toISOString();
    const name = `${i + 1}`;
    const desc = [
      p.chl !== null ? `CHL:${p.chl.toFixed(2)}mg/m3` : null,
      p.sst !== null ? `SST:${p.sst.toFixed(1)}C` : null,
      p.freshness !== null ? `Fresh:${p.freshness}h` : null,
    ].filter(Boolean).join(' | ');
    return `  <wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">
    <name>${name}</name>
    <time>${ts}</time>
    <desc>${desc}</desc>
  </wpt>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="LiveFishEdge Ocean MVP"
  xmlns="http://www.topografix.com/GPX/1/1"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>Ocean MVP Waypoints</name>
    <time>${new Date().toISOString()}</time>
  </metadata>
  ${wpts}
</gpx>`;
}

function waypointsToCSV(pts) {
  const rows = [['lat','lon','name','chl_mgm3','sst_c','freshness_h','timestamp']];
  pts.forEach((p, i) => {
    rows.push([
      p.lat.toFixed(6), p.lon.toFixed(6), String(i + 1),
      p.chl !== null ? p.chl.toFixed(3) : '',
      p.sst !== null ? p.sst.toFixed(2) : '',
      p.freshness !== null ? p.freshness : '',
      p.ts ? new Date(p.ts).toISOString() : ''
    ]);
  });
  return rows.map(r => r.join(',')).join('\n');
}

function waypointsToGeoJSON(pts) {
  return JSON.stringify({
    type: "FeatureCollection",
    metadata: { generated: new Date().toISOString(), region: REGION_ID },
    features: pts.map((p, i) => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [p.lon, p.lat] },
      properties: {
        name: String(i + 1),
        chl_mgm3: p.chl,
        sst_c: p.sst,
        freshness_h: p.freshness,
        ts: p.ts ? new Date(p.ts).toISOString() : null
      }
    }))
  }, null, 2);
}

function waypointsToKML(pts) {
  const wpts = pts.map((p, i) => {
    const desc = [
      p.chl !== null ? `CHL: ${p.chl.toFixed(2)} mg/m³` : '',
      p.sst !== null ? `SST: ${p.sst.toFixed(1)} °C` : '',
      p.freshness !== null ? `Fresh: ${p.freshness}h ago` : ''
    ].filter(Boolean).join('<br/>');
    return `  <Placemark>
    <name>${i + 1}</name>
    <description><![CDATA[${desc}]]></description>
    <Point>
      <coordinates>${p.lon.toFixed(6)},${p.lat.toFixed(6)},0</coordinates>
    </Point>
  </Placemark>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Ocean MVP Waypoints</name>
    <open>1</open>
    ${wpts}
  </Document>
</kml>`;
}

// ── Share URL ──────────────────────────────────────────────────────────────

function buildShareURL(pts) {
  const minimal = pts.map(p => ({
    l: p.lat.toFixed(5), L: p.lon.toFixed(5),
    c: p.chl !== null ? p.chl.toFixed(3) : '',
    s: p.sst !== null ? p.sst.toFixed(2) : '',
    f: p.freshness !== null ? p.freshness : ''
  }));
  const json = JSON.stringify(minimal);
  const b64 = btoa(encodeURIComponent(json));
  const url = new URL(window.location.href);
  url.searchParams.set('waypoints', b64);
  url.searchParams.set('var', 'combined');
  return url.toString();
}

function loadWaypointsFromURL() {
  const url = new URL(window.location.href);
  const b64 = url.searchParams.get('waypoints');
  if (!b64) return;
  try {
    const json = decodeURIComponent(atob(b64));
    const pts = JSON.parse(json);
    if (!Array.isArray(pts)) return;
    return pts.map(p => ({
      lat: parseFloat(p.l), lon: parseFloat(p.L),
      chl: p.c !== '' ? parseFloat(p.c) : null,
      sst: p.s !== '' ? parseFloat(p.s) : null,
      freshness: p.f !== '' ? parseFloat(p.f) : null,
      ts: Date.now()
    }));
  } catch (e) {
    console.warn('[captain] Could not parse share URL waypoints:', e);
    return null;
  }
}

function getDistanceKm(p1, p2) {
  const R = 6371;
  const dLat = (p2.lat - p1.lat) * Math.PI / 180;
  const dLon = (p2.lon - p1.lon) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function updateDistPanel() {
  const list = document.getElementById('captain-dist-list');
  const total = document.getElementById('captain-dist-total');
  if (!list) return;
  list.innerHTML = '';
  let running = 0;
  for (let i = 0; i < captainDistTool.points.length; i++) {
    const p = captainDistTool.points[i];
    if (i > 0) {
      const prev = captainDistTool.points[i - 1];
      const d = getDistanceKm(prev, p);
      running += d;
      list.innerHTML += `<div style="color:#7a8fa8;margin-bottom:2px;">Pt ${i}: ${p.lat.toFixed(4)}, ${p.lon.toFixed(4)} &nbsp;<b style="color:var(--fg);">${d.toFixed(1)} km</b></div>`;
    } else {
      list.innerHTML += `<div style="color:#7a8fa8;margin-bottom:2px;">Pt ${i}: ${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</div>`;
    }
  }
  if (total) total.textContent = captainDistTool.points.length >= 2
    ? `Total: ${running.toFixed(2)} km / ${(running / 1.852).toFixed(2)} nm` : '';
}

function renderDistLayer(map) {
  if (captainDistTool.lineLayer) map.removeLayer(captainDistTool.lineLayer);
  if (captainDistTool.points.length < 2) return;
  const pts = captainDistTool.points.map(p => toMapProjection([p.lon, p.lat]));
  const feats = [];
  let running = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = getDistanceKm(captainDistTool.points[i - 1], captainDistTool.points[i]);
    running += d;
    feats.push(new ol.Feature({
      geometry: new ol.geom.LineString([pts[i - 1], pts[i]]),
      segIdx: i
    }));
  }
  const ptFeats = captainDistTool.points.map((p, i) => new ol.Feature({
    geometry: new ol.geom.Point(toMapProjection([p.lon, p.lat])),
    label: String(i)
  }));
  const src = new ol.source.Vector({ features: [...feats, ...ptFeats], wrapX: false, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source: src,
    style: feat => {
      if (feat.getGeometry().getType() === 'LineString') {
        return new ol.style.Style({
          stroke: new ol.style.Stroke({ color: '#ff9800', width: 2.5, lineDash: [6, 4] })
        });
      }
      return new ol.style.Style({
        image: new ol.style.Circle({ radius: 5, fill: new ol.style.Fill({ color: '#ff9800' }), stroke: new ol.style.Stroke({ color: '#fff', width: 1.5 }) }),
        text: new ol.style.Text({ text: feat.get('label'), offsetY: -12, fill: new ol.style.Fill({ color: '#ff9800' }), font: 'bold 11px monospace', stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) })
      });
    },
    zIndex: 50
  });
  map.addLayer(layer);
  captainDistTool.lineLayer = layer;
}

function addDistPoint(lon, lat, map) {
  captainDistTool.points.push({ lon, lat });
  renderDistLayer(map);
  updateDistPanel();
}

function toggleAddTool(map) {

function clearAddLayer() {
  if (captainAddTool.markerLayer && captainAddTool.mapRef) {
    captainAddTool.mapRef.removeLayer(captainAddTool.markerLayer);
    captainAddTool.markerLayer = null;
  }
}

function sampleAt(lon, lat) {
  let chl = null, sst = null;
  try { const v = sampleRasterValueAt('chl', window._combinedChlGrid, window._combinedChlData, lon, lat); if (v?.value !== undefined) chl = v.value; } catch (_) {}
  try { const v = sampleRasterValueAt('sst', window._combinedSstGrid, window._combinedSstData, lon, lat); if (v?.value !== undefined) sst = v.value; } catch (_) {}
  return { chl, sst };
}

function updatePtsPanel() {
  const list = document.getElementById('captain-pts-list');
  if (!list) return;
  if (captainAddTool.points.length === 0) {
    list.innerHTML = '<div style="color:#7a8fa8;font-size:11px;">Click map to drop waypoints</div>';
    return;
  }
  list.innerHTML = captainAddTool.points.map((p, i) => {
    const chlStr = p.chl !== null ? `${p.chl.toFixed(2)} mg/m³` : '—';
    const sstStr = p.sst !== null ? `${p.sst.toFixed(1)} °C` : '—';
    return `<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.07);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="color:#4d7dff;">${i + 1}. ${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</b>
        <button onclick="window.removeWaypoint(${i})" style="background:none;border:none;color:#7a8fa8;cursor:pointer;font-size:11px;padding:2px 4px;" title="Remove">✕</button>
      </div>
      <div style="color:#9fb0c3;font-size:11px;">CHL ${chlStr} &nbsp;|&nbsp; SST ${sstStr}${p.freshness !== null ? ` &nbsp;|&nbsp; ${p.freshness}h ago` : ''}</div>
    </div>`;
  }).join('');
}

function renderPtsLayer(map) {
  if (captainAddTool.markerLayer) map.removeLayer(captainAddTool.markerLayer);
  if (captainAddTool.points.length === 0) return;
  const feats = captainAddTool.points.map((p, i) => {
    const f = new ol.Feature({ geometry: new ol.geom.Point(toMapProjection([p.lon, p.lat])), idx: i });
    return f;
  });
  const src = new ol.source.Vector({ features: feats, wrapX: false, projection: "EPSG:4326" });
  const layer = new ol.layer.Vector({
    source: src,
    style: feat => new ol.style.Style({
      image: new ol.style.Circle({ radius: 8, fill: new ol.style.Fill({ color: '#1d4f91' }), stroke: new ol.style.Stroke({ color: '#4d7dff', width: 2 }) }),
      text: new ol.style.Text({ text: String(feat.get('idx') + 1), offsetY: 1, fill: new ol.style.Fill({ color: '#fff' }), font: 'bold 11px monospace', textAlign: 'center', textBaseline: 'middle' })
    }),
    zIndex: 52
  });
  map.addLayer(layer);
  captainAddTool.markerLayer = layer;
}

function addWaypoint(lon, lat, map) {
  const { chl, sst } = sampleAt(lon, lat);
  const freshness = window._combinedChlScanTime
    ? ((Date.now() - new Date(window._combinedChlScanTime).getTime()) / 3600000).toFixed(1)
    : null;
  captainAddTool.points.push({ lon, lat, chl, sst, freshness, ts: Date.now() });
  renderPtsLayer(map);
  updatePtsPanel();
  document.getElementById('captain-save-btn')?.style.setProperty('display', 'inline-block');
}

window.removeWaypoint = function(idx) {
  captainAddTool.points.splice(idx, 1);
  renderPtsLayer(captainAddTool.mapRef);
  updatePtsPanel();
  if (captainAddTool.points.length === 0) {
    document.getElementById('captain-save-btn')?.style.setProperty('display', 'none');
  }
};

// ── Map click handler ───────────────────────────────────────────────────

let _captainMapClickHandler = null;

function installCaptainToolHandler(map) {
  if (_captainMapClickHandler) { map.un('click', _captainMapClickHandler); _captainMapClickHandler = null; }
  // Captain's Dashboard has its own persistent readout (#combined-readout,
  // z-index 1120) sitting on top of #readout (z-index 950) at the same
  // bottom-right position. setReadout() targets #readout, so writing
  // through it would put a duplicate readout *behind* the combined one
  // and visually leak out of its bounds when the click text was wider
  // than the lat/lon+CHL+SST text — that's the "double readouts
  // overlapping" Mike reported after the v1 fix. Only write to the
  // visible #combined-readout; #readout is left alone.
  const capReadoutEl = document.getElementById("combined-readout");
  const capSetReadout = (txt) => {
    if (capReadoutEl) {
      capReadoutEl.textContent = txt || "—, —";
      capReadoutEl.style.display = "inline-block";
    }
  };
  _captainMapClickHandler = (ev) => {
    // On single-product pages this handler exists only to service the
    // distance/waypoint tools. Ordinary clicks remain with product readouts.
    const toolsActive = captainDistTool.active || captainAddTool.active;
    if (currentVar !== "combined" && !toolsActive) return;
    if (!ev.coordinate) return;
    // Combined map is EPSG:3857; transform to 4326 before treating as lon/lat.
    const xy4326 = ol.proj.transform(ev.coordinate, "EPSG:3857", "EPSG:4326");
    const lon = xy4326[0];
    const lat = xy4326[1];
    if (captainDistTool.active) { addDistPoint(lon, lat, map); return; }
    if (captainAddTool.active) { addWaypoint(lon, lat, map); return; }
    // ── Feature readout (Captain's Dashboard click → bottom-right box) ──
    // Priority: bathy contour line > thermal front gradient > UV arrow > raster
    const base = formatReadoutCoords(lon, lat);
    const pixel = ev.pixel;

    // 1. Bathy contour depth
    let found = null;
    map.forEachFeatureAtPixel(pixel, feature => {
      if (found !== null) return;
      const d = feature.get("depth");
      if (Number.isFinite(d)) found = d;
    }, { hitTolerance: 6 });
    if (found !== null) { capSetReadout(`${base}, ${found}m (contour)`); return; }

    // 2. Thermal front gradient + ΔSST (from front hover points)
    const frontInfo = combinedFrontClickInfo(map, ev.coordinate, pixel);
    if (frontInfo) { capSetReadout(`${base}  ${frontInfo}`); return; }

    // 3. UV arrow current speed
    let arrowSpeed = null;
    if (window._combinedUvLayer) {
      map.forEachFeatureAtPixel(pixel, feature => {
        if (arrowSpeed !== null) return;
        const s = feature.get("speed");
        if (Number.isFinite(s)) arrowSpeed = s;
      }, { hitTolerance: 8 });
    }
    if (arrowSpeed !== null) { capSetReadout(`${base}, ${arrowSpeed.toFixed(2)} m/s (current)`); return; }

    // 4. CHL + SST raster sample as fallback
    const parts = [base];
    const chlSample = sampleRasterValueAt("chl", window._combinedChlGrid, window._combinedChlData, lon, lat);
    if (chlSample?.value !== undefined) parts.push(formatChlValue(chlSample.value));
    const sstSample = sampleRasterValueAt("sst", window._combinedSstGrid, window._combinedSstData, lon, lat);
    if (sstSample?.value !== undefined) parts.push(formatSstValue(sstSample.value));
    capSetReadout(parts.join("  "));
  };
  map.on('click', _captainMapClickHandler);
}

// thermal-front click helper for the combined view. Reuses the same
// _combinedFrontHoverPoints pixel-cache that the pointermove hover uses,
// but formats output for the persistent #readout box instead of the
// hover tooltip. Returns null if no front point is within 14 px of the click.
function combinedFrontClickInfo(map, coord, pixel) {
  const points = window._combinedFrontHoverPoints || [];
  if (!map || !coord || !pixel || !points.length) return null;
  // Zoom-independent hit radius — Haversine in km, matching the
  // pointermove hover. Clicking near (not exactly on) a front line
  // still counts regardless of zoom level.
  const nearby = [];
  for (const pt of points) {
    const d = thermalHaversineKm(coord, [pt.lon, pt.lat]);
    if (d <= MAX_THERMAL_HIT_DISTANCE_KM) nearby.push(pt);
  }
  if (!nearby.length) return null;
  const gradVals = [], sstVals = [];
  for (const pt of nearby) {
    if (pt.grad !== null && pt.grad !== undefined && Number.isFinite(pt.grad)) gradVals.push(pt.grad);
    if (pt.deltaSst && Number.isFinite(pt.deltaSst.value)) sstVals.push(pt.deltaSst.value);
  }
  const parts = [];
  if (gradVals.length) {
    const avg = gradVals.reduce((a, b) => a + b, 0) / gradVals.length;
    const displayGrad = thermalDistUnit === "nm" ? kmToNm(avg * (tempUnit === "F" ? 9 / 5 : 1)) : avg * (tempUnit === "F" ? 9 / 5 : 1);
    const unit = tempUnit + (thermalDistUnit === "nm" ? "/nm" : "/km");
    parts.push(`${displayGrad.toFixed(3)} °${unit}`);
  }
  if (sstVals.length) {
    const avg = sstVals.reduce((a, b) => a + b, 0) / sstVals.length;
    const deltaVal = tempUnit === "F" ? avg * 9 / 5 : avg;
    parts.push(`ΔSST ${deltaVal.toFixed(2)} ${tempUnitLabel()}`);
  }
  return parts.length ? parts.join("  ") : null;
}

// ── Button wiring ───────────────────────────────────────────────────────

document.getElementById('captain-dist-tool')?.addEventListener('click', () => {
  const map = window._combinedMapRef;
  if (!map) return;
  if (captainDistTool.active) { deactivateDistTool(); }
  else { activateDistTool(map); }
});

document.getElementById('captain-add-tool')?.addEventListener('click', () => {
  const map = window._combinedMapRef;
  if (!map) return;
  toggleAddTool(map);
});

document.getElementById('captain-save-btn')?.addEventListener('click', (e) => {
  e.stopPropagation();
  const menu = document.getElementById('captain-save-menu');
  if (menu) { closeSaveMenu(); return; }
  showSaveMenu();
});

document.getElementById('captain-fs-btn')?.addEventListener('click', () => {
  const fullscreenEl = document.fullscreenElement || document.webkitFullscreenElement || document.querySelector('#map') || document.documentElement;
  const target = document.fullscreenElement ? null : fullscreenEl;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (fullscreenEl.requestFullscreen) fullscreenEl.requestFullscreen();
    else if (fullscreenEl.webkitRequestFullscreen) fullscreenEl.webkitRequestFullscreen();
    else if (fullscreenEl.webkitEnterFullscreen) fullscreenEl.webkitEnterFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.webkitCancelFullScreen) document.webkitCancelFullScreen();
  }
});

// Fullscreen icon toggle
function updateFsIcon() {
  const btn = document.getElementById('captain-fs-btn');
  if (!btn) return;
  const isFs = !!(document.fullscreenElement || document.webkitIsFullScreen);
  btn.innerHTML = isFs
    ? `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
         <line x1="1" y1="1" x2="6" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
         <line x1="17" y1="1" x2="12" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
         <line x1="1" y1="17" x2="6" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
         <line x1="17" y1="17" x2="12" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
       </svg>`
    : `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
         <polyline points="1,6 1,1 6,1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
         <polyline points="12,1 17,1 17,6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
         <polyline points="1,12 1,17 6,17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
         <polyline points="17,12 17,17 12,17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
       </svg>`;
  btn.title = isFs ? 'Exit fullscreen' : 'Fullscreen';
}
document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const map = window._combinedMapRef;
  if (!map) return;
  if (e.key === 'm' || e.key === 'M') {
    if (captainDistTool.active) deactivateDistTool();
    else activateDistTool(map);
  } else if (e.key === 'a' || e.key === 'A') {
    toggleAddTool(map);
  } else if (e.key === 'Escape') {
    deactivateDistTool();
    captainAddTool.active = false;
    document.getElementById('captain-add-tool')?.classList.remove('active');
    document.getElementById('captain-pts-panel')?.classList.remove('visible');
    document.getElementById('captain-dist-panel')?.classList.remove('visible');
    closeSaveMenu();
  } else if ((e.key === 's' || e.key === 'S') && !e.metaKey && !e.ctrlKey) {
    if (captainAddTool.points.length) showSaveMenu();
  }
});

// ── Load waypoints from URL on init ────────────────────────────────────
let _urlWaypoints = loadWaypointsFromURL();
function applyUrlWaypoints() {
  if (!_urlWaypoints || !window._combinedMapRef) return;
  applyLoadedWaypoints(_urlWaypoints);
  _urlWaypoints = null;
}
</script>
