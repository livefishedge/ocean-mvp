<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiveMaps</title>
  <link rel="icon" href="data:,">

  <script src="https://cdn.plot.ly/plotly-2.34.0.min.js"></script>

  <style>
    :root{
      --bg:#050b10; --fg:#e0e6ee; --panel:rgba(5,11,16,0.92); --border:#1b2836;
      --pad:10px;
    }
    html, body {
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      overflow:auto;
    }

    /* ======= Controls (sticky) ======= */
    #controls{
      position:sticky;
      top:0;
      z-index:80;
      background:var(--panel);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(6px);
      padding:8px 10px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }

    .row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    #row-var{ flex: 0 0 auto; }
    #row-play{ flex: 0 0 auto; }
    #row-slider{ flex: 1 1 520px; min-width:320px; }

    #var-select{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:10px 12px;
      font-size:20px;
      font-weight:800;
      min-height:44px;
    }

    button{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:10px 12px;
      font-size:16px;
      min-height:44px;
      cursor:pointer;
    }
    button:disabled{ opacity:.45; cursor:default; }

    #frame-slider{ flex:1; min-width:220px; height:24px; }
    #frame-label{
      min-width:240px;
      text-align:right;
      font-size:20px;
      font-weight:800;
      font-variant-numeric: tabular-nums;
      white-space:nowrap;
    }


    #speed-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      margin-left:10px;
      white-space:nowrap;
    }
    #speed-label{
      opacity:0.85;
      font-size:13px;
      white-space:nowrap;
    }
    #speed-select{
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:8px 10px;
      font-size:14px;
      min-height:36px;
    }

    /* Modebar host: NEW CSS for floating inside the plot at upper-left */
    #modebar-host{
      position: fixed; /* Must be 'fixed' to float on scroll */
      top: 75px; /* Using 92px is generally better to clear the sticky controls */
      left: 50px; /* Using 10px moves it to the very left edge */
      z-index: 1000;
      pointer-events: auto;
    }
    .modebar{
      background: rgba(5,11,16,0.55) !important;
      border-radius:12px !important;
      padding:6px 6px !important;
      position: static !important; /* Override Plotly's internal positioning */
      gap: 14px !important;              /* space between groups */
      /* VITAL FIXES for single row display */
      display: flex !important;
      flex-wrap: nowrap !important; /* Forces all buttons into a single row */
      justify-content: flex-start !important;
    }

    /* Modebar tip */
    #modebar-tip{
      position:absolute;
      z-index:1100;
      pointer-events:none;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.5) !important;
      color: #e0e6ee;
      border: 1px solid rgba(224,230,238,0.15);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      max-width: 320px;
      white-space: nowrap;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    /* ======= Plot ======= */
    /*#plot-wrap{ position:relative; width:100%; }*/
    #plot{
      width:100%;
      height: calc(200dvh);
      min-height:520px;

      /* Key: allow 1-finger vertical page scrolling */
      touch-action: pan-y;
    }

    /* Floating readout: Updated Top position */
    #readout{
      position:absolute;
      top:75px; /* Adjusted to be consistent with modebar host */
      right:10px;
      z-index:120;
      padding:5px 5px;
      background: rgba(255,255,255,0.50);
      color:#000;
      border:1px solid rgba(0,0,0,0.12);
      border-radius:10px;
      font-variant-numeric: tabular-nums;
      pointer-events:none;
      white-space:nowrap;
      font-size:14px;
      min-width:120px;
      text-align:middle;
    }

    /* ======= Bottom ranges (sticky): Reduced Padding ======= */
    #ranges{
      position:sticky;
      bottom:-50;
      z-index:70;
      background:var(--panel);
      border-top:1px solid var(--border);
      backdrop-filter: blur(6px);
      padding:4px 10px 0;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      font-size:14px;
    }

    /* Ranges row layout with footer colorbar on the right */
    #ranges{ justify-content: space-between; }
    #ranges-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    #ranges-right{
      display:flex;
      align-items:center;
      margin-left:auto;
    }
    #cbar{
      width:320px;
      height:72px;
    }
    .range-block{	
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      padding:4px 8px; /* REDUCED PADDING */
      border:1px solid var(--border);
      border-radius:12px;
      background: rgba(12,23,35,0.65);
    }
    .range-name{
      font-weight:900;
      font-size:14px;
      margin-right:4px;
      white-space:nowrap;
    }
    .mini-label{ opacity:0.85; font-size:13px; white-space:nowrap; }
    input[type="number"]{
      width:96px;
      background:#0c1723;
      color:var(--fg);
      border:1px solid #273649;
      border-radius:10px;
      padding:2px 8px; /* REDUCED PADDING */
      font-size:14px;
      min-height:20px; /* REDUCED MIN HEIGHT */
    }
    .range-actions{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .range-actions button{
      padding:4px 8px; /* REDUCED PADDING */
      font-size:13px;
      min-height:36px; /* REDUCED MIN HEIGHT */
    }

    /* ======= Portrait mobile layout (width < height) ======= */
    @media (orientation: portrait) {
      #controls{ align-items:stretch; }
      #row-var{ flex: 0 0 100%; }
      /* row-play/row-slider display handled in JS for bathy */
      #row-play{ flex: 0 0 100%; justify-content:flex-start; }
      #row-slider{ flex: 0 0 100%; }

      #var-select{ width:100%; font-size:18px; }
      #frame-label{
        width:100%;
        min-width:0;
        text-align:left;
        font-size:18px;
      }
      #frame-slider{ width:100%; min-width:0; }

      /* modebar full row (only needed if inside controls) - keeping this for mobile safety */
      #modebar-host .modebar{
        width:auto !important; /* Auto width for modebar */
        display:flex !important;
        flex-wrap:nowrap !important;
        justify-content:flex-start !important;
      }
      /* Bigger spacing between modebar symbols */
      #modebar-host .modebar-btn{
        margin-left:10px !important;
        margin-right:10px !important;
      }
      #modebar-host{
        top: 168px; /* Adjusted for larger portrait controls */
        left: 20px;
      }
      #modebar-host .modebar-group{
        display:flex !important;
        flex-wrap:nowrap !important;
        gap: 14px !important;            /* space between buttons */
      }



      /* smaller readout */
      #readout{
        right:10px;
        top: 168px; /* Adjusted to be next to modebar in portrait */
        font-size:12px;
        min-width:96px;
        padding:5px 7px;
      }

      /* plot height */
      #plot{ height: calc(100dvh - 220px - 96px); min-height:420px; }

      /* ===== Fix: keep "Temperature min max" on ONE row ===== */
      .range-block{
        width:100%;
        gap:6px;
        padding:4px 6px; /* FURTHER REDUCED PADDING */
      }
      .range-name{ font-size:12px; margin-right:2px; }
      .mini-label{ font-size:12px; }
      input[type="number"]{
        width:72px;
        font-size:12px;
        padding:4px 6px; /* FURTHER REDUCED PADDING */
        min-height:32px; /* FURTHER REDUCED MIN HEIGHT */
      }

      /* actions go to next row */
      .range-actions{ flex: 0 0 100%; }
      .range-actions button{ font-size:12px; min-height:20 px; padding:2px 8px; }
      /* footer colorbar wraps nicely on portrait */
      #ranges-right{ flex: 0 0 100%; }
      #cbar{ width:100%; }

    }
    
    /* Gate Styles */
	#login-gate {
	  position: fixed;
	  top: 0; left: 0; width: 100%; height: 100%;
	  background: #050b10; /* Solid background blocks the map */
	  z-index: 99999;      /* Ensures it sits on top of everything */
	  display: flex;       /* Centers the box */
	  align-items: center;
	  justify-content: center;
	}

	.gate-box {
	  background: #0c1723;
	  border: 1px solid #273649;
	  padding: 40px;
	  border-radius: 12px;
	  text-align: center;
	  width: 90%;
	  max-width: 400px;
	  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
	}

	.gate-box h2 { margin-top: 0; color: #fff; }
	.gate-box p { color: #ccc; margin-bottom: 20px; }

	/* Inputs */
	.gate-box input {
	  display: block;
	  width: 100%;
	  box-sizing: border-box; /* Fixes padding issues */
	  padding: 12px;
	  margin: 10px 0;
	  border-radius: 6px;
	  border: 1px solid #273649;
	  background: #050b10;
	  color: #e0e6ee;
	  font-size: 16px;
	}

	/* Button */
	.gate-box button {
	  width: 100%;
	  padding: 12px;
	  margin-top: 10px;
	  border: none;
	  border-radius: 6px;
	  background: #1d4f91;
	  color: white;
	  font-weight: bold;
	  font-size: 16px;
	  cursor: pointer;
	}
	.gate-box button:hover { background: #2663b5; }
  </style>
</head>

<script>
/* ========================= CONFIG ========================= */
const REGION_ID = "mbh";

// Bounding Box (LonMin, LatMin, LonMax, LatMax)
const BBOX = [-79.0, 24.5, -75.0, 28.5];

// UPDATED: UV label is now Sea Surface Height, and Currents arrow unit is separate
const VAR_LABELS = { 
  chl:"Chlorophyll", sst:"Temperature", 
  uv:"Sea Surface Height", /* CHANGED for Range Input Title */
  bathy:"Bathymetry" 
};

const VAR_TO_GRID = {
  chl: "viirs_chl_750_grid.json",
  sst: "goes_sst_1000_grid.json",
  uv:  "uv_12500_grid.json"
};

const BATHY_JSON_URL = `data/${REGION_ID}/gebco_bath_20251208/gebco_2025_mbh_bathy.json`;

const INDEX_CANDIDATES = [
  "index.json",
];

const DEFAULT_RANGES = {
  chl:   { vmin: 0.01, vmax: 1.0, unit: "mg/m³" },
  sst:   { vmin: 23.0, vmax: 28.0, unit: "°C" },
  uv:    { vmin: 0.6, vmax: 0.9,  unit: "m" }, /* CHANGED: Now represents ADT/SSH range */
  bathy: { vmin: 0.0,  vmax: 3000.0, unit: "m" }
};

let userRanges = {
  chl:   { ...DEFAULT_RANGES.chl },
  sst:   { ...DEFAULT_RANGES.sst },
  uv:    { ...DEFAULT_RANGES.uv },
  bathy: { ...DEFAULT_RANGES.bathy }
};

/* CHL colorscale (algae-ish) 
const CHL_ALGAE = [
  [0.00, "#081d38"],
  [0.10, "#1d4f91"],
  [0.22, "#00a6ca"],
  [0.36, "#00d17f"],
  [0.52, "#a3f700"],
  [0.70, "#ffe600"],
  [0.86, "#ff7a00"],
  [1.00, "#b30000"]
];*/

const CHL_ALGAE = [
  [0.0, "#021029"], // Pitch Dark Blue (Lowest)
  [0.2, "#002a70"], // Deep Royal Blue
  [0.4, "#0055ff"], // Bright Electric Blue
  [0.5, "#00d4aa"], // Vivid Teal (Transition)
  [0.6, "#00c42e"], // Bright Lime/Emerald
  [0.8, "#007a1c"], // Rich Green
  [1.0, "#003300"]  // Deepest Forest Green (Highest)
];

// Professional Bathymetry Scale: Shallow (Light Teal) to Deep (Navy)
const BATHY_SCALE = [
  [0.0, "#e0ffff"], // 0 depth: Very light cyan (Coastline)
  [0.1, "#afeeee"], // Pale Turquoise (Inner Shelf)
  [0.3, "#40e0d0"], // Turquoise (Outer Shelf)
  [0.5, "#0080ff"], // Azure Blue (Slope)
  [0.7, "#0000cc"], // Medium Blue (Deep Ocean)
  [0.9, "#000066"], // Dark Blue (Abyssal)
  [1.0, "#000033"]  // Midnight Blue (Deepest Trenches)
];

/* show 0.01, 0.1, 1, 10 on CHL colorbar */
const CHL_TICKS_LINEAR = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10];
const CHL_TICKVALS = CHL_TICKS_LINEAR.map(v => Math.log10(v));
const CHL_TICKTEXT = CHL_TICKS_LINEAR.map(v => (v===0.01||v===0.1||v===1||v===10) ? String(v) : "");

/* ========================= STATE ========================= */
let lastUpdateTimestamp = null;
let framesByVar = { chl: [], sst: [], uv: [], bathy: [] };
let frameTimesByVar = { chl: [], sst: [], uv: [], bathy: [] };
let currentVar = "chl";
let currentFrameIdx = 0;
let playing = false;
let playTimer = null;
const BASE_PLAY_MS = 800;
let playSpeed = 1.0; // multiplier: 1.0 = default speed
let playIntervalMs = BASE_PLAY_MS;

const gridCache = {};
let _readoutHooked = false;
let _relayoutHooked = false;

let viewState = { hasRange:false, xRange:null, yRange:null };
let landTrace = null;

/* Touch / portrait detection */
const IS_TOUCH = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
function isPortrait() { return window.innerHeight > window.innerWidth; }

/* Marker state */
let markers = [];
let markerMode = "off"; // "off" | "add" | "remove"
let markerTrace = {
  type:"circle",
  mode:"markers+text",
  x:[], y:[], text:[],
  marker:{ size:10, color:"#ff0000", symbol:"circle" },
  textfont:{ size:12, color:"#ff0000" },
  textposition:"top center",
  hoverinfo:"text",
  visible: true,
  showlegend: false,
  name: "Markers"
};

/* Marker helpers (persist across var switches via injection in showFrame) */
function syncMarkerTraceFromState() {
  markerTrace.x = markers.map(m => m.lon);
  markerTrace.y = markers.map(m => m.lat);
  markerTrace.text = markers.map(m => m.label ?? "");
}

function injectMarkers(fig) {
  if (!fig) return;
  syncMarkerTraceFromState();
  fig.data = (fig.data || []).filter(t => t?.name !== "Markers");
  fig.data.push(markerTrace);
}

function removeNearestMarker(lon, lat, tolDeg = 0.05) {
  let bestI = -1, bestD = Infinity;
  for (let i = 0; i < markers.length; i++) {
    const dx = (markers[i].lon - lon);
    const dy = (markers[i].lat - lat);
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; bestI = i; }
  }
  if (bestI >= 0 && bestD <= tolDeg) markers.splice(bestI, 1);
}

/* ========================= TOUCH POLICY ========================= */
function installTouchPolicyOnce() {
  if (!IS_TOUCH) return;
  if (plotDiv.__touchPolicyInstalled) return;
  plotDiv.__touchPolicyInstalled = true;

  plotDiv.style.touchAction = "pan-y";

  const handler = (e) => {
    if (e.touches && e.touches.length >= 2) e.preventDefault();
  };
  plotDiv.addEventListener("touchstart", handler, { passive:false });
  plotDiv.addEventListener("touchmove", handler, { passive:false });
}

/* ========================= TIME PARSERS ========================= */
function parseChlUtcFromName(filename) {
  const m = filename.match(/_(\d{4})(\d{3})\.(\d{4})_/);
  if (!m) return null;
  const year = Number(m[1]);
  const jjj  = Number(m[2]);
  const hhmm = m[3];
  const hh = Number(hhmm.slice(0,2));
  const mm = Number(hhmm.slice(2,4));
  const d0 = new Date(Date.UTC(year,0,1,0,0,0));
  return new Date(d0.getTime() + (jjj-1)*86400e3 + hh*3600e3 + mm*60e3);
}
function parseSstUtcFromName(filename) {
  const m = filename.match(/sstcomp_.*?_(\d{4})(\d{3})_(\d{8})_(\d{2})_/);
  if (!m) return null;
  const year = Number(m[1]);
  const jjj  = Number(m[2]);
  const hh   = Number(m[4]);
  const d0 = new Date(Date.UTC(year,0,1,0,0,0));
  return new Date(d0.getTime() + (jjj-1)*86400e3 + hh*3600e3);
}
function parseUvDateFromName(filename) {
  const m = filename.match(/_(\d{8})_/);
  if (!m) return null;
  const y = Number(m[1].slice(0,4));
  const mo = Number(m[1].slice(4,6)) - 1;
  const d = Number(m[1].slice(6,8));
  return new Date(Date.UTC(y,mo,d));
}

function fmtLocalDateTime(dt) {
  return dt.toLocaleString(undefined, {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit",
    hour12:false
  });
}
function fmtLocalDate(dt) {
  return dt.toLocaleDateString(undefined, { year:"numeric", month:"2-digit", day:"2-digit" });
}

function framePathOf(f){ return String(f?.json_path || f?.path || f?.file || f?.url || f?.json || ""); }
function frameFilenameOf(f){ const p = framePathOf(f); return p.split("/").pop() || p; }

function timeOnlyLabel(varKey, frameMeta) {
  if (varKey === "bathy") return ""; /* EMPTY for bathy */
  const path = framePathOf(frameMeta);
  const filename = String(path).split("/").pop() || "";
  if (varKey === "chl") { const dt = parseChlUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "sst") { const dt = parseSstUtcFromName(filename); return dt ? fmtLocalDateTime(dt) : ""; }
  if (varKey === "uv")  { const dt = parseUvDateFromName(filename);  return dt ? fmtLocalDate(dt) : ""; }
  return "";
}

function epochMsForFrame(varKey, frameMeta) {
  if (varKey === "bathy") return Date.UTC(2025,11,8);
  const filename = frameFilenameOf(frameMeta);
  let dt = null;
  if (varKey === "chl") dt = parseChlUtcFromName(filename);
  if (varKey === "sst") dt = parseSstUtcFromName(filename);
  if (varKey === "uv")  dt = parseUvDateFromName(filename);
  return dt ? dt.getTime() : null;
}

/* ========================= HELPERS ========================= */
function is2D(a){ return Array.isArray(a) && a.length>0 && Array.isArray(a[0]) && a[0].length>0; }

function filterFramesForVar(varKey, frames) {
  const out = [];
  for (const f of (frames || [])) {
    const fn = frameFilenameOf(f).toLowerCase();
    if (!fn.endsWith(".json")) continue;
    if (fn.includes("grid")) continue;
    if (varKey === "chl" && !fn.includes("_chl_")) continue;
    if (varKey === "sst" && !fn.startsWith("sst")) continue;
    if (varKey === "uv"  && !fn.startsWith("uv_")) continue;
    out.push(f);
  }
  return out;
}

function closestIndex(times, targetMs) {
  if (!times.length || targetMs === null) return 0;
  let best = 0, bestDist = Infinity;
  for (let i=0;i<times.length;i++){
    const t = times[i];
    if (t === null) continue;
    const d = Math.abs(t - targetMs);
    if (d < bestDist){ bestDist = d; best = i; }
  }
  return best;
}

/* ========================= FIGURES ========================= */
function buildChl(gridInfo, dataObj) {
  const { xAxis, yAxis, nx, ny } = gridInfo;
  if (!is2D(dataObj.chl)) throw new Error("CHL JSON missing 2-D key: chl");

  const vmin = userRanges.chl.vmin;
  const vmax = userRanges.chl.vmax;
  const zmin = Math.log10(vmin);
  const zmax = Math.log10(vmax);

  const z = Array.from({ length: ny }, () => Array(nx).fill(null));
  const cd = Array.from({ length: ny }, () => Array(nx).fill(null));

  for (let j=0;j<ny;j++){
    for (let i=0;i<nx;i++){
      const vv = dataObj.chl[j][i];
      const num = (vv===null||vv===undefined||!isFinite(vv)) ? null : Number(vv);
      cd[j][i] = num;
      z[j][i] = (num!==null && num>0) ? Math.log10(num) : null;
    }
  }

  const cb = colorbarFor("chl");
  cb.tickmode = "array";
  cb.tickvals = CHL_TICKVALS;
  cb.ticktext = CHL_TICKTEXT;
  cb.ticks = "outside";

  return {
    data: [{
      type:"heatmap",
      x:xAxis, y:yAxis,
      z,
      customdata: cd,
      hoverinfo:"none",
      showscale:false,
      zauto:false, zmin, zmax,
      colorscale: CHL_ALGAE,
      colorbar: cb,
      zsmooth:false
    }],
    layout: stableLayout()
  };
}

function buildSst(gridInfo, dataObj) {
  const { xAxis, yAxis } = gridInfo;
  if (!is2D(dataObj.sst)) throw new Error("SST JSON missing 2-D key: sst");

  const vmin = userRanges.sst.vmin;
  const vmax = userRanges.sst.vmax;

  return {
    data: [{
      type:"heatmap",
      x:xAxis, y:yAxis,
      z: dataObj.sst,
      customdata: dataObj.sst,
      hoverinfo:"none",
      showscale:false,
      zauto:false, zmin:vmin, zmax:vmax,

      /* CHANGED: Use RdBu with reverseScale:true for standard cold(blue) -> warm(red) */
      colorscale: "RdBu",
      reversescale: false,

      colorbar: colorbarFor("sst"),
      zsmooth:false
    }],
    layout: stableLayout()
  };
}

function buildUv(gridInfo, dataObj) {
  const { xAxis, yAxis, nx, ny } = gridInfo;
  const d = dataObj.data || dataObj;

  if (!d || !is2D(d.u) || !is2D(d.v) || !is2D(d.adt)) {
    throw new Error("UV JSON missing 2-D keys: data.u, data.v, data.adt");
  }

  const adt = d.adt;
  const u = d.u, v = d.v;

  // Use the UV range, which is now configured for ADT (Sea Surface Height)
  const vmin = userRanges.uv.vmin; 
  const vmax = userRanges.uv.vmax; 

  const bg = {
    type:"heatmap",
    x:xAxis, y:yAxis,
    z:adt,
    customdata:adt,
    hoverinfo:"none",
    showscale:false,
    zauto:false, zmin:vmin, zmax:vmax,
    colorscale:"Viridis",
    // Colorbar uses the 'uv' key which now has the unit 'm'
    colorbar: colorbarFor("uv"), 
    zsmooth:false
  };

  // Open arrowheads
  const lineX = [];
  const lineY = [];

  let dxg = 0.01, dyg = 0.01;
  if (nx > 1) dxg = Math.abs(xAxis[1] - xAxis[0]);
  if (ny > 1) dyg = Math.abs(yAxis[1] - yAxis[0]);
  const minHead = 0.2 * Math.max(dxg, dyg);
  const headAngle = (10 * Math.PI) / 180;

  const step = (nx * ny > 2500) ? 2 : 1;
  const scale = 1.0;

  for (let j=0;j<ny;j+=step){
    const lat0 = yAxis[j];
    for (let i=0;i<nx;i+=step){
      const lon0 = xAxis[i];
      const uu = u[j][i], vv = v[j][i];
      const sp = Math.hypot(uu, vv); 
      
      if (!isFinite(uu) || !isFinite(vv) || !isFinite(sp)) continue;

      const lon1 = lon0 + uu * scale;
      const lat1 = lat0 + vv * scale;

      const dx = lon1 - lon0, dy = lat1 - lat0;
      const L = Math.hypot(dx,dy);
      if (!(L > 0)) continue;

      // shaft
      lineX.push(lon0, lon1, null);
      lineY.push(lat0, lat1, null);

      // open V head
      const theta = Math.atan2(dy, dx);
      const hl = Math.max(minHead, 0.45 * L);

      const xL = lon1 + hl * Math.cos(theta + Math.PI - headAngle);
      const yL = lat1 + hl * Math.sin(theta + Math.PI - headAngle);
      const xR = lon1 + hl * Math.cos(theta + Math.PI + headAngle);
      const yR = lat1 + hl * Math.sin(theta + Math.PI + headAngle);

      lineX.push(lon1, xL, null, lon1, xR, null);
      lineY.push(lat1, yL, null, lat1, yR, null);
    }
  }

  const arrows = {
    type:"scatter",
    mode:"lines",
    x:lineX, y:lineY,
    hoverinfo:"none",
    line:{ color:"#000000", width:1.6 }, /* CHANGED color to white for better contrast */
    showlegend:false
  };

  return { data:[bg, arrows], layout: stableLayout() };
}

/* ===== Improved Bathymetry Loader ===== */
async function loadBathymetryJson(url) {
  if (gridCache.__bathy_json) return gridCache.__bathy_json;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to load bathy JSON: ${url}`);
  const data = await res.json();

  // Validate structure
  if (!data.xAxis || !data.yAxis || !data.depth) {
    throw new Error("Bathy JSON missing keys: xAxis, yAxis, or depth");
  }

  // Create customdata for readout (clone depth)
  // We can just reference the same array since we aren't modifying it
  const out = {
    xAxis: data.xAxis,
    yAxis: data.yAxis,
    depth: data.depth,
    customdata: data.depth 
  };
  
  gridCache.__bathy_json = out;
  return out;
}

function buildBathy(bathy) {
  const vmin = userRanges.bathy.vmin;
  const vmax = userRanges.bathy.vmax;

  return {
    data: [{
      type:"heatmap",
      x:bathy.xAxis, y:bathy.yAxis,
      z:bathy.depth,
      customdata:bathy.customdata,
      hoverinfo:"none",
      showscale:false,
      zauto:false, zmin:vmin, zmax:vmax,
      colorscale:BATHY_SCALE,
      reversescale:false,
      colorbar: colorbarFor("bathy"),
      zsmooth:false
    }],
    layout: stableLayout()
  };
}

function buildForVar(varKey, gridInfo, dataObj) {
  if (varKey === "chl") return buildChl(gridInfo, dataObj);
  if (varKey === "sst") return buildSst(gridInfo, dataObj);
  if (varKey === "uv")  return buildUv(gridInfo, dataObj);
  throw new Error(`Unsupported varKey=${varKey}`);
}

/* ========================= READOUT (hover + tap) ========================= */
function setupReadoutHandlersOnce() {
  if (_readoutHooked) return;
  _readoutHooked = true;

  plotDiv.on("plotly_unhover", () => { if (!IS_TOUCH) setReadout(""); });

  plotDiv.on("plotly_hover", (ev) => {
    if (IS_TOUCH) return;
    const p = ev.points && ev.points[0];
    if (!p) return;
    renderReadoutFromPoint(p);
  });

  plotDiv.on("plotly_click", async (ev) => {
    const p = ev.points && ev.points[0];
    if (!p) return;

    const lon = Number(p.x);
    const lat = Number(p.y);
    if (!isFinite(lon) || !isFinite(lat)) return;

    if (markerMode === "add") {
      markers.push({ lon, lat, label: String(markers.length + 1) });
      await showFrame();
      return;
    }

    if (markerMode === "remove") {
      removeNearestMarker(lon, lat);
      await showFrame();
      return;
    }

    renderReadoutFromPoint(p);
  });
}

function renderReadoutFromPoint(p) {
  const lon = Number(p.x);
  const lat = Number(p.y);
  if (!isFinite(lon) || !isFinite(lat)) return;

  const base = `${lon.toFixed(4)}°, ${lat.toFixed(4)}°`;
  const cd = p.customdata;

  if (cd === null || cd === undefined || !isFinite(cd)) { setReadout(base); return; }

  const val = Number(cd);
  const unit = DEFAULT_RANGES[currentVar]?.unit || "";
  if (currentVar === "sst") setReadout(`${base}, ${val.toFixed(2)}${unit}`);
  else { if (currentVar === "bathy") setReadout(`${base}, ${val.toFixed(0)}${unit}`);
  else setReadout(`${base}, ${val.toFixed(3)}${unit}`);
  }
}

async function setCurrentVar(v, keepTime = true) {
  const prevVar = currentVar;
  const prevFrames = framesByVar[prevVar] || [];
  const prevFrame = prevFrames[currentFrameIdx] || null;
  const prevT = (keepTime && prevFrame) ? epochMsForFrame(prevVar, prevFrame) : null;

  currentVar = v;
  varSelect.value = v;

  const frames = framesByVar[currentVar] || [];
  const times = frameTimesByVar[currentVar] || [];

  if (frames.length) currentFrameIdx = (keepTime && prevT !== null) ? closestIndex(times, prevT) : 0;
  else currentFrameIdx = 0;

  syncRangeInputsToVar();
  updateSliderUI();
  syncTimeControls(); /* NEW */
  syncArrowLegend(); /* NEW */

  if (frames.length) await showFrame();
  else Plotly.purge(plotDiv);
}

function stepFrame(delta) {
  const frames = framesByVar[currentVar] || [];
  const n = frames.length;
  if (!n) return;
  currentFrameIdx = (currentFrameIdx + delta + n) % n;
  slider.value = currentFrameIdx;
  showFrame();
}

function setPlaying(on) {
  if (on === playing) return;
  playing = on;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  } else {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
  }
}


function setPlaySpeed(mult) {
  const m = Number(mult);
  if (!isFinite(m) || m <= 0) return;
  playSpeed = m;
  playIntervalMs = Math.max(60, Math.round(BASE_PLAY_MS / playSpeed));
  if (playing) {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => stepFrame(+1), playIntervalMs);
  }
}

/* ========================= LOADING ========================= */
async function loadIndex() {
  // 1. Fetch the data ONCE with a cache-buster
  const res = await fetch("index.json?t=" + Date.now());
  if (!res.ok) throw new Error("Failed to load index.json");
  const data = await res.json();
  
  // 2. Set the global timestamp if it's the first load
  if (!lastUpdateTimestamp) {
    lastUpdateTimestamp = data.last_updated;
  }
  
  // 3. Use the data we already fetched instead of looping through CANDIDATES
  const idx = data; 

  const fbv = idx.frames || idx.framesByVar || idx.frames_by_var || framesByVar;

  framesByVar.chl = filterFramesForVar("chl", fbv.chl || []);
  framesByVar.sst = filterFramesForVar("sst", fbv.sst || []);
  framesByVar.uv  = filterFramesForVar("uv",  fbv.uv  || []);
  framesByVar.bathy = [{ json_path: BATHY_JSON_URL }];

  for (const v of ["chl","sst","uv","bathy"]) {
    framesByVar[v].sort((a,b) => (epochMsForFrame(v,a) ?? 0) - (epochMsForFrame(v,b) ?? 0));
    frameTimesByVar[v] = framesByVar[v].map(f => epochMsForFrame(v,f));
  }
  
  return data;
}

async function loadGridForVar(v) {
  if (gridCache[v]) return gridCache[v];
  const gridName = VAR_TO_GRID[v];
  const url = `data/${REGION_ID}/grids/${gridName}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not load grid for ${v}: ${url}`);
  const grid = await res.json();

  const lon = grid.lon, lat = grid.lat;
  if (!Array.isArray(lon) || !Array.isArray(lat) || !Array.isArray(lon[0]) || !Array.isArray(lat[0])) {
    throw new Error("Grid JSON must contain 2-D lon/lat arrays");
  }

  const ny = lon.length;
  const nx = lon[0].length;

  // --- FIX START: Use the middle row/col to minimize projection skew ---
  const midY = Math.floor(ny / 2);
  const midX = Math.floor(nx / 2);

  // Use the middle row of longitudes for the X-axis
  const xAxis = lon[midY].slice();
  
  // Use the middle column of latitudes for the Y-axis
  const yAxis = lat.map(r => r[midX]);
  // --- FIX END ---

  const info = { xAxis, yAxis, nx, ny };
  gridCache[v] = info;
  return info;
}

async function fetchFrameData(varKey, frameMeta) {
  const p = framePathOf(frameMeta);
  if (!p) throw new Error("Frame has no json path");
  const res = await fetch(p);
  if (!res.ok) throw new Error(`Frame load failed: ${p}`);
  return await res.json();
}

async function prepareLandMask() {
  try {
    // Reuse your existing loader
    const data = await loadBathymetryJson(BATHY_JSON_URL);
    
    // Create a Z-grid for the mask: 1 for Land, null for Water
    // Assuming convention: Positive = Water Depth, Negative/Zero = Land Elevation
    const zMask = data.depth.map(row => 
      row.map(val => (val !== null && val <= 0) ? 1 : null)

    landTrace = {

      hoverinfo: "skip", // Don't show hover tooltips for land
      zmin: 0,

      name: "LandMask"
    };

  }
}

          markerMode = (markerMode === "add") ? "off" : "add";
          plotDiv.style.cursor = (markerMode === "add") ? "crosshair" : "";
          setReadout(markerMode === "add" ? "Marker mode ON: click map to drop marker" : "");
        }
      },
      {
        name: "Remove marker",
        title: "Click to remove a marker)",
        icon: Plotly.Icons.eraseshape,
        click: () => {
          markerMode = (markerMode === "remove") ? "off" : "remove";
          plotDiv.style.cursor = (markerMode === "remove") ? "not-allowed" : "";
          setReadout(markerMode === "remove" ? "Remove mode ON: click near a marker to remove" : "");
        }
      },
      /*{
        name: "Clear markers",
        title: "Remove all markers",
        icon: Plotly.Icons.trash,
        click: () => {
          markers = [];
          setReadout("");
          showFrame();
        }
      }*/
    ]
  };
}



async function showFrame() {
  updateReadoutPosition();

  const frames = framesByVar[currentVar] || [];
  if (!frames.length) return;

  const frameMeta = frames[currentFrameIdx];

  let fig = null;

  if (currentVar === "bathy") {
    const bathy = await loadBathymetryJson(BATHY_JSON_URL);
    fig = buildBathy(bathy);
  } else {
    const [gridInfo, dataObj] = await Promise.all([
      loadGridForVar(currentVar),
      fetchFrameData(currentVar, frameMeta)
    ]);
    fig = buildForVar(currentVar, gridInfo, dataObj);
  }

  injectMarkers(fig);
  
  if (landTrace && currentVar !== "bathy") {
    fig.data.push(landTrace);
  }

  await Plotly.react(plotDiv, fig.data, fig.layout, plotConfig());
  await renderFooterColorbar(currentVar);
  
  const modebar = plotDiv.querySelector('.modebar');
  if (modebar && !modebarHost.querySelector('.modebar')) {
      modebarHost.appendChild(modebar);
  }
  
  installModebarHoverHelpOnce();

  installTouchPolicyOnce();
  
  setupReadoutHandlersOnce();
  attachRelayoutListenerOnce();
  updateSliderUI();
}

});

slider.addEventListener("input", () => {
  currentFrameIdx = Number(slider.value) || 0;
  showFrame();
});

playBtn.addEventListener("click", () => setPlaying(!playing));
speedSel.addEventListener("change", () => setPlaySpeed(speedSel.value));

// Fullscreen toggle (plot stays responsive)
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}
if (fsBtn) {
  fsBtn.addEventListener("click", () => toggleFullscreen());
}
document.addEventListener("fullscreenchange", () => {
  try { Plotly.Plots.resize(plotDiv); } catch(e) {}
});

prevBtn.addEventListener("click", () => { setPlaying(false); stepFrame(-1); });
nextBtn.addEventListener("click", () => { setPlaying(false); stepFrame(+1); });

applyBtn.addEventListener("click", () => {
  const vmin = Number(vminInput.value);
  const vmax = Number(vmaxInput.value);
  if (!isFinite(vmin) || !isFinite(vmax) || vmax <= vmin) return;
  userRanges[currentVar].vmin = vmin;
  userRanges[currentVar].vmax = vmax;
  showFrame();
});

resetBtn.addEventListener("click", () => {
  userRanges[currentVar] = { ...DEFAULT_RANGES[currentVar] };
  syncRangeInputsToVar();
  showFrame();
});

window.addEventListener("resize", () => {
  updateReadoutPosition();
  try { Plotly.Plots.resize(plotDiv); } catch(_){}
  showFrame();
});

/* ================= LOGIN GATE LOGIC ================= */
(function() {
  // Elements
  const gate = document.getElementById('login-gate');
  const btn = document.getElementById('gate-btn');
  const title = document.getElementById('gate-title');
  const msg = document.getElementById('gate-msg');
  
  const inpName = document.getElementById('visitor-name');
  const inpEmail = document.getElementById('visitor-email');
  const inpPhone = document.getElementById('visitor-phone');

  // Check LocalStorage
  const hasVisited = localStorage.getItem('ocean_viewer_registered');

  // --- 1. SETUP UI ---
  if (hasVisited) {
    // Returning User: Hide extra fields
    title.innerText = "Welcome Back";
    msg.innerText = "Please verify your name.";
    inpEmail.style.display = 'none';
    inpPhone.style.display = 'none';
    
    // Auto-fill name if available
    const lastName = localStorage.getItem('ocean_viewer_last_user');
    if (lastName) inpName.value = lastName;
  }

  // --- 2. VALIDATION HELPERS ---
  function isValidEmail(email) {
    // Basic regex: text @ text . text
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function isValidPhone(phone) {
    // Remove non-digits
    const digits = phone.replace(/\D/g, '');
    // Check if we have at least 10 digits
    return digits.length >= 10;
  }

  // --- 3. HANDLE SUBMIT ---
  btn.addEventListener('click', () => {
    const name = inpName.value.trim();
    const email = inpEmail.value.trim();
    const phone = inpPhone.value.trim();

    // A. Validate Name (Always required)
    if (name.length < 2) {
      alert("Please enter a valid name.");
      return;
    }

    // B. Validate Contact Info (Only for New Users)
    if (!hasVisited) {
      if (!isValidEmail(email)) {
        alert("Please enter a valid email address.");
        return;
      }
      if (!isValidPhone(phone)) {
        alert("Please enter a valid phone number (at least 10 digits).");
        return;
      }
    }

    // C. Success! Save & Close
    localStorage.setItem('ocean_viewer_registered', 'true');
    localStorage.setItem('ocean_viewer_last_user', name);
    
    // Hide the gate
    gate.style.display = 'none';

    // D. Notify Discord
    sendNotification(name, email, phone, !hasVisited);
  });

  function sendNotification(name, email, phone, isNewUser) {
    // REPLACE WITH YOUR URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1453131435522265291/1MrssyUuxkTWxOP_AP8rQMKqhpE3wxTQymN36evICSjpmF6AyUNzaTtYfq9q6YRGci2o";

    let content = "";
    if (isNewUser) {
      content = `🆕 **New User:** ${name}\n📧 **Email:** ${email}\n📱 **Phone:** ${phone}`;
    } else {
      content = `👋 **Return Visit:** ${name}`;
    }

    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content })
    }).catch(e => console.error("Log failed", e));
  }
})();

(function() {
  const submitBtn = document.getElementById('feedbackSubmit');
  const inputField = document.getElementById('feedbackInput');

  if (submitBtn && inputField) {
    submitBtn.addEventListener('click', sendFeedback);
    
    // Also allow pressing "Enter" inside the box

    function sendFeedback() {
      const text = inputField.value.trim();

      // 1. Get User Name
      const user = localStorage.getItem('ocean_viewer_last_user') || "Anonymous";

      // 2. Prepare Webhook
      const WEBHOOK_URL = "https://discord.com/api/webhooks/1453131435522265291/1MrssyUuxkTWxOP_AP8rQMKqhpE3wxTQymN36evICSjpmF6AyUNzaTtYfq9q6YRGci2o";

      const payload = {
        content: `💬 **Comment from ${user}:** ${text}`
      };

      // 3. Send
      fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

      })

async function pollForUpdates() {
  try {
    // Ping index.json with a random string to force GitHub to give us the newest version
    const res = await fetch("index.json?nocache=" + Date.now());
    const data = await res.json();

    // Check if the SERVER has a timestamp, and if it differs from ours.
    // This allows the page to refresh even if our local timestamp was null (first run).
    if (data.last_updated && data.last_updated !== lastUpdateTimestamp) {
      console.log("New data detected! Reloading...");
      window.location.reload(); 
    }
  } catch (e) {
    console.error("Update check failed", e);
  }
}

// Check for updates every 60 seconds (1 minute)
setInterval(pollForUpdates, 60000);
