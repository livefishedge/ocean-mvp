  <style>

    #cursor-ring{
      position:fixed;
      top:-100px; left:-100px;
      width:44px; height:44px;
      border-radius:50%;
      background:rgba(160,190,210,0.18);
      border:2px solid rgba(160,190,210,0.60);

      z-index:9999;
      display:block; /* default visible, JS can hide */
      transform:translate(-50%,-50%);
      transition:opacity 0.15s, left 0s, top 0s;
      /* Force GPU acceleration for smooth following */

      -webkit-backface-visibility:hidden;

<script>
const REGIONS = {
  usec_south: { label: "US East Coast - South-Atlantic", index: "index-usec_south.json" },
  usec_md: { label: "US East Coast - Mid-Atlantic", index: "index-usec_md.json" }
};
let regionId = new URLSearchParams(location.search).get("region") || "usec_south";
if (!REGIONS[regionId]) regionId = "usec_south";
let bbox = [-81,31,-71,40];
let frames = [];
let frameData = [];
let sourceFrameCount = 0;
let landTrace = null;
let mode = "animation";
let playing = false;
let playTimer = null;
let frameIdx = 0;
let dailyFrames = []; // {date: "YYYY-MM-DD", t: ms, item}[]

const plot = document.getElementById("plot");
const statusEl = document.getElementById("status");
const readoutEl = document.getElementById("readout");
const cursorRing = document.getElementById("cursor-ring");
const regionSelect = document.getElementById("region-select");
const animationBtn = document.getElementById("mode-animation");
const dailyBtn = document.getElementById("mode-daily");
const overlayBtn = document.getElementById("mode-overlay");
const playBtn = document.getElementById("play-btn");
const hamburgerBtn = document.getElementById("hamburger-btn");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");
const frameTimeEl = document.getElementById("frame-time");
const frontsLabel = document.getElementById("fronts-label");
const menuPanel = document.getElementById("menu-panel");
const menuRegionSelect = document.getElementById("menu-region-select");
const productSelect = document.getElementById("product-select");
regionSelect.value = regionId;
menuRegionSelect.value = regionId;
productSelect.value = "thermal_fronts";

const PLACE_LABELS = [
  {type:"city", name:"New York", lon:-74.0060, lat:40.7128},
  {type:"city", name:"Philadelphia", lon:-75.1652, lat:39.9526},
  {type:"city", name:"Atlantic City", lon:-74.4229, lat:39.3643},
  {type:"city", name:"Baltimore", lon:-76.6122, lat:39.2904},
  {type:"city", name:"Washington DC", lon:-77.0369, lat:38.9072},
  {type:"city", name:"Norfolk", lon:-76.2859, lat:36.8508},
  {type:"city", name:"Virginia Beach", lon:-75.9780, lat:36.8529},
  {type:"city", name:"Wilmington", lon:-77.9447, lat:34.2257},
  {type:"city", name:"Myrtle Beach", lon:-78.8867, lat:33.6891},
  {type:"city", name:"Charleston", lon:-79.9311, lat:32.7765},
  {type:"city", name:"Savannah", lon:-81.0998, lat:32.0809},
  {type:"port", name:"Montauk", lon:-71.9448, lat:41.0359},
  {type:"port", name:"Brielle / Manasquan", lon:-74.0565, lat:40.1079},
  {type:"port", name:"Barnegat Light", lon:-74.1065, lat:39.7576},
  {type:"port", name:"Cape May", lon:-74.9060, lat:38.9351},
  {type:"port", name:"Ocean City MD", lon:-75.0849, lat:38.3365},
  {type:"port", name:"Wachapreague", lon:-75.6896, lat:37.6057},
  {type:"port", name:"Oregon Inlet", lon:-75.5488, lat:35.7957},
  {type:"port", name:"Hatteras", lon:-75.6902, lat:35.2196},
  {type:"port", name:"Morehead City", lon:-76.7260, lat:34.7229},
  {type:"port", name:"Beaufort NC", lon:-76.6638, lat:34.7182},
  {type:"port", name:"Wrightsville Beach", lon:-77.7950, lat:34.2085},
  {type:"port", name:"Little River", lon:-78.6142, lat:33.8732},
  {type:"port", name:"Georgetown", lon:-79.2945, lat:33.3768},
  {type:"port", name:"Charleston Harbor", lon:-79.9237, lat:32.7810},
  {type:"spot", name:"Wilmington Canyon", lon:-73.60, lat:38.10},
  {type:"spot", name:"Norfolk Canyon", lon:-74.80, lat:36.90},
  {type:"spot", name:"Cape May Rim", lon:-74.40, lat:38.90},
  {type:"spot", name:"Polar Fork", lon:-72.80, lat:38.70},
  {type:"spot", name:"Saxon State", lon:-73.40, lat:38.00},
  {type:"spot", name:"Northern Rim", lon:-73.00, lat:38.60}
];

function framePathOf(f){ return String(f?.json_path || f?.path || f?.file || f?.url || f?.json || ""); }
function parseFrameTime(f) {
  if (f?.time_iso) {
    const dt = new Date(f.time_iso);
    if (!Number.isNaN(dt.getTime())) return dt.getTime();
  }
  const fn = framePathOf(f).split("/").pop() || "";
  const m = fn.match(/^sstfront_.*?_(\d{4})(\d{3})_(\d{8})_(\d{2})_/);
  if (!m) return null;
  const y = Number(m[3].slice(0,4));
  const mo = Number(m[3].slice(4,6)) - 1;
  const d = Number(m[3].slice(6,8));
  return Date.UTC(y, mo, d, Number(m[4]), 0, 0);
}
function formatAge(ms, latestMs) {
  const mins = Math.max(0, Math.round((latestMs - ms) / 6e4));
  if (mins < 60) return `${mins} mins ago`;
  const hours = Math.round(mins / 60);
  if (hours < 48) return `${hours}h ago`;
  return `${Math.round(hours / 24)}d ago`;
}
function colorForAge(ms, latestMs, oldestMs) {
  const span = Math.max(1, latestMs - oldestMs);
  const t = Math.max(0, Math.min(1, (ms - oldestMs) / span));
  const hue = 210 - 190 * t;
  return `hsl(${hue}, 92%, 56%)`;
}
function appendSegmentedLine(lineX, lineY, coords, maxJumpDeg = 0.08) {
  let prev = null;
  for (const pt of coords) {
    if (!Array.isArray(pt) || pt.length < 2) continue;
    const lon = Number(pt[0]);
    const lat = Number(pt[1]);
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
    if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > maxJumpDeg) {
      lineX.push(null);
      lineY.push(null);
    }
    lineX.push(lon);
    lineY.push(lat);
    prev = [lon, lat];
  }
  lineX.push(null);
  lineY.push(null);
}
function lineLength(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) {
    const a = coords[i - 1], b = coords[i];
    if (!Array.isArray(a) || !Array.isArray(b)) continue;
    d += Math.hypot(Number(b[0]) - Number(a[0]), Number(b[1]) - Number(a[1]));
  }
  return d;
}
function labelPoint(coords) {
  if (!coords.length) return null;
  return coords[Math.floor(coords.length / 2)];
}
function placeInRegion(p) {
  const [w, s, e, n] = bbox.map(Number);
  return p.lon >= w && p.lon <= e && p.lat >= s && p.lat <= n;
}
function placeTrace(type) {
  const pts = PLACE_LABELS.filter(p => p.type === type && placeInRegion(p));
  const isPort = type === "port";
  const isSpot = type === "spot";
  return {
    type:"scatter",
    mode:"markers+text",
    x: pts.map(p => p.lon),
    y: pts.map(p => p.lat),
    text: pts.map(p => p.name),
    textposition: isSpot ? "top center" : isPort ? "bottom center" : "top center",
    textfont:{ size:13, color:isSpot ? "#ffb000" : isPort ? "#ffe066" : "#ffffff" },
    marker:{ size:isSpot ? 10 : isPort ? 8 : 7, color:isSpot ? "#ff6b35" : isPort ? "#ffb000" : "#7bdff2", symbol:isSpot ? "star" : isPort ? "diamond" : "circle", line:{ color:"#000", width:2 } },
    hovertemplate:"%{text}<extra></extra>",
    showlegend:false,
    name:type
  };
}
function baseTraces() {
  const traces = [];
  if (landTrace) traces.push(landTrace);
  for (const type of ["city", "port", "spot"]) {
    const trace = placeTrace(type);
    if (trace.x.length) traces.push(trace);
  }
  return traces;
}
function tracesForFrames(items, labelEveryFrame = true) {
  const latestMs = frames.at(-1)?.t ?? Date.now();
  const oldestMs = frames[0]?.t ?? latestMs;
  const traces = [];
  for (const item of items) {
    const age = formatAge(item.t, latestMs);
    const color = colorForAge(item.t, latestMs, oldestMs);
    const lineX = [], lineY = [], labelX = [], labelY = [], labels = [];
    const textArr = []; // one entry per line point
    const features = Array.isArray(item.data?.features) ? item.data.features : [];
    const candidates = [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      if (!Array.isArray(coords) || coords.length < 2) continue;
      const props = feature?.properties || {};
      const gradient = props.gradient_per_km != null ? Number(props.gradient_per_km) : null;
      const lengthKm = props.length_km != null ? Number(props.length_km) : null;
      // gradient_per_km is the physically correct perpendicular SST gradient (°C/km)
      // Computed from raw SST: step-function ΔSST / front_cross_distance
      // gradient_per_km is the perpendicular SST gradient in °C/km (computed from step-function cross-section)
      // length_km not shown per Mike's request
      const parts = [];
      if (gradient != null) parts.push(`${gradient.toFixed(3)} °C/km`);
      const segText = parts.join(' | ');
      candidates.push({ coords, length: lengthKm || lineLength(coords), props });
      let prev = null;
      for (const pt of coords) {
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const lon = Number(pt[0]);
        const lat = Number(pt[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
        if (prev && Math.hypot(lon - prev[0], lat - prev[1]) > 0.08) {
          lineX.push(null); lineY.push(null); textArr.push(null);
        }
        lineX.push(lon); lineY.push(lat); textArr.push(segText);
        prev = [lon, lat];
      }
      lineX.push(null); lineY.push(null); textArr.push(null);
    }
    traces.push({
      type:"scatter", mode:"lines", x:lineX, y:lineY,
      text: textArr,
      line:{ color, width: labelEveryFrame ? 2.2 : 1.5 },
      hovertemplate:`%{text}<extra></extra>`,
      showlegend:false
    });
  }
  return traces;
}
function layout(title) {
  return {
    title:{ text:title, x:0.5, font:{ size:16, color:"#e0e6ee" } },
    margin:{ l:0, r:0, t:58, b:0 },
    paper_bgcolor:"#050b10",
    plot_bgcolor:"#f8fbff",
    font:{ color:"#e0e6ee" },
    xaxis:{ range:[bbox[0], bbox[2]], showgrid:false, zeroline:false, fixedrange:false },
    yaxis:{ range:[bbox[1], bbox[3]], showgrid:false, zeroline:false, fixedrange:false },
    dragmode:"pan",
    uirevision:false
  };
}
function plotConfig() {
  return {
    responsive:true,
    displayModeBar:true,
    displaylogo:false,
    scrollZoom:true,
    doubleClick:"reset",
    modeBarButtonsToRemove:["lasso2d", "select2d"]
  };
}
async function prepareLandMask(indexMeta) {
  try {
    const path = indexMeta?.region_meta?.bathy_path || "gebco_bath_latest/gebco_bathy.json";
    const res = await fetch(`data/${regionId}/${path}?t=${Date.now()}`);
    if (!res.ok) return;
    const bathy = await res.json();
    const depth = bathy.depth || bathy.z || [];
    const zMask = depth.map(row => row.map(v => Number.isFinite(Number(v)) && Number(v) <= 0 ? 1 : null));
    landTrace = {
      type:"heatmap",
      x:bathy.xAxis || bathy.x || [],
      y:bathy.yAxis || bathy.y || [],
      z:zMask,
      colorscale:[[0, "#c9d0d6"], [1, "#c9d0d6"]],
      zmin:0,
      zmax:1,
      showscale:false,
      hoverinfo:"skip",
      name:"Land"
    };
  } catch (err) {
    console.warn("Land mask failed", err);
  }
}
async function render() {
  installReadoutHandlers();
  const basemap = baseTraces();
  if (!frameData.length) {
    statusEl.textContent = "No thermal-front frames available for this region.";
    await Plotly.react(plot, basemap, layout("Thermal fronts"), plotConfig());
    return;
  }
  if (mode === "overlay") {
    const traces = basemap.concat(tracesForFrames(frameData, false));
    statusEl.textContent = `${frameData.length} front-bearing frames across ${Math.round((frames.at(-1).t - frames[0].t)/864e5)||1} days`;
    await Plotly.react(plot, traces, layout("Thermal fronts: all available frames"), plotConfig());
    return;
  }
  if (mode === "daily") {
    if (!dailyFrames.length) buildDailyFrames();
    frameIdx = Math.max(0, Math.min(frameIdx, dailyFrames.length - 1));
    const dayItem = dailyFrames[frameIdx];
    const allThatDay = frameData.filter(item => {
      const d = new Date(item.t);
      const dateStr = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
      return dateStr === dayItem.date;
    });
    const traces = basemap.concat(tracesForFrames(allThatDay, false));
    statusEl.textContent = `${frameIdx+1}/${dailyFrames.length} daily frames • ${dayItem.date}`;
    await Plotly.react(plot, traces, layout(`Thermal fronts: ${dayItem.date}`), plotConfig());
    return;
  }
  frameIdx = Math.max(0, Math.min(frameIdx, frameData.length - 1));
  const item = frameData[frameIdx];
  const traces = basemap.concat(tracesForFrames([item], true));
  statusEl.textContent = `${frameIdx + 1}/${frameData.length} front-bearing • ${new Date(item.t).toLocaleString()} • ${formatAge(item.t, frames.at(-1).t)} before latest`;
  await Plotly.react(plot, traces, layout("Thermal fronts: animation"), plotConfig());
  updateNavBar();
}
function setMode(next) {
  mode = next;
  animationBtn.classList.toggle("active", mode === "animation");
  dailyBtn.classList.toggle("active", mode === "daily");
  overlayBtn.classList.toggle("active", mode === "overlay");
  playBtn.disabled = mode !== "animation" || frameData.length <= 1;
  if (mode !== "animation") setPlaying(false);
  document.getElementById("daily-slider-row").classList.toggle("visible", mode === "daily");
  if (mode === "daily") {
    buildDailyFrames();
    updateDailySlider();
  }
  render();
  updateNavBar();
}
function updateNavBar() {
  const latestMs = frames.at(-1)?.t ?? Date.now();
  if (mode === "daily") {
    const dayItem = dailyFrames[frameIdx];
    frameTimeEl.textContent = dayItem ? dayItem.date : "";
    prevBtn.disabled = frameData.length <= 1;
    nextBtn.disabled = frameData.length <= 1;
  } else if (mode === "animation") {
    const item = frameData[frameIdx];
    frameTimeEl.textContent = item ? new Date(item.t).toLocaleString(undefined, {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
    prevBtn.disabled = frameData.length <= 1;
    nextBtn.disabled = frameData.length <= 1;
  } else {
    frameTimeEl.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
  }
  if (frames.length) {
    const latestFrame = frames.at(-1);
    frontsLabel.textContent = `Fronts ${formatAge(latestFrame.t, latestMs)}`;
  }
}
const dailySliderEl = document.getElementById("daily-slider");

function updateDailySlider() {
  if (!dailySliderEl || !dailyFrames.length) return;
  dailySliderEl.min = 0;
  dailySliderEl.max = dailyFrames.length - 1;
  dailySliderEl.value = frameIdx;
}

function buildDailyFrames() {
  dailyFrames = [];
  const seen = new Set();
  const sorted = [...frameData].sort((a,b) => a.t - b.t);
  for (const item of sorted) {
    const d = new Date(item.t);
    const dateStr = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
    if (!seen.has(dateStr)) {
      seen.add(dateStr);
      dailyFrames.push({ date: dateStr, t: item.t, item });
    }
  }
}
function step(delta) {
  if (!frameData.length) return;
  frameIdx = (frameIdx + delta + frameData.length) % frameData.length;
  render();
}
function setPlaying(on) {
  playing = on;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playTimer) clearInterval(playTimer);
  playTimer = playing ? setInterval(() => step(1), 750) : null;
}
async function init() {
  const idxRes = await fetch(REGIONS[regionId].index + "?t=" + Date.now());
  if (!idxRes.ok) throw new Error(`Failed to load ${REGIONS[regionId].index}`);
  const idx = await idxRes.json();
  if (idx.region_meta?.bbox?.length >= 4) bbox = idx.region_meta.bbox.map(Number);
  await prepareLandMask(idx);
  frames = ((idx.frames || idx.frames_by_var || {}).sst_front || [])
    .map(f => ({ ...f, t: parseFrameTime(f) }))
    .filter(f => Number.isFinite(f.t))
    .sort((a,b) => a.t - b.t);
  const latest = frames.at(-1)?.t;
  if (latest) frames = frames.filter(f => latest - f.t <= 21 * 864e5);
  sourceFrameCount = frames.length;
  frameData = await Promise.all(frames.map(async f => {
    const res = await fetch(framePathOf(f));
    return { meta:f, t:f.t, data: res.ok ? await res.json() : { features:[] } };
  }));
  frameData = frameData.filter(item => Array.isArray(item.data?.features) && item.data.features.length > 0);
  frameIdx = Math.max(0, frameData.length - 1);
  await render();
}
regionSelect.addEventListener("change", () => {
  const url = new URL(location.href);
  url.searchParams.set("region", regionSelect.value);
  location.href = url.toString();
});
hamburgerBtn.addEventListener("click", () => menuPanel.classList.toggle("open"));
menuRegionSelect.addEventListener("change", () => {
  const url = new URL(location.href);
  url.searchParams.set("region", menuRegionSelect.value);
  location.href = url.toString();
});
productSelect.addEventListener("change", () => {
  if (productSelect.value === "thermal_fronts") return;
  const url = new URL("index.html", location.href);
  url.searchParams.set("region", regionId);
  url.searchParams.set("var", productSelect.value);
  location.href = url.toString();
});
animationBtn.addEventListener("click", () => setMode("animation"));
dailyBtn.addEventListener("click", () => setMode("daily"));
overlayBtn.addEventListener("click", () => setMode("overlay"));
playBtn.addEventListener("click", () => setPlaying(!playing));
if (prevBtn) prevBtn.addEventListener("click", () => { setPlaying(false); step(-1); });
if (nextBtn) nextBtn.addEventListener("click", () => { setPlaying(false); step(+1); });
if (dailySliderEl) {
  dailySliderEl.addEventListener("input", () => {
    const idx = Number(dailySliderEl.value);
    frameIdx = idx;
    setPlaying(false);
    render();
    updateNavBar();
  });
}
window.addEventListener("resize", () => { try { Plotly.Plots.resize(plot); } catch(_){} });
let _readoutHooked = false;

function setReadout(txt) {
  if (!readoutEl) return;
  readoutEl.textContent = txt || "";
  readoutEl.style.display = txt ? "inline-block" : "none";
}

function onCursorMove(ev) {
  const rect = plot.getBoundingClientRect();
  const [w, s, e, n] = bbox;
  const mouseLon = w + (ev.clientX - rect.left) / rect.width * (e - w);
  const mouseLat = s + (ev.clientY - rect.top) / rect.height * (n - s);
  let best = null;
  let bestDist = Infinity;
  for (const item of frames) {
    const features = Array.isArray(item.data?.features) ? item.data.features : [];
    for (const feature of features) {
      const coords = feature?.geometry?.coordinates || [];
      const props = feature?.properties || {};
      for (const pt of coords) {
        if (!Array.isArray(pt) || pt.length < 2) continue;
        const dist = Math.hypot(pt[0] - mouseLon, pt[1] - mouseLat);
        if (dist < bestDist) { bestDist = dist; best = props; }
      }
    }
  }
  if (bestDist < 0.15) {
    const g = best?.gradient_per_km;
    if (g != null) {
      setReadout(`${Number(g).toFixed(3)} °C/km`);
    } else {
      setReadout(`${mouseLat.toFixed(3)}°N ${mouseLon.toFixed(3)}°W`);
    }
  } else {
    setReadout(`${mouseLat.toFixed(3)}°N ${mouseLon.toFixed(3)}°W`);
  }
}

function showCursorRing(clientX, clientY) {
  if (!cursorRing) return;
  cursorRing.style.left = clientX + 'px';
  cursorRing.style.top = clientY + 'px';
  cursorRing.style.display = 'block';
}

function installReadoutHandlers() {
  if (_readoutHooked) return;
  _readoutHooked = true;

  // Show ring cursor on desktop
  plot.addEventListener('mousemove', (ev) => {
    showCursorRing(ev.clientX, ev.clientY);
    onCursorMove(ev);
  });
  plot.addEventListener('mouseleave', () => {
    if (cursorRing) cursorRing.style.display = 'none';
    setReadout('');
  });

  // Mobile: tap = show readout + cursor ring
  plot.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    const touch = ev.touches[0];
    if (touch) {
      // Move ring to touch point immediately (before potential scroll)
      const ring = cursorRing;
      if (ring) {
        ring.style.left = touch.clientX + 'px';
        ring.style.top = touch.clientY + 'px';
        ring.style.display = 'block';
      }
      // Fire readout update
      onCursorMove({ clientX: touch.clientX, clientY: touch.clientY });
    }
  }, { passive: false });

  // Mobile: touchmove for continuous readout while dragging
  plot.addEventListener('touchmove', (ev) => {
    ev.preventDefault();
    const touch = ev.touches[0];
    if (touch) {
      showCursorRing(touch.clientX, touch.clientY);
      onCursorMove({ clientX: touch.clientX, clientY: touch.clientY });
    }
  }, { passive: false });

  plot.addEventListener('touchend', () => {
    // Keep readout visible after tap — don't clear it
    if (cursorRing) cursorRing.style.display = 'none';
    // setReadout(''); // REMOVED: user needs to see what they tapped
  });
}

init().catch(err => {
  console.error(err);
  statusEl.textContent = err.message;
});
</script>
