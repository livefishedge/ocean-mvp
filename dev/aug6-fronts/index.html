<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aug 6 SST Fronts — dev site</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin:0; padding:0; height:100%; font-family:-apple-system, system-ui, sans-serif; background:#0e1117; color:#e6e6e6; }
    #app { display:flex; height:100vh; }
    #sidebar { width:280px; background:#161b22; border-right:1px solid #30363d; padding:12px; overflow-y:auto; }
    #sidebar h1 { font-size:16px; margin:0 0 12px; }
    #map { flex:1; height:100%; }
    .hour-btn { display:block; width:100%; padding:6px 8px; margin-bottom:4px; background:#0e1117;
                color:#e6e6e6; border:1px solid #30363d; border-radius:4px; cursor:pointer; text-align:left; font-size:13px; }
    .hour-btn:hover { background:#1f2937; }
    .hour-btn.active { background:#1f6feb; border-color:#1f6feb; color:white; }
    .hour-btn small { color:#7d8590; font-size:11px; }
    .hour-btn.active small { color:#c9d1d9; }
    #legend { position:absolute; bottom:12px; left:12px; background:rgba(14,17,23,0.9);
              padding:10px 12px; border:1px solid #30363d; border-radius:6px; font-size:12px; z-index:1000; }
    #legend .swatch { display:inline-block; width:80px; height:8px; vertical-align:middle; margin-left:8px; }
    #info { position:absolute; top:12px; right:12px; background:rgba(14,17,23,0.92);
            padding:10px 14px; border:1px solid #30363d; border-radius:6px;
            font-size:12px; max-width:380px; max-height:80vh; overflow:auto; z-index:1000; display:none; }
    #info h3 { margin:0 0 6px; font-size:13px; color:#58a6ff; }
    #info table { width:100%; border-collapse:collapse; font-size:11px; }
    #info th, #info td { padding:2px 6px; border-bottom:1px solid #21262d; text-align:left; }
    #info th { color:#7d8590; font-weight:500; }
    .grad-strong { color:#ff7b72; font-weight:600; }
    .grad-mod { color:#d2a8ff; }
    .grad-weak { color:#7d8590; }
    .vertex-table { margin-top:8px; max-height:200px; overflow:auto; font-size:10px; font-family:monospace; }
    .meta { color:#7d8590; font-size:11px; margin-top:6px; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Aug 6 SST Fronts</h1>
    <div style="font-size:12px; color:#7d8590; margin-bottom:12px;">usec_md · 24 hours · click a front for readout</div>
    <div id="hours"></div>
  </div>
  <div id="map"></div>
</div>
<div id="legend">
  Front gradient (°C/km, max per front)
  <span class="swatch" id="legend-bar"></span>
  <div style="margin-top:4px;"><span style="color:#7d8590;">0</span> &nbsp; <span style="color:#7d8590; float:right;" id="legend-max"></span></div>
</div>
<div id="info"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUMMARIES = [{"hour": 0, "n_fronts": 25, "n_valid_sst_pct": 73.75, "sst_png": "sst/aug6_00.png", "fronts_geojson": "data/h00/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.143, "sst_max_p99": 29.29, "strongest_gradient": 1.7453}, {"hour": 1, "n_fronts": 22, "n_valid_sst_pct": 72.61, "sst_png": "sst/aug6_01.png", "fronts_geojson": "data/h01/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.174, "sst_max_p99": 29.084, "strongest_gradient": 1.454}, {"hour": 2, "n_fronts": 25, "n_valid_sst_pct": 74.11, "sst_png": "sst/aug6_02.png", "fronts_geojson": "data/h02/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.194, "sst_max_p99": 29.05, "strongest_gradient": 1.9072}, {"hour": 3, "n_fronts": 26, "n_valid_sst_pct": 74.14, "sst_png": "sst/aug6_03.png", "fronts_geojson": "data/h03/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.2, "sst_max_p99": 28.985, "strongest_gradient": 1.5235}, {"hour": 4, "n_fronts": 24, "n_valid_sst_pct": 72.4, "sst_png": "sst/aug6_04.png", "fronts_geojson": "data/h04/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.197, "sst_max_p99": 28.932, "strongest_gradient": 1.6227}, {"hour": 5, "n_fronts": 23, "n_valid_sst_pct": 69.32, "sst_png": "sst/aug6_05.png", "fronts_geojson": "data/h05/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.255, "sst_max_p99": 28.949, "strongest_gradient": 1.3557}, {"hour": 6, "n_fronts": 23, "n_valid_sst_pct": 65.27, "sst_png": "sst/aug6_06.png", "fronts_geojson": "data/h06/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.366, "sst_max_p99": 29.037, "strongest_gradient": 1.043}, {"hour": 7, "n_fronts": 21, "n_valid_sst_pct": 63.37, "sst_png": "sst/aug6_07.png", "fronts_geojson": "data/h07/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.332, "sst_max_p99": 29.063, "strongest_gradient": 1.3998}, {"hour": 8, "n_fronts": 14, "n_valid_sst_pct": 64.98, "sst_png": "sst/aug6_08.png", "fronts_geojson": "data/h08/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.246, "sst_max_p99": 29.12, "strongest_gradient": 1.1208}, {"hour": 9, "n_fronts": 17, "n_valid_sst_pct": 69.12, "sst_png": "sst/aug6_09.png", "fronts_geojson": "data/h09/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.162, "sst_max_p99": 29.074, "strongest_gradient": 1.4595}, {"hour": 10, "n_fronts": 22, "n_valid_sst_pct": 71.14, "sst_png": "sst/aug6_10.png", "fronts_geojson": "data/h10/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.123, "sst_max_p99": 29.107, "strongest_gradient": 1.4815}, {"hour": 11, "n_fronts": 16, "n_valid_sst_pct": 74.28, "sst_png": "sst/aug6_11.png", "fronts_geojson": "data/h11/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.074, "sst_max_p99": 29.162, "strongest_gradient": 1.6784}, {"hour": 12, "n_fronts": 24, "n_valid_sst_pct": 76.63, "sst_png": "sst/aug6_12.png", "fronts_geojson": "data/h12/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.091, "sst_max_p99": 29.227, "strongest_gradient": 2.0234}, {"hour": 13, "n_fronts": 29, "n_valid_sst_pct": 77.31, "sst_png": "sst/aug6_13.png", "fronts_geojson": "data/h13/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.139, "sst_max_p99": 29.287, "strongest_gradient": 2.6994}, {"hour": 14, "n_fronts": 34, "n_valid_sst_pct": 77.12, "sst_png": "sst/aug6_14.png", "fronts_geojson": "data/h14/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.184, "sst_max_p99": 29.309, "strongest_gradient": 2.946}, {"hour": 15, "n_fronts": 27, "n_valid_sst_pct": 76.97, "sst_png": "sst/aug6_15.png", "fronts_geojson": "data/h15/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.26, "sst_max_p99": 29.335, "strongest_gradient": 2.3709}, {"hour": 16, "n_fronts": 27, "n_valid_sst_pct": 75.54, "sst_png": "sst/aug6_16.png", "fronts_geojson": "data/h16/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.345, "sst_max_p99": 29.401, "strongest_gradient": 2.3929}, {"hour": 17, "n_fronts": 26, "n_valid_sst_pct": 72.05, "sst_png": "sst/aug6_17.png", "fronts_geojson": "data/h17/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.478, "sst_max_p99": 29.408, "strongest_gradient": 2.4977}, {"hour": 18, "n_fronts": 21, "n_valid_sst_pct": 68.49, "sst_png": "sst/aug6_18.png", "fronts_geojson": "data/h18/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.581, "sst_max_p99": 29.351, "strongest_gradient": 2.6185}, {"hour": 19, "n_fronts": 21, "n_valid_sst_pct": 67.65, "sst_png": "sst/aug6_19.png", "fronts_geojson": "data/h19/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.634, "sst_max_p99": 29.336, "strongest_gradient": 1.7322}, {"hour": 20, "n_fronts": 24, "n_valid_sst_pct": 69.49, "sst_png": "sst/aug6_20.png", "fronts_geojson": "data/h20/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.706, "sst_max_p99": 29.338, "strongest_gradient": 3.8187}, {"hour": 21, "n_fronts": 21, "n_valid_sst_pct": 71.28, "sst_png": "sst/aug6_21.png", "fronts_geojson": "data/h21/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.702, "sst_max_p99": 29.372, "strongest_gradient": 3.6958}, {"hour": 22, "n_fronts": 28, "n_valid_sst_pct": 73.03, "sst_png": "sst/aug6_22.png", "fronts_geojson": "data/h22/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.639, "sst_max_p99": 29.538, "strongest_gradient": 2.5515}, {"hour": 23, "n_fronts": 30, "n_valid_sst_pct": 75.94, "sst_png": "sst/aug6_23.png", "fronts_geojson": "data/h23/fronts.geojson", "bbox": [-76.5, 35.5, -71.52000000000099, 40.48000000000078], "sst_min_p1": 24.548, "sst_max_p99": 29.678, "strongest_gradient": 2.7578}];
const MAX_PEAK = 3.8187;
const MAP = L.map('map', {zoomControl:true}).setView([38, -74], 7);
L.tileLayer('', {maxZoom:18}).addTo(MAP); // no basemap, SST is the basemap

let sstLayer = null, frontsLayer = null;

function colorForGrad(g) {
  if (g === null || g === undefined) return '#7d8590';
  // Map 0..MAX_PEAK to a red→yellow gradient
  const t = Math.min(1, g / MAX_PEAK);
  const r = Math.round(255);
  const gg = Math.round(255 * (1 - t * 0.6));
  const b = Math.round(80 * (1 - t));
  return `rgb(${r},${gg},${b})`;
}

function fmtNum(v, d=3) { return (v===null||v===undefined) ? 'n/a' : v.toFixed(d); }

function showFrontInfo(props) {
  const info = document.getElementById('info');
  let strengthClass = 'grad-weak';
  if (props.gradient_max !== null && props.gradient_max >= 0.8) strengthClass = 'grad-strong';
  else if (props.gradient_max !== null && props.gradient_max >= 0.3) strengthClass = 'grad-mod';
  const pv = props.per_vertex || {};
  const lons = pv.lon || [], lats = pv.lat || [], grads = pv.gradient || [], dss = pv.delta_sst || [];
  let vertexRows = '';
  for (let i = 0; i < lons.length; i++) {
    const g = grads[i], ds = dss[i];
    vertexRows += `<tr><td>${i}</td><td>${lons[i].toFixed(3)}</td><td>${lats[i].toFixed(3)}</td>` +
                  `<td class="${g!==null&&g>=0.8?'grad-strong':g!==null&&g>=0.3?'grad-mod':'grad-weak'}">${fmtNum(g,3)}</td>` +
                  `<td>${fmtNum(ds,2)}</td></tr>`;
  }
  info.innerHTML = `
    <h3>Front #${props.front_id}</h3>
    <div style="font-size:11px; color:#7d8590;">${props.vertex_count} vertices · ${props.length_km.toFixed(2)} km · ${props.pixel_count} px</div>
    <table style="margin-top:6px;">
      <tr><th>Metric</th><th>gradient (°C/km)</th><th>ΔSST (°C)</th></tr>
      <tr><td>mean</td><td class="${strengthClass}">${fmtNum(props.gradient_mean,4)}</td><td>${fmtNum(props.delta_mean,3)}</td></tr>
      <tr><td>max</td><td class="${strengthClass}">${fmtNum(props.gradient_max,4)}</td><td>${fmtNum(props.delta_max,3)}</td></tr>
      <tr><td>min</td><td>${fmtNum(props.gradient_min,4)}</td><td>${fmtNum(props.delta_min,3)}</td></tr>
    </table>
    <div class="meta">Click anywhere on map to dismiss</div>
    <div class="vertex-table">
      <table>
        <tr><th>v</th><th>lon</th><th>lat</th><th>grad</th><th>ΔSST</th></tr>
        ${vertexRows}
      </table>
    </div>
  `;
  info.style.display = 'block';
}

MAP.on('click', () => { document.getElementById('info').style.display = 'none'; });

function loadHour(hh) {
  const s = SUMMARIES[hh];
  document.querySelectorAll('.hour-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.hour-btn[data-hh="${hh}"]`)?.classList.add('active');
  if (sstLayer) MAP.removeLayer(sstLayer);
  if (frontsLayer) MAP.removeLayer(frontsLayer);
  document.getElementById('info').style.display = 'none';

  const [lonMin, latMin, lonMax, latMax] = s.bbox;
  const bounds = [[latMin, lonMin], [latMax, lonMax]];
  sstLayer = L.imageOverlay(s.sst_png, bounds, {opacity:0.92, interactive:false});
  sstLayer.addTo(MAP);
  MAP.fitBounds(bounds, {padding:[20,20]});

  fetch(s.fronts_geojson).then(r => r.json()).then(gj => {
    frontsLayer = L.geoJSON(gj, {
      style: f => ({
        color: colorForGrad(f.properties.strength_for_color),
        weight: 2.5,
        opacity: 0.95,
        lineCap: 'round',
      }),
      onEachFeature: (f, layer) => {
        layer.on('click', e => {
          L.DomEvent.stopPropagation(e);
          showFrontInfo(f.properties);
        });
        layer.bindTooltip(
          `Front #${f.properties.front_id} · ${f.properties.vertex_count}v · max ${f.properties.gradient_max?.toFixed(3)} °C/km`,
          {sticky:true, direction:'top', className:'front-tip'}
        );
      }
    }).addTo(MAP);
  });
}

const hoursDiv = document.getElementById('hours');
SUMMARIES.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'hour-btn';
  btn.dataset.hh = s.hour;
  const time = `${String(s.hour).padStart(2,'0')}:00 UTC`;
  btn.innerHTML = `${time} <small>${s.n_fronts} fronts · peak ${s.strongest_gradient.toFixed(2)} °C/km</small>`;
  btn.onclick = () => loadHour(s.hour);
  hoursDiv.appendChild(btn);
});

// Default: pick the hour with the most fronts (usually 12:00 UTC, noon)
const bestHour = SUMMARIES.reduce((a,b) => (b.n_fronts > a.n_fronts ? b : a), SUMMARIES[0]);
loadHour(bestHour.hour);

// Legend gradient
const legendBar = document.getElementById('legend-bar');
legendBar.style.background = `linear-gradient(to right, rgb(255,255,80), rgb(255,80,80))`;
document.getElementById('legend-max').textContent = `${MAX_PEAK.toFixed(2)} °C/km`;
</script>
</body>
</html>
