<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ocean MVP — Login</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #050b10; --fg: #e0e6ee; --accent: #1a7f7a; --accent2: #2dd4bf; --panel: rgba(5,11,16,0.95); --border: #1b2836; --err: #ff6b6b; --success: #2dd4bf; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    #login-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px 36px; max-width: 400px; width: 90%;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--accent2); }
    .subtitle { font-size: 13px; color: #7a8fa6; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--fg); }
    input[type="email"], .auth-input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: #0c1723; color: var(--fg);
      font-size: 14px; outline: none; margin-bottom: 12px;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; padding: 11px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s; margin-top: 4px;
    }
    button:hover { background: #1a9e92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; border: 1px solid var(--border); color: var(--fg);
      margin-top: 8px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }
    #msg {
      margin-top: 14px; font-size: 13px; text-align: center; min-height: 20px;
    }
    .success { color: #2dd4bf; }
    .error { color: #f87171; }
    .register-link { font-size: 12px; text-align: center; margin-top: 16px; opacity: 0.6; }
    .register-link a { color: var(--accent2); text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
    .field-error { font-size: 0.75rem; color: var(--err); margin-top: -8px; margin-bottom: 8px; }
    .pw-wrap { position: relative; margin-bottom: 12px; }
    .pw-wrap .auth-input { margin-bottom: 0; padding-right: 46px; }
    .pw-wrap .pw-toggle {
      all: unset;
      position: absolute; top: 1px; right: 1px; bottom: 1px;
      width: 42px; display: flex; align-items: center; justify-content: center;
      border-radius: 0 7px 7px 0; color: #7a8fa6; cursor: pointer;
      background: transparent !important; box-sizing: border-box;
      z-index: 2; touch-action: manipulation;
    }
    .pw-wrap .pw-toggle:hover { color: var(--fg); }
    .pw-wrap .pw-toggle:focus-visible { outline: 2px solid var(--accent2); outline-offset: -3px; }
    .pw-wrap .pw-toggle svg { width: 18px; height: 18px; display: block; }
  </style>
</head>
<body>
  <div id="login-card">
    <h1>Ocean MVP</h1>
    <p class="subtitle">Sign in to access your marine intelligence dashboard.</p>

    <form id="login-form" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="captain@example.com" required />

      <label for="password" style="margin-top:4px">Password</label>
      <div class="pw-wrap">
        <input class="auth-input" type="password" id="password" placeholder="Your password" required />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
          <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <div id="email-error" class="field-error" style="display:none"></div>
      <div id="pw-error" class="field-error" style="display:none"></div>

      <button type="submit" id="signin-btn">Sign in</button>
    </form>

    <div id="msg"></div>

    <div class="register-link">New here? <a href="register.html">Create an account</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js?v=20260531"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://wfdpfeptmyiqifgwqpzu.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_W6wnJkT70jb69JUZgM1dow_nabPZycR';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      function showMsg(msg, type) {
        const el = document.getElementById('msg');
        el.textContent = msg;
        el.className = type || '';
      }

      function clearErrors() {
        document.querySelectorAll('.field-error').forEach(el => { el.style.display = 'none'; el.textContent = ''; });
        document.querySelectorAll('input').forEach(el => el.style.borderColor = '');
      }

      function setFieldError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.style.display = 'block';
        const inputId = id === 'pw-error' ? 'password' : id.replace('-error', '');
        document.getElementById(inputId).style.borderColor = 'var(--err)';
      }

      async function enforceEmailVerification(session) {
        if (!session || session.user.email_confirmed_at) return true;
        await sb.auth.signOut();
        showMsg('Please verify your email before signing in.', 'error');
        return false;
      }

      // Redirect if already logged in
      try {
        if (sessionStorage.getItem('email_verification_required') === 'true') {
          sessionStorage.removeItem('email_verification_required');
          showMsg('Please verify your email before signing in.', 'error');
        }
      } catch(e) {}

      sb.auth.getSession().then(async ({ data: { session } }) => {
        if (session && await enforceEmailVerification(session)) window.location.replace('index.html');
      });

      // PostHog
      !function(){
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/posthog-js@4/dist/posthog.min.js';
        script.onload = function(){
          posthog.init('phc_vSJhhcgYknWa27Vydc2D3N8LxxPuTwJeKxYZXbLThwcF', {
            api_host: 'https://app.posthog.com',
            person_profiles: 'always',
            capture_pageview: true,
            autocapture: false,
          });
        };
        document.head.appendChild(script);
      }();

      // Password visibility toggle
      document.getElementById('pw-toggle').addEventListener('click', function(e) {
        e.preventDefault();
        var pw = document.getElementById('password');
        var open = document.getElementById('eye-open');
        var closed = document.getElementById('eye-closed');
        if (pw.type === 'password') {
          pw.type = 'text';
          open.style.display = 'none';
          closed.style.display = 'block';
        } else {
          pw.type = 'password';
          open.style.display = 'block';
          closed.style.display = 'none';
        }
        pw.focus();
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('signin-btn');

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setFieldError('email-error', 'Valid email required'); return;
        }
        if (!password) {
          setFieldError('pw-error', 'Password required'); return;
        }

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        showMsg('', '');

        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          showMsg(error.message || 'Sign in failed.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        if (!await enforceEmailVerification(data.session)) {
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        // If there's a pending profile from registration, create it now
        try {
          var pending = sessionStorage.getItem('pending_profile');
          if (pending) {
            var profile = JSON.parse(pending);
            sessionStorage.removeItem('pending_profile');
            sb.from('profiles')
              .update({ name: profile.name, phone: profile.phone, selected_region: profile.selected_region })
              .eq('user_id', data.user.id)
              .then(function() {});
          }
        } catch(e) {}

        showMsg('Signed in! Loading dashboard…', 'success');
        btn.textContent = 'Done';
        setTimeout(() => window.location.replace('index.html'), 600);
      });
    })();
  </script>
</body>
</html>
