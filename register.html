<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ocean MVP — Create Account</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #050b10; --fg: #e0e6ee; --accent: #1a7f7a; --accent2: #2dd4bf; --panel: rgba(5,11,16,0.97); --border: #1b2836; --err: #ff6b6b; --success: #2dd4bf; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; background: var(--bg); color: var(--fg); font-family: system-ui,-apple-system,"Segoe UI",sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #reg-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 36px 32px; max-width: 420px; width: 100%; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: var(--accent2); }
    .subtitle { font-size: 0.85rem; opacity: 0.6; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 0.8rem; margin-bottom: 4px; opacity: 0.8; }
    input, select { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--accent); }
    .field { margin-top: 14px; }
    #reg-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.15s; margin-top: 18px; }
    #reg-btn:hover { background: #1a9f96; }
    #reg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 0.82rem; margin-top: 10px; padding: 8px 12px; border-radius: 6px; display: none; }
    .msg.error { background: rgba(255,107,107,0.15); color: var(--err); display: block; }
    .msg.success { background: rgba(45,212,191,0.15); color: var(--success); display: block; }
    .field-error { font-size: 0.75rem; color: var(--err); margin-top: 3px; }
    .login-link { font-size: 0.85rem; text-align: center; margin-top: 16px; opacity: 0.6; }
    .login-link a { color: var(--accent2); text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
    .reqs { font-size: 0.72rem; opacity: 0.5; margin-top: 4px; line-height: 1.5; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 40px; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #7a8fa6;
      padding: 4px; display: flex; align-items: center;
    }
    .pw-toggle:hover { color: var(--fg); }
    .pw-toggle svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
<div id="reg-card">
  <h1>Create Account</h1>
  <p class="subtitle">Enter your info to access the dashboard. We'll send a verification email — confirm within 24 hours or the account is removed.</p>

  <form id="reg-form" novalidate>
    <div class="field">
      <label for="email">Email address *</label>
      <input id="email" type="email" placeholder="captain@example.com" required />
    </div>
    <div class="field">
      <label for="password">Password *</label>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="Create a password" required />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
          <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="reqs">Min 8 chars, at least one uppercase, one lowercase, one number.</div>
    </div>
    <div class="field">
      <label for="name">Name *</label>
      <input id="name" type="text" placeholder="Your name" required />
    </div>
    <div class="field">
      <label for="phone">Phone *</label>
      <input id="phone" type="tel" placeholder="(555) 555-5555" required />
    </div>
    <div class="field">
      <label for="region">Preferred Region *</label>
      <select id="region" required>
        <option value="">Select a region...</option>
        <option value="usec_south">US East Coast — South-Atlantic</option>
        <option value="usec_md">US East Coast — Mid-Atlantic</option>
      </select>
    </div>

    <div class="msg" id="form-msg"></div>
    <button type="submit" id="reg-btn">Create Account</button>
  </form>

  <div class="login-link">Already have an account? <a href="login.html">Sign in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js?v=20260531"></script>
<script>
(function() {
  var SUPABASE_URL = 'https://wfdpfeptmyiqifgwqpzu.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_W6wnJkT70jb69JUZgM1dow_nabPZycR';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(msg, type) {
    var el = document.getElementById('form-msg');
    el.textContent = msg;
    el.className = 'msg ' + (type || '');
  }

  function clearFieldErrors() {
    var errs = document.querySelectorAll('.field-error');
    for (var i = 0; i < errs.length; i++) errs[i].remove();
    var inputs = document.querySelectorAll('input, select');
    for (var j = 0; j < inputs.length; j++) inputs[j].style.borderColor = '';
  }

  function setFieldError(id, msg) {
    var input = document.getElementById(id);
    if (!input) return;
    input.style.borderColor = 'var(--err)';
    var existing = document.getElementById(id + '-error');
    if (existing) return;
    var err = document.createElement('div');
    err.id = id + '-error';
    err.className = 'field-error';
    err.textContent = msg;
    input.parentNode.appendChild(err);
  }

  function validateForm() {
    clearFieldErrors();
    var valid = true;
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var region = document.getElementById('region').value;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setFieldError('email', 'Valid email required'); valid = false;
    }
    if (password.length < 8) { setFieldError('password', 'Must be at least 8 characters'); valid = false; }
    if (!/[A-Z]/.test(password)) { setFieldError('password', 'Must include at least one uppercase letter'); valid = false; }
    if (!/[a-z]/.test(password)) { setFieldError('password', 'Must include at least one lowercase letter'); valid = false; }
    if (!/[0-9]/.test(password)) { setFieldError('password', 'Must include at least one number'); valid = false; }
    if (!name) { setFieldError('name', 'Name required'); valid = false; }
    if (!phone || phone.replace(/\D/g, '').length < 10) { setFieldError('phone', 'Valid phone number required'); valid = false; }
    if (!region) { setFieldError('region', 'Please select a region'); valid = false; }
    return valid;
  }

  document.getElementById('reg-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!validateForm()) return;

    var btn = document.getElementById('reg-btn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    showMsg('', '');

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var region = document.getElementById('region').value;

    var result = await sb.auth.signUp({
      email: email,
      password: password,
      options: {
        data: { name: name, phone: phone, selected_region: region },
        emailRedirectTo: window.location.origin + '/index.html'
      }
    });

    if (result.error) {
      showMsg(result.error.message || 'Registration failed. Try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    // With email confirmation enabled, session is null until user clicks the email link.
    // Store profile data in sessionStorage; login page will pick it up and create the profile.
    try {
      sessionStorage.setItem('pending_profile', JSON.stringify({
        user_id: result.data.user.id,
        name: name,
        phone: phone,
        selected_region: region
      }));
    } catch(e) {}

    showMsg('Account created! Check your email and click the link to verify — then sign in.', 'success');
    btn.textContent = 'Redirecting to sign in...';
    setTimeout(function() { window.location.replace('login.html'); }, 3500);
  });

  // Password visibility toggle
  var pwToggle = document.getElementById('pw-toggle');
  if (pwToggle) {
    pwToggle.addEventListener('click', function() {
      var pw = document.getElementById('password');
      var open = document.getElementById('eye-open');
      var closed = document.getElementById('eye-closed');
      if (pw.type === 'password') {
        pw.type = 'text'; open.style.display = 'none'; closed.style.display = 'block';
      } else {
        pw.type = 'password'; open.style.display = 'block'; closed.style.display = 'none';
      }
    });
  }
})();
</script>
</body>
</html>
